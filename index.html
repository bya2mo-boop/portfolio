async function refreshCountries(){
  try{
    if(!D||!D.poches)return;
    D.prefs=D.prefs||{};
    const _auto=D.prefs.paysAuto||{}, _try=D.prefs.paysTry=D.prefs.paysTry||{};
    const map={};
    // Verrou PAR TICKER, plus par portefeuille. Avant, une seule date globale bloquait toute nouvelle
    // résolution pendant 7 jours : une position ajoutée juste après un cycle attendait une semaine
    // (SK Hynix est resté "États-Unis" pour cette raison). Désormais un ticker déjà résolu n'est plus
    // redemandé, et un ticker en échec est retenté au bout de 3 jours — sans bloquer les autres.
    // Les enveloppes de type fonds (AV, PEE) ne sont plus écartées d'office : une vraie action logée
    // dans une assurance vie a un pays, et c'est le drapeau isFund qui décide ensuite, pas l'enveloppe.
    Object.entries(D.poches).forEach(([n,p])=>{p.positions.forEach(pos=>{const t=pos.ticker;
      if(!t||pos.manual||(typeof CG!=="undefined"&&CG[t])||KNOWN_DIVERSIFIED_ETF.has(t))return;
      if(_auto[t])return;
      if(_try[t]&&Date.now()-_try[t]<3*24*3600000)return;
      map[t]=_ySym(pos);});});
    const tickers=Object.keys(map);
    if(!tickers.length)return;
    // par petits paquets (pas tout d'un coup) : trop de requêtes simultanées au Worker fondamentaux font échouer la plupart d'entre elles
    const byTicker={};
    const BATCH=4;
    for(let i=0;i<tickers.length;i+=BATCH){
      const batch=tickers.slice(i,i+BATCH);
      // On retient POURQUOI ça n'a pas marché, avec le libellé brut renvoyé. Avant, un échec produisait
      // null et disparaissait : un pays absent de la table (ex. "Guernsey") était indiscernable d'un
      // symbole introuvable. La page "positions sans pays" s'appuie sur ces raisons.
      const res=await Promise.all(batch.map(async t=>{
        try{const s=await fundFetch("summary",map[t]);
          if(!s||s.error)return[t,null,{raison:"introuvable",libelle:(s&&s.error)||"aucune réponse"}];
          if(!s.pays)return[t,null,{raison:"sans_pays",libelle:""}];
          const code=YAHOO_COUNTRY_TO_CODE[s.pays];
          if(!code)return[t,null,{raison:"libelle_inconnu",libelle:s.pays}];
          return[t,code,null];
        }catch(e){return[t,null,{raison:"erreur",libelle:e.message||"échec réseau"}];}}));
      D.prefs=D.prefs||{};D.prefs.paysEchec=D.prefs.paysEchec||{};
      res.forEach(([t,code,ech])=>{
        D.prefs.paysTry[t]=Date.now();
        if(code){byTicker[t]=code;delete D.prefs.paysEchec[t];}
        else D.prefs.paysEchec[t]=Object.assign({at:Date.now()},ech);});
      D.prefs.paysAuto=Object.assign({},D.prefs.paysAuto||{},byTicker);R();
    }
    if(!D.prefs)D.prefs={};
    // On purge les échecs des tickers qu'on ne détient plus, sinon la liste se remplit de fantômes.
    if(D.prefs.paysEchec){const vivants={};Object.values(D.poches).forEach(p=>p.positions.forEach(x=>{vivants[x.ticker]=1;}));
      Object.keys(D.prefs.paysEchec).forEach(t=>{if(!vivants[t])delete D.prefs.paysEchec[t];});}
    D.prefs.paysAutoTs=Date.now();
    saveLocal();if(currentUser)pushToSupabase();R();
  }catch(e){}
}
// pour un ETF/fonds sans pays résolu (donc probablement pas une entreprise unique) : va chercher ses principales lignes détenues
// (nouvelle fonction ?holdings= du Worker), puis le pays de chaque ligne (réutilise le même mécanisme que refreshCountries)
// pour reconstruire une vraie répartition géographique au lieu de deviner — fonctionne pour n'importe quel ETF, pas seulement ceux déjà connus
// appelée indépendamment de refreshCountries (pas imbriquée dedans) : sinon son cache de 7 jours bloque aussi celle-ci sans raison.
// Le cache est par ticker (30j si résolu, 3j si échec/non reconnu) plutôt qu'un verrou global, pour qu'un ticker jamais tenté
// (ex: position tout juste ajoutée, ou ancien blocage levé par une mise à jour du code) soit toujours retenté au prochain cycle.
async function refreshEtfHoldings(){
  try{
    if(!D||!D.poches)return;
    if(!D.prefs)D.prefs={};
    if(!D.prefs.etfHoldings)D.prefs.etfHoldings={};
    const eh=D.prefs.etfHoldings;
    const map={};
    Object.entries(D.poches).forEach(([n,p])=>{p.positions.forEach(pos=>{const t=pos.ticker;if(!t||(typeof CG!=="undefined"&&CG[t])||ETF_BREAKDOWN_BY_TICKER[t])return;
      const auto=(D.prefs&&D.prefs.paysAuto)||{};
      const prev=eh[t];
      // On ne saute que ce qu'on a déjà identifié comme n'étant PAS un fonds : sinon un ETF
      // dont le pays a été résolu tôt ne serait jamais analysé ligne par ligne.
      if(auto[t]&&prev&&prev.isFund===false)return;
      // prev.isFund===undefined : entrée en cache écrite par une ancienne version du code (avant le flag isFund) —
      // on la retente tout de suite au lieu d'attendre son délai normal, pour que les correctifs de classification
      // s'appliquent dès le prochain cycle plutôt que de rester coincés jusqu'à 3-30 jours.
      if(prev&&prev.isFund!==undefined){const ttl=(prev.isFund===false||(prev.parts&&prev.parts.length))?30*24*3600000:3*24*3600000;if(Date.now()-(prev.at||0)<ttl)return;}
      map[t]=_ySym(pos);
    });});
    const tickers=Object.keys(map);
    if(!tickers.length)return;
    for(const t of tickers){
      try{
        const h=await fundFetchHoldings(map[t]);
        // "isFund" : le Worker a confirmé que ce symbole est bien un fonds/ETF (famille, catégorie ou secteurs connus),
        // même si le détail ligne par ligne est absent chez Yahoo (fréquent sur les petits fonds européens). Dans ce cas
        // il ne faut surtout pas retomber sur la devinette pays-par-devise (ex: un ETF Émergents en EUR ne doit pas
        // s'afficher "France") : on classe proprement en Diversifié plutôt que d'inventer un pays.
        const isFund=!!(h&&!h.error&&(h.family||h.category||(h.sectors&&h.sectors.length)||(h.holdings&&h.holdings.length)));
        if(!h||h.error||!h.holdings||!h.holdings.length){eh[t]={parts:[],isFund,at:Date.now()};saveLocal();continue;}
        const parts=[];
        const BATCH=4;
        for(let i=0;i<h.holdings.length;i+=BATCH){
          const batch=h.holdings.slice(i,i+BATCH);
          const res=await Promise.all(batch.map(async hd=>{if(!hd.symbol||!hd.pct)return null;try{const s=await fundFetch("summary",hd.symbol);const code=(s&&s.pays)?(YAHOO_COUNTRY_TO_CODE[s.pays]||null):null;return code?[code,hd.pct]:null;}catch(e){return null;}}));
          res.forEach(r=>{if(r)parts.push(r);});
        }
        eh[t]={parts,isFund:true,holdings:h.holdings.slice(0,10),category:h.category||null,at:Date.now()};
        saveLocal();R();
      }catch(e){eh[t]={parts:[],isFund:false,at:Date.now()};saveLocal();}
    }
    if(currentUser)pushToSupabase();R();
  }catch(e){}
}

// ça débloque d'un coup les prix en direct, les fondamentaux, la répartition géographique et les holdings ETF pour
// cette position, sans rien changer ailleurs.
async function _resolveIsin(isin){
  try{
    const r=await fetchT(`${WORKER_URL}/?search=${encodeURIComponent(isin)}`,{},10000);
    if(!r.ok)return null;
    const j=await r.json();
    const q=(j.quotes||[]).find(m=>m.symbol&&m.quoteType!=="CURRENCY");
    if(!q)return null;
    return {sym:q.symbol,cur:q.currency||_guessCur(q.exchange)||_guessCur(q.exchDisp)||null,name:q.longname||q.shortname||null};
  }catch(e){return null;}
}

async function refreshIsinSymbols(){
  try{
    if(!D||!D.poches)return;
    if(!D.prefs)D.prefs={};
    if(!D.prefs.isinFailed)D.prefs.isinFailed={};
    const targets=[];
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      const t=pos.ticker;
      if(!t||pos.avSymbol||!ISIN_RE.test(t))return;
      const failedAt=D.prefs.isinFailed[t];
      if(failedAt&&Date.now()-failedAt<7*24*3600000)return;
      targets.push(pos);
    }));
    if(!targets.length)return;
    const BATCH=4;
    for(let i=0;i<targets.length;i+=BATCH){
      const batch=targets.slice(i,i+BATCH);
      await Promise.all(batch.map(async pos=>{
        if(!pos.isin)pos.isin=(pos.ticker||"").toUpperCase();
        const res=await _resolveIsin(pos.ticker);
        if(res&&res.sym){
          pos.avSymbol=res.sym;
          if(res.cur&&!pos.currency)pos.currency=res.cur;
          if(res.name&&(!pos.titre||pos.titre===pos.ticker))pos.titre=res.name;
          delete D.prefs.isinFailed[pos.ticker];
        }else{
          D.prefs.isinFailed[pos.ticker]=Date.now();
        }
      }));
      saveLocal();R();
    }
    if(currentUser)pushToSupabase();
  }catch(e){}
}

  if(lastComma>-1&&lastDot>-1){

function scorePos(pos, pocheName){
  const isCrypto = pocheName === "Crypto" || CG[pos.ticker];
  const isFund = pocheName === "Assurance Vie" || pocheName === "PEE";
  const prof=(D&&D.prefs&&D.prefs.scoreProfile)||"equilibre";
  const W = prof==="croissance"?{pl:1,div:0,mom:1.4}:prof==="dividende"?{pl:0.8,div:1.6,mom:0.8}:{pl:1,div:1,mom:1};
  let s=5; const crit=[];
  const pl=pos.plPct||0;
  const mult=isCrypto?1.5:isFund?0.7:1.0;
  let plPts=0;
  if(pl>=50*mult)plPts=2.5;else if(pl>=25*mult)plPts=1.5;else if(pl>=10*mult)plPts=0.8;else if(pl>=-5*mult)plPts=0;else if(pl>=-15*mult)plPts=-0.8;else if(pl>=-30*mult)plPts=-1.5;else plPts=-2.5;
  plPts=Math.round(plPts*W.pl*10)/10;s+=plPts;
  crit.push({n:"P&L",v:(plPts>=0?"+":"")+plPts.toFixed(1),c:plPts>0?"g":plPts<0?"r":"a"});
  const w=pos.poids||0;let wPts=0;
  if(w>=8&&w<=22)wPts=0.5;else if((w>=5&&w<8)||(w>22&&w<=30))wPts=0;else if((w>=2&&w<5)||(w>30&&w<=40))wPts=-0.5;else if(w<2)wPts=-1;else wPts=-1.5;
  s+=wPts;crit.push({n:"Poids",v:(wPts>=0?"+":"")+wPts.toFixed(1),c:wPts>0?"g":wPts<0?"r":"a"});
  const div=pos.dividend||DIVS[pos.ticker]||0;const yld=pos.cours>0?(div/pos.cours*100):0;
  let divPts=0;if(yld>5)divPts=1;else if(yld>3)divPts=0.7;else if(yld>1)divPts=0.4;else if(yld>0)divPts=0.2;
  divPts=Math.round(divPts*W.div*10)/10;if(divPts>0){s+=divPts;crit.push({n:"Div",v:"+"+divPts.toFixed(1),c:"g"});}
  if(pos.cours7j&&pos.cours7j>0){const delta=(pos.cours-pos.cours7j)/pos.cours7j*100;let mPts=0;if(delta>10)mPts=1;else if(delta>3)mPts=0.5;else if(delta>-3)mPts=0;else if(delta>-10)mPts=-0.5;else mPts=-1;mPts=Math.round(mPts*W.mom*10)/10;s+=mPts;crit.push({n:"7j",v:(mPts>=0?"+":"")+mPts.toFixed(1),c:mPts>0?"g":mPts<0?"r":"a"});}
  if(pos.cible>0&&pos.cours>0){const ec=(pos.cours-pos.cible)/pos.cible*100;let cPts=0;if(ec<=0)cPts=0.5;else if(ec<5)cPts=0.2;if(cPts>0){s+=cPts;crit.push({n:"Cible",v:"+"+cPts.toFixed(1),c:ec<=0?"g":"a"});}}
  return {score:Math.max(1,Math.min(10,Math.round(s*10)/10)),crit};
}

function downsampleH(){
  if(H.length<2)return;
  const now=Date.now();
  const D7=7*24*3600*1000;
  const D30=30*24*3600*1000;
  const recent=H.filter(x=>now-x.t<D7);
  const mid=H.filter(x=>now-x.t>=D7&&now-x.t<D30);
  const old=H.filter(x=>now-x.t>=D30);
  const midMap={};
  mid.forEach(x=>{const k=new Date(x.t).toISOString().slice(0,10);if(!midMap[k])midMap[k]=x;else Object.assign(midMap[k], x);});
  const oldMap={};
  old.forEach(x=>{const d=new Date(x.t);const wk=`${d.getFullYear()}-W${String(Math.ceil((d-new Date(d.getFullYear(),0,1))/604800000)).padStart(2,"0")}`;if(!oldMap[wk])oldMap[wk]=x;else Object.assign(oldMap[wk], x);});
  H=[...Object.values(oldMap),...Object.values(midMap),...recent].sort((a,b)=>a.t-b.t);
}

function rc(d){
  if(!d||!d.poches)return d;
  // Migration : les réglages de lissage des courbes ont été supprimés (ils maquillaient de vraies
  // tendances). On efface les clés devenues inutiles ; elles disparaîtront à la prochaine sauvegarde
  // normale, sans écriture déclenchée exprès.
  if(d.prefs){ delete d.prefs.seedMode; delete d.prefs.smoothMid; }
  const eurUsd=d.eurUsd||1.1;
  Object.entries(d.poches).forEach(([pocheName,p])=>{
    p.positions.forEach(x=>{
      const cur=curOf(x);
      const te=toEur(cur);
      x.valeur=(x.qty*x.cours)*te;
      x.pl=(x.qty*(x.cours-x.pru))*te;
      x.plPct=x.pru?((x.cours-x.pru)/x.pru*100):0;
    });
    p.investi=p.positions.reduce((s,x)=>{
      const cur=curOf(x);
      return s+(x.qty*x.pru)*toEur(cur)
    },0);
    p.valeur=p.positions.reduce((s,x)=>s+x.valeur,0);
    p.pl=p.valeur-p.investi;
    const t=p.valeur||1;
    p.positions.forEach(x=>{x.poids=Math.round(x.valeur/t*1000)/10});
    
    const n=p.positions.length;
    if(n===0){p.sante="5,0";return;}
    let sc=0,wTotal=0;
    p.positions.forEach(x=>{
      const w=(x.poids||0)/100;
      const r=scorePos(x,pocheName);
      x._score=r.score;x._crit=r.crit;
      sc+=r.score*w;wTotal+=w;
    });
    let raw=wTotal>0?sc/wTotal:5;
    if(n>=6)raw+=0.3;else if(n>=4)raw+=0.15;
    const maxPoids=Math.max(...p.positions.map(x=>x.poids));
    if(maxPoids>60)raw-=1;else if(maxPoids>45)raw-=0.5;
    const plPct=p.investi>0?(p.pl/p.investi*100):0;
    if(plPct>20)raw+=0.5;else if(plPct<-15)raw-=0.5;
    p.sante=Math.max(1,Math.min(10,raw)).toFixed(1).replace('.',',');
  });
  if(d.immobilier){ensureImmoBiens(d);let _vv=0,_cc=0;d.immobilier.biens.forEach(b=>{_vv+=(b.valeurEstimee||0);_cc+=(b.capitalRestant||0);});d.immobilier.valeurEstimee=Math.round(_vv*100)/100;d.immobilier.capitalRestant=Math.round(_cc*100)/100;d.immobilier.equityNette=d.immobilier.valeurEstimee-d.immobilier.capitalRestant;}
  d.updatedAt=new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return d;
}

function _echantillonne(arr){
  if(!Array.isArray(arr)||arr.length<2)return arr;
  const cle = htf==="1s" ? (t=>Math.floor(t/3600000)) : (t=>new Date(t).toDateString());

}
function despike(arr, key){
  if(!Array.isArray(arr)||arr.length<3)return arr;
  let out=arr.map(x=>({...x}));
  for(let pass=0;pass<3;pass++){
    for(let i=1;i<out.length-1;i++){
      const a=out[i-1][key],b=out[i][key],c=out[i+1][key];
      if(a==null||b==null||c==null)continue;
      const refMax=Math.max(Math.abs(a),Math.abs(c),1);
      if(Math.abs(b-a)/refMax>0.15 && Math.abs(b-c)/refMax>0.15 && Math.abs(a-c)/refMax<0.1){ out[i][key]=(a+c)/2; }
    }
  }
  return out;
}

function _fluxHtml(disp, envCur){

function _convLbl(tk){const t=String(tk||"").trim();return t.length>11?t.slice(0,10)+"…":t;}
function _convChartSvg(items){
  if(!items.length)return `<div style="font-size:11px;color:var(--mut);text-align:center;padding:20px 6px">Aucune position à afficher pour ce filtre.</div>`;
  // Marge de 6 % seulement : l'ancien arrondi au pas de 2 (avec +15 %) laissait le point le plus
  // lourd s'arrêter à 84 % de la largeur, soit près d'un tiers du graphique inutilisé.
  const maxP=Math.max(4,Math.max(...items.map(i=>i.poids))*1.06);
  // Axe vertical adaptatif : inutile d'afficher 0-100 si les notes vont de 50 à 100 (la moitié basse
  // resterait vide). On arrondit aux 5 les plus proches et on impose une amplitude minimale, sinon
  // trois positions très proches occuperaient toute la hauteur et paraîtraient très écartées.
  let lo=Math.min(...items.map(i=>i.conv)), hi=Math.max(...items.map(i=>i.conv));
  lo=Math.max(0,Math.floor((lo-4)/5)*5); hi=Math.min(100,Math.ceil((hi+4)/5)*5);
  if(hi-lo<20){const mid=(hi+lo)/2;lo=Math.max(0,Math.round((mid-10)/5)*5);hi=Math.min(100,lo+20);}
  const VW=390,VH=400;

  // 7 à 20 px se chevauchaient, poussaient les points loin de leur vraie abscisse et mangeaient la
  // place des étiquettes. Un petit rayon constant rend la position précise et lisible.
  const R_PT=4.5;
  const rf=()=>R_PT;

  // Graduations chiffrées, indispensables : sans elles un point à mi-hauteur voudrait dire 50 un jour
  // et 75 le lendemain, et toute comparaison dans le temps serait perdue.
  const ticks=[lo,Math.round((lo+hi)/2),hi];
  let grid=ticks.map(v=>`<line x1="${X0}" y1="${yf(v).toFixed(1)}" x2="${X1}" y2="${yf(v).toFixed(1)}" stroke="var(--dim)" stroke-opacity="0.18" stroke-width="1"/><text x="${X0-7}" y="${(yf(v)+3.5).toFixed(1)}" font-size="10" fill="var(--mut)" text-anchor="end" font-family="monospace">${v}</text>`).join("");

  // Ligne de cohérence : « conviction = poids ». C'est une convention, pas une vérité — mais elle rend

  // l'inverse. Les deux libellés restent discrets pour ne pas concurrencer les points.
  // Deux régions séparées par la diagonale, avec un aplat gris à peine perceptible pour qu'on voie

  const zones=`<polygon points="${X0},${Y1} ${X1},${Y0} ${X0},${Y0}" fill="var(--txt)" fill-opacity="0.06"/>`
    +`<polygon points="${X0},${Y1} ${X1},${Y0} ${X1},${Y1}" fill="var(--txt)" fill-opacity="0.02"/>`;
  // Diagonale nettement plus visible qu'avant (0,3 → 0,55 et 1 → 1,5 px) : c'est la référence de
  // lecture de tout le graphique, elle ne peut pas être plus discrète que les repères.
  const diag=`<line x1="${X0}" y1="${Y1}" x2="${X1}" y2="${Y0}" stroke="var(--dim)" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  // Décalage horizontal des points qui se chevauchent (beeswarm) : la conviction (y) n'est JAMAIS
  // modifiée, seul le x bouge de quelques pixels. Deux balayages symétriques puis leur moyenne, ce qui
  // respecte les écarts minimums tout en recentrant le nuage sur sa position réelle.
  const dots0=items.map(it=>({it,ncx:xf(it.poids),cy:yf(it.conv),r:R_PT,dr:R_PT+1.5}));
  const order=dots0.slice().sort((a,b)=>a.ncx-b.ncx||a.cy-b.cy);
  const n=order.length;
  const gapOf=(a,b)=>{const dy=Math.abs(a.cy-b.cy);const mg=a.dr+b.dr+3;return dy<mg?Math.sqrt(Math.max(0,mg*mg-dy*dy)):0;};
  const fwd=new Array(n);
  order.forEach((b,i)=>{let req=b.ncx;for(let j=0;j<i;j++)req=Math.max(req,fwd[j]+gapOf(order[j],b));fwd[i]=req;});
  const bwd=new Array(n);

  order.forEach((d,i)=>{d.cx=(fwd[i]+bwd[i])/2;});

  const rightOver=Math.max(0,Math.max(...order.map(d=>d.cx+d.dr))-X1);
  if(rightOver>0)order.forEach(d=>{d.cx-=rightOver;});
  // Garde-fou : la translation rigide ne peut pas toujours tout rentrer (beaucoup de points au même
  // poids). On borne alors chaque point au cadre, plutôt que de le laisser sortir du graphique.
  order.forEach(d=>{d.cx=Math.max(X0+d.r,Math.min(X1-d.r,d.cx));});

  // Placement des étiquettes : AUCUN nom ne disparaît. On essaie six positions autour du point
  // (dessus, dessous, droite, gauche, puis les diagonales hautes) et, dès que le nom s'éloigne de sa
  // position par défaut, un fin trait de rappel le relie à son cercle. Avant, seules deux positions
  // étaient tentées et le nom était purement supprimé en cas d'échec (HYPE et TSM disparaissaient).
  let dots="",labels="",amorces="";
  const prises=[];
  // Points exactement superposés : un seul repère portant le NOMBRE de lignes, cliquable.
  const paquets={};
  dots0.forEach(d=>{const k=Math.round(d.cx*2)+"|"+Math.round(d.cy*2);(paquets[k]=paquets[k]||[]).push(d);});
  const groupes=Object.values(paquets);

  const aPlacer=dots0.filter(d=>!d.groupe||d.chef);

    const txt=nb>1?String(nb):_convLbl(d.it.tk);
    const demiL=txt.length*3.3+3;
    // Les candidates sont RAMENÉES dans la zone de tracé : un point collé au bord voit son nom
    // glisser vers l'intérieur au lieu d'être rejeté, donc plus rien ne déborde sur les graduations.
    const bornes=x=>Math.max(X0+demiL+2,Math.min(X1-demiL-2,x));
    const essais=[
      {x:d.cx,             y:d.cy-d.r-6},
      {x:d.cx,             y:d.cy+d.r+12},
      {x:d.cx+d.r+demiL+4, y:d.cy+3.5},
      {x:d.cx-d.r-demiL-4, y:d.cy+3.5},
      {x:d.cx+d.r+demiL+4, y:d.cy-d.r-4},
      {x:d.cx-d.r-demiL-4, y:d.cy-d.r-4},
      {x:d.cx,             y:d.cy-d.r-19},
      {x:d.cx,             y:d.cy+d.r+25},
      {x:d.cx+d.r+demiL+4, y:d.cy-d.r-17},
      {x:d.cx-d.r-demiL-4, y:d.cy+d.r+17}].map(e=>({x:bornes(e.x),y:e.y}));
    // Pénalité plutôt que repli aveugle : si aucune place n'est parfaitement libre, on retient celle
    // qui gêne le MOINS. Avant, tous les noms d'une grappe retombaient sur la même position par
    // défaut et se superposaient exactement.
    let best=null,bestPen=Infinity;
    essais.forEach((e,idx)=>{

      let pen=idx*0.6; // on préfère les premières positions, plus naturelles
      prises.forEach(q=>{const dx=(q.demiL+demiL+4)-Math.abs(q.x-e.x),dy=11-Math.abs(q.y-e.y);

    labels+=`<text x="${pose.x.toFixed(1)}" y="${pose.y.toFixed(1)}" font-size="9.5" font-weight="600" fill="${nb>1?"var(--dim)":d.it.color}" text-anchor="middle" ${nb>1?`style="cursor:pointer" onclick="_convPaquet('${escAttr(d.groupe.map(q=>q.it.tk).join(","))}')"`:""}>${esc(txt)}</text>`;
  });
  // Libellés de zone placés dans les COINS extrêmes, jamais au centre : au milieu du nuage ils se
  // lisaient comme l'étiquette du point le plus proche. Un contrôle de collision les décale
  // verticalement s'ils tombent quand même sur un point ou sur un nom.
  const libre=(x,y,demi)=>!dots0.some(o=>Math.abs(o.cx-x)<(demi+o.r+3)&&Math.abs(o.cy-y)<(o.r+9))

  const yHaut=poseZone(X0+8+22,Y0+22,26,false);

  const zoneLbl=`<text x="${X0+8}" y="${yHaut}" font-size="9" fill="var(--mut)" opacity="0.45">sous-pondéré</text>`
    +`<text x="${X0+8}" y="${yHaut+11}" font-size="9" fill="var(--mut)" opacity="0.45">/ conviction</text>`
    +`<text x="${X1-8}" y="${yBas}" font-size="9" fill="var(--mut)" opacity="0.45" text-anchor="end">surpondéré</text>`
    +`<text x="${X1-8}" y="${yBas+11}" font-size="9" fill="var(--mut)" opacity="0.45" text-anchor="end">/ conviction</text>`;
  dots0.forEach(d=>{
    const it=d.it;
    const msg=it.tk+"|"+(it.titre||"")+"|"+it.poche+"|"+it.conv+"|"+vg(it.poids,1)+"|"+(it.dormante?"1":"");
    dots+=`<circle cx="${d.cx.toFixed(1)}" cy="${d.cy.toFixed(1)}" r="${d.r.toFixed(1)}" fill="${it.dormante?"transparent":it.color+"3d"}" stroke="${it.color}" stroke-width="${it.dormante?1.6:1.3}" ${it.dormante?'stroke-dasharray="3 2.5"':""} style="cursor:pointer" onclick="_ptInfo('${escAttr(msg)}')"/>`;
  });

  return `<svg viewBox="0 0 ${VW} ${VH}" width="100%" style="display:block;height:auto;max-height:62vh;overflow:visible">
    ${zones}${grid}${diag}${zoneLbl}${amorces}${dots}${labels}
    <text x="${X0}" y="${VH-10}" font-size="10" fill="var(--mut)">0%</text>
    <text x="${(X0+X1)/2}" y="${VH-10}" font-size="10" fill="var(--mut)" text-anchor="middle">poids dans ton portefeuille</text>
    <text x="${X1}" y="${VH-10}" font-size="10" fill="var(--mut)" text-anchor="end">${vg(maxP,0)} %</text>
    <text x="2" y="${Y0-13}" font-size="9" fill="var(--mut)" text-anchor="start">conviction</text>

}

// ── LA DÉRIVE ───────────────────────────────────────────────────────────────────────────────
// Ce que le marché a imposé sans décision de ta part. Période fixe de 3 mois : c'est une question
// d'actualité, pas d'horizon. Par ENVELOPPE tout de suite (l'historique les garde) ; par POSITION
// dès qu'on aura ~3 mois de relevés hebdomadaires (_snapPoids), car H ne gardait pas ce détail.
function _derive(){
  const out=[];const seuil=3;
  const ventes=(D.sales||[]).filter(s=>Date.now()-new Date(s.date).getTime()<90*86400000).map(s=>s.ticker);
  const hist=(D.prefs&&D.prefs.poidsHist)||[];
  const vieux=hist.filter(x=>Date.now()-x.t>=80*86400000).pop();
  if(vieux){
    const d=ga();const viv=d.ap.filter(x=>!x.noPerf);
    const tot=viv.reduce((s,x)=>s+(x.valeur||0),0)||1;
    viv.forEach(x=>{const av=vieux.w[x.ticker];if(av==null)return;
      const ap=(x.valeur||0)/tot*100;
      if(Math.abs(ap-av)<seuil)return;
      out.push(`<b>${esc(x.ticker)}</b> — poids ${ap>av?"passé":"tombé"} de ${vg(av,0)} % à ${vg(ap,0)} % en 3 mois${ventes.includes(x.ticker)?"":", tu n'as rien vendu"}`);});
  }
  const S=H.slice().sort((a,b)=>a.t-b.t).filter(p=>p.env&&Object.keys(p.env).length);
  const ref=S.filter(p=>Date.now()-p.t>=80*86400000).pop();
  const der=S[S.length-1];
  if(ref&&der&&ref!==der){
    const part=(p,n)=>{const t=_perfPoches().reduce((s,k)=>s+(p.env[k]||0),0);return t>0?(p.env[n]||0)/t*100:null;};
    _perfPoches().forEach(n=>{const a=part(ref,n),b=part(der,n);
      if(a==null||b==null||Math.abs(b-a)<seuil)return;
      out.push(`Ton <b>${esc(n)}</b> est ${b>a?"passé":"tombé"} de ${vg(a,0)} % à ${vg(b,0)} % de ta bourse en 3 mois`);});
  }
  return out;
}
// ── LES PAGES DE L'ONGLET CONVICTION ────────────────────────────────────────────────────────
// État vide centré : un repère neutre discret, une phrase qui dit quoi faire, l'action si elle
// existe. Sans ça, une petite carte de texte gris en haut d'un grand fond donne l'impression que
// la page est cassée. Volontairement neutre en attendant la charte graphique.
function _videHtml(txt,action,libelle){
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:220px;padding:20px"><div style="width:34px;height:34px;border-radius:50%;border:1px solid var(--bdr);opacity:.7"></div><div style="font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:14px;max-width:280px">${txt}</div>${action?`<div onclick="${action}" style="margin-top:14px;font-size:12.5px;color:var(--acc);font-weight:600;cursor:pointer">${libelle} ›</div>`:""}</div>`;
}
function _convRetour(){return `<div onclick="_navBack()" style="display:inline-flex;align-items:center;gap:4px;color:var(--acc);font-size:13px;cursor:pointer;padding:4px 2px 10px;font-weight:600">‹ ${esc(_navLbl())}</div>`;}
function _convEntete(titre,phrase,aide){
  return `<div style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:6px"><h2 style="font-size:19px;font-weight:700">${titre}</h2>${aide?`<span onclick="_convAide('${aide}')" style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;font-weight:700;cursor:pointer">?</span>`:""}</div><div style="font-size:11px;color:var(--mut);line-height:1.5;margin-top:3px">${phrase}</div></div>`;
}
function _convVuePage(vue,ctx){
  const d=ctx.d,cv=ctx.cv,noThesis=ctx.noThesis,noPlan=ctx.noPlan,noHz=ctx.noHz,derive=ctx.derive;
  const lignePos=(x)=>`<div onclick="posFiche('${escAttr(x.poche)}','${escAttr(x.ticker)}')" style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--sep);cursor:pointer"><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">${esc(_nomAffiche(x))}</div><div style="font-size:10px;color:var(--mut);margin-top:2px">${esc(x.poche)}</div></div><span style="color:var(--mut);font-size:13px">›</span></div>`;
  if(vue==="completer"){
    // Trois choix, jamais la liste des positions : un mur de 30 lignes vides décourage au lieu
    // d'inviter. On entre ensuite dans un parcours qui ne montre QU'UNE position à la fois.
    const choix=[["horizon","Ajouter les horizons manquants",noHz.length,"Pour combien de temps tu comptes garder chaque ligne"],
                 ["these","Écrire les thèses manquantes",noThesis.length,"Pourquoi tu détiens cette ligne"],
                 ["plan","Définir les plans de sortie",noPlan.length,"À quel prix tu comptes vendre"]].filter(c=>c[2]>0);
    return _convRetour()+_convEntete("À compléter","Choisis ce que tu veux remplir. On avance ensuite ligne par ligne, sans te montrer toute la liste d'un coup.")
      +(choix.length?`<div class="card" style="padding:6px 14px 10px">${choix.map(c=>`<div onclick="setConvFill('${c[0]}')" style="display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--sep);cursor:pointer"><div style="flex:1"><div style="font-size:13px;color:var(--txt)">${c[1]} <span style="color:var(--mut)">(${c[2]})</span></div><div style="font-size:10.5px;color:var(--mut);margin-top:2px">${c[3]}</div></div><span style="color:var(--mut);font-size:14px">›</span></div>`).join("")}</div>`
        :`<div class="card" style="text-align:center;color:var(--mut);font-size:12px;padding:24px">Tout est rempli 👍</div>`);
  }
  if(vue==="fill"){
    // Une position à la fois : on remplit, on passe à la suivante. La progression est visible,
    // l'ampleur du travail ne l'est pas — c'est ce qui fait qu'on commence.
    const listes={horizon:noHz,these:noThesis,plan:noPlan};
    const titres={horizon:["Horizons","Pour combien de temps comptes-tu la garder ?"],
                  these:["Thèses","Pourquoi détiens-tu cette ligne ?"],
                  plan:["Plans de sortie","À quel prix comptes-tu vendre ?"]};
    const lst=(listes[convFill]||[]).filter(x=>_convSkip.indexOf(x.ticker)<0);
    const tot=(listes[convFill]||[]).length;
    const t=titres[convFill]||["À compléter",""];
    if(!lst.length)return `<div onclick="setConvView('convictions')" style="display:inline-flex;align-items:center;gap:4px;color:var(--acc);font-size:13px;cursor:pointer;padding:4px 2px 10px;font-weight:600">‹ Mes convictions</div>`
      +`<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:28px">👍</div><div style="font-size:13px;color:var(--dim);margin-top:8px">${tot?"Tu as passé toutes les lignes restantes.":"Plus rien à remplir ici."}</div></div>`;
    const x=lst[0];
    const fait=tot-lst.length;
    let champ="";
    if(convFill==="horizon")champ=_hzChips(null)+`<div style="font-size:10px;color:var(--mut);margin-top:8px">Une intention, modifiable à tout moment.</div>`;
    else if(convFill==="these")champ=`<textarea id="fillTh" rows="3" placeholder="Ex : leader sur un marché qui double tous les 3 ans" style="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--txt);font-family:inherit;font-size:13px;resize:vertical"></textarea><button class="btn btn-p" style="margin-top:10px" onclick="_fillThese('${escAttr(x.ticker)}')">Enregistrer et continuer</button>`;
    else{convPlanTk=x.ticker;convPlanPoche=x.poche;champ=_planEditorHtml(x,true);}
    // Une seule carte au milieu d'un écran noir donnait une page inachevée : on montre
    // l'avancement en clair, et la file de ce qui suit.
    const suite=lst.slice(1);
    const apercu=suite.length?`<div style="margin-top:14px"><div style="font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:0 2px 6px">Ensuite</div><div class="card" style="padding:2px 14px 4px;opacity:.62">${suite.slice(0,12).map(y=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--sep)"><span style="font-size:12.5px;color:var(--dim)">${esc(_nomAffiche(y,26))}</span><span style="font-size:10px;color:var(--mut)">${esc(y.poche)}</span></div>`).join("")}${suite.length>12?`<div style="font-size:10.5px;color:var(--mut);padding:9px 0">et ${suite.length-12} autre${suite.length-12>1?"s":""}…</div>`:""}</div></div>`:"";
    return `<div onclick="setConvView('convictions')" style="display:inline-flex;align-items:center;gap:4px;color:var(--acc);font-size:13px;cursor:pointer;padding:4px 2px 10px;font-weight:600">‹ Mes convictions</div>`
      +`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><h2 style="font-size:19px;font-weight:700">${t[0]}</h2><span class="mono" style="font-size:11px;color:var(--dim);font-weight:700">${fait} / ${tot} faites</span></div>`
      +`<div style="height:3px;background:var(--bdr);border-radius:2px;overflow:hidden;margin-bottom:14px"><div style="height:100%;width:${Math.round(fait/tot*100)}%;background:var(--acc);border-radius:2px"></div></div>`
      +`<div class="card"><div style="font-size:15px;font-weight:700">${esc(_nomAffiche(x,32))}</div><div style="font-size:10.5px;color:var(--mut);margin-top:2px;margin-bottom:14px">${esc(x.poche)}${convFill==="plan"?"":" · "+fmt_(Math.round(x.valeur||0))+" €"}</div><div style="font-size:11.5px;color:var(--dim);margin-bottom:8px">${t[1]}</div>${champ}<div onclick="_fillSkip('${escAttr(x.ticker)}')" style="text-align:center;margin-top:12px;font-size:11.5px;color:var(--mut);cursor:pointer">Passer cette ligne</div></div>`+apercu;
  }
  if(vue==="plan"){
    const x=d.ap.find(y=>y.ticker===convPlanTk&&y.poche===convPlanPoche);
    if(!x)return _convRetour()+`<div class="card">Position introuvable.</div>`;
    return _convRetour()+_convEntete("Plan de sortie","À quels prix tu comptes vendre, et quelle part à chaque fois. Chaque palier sert aussi d'alerte de prix.")
      +`<div class="card"><div style="font-size:15px;font-weight:700">${_lienTitre(x.ticker,esc(_nomAffiche(x,30)))}</div><div style="font-size:10.5px;color:var(--mut);margin:2px 0 10px">${esc(x.poche)}</div>${_planEditorHtml(x,false)}</div>`;
  }
  if(vue==="achat"){
    const tk=achatTk;const pch=achatPoche||"";
    if(!tk)return _convRetour()+`<div class="card">Aucun titre choisi.</div>`;
    return _convRetour()+_convEntete("Plan d'achat","À quels prix tu comptes entrer, et combien à chaque fois. Chaque palier sert aussi d'alerte de baisse.")
      +`<div class="card"><div style="font-size:15px;font-weight:700">${_lienTitre(tk,esc(_tkNom(tk)))}</div><div style="font-size:10.5px;color:var(--mut);margin:2px 0 10px">${esc(tk)}${pch?" · "+esc(pch):(_tkDetenu(tk)?"":" · titre non détenu")}</div>${_achatEditorHtml(pch,tk)}</div>`;
  }
  if(vue==="boussole"){
    const un=boussoleTk;
    const tks=un?[un]:_boussoleTickers();
    let items=[];tks.forEach(tk=>{items=items.concat(_boussoleFlux(tk));});
    const total=items.length;
    if(boussoleFiltre==="these")items=items.filter(e=>e.type==="these");
    else if(boussoleFiltre==="note")items=items.filter(e=>e.type==="note");
    // La thèse vivante n'est pas un événement daté : elle ouvre le flux (ou le ferme si on
    // remonte le temps). Les entrées datées, elles, se trient vraiment par date.
    const act=items.filter(e=>e.actuelle);
    const dat=items.filter(e=>!e.actuelle).sort((a,b)=>boussoleOrdre==="recent"?((b.d||0)-(a.d||0)):((a.d||0)-(b.d||0)));
    const flux=boussoleOrdre==="recent"?act.concat(dat):dat.concat(act);
    // Teintes provisoires : violet pour la thèse, gris pour le journal. La charte tranchera.
    const TH_C="#a78bfa";
    const chip=(e)=>{const th=e.type==="these";
      return `<span style="display:inline-block;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;${th?`background:${TH_C}26;border:1px solid ${TH_C}66;color:${TH_C}`:"background:transparent;border:1px solid var(--bdr);color:var(--mut)"}">${th?("Thèse"+(e.v?" v"+e.v:"")):"Journal"}</span>`;};
    const ent=(e)=>`<div style="border-left:${e.type==="these"?"3px solid "+TH_C:"2px solid var(--bdr)"};padding:1px 0 1px 11px;margin-bottom:14px"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">${chip(e)}${e.actuelle?`<span style="font-size:9.5px;color:var(--mut)">actuelle</span>`:""}${un?"":`<span onclick="openBoussole('${escAttr(e.tk)}')" style="font-size:11px;font-weight:700;color:var(--acc);cursor:pointer">${esc(_tkNom(e.tk))}</span>`}${e.d?`<span style="font-size:10px;color:var(--mut)">${e.actuelle?"":(e.type==="these"?"rangée ":"")}${_relTime(e.d)}</span>`:""}<span style="flex:1"></span>${e.actuelle?`<span onclick="_bsThese('${escAttr(e.tk)}','corriger')" style="font-size:11px;color:var(--acc);font-weight:600;cursor:pointer">Corriger</span><span onclick="_bsDelThese('${escAttr(e.tk)}')" style="color:var(--mut);font-size:13px;cursor:pointer;padding:0 2px">✕</span>`:`<span onclick="_bsDelNote('${escAttr(e.tk)}',${e.i})" style="color:var(--mut);font-size:13px;cursor:pointer;padding:0 2px">✕</span>`}</div><div style="font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:5px;white-space:pre-wrap">${esc(e.t)}</div></div>`;
    const filtres=`<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px">`
      +[["tout","Tout"],["these","Thèses"],["note","Journal"]].map(f=>`<span onclick="_bsFiltre('${f[0]}')" style="padding:5px 11px;border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid ${boussoleFiltre===f[0]?"var(--acc)":"var(--bdr)"};background:${boussoleFiltre===f[0]?"var(--acc)":"transparent"};color:${boussoleFiltre===f[0]?"#fff":"var(--dim)"}">${f[1]}</span>`).join("")
      +`<span style="flex:1"></span><span onclick="_bsOrdre()" style="font-size:11px;color:var(--dim);cursor:pointer;padding:5px 2px">${boussoleOrdre==="recent"?"Plus récent d'abord":"Plus ancien d'abord"} ⇅</span></div>`;
    const th=un?_theseTxt(un):"";
    const boutons=un
      ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><span onclick="_bsNote('${escAttr(un)}')" style="padding:7px 12px;border:1px solid var(--bdr);border-radius:999px;font-size:12px;color:var(--acc);font-weight:600;cursor:pointer">+ Note de journal</span><span onclick="${th?`_bsTheseMenu('${escAttr(un)}')`:`_bsThese('${escAttr(un)}')`}" style="padding:7px 12px;border:1px solid var(--bdr);border-radius:999px;font-size:12px;color:var(--acc);font-weight:600;cursor:pointer">+ Thèse</span></div>`
      : `<div onclick="_bsChoisirTitre()" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:7px 12px;border:1px solid var(--bdr);border-radius:999px;font-size:12px;color:var(--acc);font-weight:600;cursor:pointer">+ Écrire</div>`;
    const retour=_convRetour();
    const entete=un
      ? `<div style="margin-bottom:12px"><h2 style="font-size:19px;font-weight:700">${_lienTitre(un,esc(_tkNom(un)))}</h2><div style="font-size:11px;color:var(--mut);line-height:1.5;margin-top:3px">${esc(un)}${_tkDetenu(un)?"":" · titre non détenu"} · ce que tu as écrit sur cette ligne</div></div>`
      : _convEntete("Ma boussole","Tes convictions et tes décisions, à relire quand tu doutes");
    let corps;
    if(flux.length)corps=`<div class="card">${flux.map(ent).join("")}</div>`;
    else if(total)corps=`<div class="card" style="text-align:center;color:var(--mut);font-size:12px;padding:24px">Rien de ce type ici.</div>`;
    else corps=_videHtml(un?"Rien d'écrit sur cette ligne.<br>Ta thèse, c'est ta raison de la détenir ; ton journal, ce que tu décides au fil du temps.":"Rien d'écrit pour l'instant.<br>Ce carnet ne se remplit pas tout seul : c'est toi qui y notes ce en quoi tu crois, et ce que tu décides.",un?`_bsThese('${escAttr(un)}')`:"_bsChoisirTitre()",un?"Écrire ta thèse":"Écrire");
    return retour+entete+boutons+(total?filtres:"")+corps;
  }
  if(vue==="convictions"){
    const envs=[...new Set(d.ap.filter(x=>!x.noPerf&&!x.manual).map(x=>x.poche))];
    if(envs.length&&envs.indexOf(convEnv)<0)convEnv=envs[0];
    const tot=d.ap.filter(x=>!x.noPerf).reduce((s2,x)=>s2+(x.valeur||0),0)||1;
    const lst=d.ap.filter(x=>!x.noPerf&&!x.manual&&x.poche===convEnv).sort((a,b)=>(b.valeur||0)-(a.valeur||0));
    const notes=(D.prefs&&D.prefs.notes)||{};
    const modes=[["conv","Convictions"],["these","Thèses"],["plan","Plans de sortie"],["themes","Thèmes"]];
    const coupe=(t,n)=>{const v=String(t||"").replace(/\s+/g," ").trim();return v.length>n?v.slice(0,n-1)+"…":v;};
    // La liste ne change pas d'un mode à l'autre : même ordre, même filtre. Seule la colonne
    // de droite change, pour qu'on garde ses repères en basculant.
    const ligne=(x)=>{const c=cv[x.ticker]||0;const dorm=_convDormante(x.ticker);
      const id="cvv_"+x.ticker.replace(/[^A-Za-z0-9]/g,"_");
      const titre=`<div style="min-width:0">${_lienTitre(x.ticker,`<span style="font-size:13px;font-weight:700">${esc(_nomAffiche(x,22))}</span>`)}${dorm&&convMode==="conv"?` <span style="font-size:9px;color:var(--mut);border:1px dashed var(--mut);border-radius:4px;padding:0 4px">à revoir</span>`:""}<div style="font-size:10px;color:var(--mut);margin-top:2px">${vg((x.valeur||0)/tot*100,1)} % du portefeuille</div></div>`;
      if(convMode==="conv"){
        return `<div style="padding:13px 0;border-bottom:1px solid var(--sep)"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px">${titre}<span class="mono" id="${id}" style="font-size:15px;font-weight:800;color:${_convColor(c)}">${c}</span></div><input type="range" min="0" max="100" step="1" value="${c}" oninput="var e=document.getElementById('${id}');e.textContent=this.value;e.style.color=(this.value>=70?'var(--grn)':this.value>=40?'var(--amb)':'var(--mut)')" onchange="_convSet('${escAttr(x.ticker)}',this.value)" style="width:100%;accent-color:var(--acc)"></div>`;}
      let etat,apercu,act;
      if(convMode==="these"){const th=(notes[x.ticker]||"").trim();
        etat=th?`Écrite ✓`:`+ Écrire`;apercu=th?coupe(th,64):"";
        act=`_bsThese('${escAttr(x.ticker)}')`;}
      else{const n=_paliersRows(x.poche,x.ticker);
        etat=n.length?`${n.length} palier${n.length>1?"s":""} ✓`:`+ Définir`;
        apercu=n.length?n.slice().sort((a,b)=>a.px-b.px).map(r=>vg(r.px,2)).join(" · ")+" "+esc(curSym(curOf(x))):"";
        act=`openPlan('${escAttr(x.ticker)}','${escAttr(x.poche)}')`;}
      const fait=!/^\+/.test(etat);
      return `<div onclick="${act}" style="padding:13px 0;border-bottom:1px solid var(--sep);cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">${titre}<span style="font-size:11px;font-weight:700;flex-shrink:0;color:${fait?"var(--dim)":"var(--acc)"}">${etat}</span></div>${apercu?`<div style="font-size:10.5px;color:var(--mut);margin-top:5px;line-height:1.5">${esc(apercu)}</div>`:""}</div>`;};
    const rows=lst.map(ligne).join("");
    const selMode=`<div style="display:inline-flex;border:1px solid var(--bdr);border-radius:999px;overflow:hidden;margin-bottom:12px">${modes.map(m=>`<span onclick="setConvMode('${m[0]}')" style="padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer;background:${convMode===m[0]?"var(--acc)":"transparent"};color:${convMode===m[0]?"#fff":"var(--dim)"}">${m[1]}</span>`).join("")}</div>`;
    const sous={conv:"Ajuste tes notes. Le poids sous chaque ligne te rappelle ce qu'elle représente déjà.",
                these:"Pourquoi tu détiens chaque ligne. Touche une ligne pour écrire ou relire.",
                plan:"À quels prix tu comptes vendre. Touche une ligne pour définir ou modifier.",
                themes:"Regroupe plusieurs titres sous une même grande idée."}[convMode];
    // Le mode Thèmes montre des CARTES DE THÈME, pas la liste des positions : ni le filtre
    // par enveloppe ni les lignes ne s'y appliquent — il a donc son propre corps.
    const corps=(convMode==="themes")?_themesModeHtml()
      :((envs.length>1?`<div style="margin-bottom:12px">${segHtml(envs.map(n=>[n,n]),convEnv,"setConvEnv")}</div>`:"")
        +`<div class="card">${rows||`<div style="color:var(--mut);font-size:12px;text-align:center;padding:16px">Aucune position ici.</div>`}</div>`);
    return _convRetour()+_convEntete("Mes convictions",sous,"dorm")
      +selMode
      +corps;
  }
  if(vue==="themePage"){
    const t=_theme(themeOpen);
    if(!t)return _convRetour()+`<div class="card">Thème introuvable — il a peut-être été supprimé.</div>`;
    const st=_themeStats(t.id);
    const theseKey="th_"+t.id, theseTxt=(t.these||"").trim(), theseLongue=theseTxt.length>220;
    const theseAff=(!theseLongue||_themeExp[theseKey])?theseTxt:theseTxt.slice(0,220)+"…";
    const header=`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px"><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="width:9px;height:9px;border-radius:50%;background:${_themeCouleur(t)};flex-shrink:0"></span><h2 style="font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.icone?esc(t.icone)+" ":""}${esc(t.nom)}</h2></div><span onclick="_themeMenu('${escAttr(t.id)}')" style="color:var(--mut);font-size:19px;cursor:pointer;padding:4px 8px;flex-shrink:0">⋯</span></div>`;
    const sousLigne=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-bottom:14px"><span>${vg(st.poids,1)} % du portefeuille</span><span onclick="_themePoidsInfo()" style="display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--acc);color:#fff;font-size:8px;font-weight:700;cursor:pointer">?</span><span>·</span><span>conviction ${st.conv==null?"non notée":vg(st.conv,0)}</span></div>`;
    const theseBloc=`<div class="card" style="background:var(--inp);border-color:var(--bdr);margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px"><div style="font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">La thèse du thème</div><span onclick="_themeTheseEditer('${escAttr(t.id)}')" style="font-size:11px;color:var(--acc);font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0">✎ Modifier</span></div>`
      +(theseTxt?`<div style="font-size:12.5px;color:var(--dim);line-height:1.6;white-space:pre-wrap">${esc(theseAff)}${theseLongue?` <span onclick="_themeToggle('${theseKey}')" style="color:var(--acc);cursor:pointer;font-weight:600;font-size:11px;white-space:nowrap">${_themeExp[theseKey]?"voir moins":"voir plus"}</span>`:""}</div>`

function perfReelle(){if(!H||H.length<3)return null;const s0=H.slice().sort((a,b)=>a.t-b.t);
  // Bug C corrigé : on calcule la perf sur la VALEUR BOURSE (hors cash/immo),
  // reconstruite depuis env, avec les flux bourse. Si tout est inclus, on peut
  // utiliser inv (déjà bourse-only) pour les vieux points sans envInv.
  const allInc=_perfPoches().length===Object.keys((D&&D.poches)||{}).length;
  const pts=s0.map(p=>{const vB=_bourseVal(p);let iB=_bourseInv(p);if(iB==null&&allInc)iB=(p.inv!=null?p.inv:null);return{t:p.t,v:vB,inv:iB};}).filter(p=>p.v!=null&&p.inv!=null);
  if(pts.length<2)return null;
  let seedIdx=0,maxCf=0;const half=Math.max(1,Math.floor(pts.length/2));for(let i=1;i<=half;i++){const cf=(pts[i].inv||0)-(pts[i-1].inv||0);if(cf>maxCf){maxCf=cf;seedIdx=i;}}
  const s=pts.slice(seedIdx);if(s.length<2)return null;
  let twr=1,n=0;for(let i=1;i<s.length;i++){const v0=s[i-1].v,v1=s[i].v;let cf=(s[i].inv||0)-(s[i-1].inv||0);if(cf<0)cf=0;if(v0>0){const r=(v1-cf)/v0;if(isFinite(r)&&r>0){twr*=r;n++;}}}if(n<1)return null;
  const days=(s[s.length-1].t-s[0].t)/86400000;const cum=(twr-1)*100;const MINC=30,MINA=180;const cumLocked=days<MINC;const ann=days>=MINA?(Math.pow(twr,365/days)-1)*100:null;
  return {cum,days,cumLocked,ann,start:new Date(s[0].t),unlockCum:new Date(s[0].t+MINC*86400000),unlockAnn:new Date(s[0].t+MINA*86400000)};}

// Détection symétrique : une chute brutale en début d'historique est aussi suspecte qu'un grand

async function pullFromSupabase() {
  if (!sb || !currentUser) return false;
  try {
    const { data: pfData, error: pfErr } = await sb.from('portfolios').select('*').eq('user_id', currentUser.id).limit(1);
    if (pfErr) throw pfErr;
    if (!pfData || pfData.length === 0) return false;

    const pf = pfData[0];
    window.currentPfId = pf.id;

    const { data: posData, error: posErr } = await sb.from('positions').select('*').eq('portfolio_id', pf.id);
    if (posErr) throw posErr;

    const { data: cfData, error: cfErr } = await sb.from('cashflows').select('*').eq('portfolio_id', pf.id).order('date', { ascending: true });
    if (cfErr) console.warn('cashflows fetch error', cfErr);
    window.cashflows = cfData || [];

    const localD = loadLocal().D || {};

    let newD = {
      updatedAt: new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),
      eurUsd: pf.eur_usd || 1.10,
      cash: pf.cash || 0,
      targetAlloc: pf.target_alloc || {},
      immobilier: pf.immobilier || {},
      sales: pf.sales || [],
      divReceived: pf.div_received || [],
      prefs: pf.prefs || {},
      poches: {},
      migV2: localD.migV2, migV3: localD.migV3, migV4: localD.migV4, migV5: localD.migV5, migV6: localD.migV6, migV7: localD.migV7
    };

    const savedOrder = (pf.prefs && Array.isArray(pf.prefs.pocheOrder) && pf.prefs.pocheOrder.length) ? pf.prefs.pocheOrder : ["CTO", "PEA", "Assurance Vie", "PEE", "Crypto", "Métaux"];
    savedOrder.forEach(p => { if(!newD.poches[p]) newD.poches[p] = {sante: "5,0", positions: []}; });

    if (posData) {
      posData.forEach(pos => {
        if (!newD.poches[pos.poche]) {
          newD.poches[pos.poche] = {sante: "5,0", positions: []};
        }
        
        const oldPos = localD.poches && localD.poches[pos.poche] && localD.poches[pos.poche].positions.find(x => x.ticker === pos.ticker);
        
        newD.poches[pos.poche].positions.push({
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible,
          cibleHaut: pos.cible_haut,
          sector: pos.sector,
          dividend: pos.dividend,
          cours7j: oldPos ? oldPos.cours7j : pos.cours,
          cours7jDate: oldPos ? oldPos.cours7jDate : Date.now(),
          lastUpd: oldPos ? oldPos.lastUpd : Date.now(),
          currency: pos.currency || (oldPos ? oldPos.currency : null),
          avSymbol: pos.av_symbol || (oldPos ? oldPos.avSymbol : null),
          isin: pos.isin || (oldPos ? oldPos.isin : null),
          manual: !!(pf.prefs && pf.prefs.manualTickers && pf.prefs.manualTickers.includes(pos.ticker)),
          noPerf: !!(pf.prefs && pf.prefs.noPerfTickers && pf.prefs.noPerfTickers.includes(pos.ticker)),
          manualUpdated: (pf.prefs && pf.prefs.manualUpdatedAt && pf.prefs.manualUpdatedAt[pos.ticker]) || null
        });
      });
    }

    D = newD;
    H = pf.hist || [];
    st.sync = true;
    return true;
  } catch(e) {
    console.error("pullFromSupabase:", e);
    st.sync = false;
    return false;
  }
}

async function pushToSupabase() {
  if(!sb || !currentUser || !window.currentPfId) return false;
  if(_isSyncing){_syncPending=true;return false;}
  _isSyncing=true;
  let ok=false;
  try{
    const { error: pfErr } = await sb.from('portfolios').update({
      cash: D.cash || 0,
      eur_usd: D.eurUsd || 1.1,
      immobilier: D.immobilier || {},
      target_alloc: D.targetAlloc || {},
      sales: D.sales || [],
      div_received: D.divReceived || [],
      prefs: D.prefs || {},
      hist: H.slice(-1000)
    }).eq('id', window.currentPfId);
    
    if(pfErr) throw pfErr;

    const { data: dbPos, error: fetchErr } = await sb.from('positions').select('id, poche, ticker').eq('portfolio_id', window.currentPfId);
    if(fetchErr) throw fetchErr;

    let toUpdate = [];
    let toInsert = [];
    let keptIds = new Set();

    Object.entries(D.poches).forEach(([pocheName, p]) => {
      p.positions.forEach(pos => {
        const dbMatch = dbPos.find(x => x.poche === pocheName && x.ticker === pos.ticker);
        const payload = {
          portfolio_id: window.currentPfId,
          poche: pocheName,
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible || null,
          cible_haut: pos.cibleHaut || null,
          sector: pos.sector || null,
          dividend: pos.dividend || null,
          av_symbol: pos.avSymbol || null,
          currency: pos.currency || null,
          isin: pos.isin || null
        };
        if(dbMatch) {
          toUpdate.push({ id: dbMatch.id, ...payload });
          keptIds.add(dbMatch.id);
        } else {
          toInsert.push(payload);
        }
      });
    });

    const idsToDelete = dbPos.filter(x => !keptIds.has(x.id)).map(x => x.id);
    
    if(idsToDelete.length > 0) await sb.from('positions').delete().in('id', idsToDelete);
    if(toInsert.length > 0) await sb.from('positions').insert(toInsert);
    for(const item of toUpdate) {
        const { id, ...data } = item;
        await sb.from('positions').update(data).eq('id', id);
    }

    st.sync=true; ok=true;
  }catch(e){console.error("pushToSupabase:",e);st.sync=false;_syncErr();}
  finally{
    _isSyncing=false;
    R();
  }
  if(_syncPending){_syncPending=false;setTimeout(pushToSupabase,0)}
  else if(ok && currentUser){try{localStorage.removeItem("pf-dirty-"+currentUser.id);}catch(e){}}
  return ok;
}

async function migrateToSupabase() {
  if(!sb || !currentUser) return;
  if(localStorage.getItem('sb-migrated-'+currentUser.id) === 'true') {
     if(!window.currentPfId) {
        const { data } = await sb.from('portfolios').select('id').eq('user_id', currentUser.id).limit(1);
        if(data && data.length > 0) window.currentPfId = data[0].id;
     }
     return;
  }
  
  try {
    const { data: existing, error: fetchErr } = await sb.from('portfolios').select('id').eq('user_id', currentUser.id).limit(1);
    if (fetchErr) throw fetchErr;
    
    if (existing && existing.length > 0) {
      localStorage.setItem('sb-migrated-'+currentUser.id, 'true');
      window.currentPfId = existing[0].id;
      return;
    }

    const { data: newPf, error: insertErr } = await sb.from('portfolios').insert([{
      user_id: currentUser.id,
      cash: D.cash || 0,
      eur_usd: D.eurUsd || 1.1,
      immobilier: D.immobilier || {},
      target_alloc: D.targetAlloc || {},
      sales: D.sales || [],
      div_received: D.divReceived || [],
      prefs: D.prefs || {},
      hist: H || []
    }]).select();
    
    if (insertErr) throw insertErr;
    const pfId = newPf[0].id;
    window.currentPfId = pfId;

    const posToInsert = [];
    Object.entries(D.poches).forEach(([pocheName, p]) => {
      p.positions.forEach(pos => {
        posToInsert.push({
          portfolio_id: pfId,
          poche: pocheName,
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible || null,
          cible_haut: pos.cibleHaut || null,
          sector: pos.sector || null,
          dividend: pos.dividend || null,
          av_symbol: pos.avSymbol || null,
          currency: pos.currency || null
        });
      });
    });

    if (posToInsert.length > 0) {
      const { error: posErr } = await sb.from('positions').insert(posToInsert);
      if (posErr) throw posErr;
    }

    localStorage.setItem('sb-migrated-'+currentUser.id, 'true');
    
  } catch (err) {
    console.error("Migration error:", err);
  }
}

async function fetchStocks(){
  const tickers=new Set();
  if(D&&D.poches)Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
    if(pos.manual)return;
    const cur=curOf(pos);
    // Tout ticker sans point, pas crypto, pas or → US par défaut
    // Couvre les positions ajoutées manuellement sans passer par la recherche
    if(!CG[pos.ticker]&&pos.ticker!=="50PESO"&&!pos.ticker.includes(".")){
      if(cur==="USD"||!cur) tickers.add(pos.ticker);
    }
  }));
  if(tickers.size===0){window._usPrevClose={};return {};}
  const list=[...tickers].join(",");
  let quotes={};const pcMap={};
  // Cours US via Finnhub (temps réel quand ça répond) — meta contient la clôture veille (pc).
  try{
    const r=await fetchT(`${WORKER_URL}/?usquote=${encodeURIComponent(list)}`);
    if(r.ok){const j=await r.json();quotes=j.quotes||{};const m=j.meta||{};Object.keys(m).forEach(k=>{if(m[k]&&m[k].pc>0)pcMap[k]=m[k].pc;});}
  }catch(e){console.error("US quote fetch error:",e)}
  // Repli Yahoo pour les tickers que Finnhub n'a pas renvoyés → évite les prix qui traînent (⚠️) + clôture veille.
  const missing=[...tickers].filter(t=>quotes[t]==null);
  if(missing.length){
    try{
      const r2=await fetchT(`${WORKER_URL}/?symbols=${encodeURIComponent(missing.join(","))}&_t=${Date.now()}`);
      if(r2.ok){const j2=await r2.json();const arr=(j2.quoteResponse&&j2.quoteResponse.result)||[];arr.forEach(q=>{if(q.symbol&&q.regularMarketPrice!=null){quotes[q.symbol]=q.regularMarketPrice;if(q.regularMarketPreviousClose>0)pcMap[q.symbol]=q.regularMarketPreviousClose;}});}
    }catch(e){console.error("US Yahoo fallback error:",e)}
  }
  window._usPrevClose=pcMap;
  return quotes;
}

async function applyPortfolioMigrations(){
  if(!D||!D.poches)return false;
  const _hasData=Object.values(D.poches).some(p=>p.positions&&p.positions.length)||D.cash>0||(Array.isArray(D.sales)&&D.sales.length>0);
  if(!_hasData)return false;

  let changed=false;
  // migV2/migV3 retirees : elles injectaient des donnees personnelles chez tous les comptes (fuite). On marque juste comme appliquees.
  if(!D.migV2){D.migV2=true;}
  if(!D.migV3){D.migV3=true;}
  if(!D.migV4){
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.sector&&SECTORS[pos.ticker])pos.sector=SECTORS[pos.ticker];
      if(!pos.dividend&&DIVS[pos.ticker])pos.dividend=DIVS[pos.ticker];
    }));
    D.migV4=true;changed=true;
  }
  if(!D.migV5){
    const now=Date.now();
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.lastUpd)pos.lastUpd=now;
      if(!pos.cours7j&&pos.cours){pos.cours7j=pos.cours;pos.cours7jDate=now;}
    }));
    D.migV5=true;changed=true;
  }

  if(!D.migV7){
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{ if(!pos.currency)pos.currency=LEGACY_CUR[pos.ticker]||"EUR"; }));
    D.migV7=true;changed=true;
  }

  if (!D.migV6 && sb && window.currentPfId && Array.isArray(D.sales) && D.sales.length > 0) {
    try {
      const rows = D.sales.map(s => ({
        portfolio_id: window.currentPfId,
        date: s.date,
        type: 'sell',
        ticker: s.ticker || null,
        poche: s.poche || null,
        amount_eur: Number(s.net != null ? s.net : (s.brut || 0)),
        qty: s.qty != null ? Number(s.qty) : null,
        price_eur: (s.qty && s.net) ? Number((s.net / s.qty).toFixed(4)) : null,
        label: s.titre || null
      }));

      const { error: insErr } = await sb.from('cashflows').insert(rows);
      if (!insErr) {
        D.migV6 = true;
        changed = true;
        const { data: cfData } = await sb
          .from('cashflows')
          .select('*')
          .eq('portfolio_id', window.currentPfId)
          .order('date', { ascending: true });
        window.cashflows = cfData || [];
      }
    } catch (e) {
      console.warn('Migration V6 exception :', e);
    }
  }

  // ── Paliers par ticker → paliers par enveloppe (jouée UNE seule fois) ──────────────────
  // Ne touche que le portfolio chargé en mémoire : aucun autre compte n'est concerné.
  if(!D.prefs||!D.prefs.migPaliersEnvFait){
    D.prefs=D.prefs||{};
    const _pos=(tk)=>{const c=[];Object.entries(D.poches).forEach(([poche,p])=>p.positions.forEach(x=>{
      if(x.ticker===tk)c.push({poche:poche,x:x});}));return c;};
    const _plusGrosse=(c)=>c.slice().sort((a,b)=>((b.x.qty||0)*(b.x.cours||0))-((a.x.qty||0)*(a.x.cours||0)))[0];
    const anc=D.prefs.paliers||{};
    const neuf={};
    // 1) Chaque clé « TICKER » est rattachée à UNE enveloppe. Quand le titre est détenu dans
    //    plusieurs comptes, la quantité de référence (base) désigne celui d'origine ; à défaut
    //    la position la plus grosse. Jamais de duplication sur les deux.
    Object.keys(anc).forEach(k=>{
      if(k.indexOf("|")>=0){neuf[k]=anc[k];return;}          // déjà au nouveau format
      const o=anc[k];const cands=_pos(k);
      if(!cands.length)return;                                // titre plus détenu : la clé tombe
      let choisi=cands[0];
      if(cands.length>1){
        const parBase=(o&&o.base>0)?cands.find(c=>Math.abs((c.x.qty||0)-o.base)<0.0001):null;
        choisi=parBase||_plusGrosse(cands);
      }
      neuf[_pkPal(choisi.poche,k)]=o;
    });
    // 2) Ancienne structure « prix unique » (prefs.plan, d'avant la v207). On ne la convertit
    //    que si le titre n'a AUCUN plan — sinon on ressusciterait ce qu'on vient de ranger —
    //    puis on l'efface définitivement : c'est elle que rc() réinjectait sans fin.
    const legacy=D.prefs.plan||{};
    Object.keys(legacy).forEach(tk=>{
      const px=legacy[tk]&&legacy[tk].px;
      if(!(px>0))return;
      if(Object.keys(neuf).some(k=>k.slice(k.indexOf("|")+1)===tk))return;
      const cands=_pos(tk);if(!cands.length)return;
      const c=_plusGrosse(cands);
      neuf[_pkPal(c.poche,tk)]={unit:"pct",base:c.x.qty||0,rows:[{q:100,px:px}]};
    });
    delete D.prefs.plan;
    D.prefs.paliers=neuf;
    // 3) Marqueurs palierSync au format « TICKER » (d'avant la v213) : inertes, ils empêchaient
    //    _syncCibleHaut() de reconnaître ses propres valeurs donc de les effacer. On les reporte
    //    sur le couple correspondant, puis l'ancien format disparaît.
    const sync=D.prefs.palierSync||{};const syncNeuf={};
    Object.keys(sync).forEach(k=>{
      if(k.indexOf("|")>=0){syncNeuf[k]=sync[k];return;}
      _pos(k).forEach(c=>{if(c.x.cibleHaut===sync[k])syncNeuf[_pkPal(c.poche,k)]=sync[k];});
    });
    // 4) Objectifs orphelins : une position sans plan dont le cibleHaut avait été POSÉ par la
    //    synchronisation (il correspond à un marqueur) n'a plus de raison d'exister. Un objectif
    //    saisi à la main n'a lui aucun marqueur : on n'y touche jamais.
    Object.entries(D.poches).forEach(([poche,p])=>p.positions.forEach(x=>{
      const cle=_pkPal(poche,x.ticker);
      if(neuf[cle])return;
      const pose=syncNeuf[cle];
      if(x.cibleHaut!=null&&pose!=null&&x.cibleHaut===pose){delete x.cibleHaut;delete syncNeuf[cle];}
    }));
    D.prefs.palierSync=syncNeuf;
    D.prefs.migPaliersEnvFait=1;
    changed=true;
  }

  // ── Plans d'achat par ticker → plans par enveloppe (jouée UNE seule fois) ───────────────
  // Ne touche que le portfolio chargé en mémoire. L'enveloppe vide ("|TICKER") est légitime :
  // c'est un plan sur un titre qu'on ne détient nulle part, qui doit être conservé tel quel.
  if(!D.prefs||!D.prefs.migAchatEnvFait){
    D.prefs=D.prefs||{};
    const _posA=(tk)=>{const c=[];Object.entries(D.poches).forEach(([poche,p])=>p.positions.forEach(x=>{
      if(x.ticker===tk)c.push({poche:poche,x:x});}));return c;};
    const _plusGrosseA=(c)=>c.slice().sort((a,b)=>((b.x.qty||0)*(b.x.cours||0))-((a.x.qty||0)*(a.x.cours||0)))[0];
    const ancA=D.prefs.achat||{};
    const neufA={};
    Object.keys(ancA).forEach(k=>{
      if(k.indexOf("|")>=0){neufA[k]=ancA[k];return;}        // déjà au nouveau format
      const o=ancA[k];const cands=_posA(k);
      // Titre détenu nulle part : le plan reste autonome, sans enveloppe.
      if(!cands.length){neufA[_pkPal("",k)]=o;return;}
      let choisi=cands[0];
      if(cands.length>1){
        // Un plan d'achat n'a pas de « base » (contrairement aux paliers de vente) : on la teste
        // quand même par sûreté, puis on retient la position la plus grosse.
        const parBase=(o&&o.base>0)?cands.find(c=>Math.abs((c.x.qty||0)-o.base)<0.0001):null;
        choisi=parBase||_plusGrosseA(cands);
      }
      neufA[_pkPal(choisi.poche,k)]=o;
    });
    D.prefs.achat=neufA;                                     // l'ancien format disparaît
    // Seuils bas devenus orphelins : une position dont l'enveloppe n'a plus de plan, et dont le
    // seuil avait été POSÉ par la synchronisation (il correspond à un marqueur). Un seuil saisi
    // à la main n'a aucun marqueur : on n'y touche jamais.
    const syncA=D.prefs.achatSync||{};
    Object.entries(D.poches).forEach(([poche,p])=>p.positions.forEach(x=>{
      const cle=_pkPal(poche,x.ticker);
      if(neufA[cle])return;
      const pose=syncA[cle];
      if(x.cible!=null&&pose!=null&&x.cible===pose){delete x.cible;delete syncA[cle];}
    }));
    // Même règle pour la liste de suivi, qui reste indexée par ticker : son seuil vient
    // désormais du plan SANS enveloppe.
    ((D.prefs.watchlist)||[]).forEach(w=>{
      if(neufA[_pkPal("",w.ticker)])return;
      const k="wl:"+w.ticker;const pose=syncA[k];
      if(w.target!=null&&pose!=null&&w.target===pose){delete w.target;delete syncA[k];}
    });
    D.prefs.achatSync=syncA;
    D.prefs.migAchatEnvFait=1;
    changed=true;
  }

  if(!D.migV8){
    D.prefs=D.prefs||{};
    if(D.prefs.conv){
      Object.keys(D.prefs.conv).forEach(tk=>{
        const v=D.prefs.conv[tk];
        if(v>0&&v<=5)D.prefs.conv[tk]=Math.round(v*20);
      });
    }
    D.migV8=true;changed=true;
  }

  return changed;
}

// Projection de remboursement du crédit : date de fin + intérêts restants
function mortgageProjection(m){
  if(!m||((!m.mainMensualite||m.mainMensualite<=0)&&(!m.ptzMensualite||m.ptzMensualite<=0)))return null;
  let main=m.mainCapital||0, ptz=m.ptzCapital||0, months=0, totalInterest=0;
  const rate=(m.mainTaux||0)/12;
  while((main>0.01||ptz>0.01)&&months<720){
    months++;
    if(ptz>0.01)ptz=Math.max(0,ptz-Math.min(m.ptzMensualite||0,ptz));
    if(main>0.01){
      const interest=main*rate;
      const principal=(m.mainMensualite||0)-interest;
      if(principal<=0){months=-1;break;}
      totalInterest+=interest;
      main=Math.max(0,main-principal);
    }
  }
  if(months<0||months>=720)return null;
  const end=new Date();end.setMonth(end.getMonth()+months);
  return {months,endDate:end,totalInterest:Math.round(totalInterest),monthlyTotal:(m.mainMensualite||0)+(m.ptzMensualite||0)};
}
function ensureImmoBiens(d){if(!d||!d.immobilier)return;if(!Array.isArray(d.immobilier.biens))d.immobilier.biens=[];if(!d.immobilier.biens.length&&((d.immobilier.valeurEstimee||0)>0||d.immobilier.mortgage)){d.immobilier.biens=[{id:"b"+Date.now().toString(36),nom:"Bien 1",valeurEstimee:d.immobilier.valeurEstimee||0,capitalRestant:d.immobilier.capitalRestant||0,mortgage:d.immobilier.mortgage||null}];delete d.immobilier.mortgage;}}
function immoEquityInTotal(d){d=d||D;if(!d||!d.immobilier)return 0;const b=d.immobilier.biens;if(!Array.isArray(b)||!b.length)return (d.immobilier.equityNette||0);let s=0;b.forEach(x=>{if(x.exclureTotal)return;s+=((x.valeurEstimee||0)-(x.capitalRestant||0));});return Math.round(s*100)/100;}
function pocheExclSum(d){d=d||D;if(!d||!d.prefs||!d.prefs.pocheExclTotal||!d.poches)return 0;let s=0;Object.entries(d.poches).forEach(([n,p])=>{if(d.prefs.pocheExclTotal[n])s+=(p.valeur||0);});return s;}
function applyMortgagePayments(){
  if(!D||!D.immobilier)return false;ensureImmoBiens(D);if(!D.immobilier.biens.length)return false;
  const now=new Date();let applied=false;
  D.immobilier.biens.forEach(b=>{
    const m=b.mortgage;if(!m)return;
    const parts=String(m.lastPayment||"").split("-").map(Number);
    let last=parts.length===3?new Date(parts[0],parts[1]-1,parts[2]):new Date(NaN);
    if(isNaN(last.getTime())){m.lastPayment=now.toISOString().slice(0,10);return;}
    let safety=0;
    while(safety<600){
      safety++;
      const next=new Date(last.getFullYear(),last.getMonth()+1,1);
      if(isNaN(next.getTime())||next>now)break;
      const ptzPay=Math.min(m.ptzMensualite,m.ptzCapital);
      m.ptzCapital=Math.max(0,m.ptzCapital-ptzPay);
      const interest=m.mainCapital*(m.mainTaux/12);
      const capitalPart=Math.max(0,m.mainMensualite-interest);
      m.mainCapital=Math.max(0,m.mainCapital-capitalPart);
      const yy=next.getFullYear(),mm=String(next.getMonth()+1).padStart(2,"0"),dd=String(next.getDate()).padStart(2,"0");
      m.lastPayment=yy+"-"+mm+"-"+dd;
      last.setTime(next.getTime());
      applied=true;
    }
    b.capitalRestant=Math.round((m.ptzCapital+m.mainCapital)*100)/100;
  });
  return applied;
}

// ══════════════ GRAPHIQUES & DONUT ══════════════
function dn(data,colors,sz=120){const tot=data.reduce((s,d)=>s+d[1],0)||1;let a=0;const g=.02,cx=sz/2,cy=sz/2,R=sz*.42,r=sz*.28;let p="";data.forEach((d,i)=>{const f=d[1]/tot;if(f<.001){a+=f;return}const s1=a*Math.PI*2-Math.PI/2+g,e1=(a+f)*Math.PI*2-Math.PI/2-g,l=f>.5?1:0;p+=`<path d="M${cx+R*Math.cos(s1)},${cy+R*Math.sin(s1)} A${R},${R} 0 ${l} 1 ${cx+R*Math.cos(e1)},${cy+R*Math.sin(e1)} L${cx+r*Math.cos(e1)},${cy+r*Math.sin(e1)} A${r},${r} 0 ${l} 0 ${cx+r*Math.cos(s1)},${cy+r*Math.sin(s1)} Z" fill="${colors[i%colors.length]}" opacity=".9"/>`;a+=f});return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${p}</svg>`;}

// RESTAURATION fb23f43 : lc() restauré dans sa version simple d'origine (signature lc(data, k, w, h) avec k=clé string).
// Les fonctionnalités benchmark/crosshair/cashflow markers ne sont pas dans la version d'origine.
function lc(data, k, w=300, h=180, pctBase=null) {
  const endVal = data.length > 0 ? data[data.length-1][k] : 0;
  const fmtC=(v)=>(Math.abs(Number(v))>=1000?fmt_(v):Number(v).toFixed(2));

  if(data.length < 2) {
    return `<div style="height:${h}px; position:relative; display:flex; flex-direction:column;">
      <div class="mono" style="font-size:16px; font-weight:bold; color:var(--txt); padding-top:14px;">${fmtC(endVal)}</div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--mut); font-size:11px; text-align:center; padding-bottom:10px;">
        <div style="font-size:20px; margin-bottom:8px; opacity:0.5;">📈</div>
        Acquisition en cours...<br>La courbe apparaîtra au prochain relevé.
      </div>
    </div>`;
  }

  const vs = data.map(d=>d[k]);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mn === mx) { mn -= 1; mx += 1; }

  const pad = (mx - mn) * 0.1;
  const dMin = mn - pad, dMax = mx + pad, rg = dMax - dMin;

  // Gouttière à droite : les valeurs des repères vivent hors du tracé et ne le chevauchent jamais.
  const gR = 34;
  const pdX = 0, pt = 42, pb = 20;
  const cw = w - pdX - gR, ch = h - pt - pb;

  const startVal = vs[0];
  const diff = endVal - startVal;
  const isPos = diff >= 0;
  // Couleur unique et neutre : le graphique ne juge pas. Le vert/rouge est sur le chiffre, au-dessus,
  // où il est mieux placé — une baisse de 2 % ne doit pas s'afficher aussi rouge qu'une chute de 30 %.
  const col = "var(--acc)";
  const dCol = isPos ? "var(--grn)" : "var(--red)";
  // Valeurs des repères abrégées : 72k, 64k. La valeur exacte reste disponible au doigt.
  const fmtK = (v)=>{const a=Math.abs(v); if(a>=10000) return Math.round(v/1000)+"k"; if(a>=1000) return (v/1000).toFixed(1)+"k"; return String(Math.round(v));};

  // Axe horizontal = le TEMPS, pas le numéro du point. Avant, un point valait une part égale de
  // largeur quelle que soit sa date : des relevés hebdomadaires au début et plusieurs par jour à la
  // fin écrasaient des mois entiers sur quelques pixels. Repli sur l'espacement régulier si toutes
  // les dates sont identiques (ou absentes), sinon division par zéro.
  const ts = data.map(d=>d.t);
  const tMin = Math.min(...ts), tMax = Math.max(...ts);
  const tRg = tMax - tMin;
  const xAt = (i)=> (isFinite(tRg) && tRg > 0) ? (ts[i]-tMin)/tRg : (i/(vs.length-1));
  const P = vs.map((v,i)=>({x: pdX+xAt(i)*cw, y: pt+ch-((v-dMin)/rg*ch)}));

  const K = 0.16;
  let curveCmds = "";
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1];
    // Les points de contrôle sont tirés de l'écartement des VOISINS. Avec des points régulièrement
    // espacés c'est sans danger, mais l'axe temporel rend l'espacement très irrégulier (une nuit de
    // 16 h, puis dix relevés en dix minutes) : le contrôle atterrissait alors loin au-delà du point
    // d'arrivée et la courbe faisait des boucles. On borne l'offset à la moitié du segment courant.
    // Sur des points bien espacés, le min retient toujours K : le tracé est identique.
    const spanA=p2.x-p0.x, spanB=p3.x-p1.x, segx=p2.x-p1.x;
    const kA = spanA>0 ? Math.min(K, segx/spanA*0.5) : 0;
    const kB = spanB>0 ? Math.min(K, segx/spanB*0.5) : 0;
    const c1x=p1.x+spanA*kA, c1y=p1.y+(p2.y-p0.y)*kA;
    const c2x=p2.x-spanB*kB, c2y=p2.y-(p3.y-p1.y)*kB;
    curveCmds += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const last = P[P.length-1];
  const ptLine = `M${P[0].x.toFixed(1)},${P[0].y.toFixed(1)}` + curveCmds;
  const ptArea = `M${P[0].x.toFixed(1)},${(pt+ch).toFixed(1)} L${P[0].x.toFixed(1)},${P[0].y.toFixed(1)}` + curveCmds + ` L${last.x.toFixed(1)},${(pt+ch).toFixed(1)} Z`;

  const diffPct = (pctBase!=null&&pctBase>0) ? (diff / pctBase * 100) : (startVal !== 0 ? (diff / Math.abs(startVal) * 100) : 0);
  const diffSign = isPos ? "+" : "";

  const hasIntraday = data.some((d,i)=>i>0 && d.t && data[i-1].t && new Date(d.t).toDateString()===new Date(data[i-1].t).toDateString());
  const formatT = (ms) => {
    if(!ms) return "";
    const d = new Date(ms), nw = new Date();
    const sameDay = d.getDate()===nw.getDate() && d.getMonth()===nw.getMonth() && d.getFullYear()===nw.getFullYear();
    if(sameDay && !hasIntraday) return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    const dateStr = d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:d.getFullYear()!==nw.getFullYear()?"2-digit":undefined});
    if(hasIntraday) return dateStr+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    return dateStr;
  };

  // Trois repères horizontaux seulement, et aucune ligne verticale : la lecture au doigt donne la
  // date bien mieux qu'en comptant des traits, et chaque trait en moins profite à la courbe.
  const grid = [0, 0.5, 1].map(f=>({y: pt + f*ch, v: dMax - (dMax-dMin)*f}));

  const uid = Math.random().toString(36).substring(2,9);
  window._LC=window._LC||{};
  // cw est nécessaire à la lecture au doigt : elle convertit la position du doigt en coordonnée du
  // tracé pour chercher le point le plus proche par sa POSITION, et non par son numéro.
  window._LC[uid]={xs:P.map(p=>p.x),ys:P.map(p=>p.y),vs:vs.slice(),tsf:data.map(d=>formatT(d.t)),d1:fmtC(endVal),d2:diffSign+fmtC(diff)+" ("+diffSign+diffPct.toFixed(1)+"%)",col:col,dCol:dCol,cw:cw};

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible; display:block">
    <text id="lcv-${uid}" x="0" y="14" font-size="16" font-weight="bold" fill="var(--txt)" font-family="monospace">${fmtC(endVal)}</text>
    <text id="lcd-${uid}" x="0" y="32" font-size="12" font-weight="600" fill="${dCol}" font-family="monospace">${diffSign}${fmtC(diff)} (${diffSign}${vg(diffPct,1)}%)</text>

    ${grid.map(g=>`<line x1="0" y1="${g.y.toFixed(1)}" x2="${cw}" y2="${g.y.toFixed(1)}" stroke="var(--dim)" stroke-opacity="0.25" stroke-width="1"/><text x="${w}" y="${(g.y+3).toFixed(1)}" font-size="9" fill="var(--mut)" text-anchor="end" font-family="monospace">${fmtK(g.v)}</text>`).join("")}

    <path d="${ptArea}" fill="var(--acc)" fill-opacity="0.10"/>
    <path d="${ptLine}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3.5" fill="var(--acc)" stroke="var(--card)" stroke-width="2"/>

    <text x="0" y="${h-2}" font-size="9" fill="var(--mut)">${formatT(data[0].t)}</text>
    <text x="${cw}" y="${h-2}" font-size="9" fill="var(--mut)" text-anchor="end">${formatT(data[data.length-1].t)}</text>
    <g style="pointer-events:none"><line id="cl-${uid}" x1="-9" y1="${pt-2}" x2="-9" y2="${pt+ch}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle id="cc-${uid}" cx="-9" cy="0" r="3.5" fill="var(--acc)" stroke="var(--card)" stroke-width="2" opacity="0"/></g>
    <rect x="0" y="0" width="${cw}" height="${h}" fill="transparent" style="cursor:crosshair" onmousemove="_lcHover(event,'${uid}')" onmouseleave="_lcOut('${uid}')" ontouchstart="_lcHover(event,'${uid}')" ontouchmove="_lcHover(event,'${uid}')" ontouchend="_lcOut('${uid}')"/>
  </svg>`;
}

 ; tu restes seul responsable de tes décisions.</div>`);};

window.exportPDF = () => { cm(); const d = ga(); let html = `<div class="print-page"><div class="print-title">Rapport de Portefeuille Global</div><div class="print-subtitle">Généré le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})}</div><div style="font-size:18px; margin-bottom:10px;">Patrimoine Net : <b>${fmt_(d.tN)} €</b></div><div style="font-size:14px; margin-bottom:20px;">P&L Global : <b class="${d.tP >= 0 ? 'text-green' : 'text-red'}">${fL(d.tP)}</b></div><table class="print-table"><thead><tr><th>Enveloppe</th><th class="text-right">Valeur</th><th class="text-right">Poids</th><th class="text-right">P&L</th></tr></thead><tbody>`; d.al.forEach(a => { const isCash = a[0] === "Cash"; const p = isCash ? null : D.poches[a[0]]; const plStr = isCash ? "-" : `<span class="${p.pl >= 0 ? 'text-green' : 'text-red'}">${fL(p.pl)}</span>`; html += `<tr><td><b>${a[0]}</b></td><td class="text-right">${fmt_(a[1])} €</td><td class="text-right">${vg((a[1] / d.tF) * 100,1)}%</td><td class="text-right">${plStr}</td></tr>`; }); html += `</tbody></table>`; if (D.immobilier) { html += `<div class="print-title" style="font-size:18px; border-bottom:1px solid #ccc;">Immobilier</div><table class="print-table" style="width:50%;"><tr><td>Valeur Estimée</td><td class="text-right">${fmt_(D.immobilier.valeurEstimee)} €</td></tr><tr><td>Capital Restant</td><td class="text-right">${fmt_(D.immobilier.capitalRestant)} €</td></tr><tr><td><b>Capital Net (Equity)</b></td><td class="text-right"><b>${fmt_(D.immobilier.equityNette)} €</b></td></tr></table>`; } html += `</div>`; Object.entries(D.poches).forEach(([n, p]) => { html += `<div class="print-page"><div class="print-title">Détail : ${n}</div><div style="margin-bottom: 20px; font-size: 14px;">Valeur Totale : <b>${fmt_(p.valeur)} €</b> &nbsp;|&nbsp; Investissement : ${fmt_(p.investi)} € &nbsp;|&nbsp; P&L : <b class="${p.pl >= 0 ? 'text-green' : 'text-red'}">${fL(p.pl)}</b></div>`; if (p.positions.length > 0) { const sortedPositions=[...p.positions].sort((a,b)=>(b.valeur||0)-(a.valeur||0)); html += `<table class="print-table"><thead><tr><th>Nom de l'Actif</th><th>Ticker</th><th class="text-right">Qté</th><th class="text-right">PRU</th><th class="text-right">Cours Actuel</th><th class="text-right">Valeur</th><th class="text-right">Poids</th><th class="text-right">P&L Latent</th></tr></thead><tbody>`; sortedPositions.forEach(x => { const cur = curOf(x); const prSym = " " + curSym(cur); html += `<tr><td>${esc(x.titre)}</td><td>${esc(x.ticker)}</td><td class="text-right">${x.qty}</td><td class="text-right">${fmt2_(x.pru)}${prSym}</td><td class="text-right">${fmt2_(x.cours)}${prSym}</td><td class="text-right"><b>${fmt_(x.valeur)} €</b></td><td class="text-right">${x.poids}%</td><td class="text-right"><span class="${x.pl >= 0 ? 'text-green' : 'text-red'}">${fL(x.pl)}<br><span style="font-size:10px">${fP(x.plPct)}</span></span></td></tr>`; }); html += `</tbody></table>`; } else { html += `<p style="font-size:12px; color:#555;">Aucune position active dans cette enveloppe.</p>`; } html += `</div>`; }); let pr = document.getElementById("print-report"); pr.innerHTML = html; setTimeout(() => { window.print(); }, 300); };
