function scorePos(pos, pocheName){
  const isCrypto = pocheName === "Crypto" || CG[pos.ticker];
  const isFund = pocheName === "Assurance Vie" || pocheName === "PEE";
  const prof=(D&&D.prefs&&D.prefs.scoreProfile)||"equilibre";
  const W = prof==="croissance"?{pl:1,div:0,mom:1.4}:prof==="dividende"?{pl:0.8,div:1.6,mom:0.8}:{pl:1,div:1,mom:1};
  let s=5; const crit=[];
  const pl=pos.plPct||0;
  const mult=isCrypto?1.5:isFund?0.7:1.0;
  let plPts=0;
  if(pl>=50*mult)plPts=2.5;else if(pl>=25*mult)plPts=1.5;else if(pl>=10*mult)plPts=0.8;else if(pl>=-5*mult)plPts=0;else if(pl>=-15*mult)plPts=-0.8;else if(pl>=-30*mult)plPts=-1.5;else plPts=-2.5;
  plPts=Math.round(plPts*W.pl*10)/10;s+=plPts;
  crit.push({n:"P&L",v:(plPts>=0?"+":"")+plPts.toFixed(1),c:plPts>0?"g":plPts<0?"r":"a"});
  const w=pos.poids||0;let wPts=0;
  if(w>=8&&w<=22)wPts=0.5;else if((w>=5&&w<8)||(w>22&&w<=30))wPts=0;else if((w>=2&&w<5)||(w>30&&w<=40))wPts=-0.5;else if(w<2)wPts=-1;else wPts=-1.5;
  s+=wPts;crit.push({n:"Poids",v:(wPts>=0?"+":"")+wPts.toFixed(1),c:wPts>0?"g":wPts<0?"r":"a"});
  const div=pos.dividend||DIVS[pos.ticker]||0;const yld=pos.cours>0?(div/pos.cours*100):0;
  let divPts=0;if(yld>5)divPts=1;else if(yld>3)divPts=0.7;else if(yld>1)divPts=0.4;else if(yld>0)divPts=0.2;
  divPts=Math.round(divPts*W.div*10)/10;if(divPts>0){s+=divPts;crit.push({n:"Div",v:"+"+divPts.toFixed(1),c:"g"});}
  if(pos.cours7j&&pos.cours7j>0){const delta=(pos.cours-pos.cours7j)/pos.cours7j*100;let mPts=0;if(delta>10)mPts=1;else if(delta>3)mPts=0.5;else if(delta>-3)mPts=0;else if(delta>-10)mPts=-0.5;else mPts=-1;mPts=Math.round(mPts*W.mom*10)/10;s+=mPts;crit.push({n:"7j",v:(mPts>=0?"+":"")+mPts.toFixed(1),c:mPts>0?"g":mPts<0?"r":"a"});}
  if(pos.cible>0&&pos.cours>0){const ec=(pos.cours-pos.cible)/pos.cible*100;let cPts=0;if(ec<=0)cPts=0.5;else if(ec<5)cPts=0.2;if(cPts>0){s+=cPts;crit.push({n:"Cible",v:"+"+cPts.toFixed(1),c:ec<=0?"g":"a"});}}
  return {score:Math.max(1,Math.min(10,Math.round(s*10)/10)),crit};
}

function downsampleH(){
  if(H.length<2)return;
  const now=Date.now();
  const D7=7*24*3600*1000;
  const D30=30*24*3600*1000;
  const recent=H.filter(x=>now-x.t<D7);
  const mid=H.filter(x=>now-x.t>=D7&&now-x.t<D30);
  const old=H.filter(x=>now-x.t>=D30);
  const midMap={};
  mid.forEach(x=>{const k=new Date(x.t).toISOString().slice(0,10);if(!midMap[k])midMap[k]=x;else Object.assign(midMap[k], x);});
  const oldMap={};
  old.forEach(x=>{const d=new Date(x.t);const wk=`${d.getFullYear()}-W${String(Math.ceil((d-new Date(d.getFullYear(),0,1))/604800000)).padStart(2,"0")}`;if(!oldMap[wk])oldMap[wk]=x;else Object.assign(oldMap[wk], x);});
  H=[...Object.values(oldMap),...Object.values(midMap),...recent].sort((a,b)=>a.t-b.t);
}

function rc(d){
  if(!d||!d.poches)return d;
  const eurUsd=d.eurUsd||1.1;
  Object.entries(d.poches).forEach(([pocheName,p])=>{
    p.positions.forEach(x=>{
      const cur=curOf(x);
      const te=toEur(cur);
      x.valeur=(x.qty*x.cours)*te;
      x.pl=(x.qty*(x.cours-x.pru))*te;
      x.plPct=x.pru?((x.cours-x.pru)/x.pru*100):0;
    });
    p.investi=p.positions.reduce((s,x)=>{
      const cur=curOf(x);
      return s+(x.qty*x.pru)*toEur(cur)
    },0);
    p.valeur=p.positions.reduce((s,x)=>s+x.valeur,0);
    p.pl=p.valeur-p.investi;
    const t=p.valeur||1;
    p.positions.forEach(x=>{x.poids=Math.round(x.valeur/t*1000)/10});
    
    const n=p.positions.length;
    if(n===0){p.sante="5,0";return;}
    let sc=0,wTotal=0;
    p.positions.forEach(x=>{
      const w=(x.poids||0)/100;
      const r=scorePos(x,pocheName);
      x._score=r.score;x._crit=r.crit;
      sc+=r.score*w;wTotal+=w;
    });
    let raw=wTotal>0?sc/wTotal:5;
    if(n>=6)raw+=0.3;else if(n>=4)raw+=0.15;
    const maxPoids=Math.max(...p.positions.map(x=>x.poids));
    if(maxPoids>60)raw-=1;else if(maxPoids>45)raw-=0.5;
    const plPct=p.investi>0?(p.pl/p.investi*100):0;
    if(plPct>20)raw+=0.5;else if(plPct<-15)raw-=0.5;
    p.sante=Math.max(1,Math.min(10,raw)).toFixed(1).replace('.',',');
  });
  if(d.immobilier)d.immobilier.equityNette=d.immobilier.valeurEstimee-d.immobilier.capitalRestant;
  d.updatedAt=new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return d;
}

function getCutoffs() {
   const nowD = new Date();
   const now = nowD.getTime();
   const day = nowD.getDay();
   const diffDate = nowD.getDate() - day + (day === 0 ? -6 : 1);
   const wtd = new Date(nowD.getFullYear(), nowD.getMonth(), diffDate).getTime();
   const mtd = new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime();
   const ytd = new Date(nowD.getFullYear(), 0, 1).getTime();
   return { "1s":now-7*86400000, "wtd":wtd, "1m":now-30*86400000, "3m":now-90*86400000, "mtd":mtd, "1a":now-365*86400000, "ytd":ytd, "tout":0 };
}

function despike(arr, key){
  if(!Array.isArray(arr)||arr.length<3)return arr;
  let out=arr.map(x=>({...x}));
  for(let pass=0;pass<3;pass++){
    for(let i=1;i<out.length-1;i++){
      const a=out[i-1][key],b=out[i][key],c=out[i+1][key];
      if(a==null||b==null||c==null)continue;
      const refMax=Math.max(Math.abs(a),Math.abs(c),1);
      if(Math.abs(b-a)/refMax>0.15 && Math.abs(b-c)/refMax>0.15 && Math.abs(a-c)/refMax<0.1){ out[i][key]=(a+c)/2; }
    }
  }

let _isSyncing=false;

async function pullFromSupabase() {
  if (!sb || !currentUser) return false;
  try {
    const { data: pfData, error: pfErr } = await sb.from('portfolios').select('*').eq('user_id', currentUser.id).limit(1);
    if (pfErr) throw pfErr;
    if (!pfData || pfData.length === 0) return false;

    window.currentPfId = pf.id;

    const { data: posData, error: posErr } = await sb.from('positions').select('*').eq('portfolio_id', pf.id);
    if (posErr) throw posErr;

    const { data: cfData, error: cfErr } = await sb.from('cashflows').select('*').eq('portfolio_id', pf.id).order('date', { ascending: true });
    if (cfErr) console.warn('cashflows fetch error', cfErr);
    window.cashflows = cfData || [];

    const localD = loadLocal().D || {};

    let newD = {
      updatedAt: new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),
      eurUsd: pf.eur_usd || 1.10,
      cash: pf.cash || 0,
      targetAlloc: pf.target_alloc || {},
      immobilier: pf.immobilier || {},
      sales: pf.sales || [],
      divReceived: pf.div_received || [],
      prefs: pf.prefs || {},
      poches: {},
      migV2: localD.migV2, migV3: localD.migV3, migV4: localD.migV4, migV5: localD.migV5, migV6: localD.migV6, migV7: localD.migV7
    };

    const savedOrder = (pf.prefs && Array.isArray(pf.prefs.pocheOrder) && pf.prefs.pocheOrder.length) ? pf.prefs.pocheOrder : ["CTO", "PEA", "Assurance Vie", "PEE", "Crypto", "Métaux"];
    savedOrder.forEach(p => { if(!newD.poches[p]) newD.poches[p] = {sante: "5,0", positions: []}; });

    if (posData) {
      posData.forEach(pos => {
        if (!newD.poches[pos.poche]) {
          newD.poches[pos.poche] = {sante: "5,0", positions: []};
        }
        
        const oldPos = localD.poches && localD.poches[pos.poche] && localD.poches[pos.poche].positions.find(x => x.ticker === pos.ticker);
        
        newD.poches[pos.poche].positions.push({
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible,
          cibleHaut: pos.cible_haut,
          sector: pos.sector,
          dividend: pos.dividend,
          cours7j: oldPos ? oldPos.cours7j : pos.cours,
          cours7jDate: oldPos ? oldPos.cours7jDate : Date.now(),
          lastUpd: oldPos ? oldPos.lastUpd : Date.now(),
          currency: pos.currency || (oldPos ? oldPos.currency : null),
          avSymbol: pos.av_symbol || (oldPos ? oldPos.avSymbol : null),
          manual: !!(pf.prefs && pf.prefs.manualTickers && pf.prefs.manualTickers.includes(pos.ticker)),
          manualUpdated: (pf.prefs && pf.prefs.manualUpdatedAt && pf.prefs.manualUpdatedAt[pos.ticker]) || null
        });
      });
    }

    D = newD;
    H = pf.hist || [];
    st.sync = true;
    return true;
  } catch(e) {
    console.error("pullFromSupabase:", e);
    st.sync = false;
    return false;
  }
}

async function pushToSupabase() {
  if(!sb || !currentUser || !window.currentPfId) return false;
  if(_isSyncing){_syncPending=true;return false;}
  _isSyncing=true;
  let ok=false;
  try{
    const { error: pfErr } = await sb.from('portfolios').update({
      cash: D.cash || 0,
      eur_usd: D.eurUsd || 1.1,
      immobilier: D.immobilier || {},
      target_alloc: D.targetAlloc || {},
      sales: D.sales || [],
      div_received: D.divReceived || [],
      prefs: D.prefs || {},
      hist: H.slice(-1000)
    }).eq('id', window.currentPfId);
    
    if(pfErr) throw pfErr;

    const { data: dbPos, error: fetchErr } = await sb.from('positions').select('id, poche, ticker').eq('portfolio_id', window.currentPfId);
    if(fetchErr) throw fetchErr;

    let toUpdate = [];
    let toInsert = [];
    let keptIds = new Set();

    Object.entries(D.poches).forEach(([pocheName, p]) => {
      p.positions.forEach(pos => {
        const dbMatch = dbPos.find(x => x.poche === pocheName && x.ticker === pos.ticker);
        const payload = {
          portfolio_id: window.currentPfId,
          poche: pocheName,
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible || null,
          cible_haut: pos.cibleHaut || null,
          sector: pos.sector || null,
          dividend: pos.dividend || null,
          av_symbol: pos.avSymbol || null,
          currency: pos.currency || null
        };
        if(dbMatch) {
          toUpdate.push({ id: dbMatch.id, ...payload });
          keptIds.add(dbMatch.id);
        } else {
          toInsert.push(payload);
        }
      });
    });

    const idsToDelete = dbPos.filter(x => !keptIds.has(x.id)).map(x => x.id);
    
    if(idsToDelete.length > 0) await sb.from('positions').delete().in('id', idsToDelete);
    if(toInsert.length > 0) await sb.from('positions').insert(toInsert);
    for(const item of toUpdate) {
        const { id, ...data } = item;
        await sb.from('positions').update(data).eq('id', id);
    }

    st.sync=true; ok=true;
  }catch(e){console.error("pushToSupabase:",e);st.sync=false}
  finally{
    _isSyncing=false;
    R();
  }
  if(_syncPending){_syncPending=false;setTimeout(pushToSupabase,0)}
  return ok;
}

     return;

  try {
    const { data: existing, error: fetchErr } = await sb.from('portfolios').select('id').eq('user_id', currentUser.id).limit(1);
    if (fetchErr) throw fetchErr;
    
    if (existing && existing.length > 0) {
      localStorage.setItem('sb-migrated-'+currentUser.id, 'true');
      window.currentPfId = existing[0].id;
      return;
    }

    const { data: newPf, error: insertErr } = await sb.from('portfolios').insert([{
      user_id: currentUser.id,

    }]).select();

    const pfId = newPf[0].id;
    window.currentPfId = pfId;

    const posToInsert = [];

      p.positions.forEach(pos => {
        posToInsert.push({
          portfolio_id: pfId,
          poche: pocheName,
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible || null,
          cible_haut: pos.cibleHaut || null,
          sector: pos.sector || null,
          dividend: pos.dividend || null,
          av_symbol: pos.avSymbol || null,
          currency: pos.currency || null
        });
      });
    });

    if (posToInsert.length > 0) {
      const { error: posErr } = await sb.from('positions').insert(posToInsert);
      if (posErr) throw posErr;
    }

    localStorage.setItem('sb-migrated-'+currentUser.id, 'true');
    
  } catch (err) {
    console.error("Migration error:", err);
  }
}

async function fetchCrypto(){
  const ids=Object.values(CG).join(",");
  const got={};
  try{
    const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
    if(!r.ok)throw new Error("CG "+r.status);
    const d=await r.json();
    Object.entries(CG).forEach(([t,id])=>{if(d[id]?.usd)got[t]=d[id].usd});
    if(Object.keys(got).length===Object.keys(CG).length) return got;
  }catch(e){}
  const COINBASE={SOL:"SOL-USD",BTC:"BTC-USD"};
  for(const [tkr,pair] of Object.entries(COINBASE)){
    if(got[tkr])continue;
    try{
      const r=await fetch(`https://api.exchange.coinbase.com/products/${pair}/ticker`);
      if(r.ok){
        const j=await r.json();
        if(j.price)got[tkr]=parseFloat(j.price);
      }
    }catch(e){}
  }
  const BINANCE={SOL:"SOLUSDT",BTC:"BTCUSDT",HYPE:"HYPEUSDT"};
  for(const [tkr,sym] of Object.entries(BINANCE)){
    if(got[tkr])continue;
    try{
      const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}`);
      if(r.ok){
        const j=await r.json();
        if(j.price)got[tkr]=parseFloat(j.price);
      }
    }catch(e){}
  }
  return got;
}

async function fetchStocks(){
  const tickers=new Set();
  if(D&&D.poches)Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
    if(pos.manual)return;
    const cur=curOf(pos);
    // Tout ticker sans point, pas crypto, pas or → US par défaut
    // Couvre les positions ajoutées manuellement sans passer par la recherche
    if(!CG[pos.ticker]&&pos.ticker!=="50PESO"&&!pos.ticker.includes(".")){
      if(cur==="USD"||!cur) tickers.add(pos.ticker);
    }
  }));
  if(tickers.size===0) return {};
  // Cours US via le Worker (clé Finnhub côté serveur, cache edge 5 min)
  try{
    const list=[...tickers].join(",");
    const r=await fetch(`${WORKER_URL}/?usquote=${encodeURIComponent(list)}`);
    if(r.ok){
      const j=await r.json();
      return j.quotes||{};
    }
  }catch(e){console.error("US quote fetch error:",e)}
  return {};
}

async function fetchEuStocks(){

        pos.cours7j=pos.cours;
        pos.cours7jDate=Date.now();
      }
    }));

    D=rc(nd);
    const now=new Date();
    const ts=now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    st.lastUp=ts;st.ok=(cnt>0);st.count=cnt;

    const immoEq = nd.immobilier ? nd.immobilier.equityNette || 0 : 0;
    const tv = Object.values(nd.poches).reduce((s,p)=>s+p.valeur,0) + nd.cash + immoEq;
    const tp = Object.values(nd.poches).reduce((s,p)=>s+p.pl,0);
    const invFin = Object.values(nd.poches).reduce((s,p)=>s+p.investi,0);
    
    const envData = { "Cash": Math.round(nd.cash), "Immobilier": Math.round(immoEq) };
    Object.entries(nd.poches).forEach(([n,p]) => { envData[n] = Math.round(p.valeur); });
    
    H.push({t:now.getTime(), v:Math.round(tv), pl:Math.round(tp), inv:Math.round(invFin), h:ts.slice(0,5), env: envData});
    
    downsampleH();
    if(H.length>1000)H=H.slice(-1000);

    saveLocal();
    if(currentUser) pushToSupabase();
    try{if(!D.prefs||!D.prefs.divAutoTs||Date.now()-D.prefs.divAutoTs>12*3600000)refreshDivs();}catch(e){}
  }catch(e){console.error(e)}
  finally{
    clearTimeout(_rpTimeout);
    st.loading=false;
    cd=900;
    R();
  }
}

async function loadUserEnv() {
  try {
    const loc = loadLocal();
    let pulled = await pullFromSupabase();
    
    if(!pulled){
      if(loc.D){D=loc.D;H=loc.H||[]}
      else{D=JSON.parse(JSON.stringify(DEF));H=[]}
    }

    applyMortgagePayments();
    const migrated = await applyPortfolioMigrations();
    rc(D);
    cm(); 
    R();
    
    if (!pulled) {
      await migrateToSupabase();
      const migratedAgain = await applyPortfolioMigrations();
      if (migratedAgain) { saveLocal(); pushToSupabase(); }
    } else if(migrated) {
      pushToSupabase();
    }

    // RESTAURATION fb23f43 : suppression de l'appel fetchBenchmark()
    refreshPrices();
    if(!window._intervalsSet) {
        setInterval(refreshPrices,900000);
        setInterval(()=>{if(applyMortgagePayments()){rc(D);R();pushToSupabase()}},3600000);
        setInterval(()=>{cd=Math.max(0,cd-1);if(cd<=0)cd=900;updateCountdown()},1000);
        window._intervalsSet = true;
    }
  } catch (err) {
    document.getElementById("app").innerHTML = `<div style="padding:40px; color:var(--red); text-align:center;">Erreur fatale au chargement :<br>${err.message}</div>`;
  }
}

async function applyPortfolioMigrations(){
  if(!D||!D.poches||!D.poches.PEA)return false;
  if(D.poches.PEA.positions.length === 0 && D.cash === 0) return false;

  let changed=false;
  // migV2/migV3 retirees : elles injectaient des donnees personnelles chez tous les comptes (fuite). On marque juste comme appliquees.
  if(!D.migV2){D.migV2=true;}
  if(!D.migV3){D.migV3=true;}
  if(!D.migV4){
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.sector&&SECTORS[pos.ticker])pos.sector=SECTORS[pos.ticker];
      if(!pos.dividend&&DIVS[pos.ticker])pos.dividend=DIVS[pos.ticker];
    }));
    D.migV4=true;changed=true;
  }
  if(!D.migV5){
    const now=Date.now();
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.lastUpd)pos.lastUpd=now;
      if(!pos.cours7j&&pos.cours){pos.cours7j=pos.cours;pos.cours7jDate=now;}
    }));
    D.migV5=true;changed=true;
  }

  if(!D.migV7){
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{ if(!pos.currency)pos.currency=LEGACY_CUR[pos.ticker]||"EUR"; }));
    D.migV7=true;changed=true;
  }

  if (!D.migV6 && sb && window.currentPfId && Array.isArray(D.sales) && D.sales.length > 0) {
    try {
      const rows = D.sales.map(s => ({
        portfolio_id: window.currentPfId,
        date: s.date,
        type: 'sell',
        ticker: s.ticker || null,
        poche: s.poche || null,
        amount_eur: Number(s.net != null ? s.net : (s.brut || 0)),
        qty: s.qty != null ? Number(s.qty) : null,
        price_eur: (s.qty && s.net) ? Number((s.net / s.qty).toFixed(4)) : null,
        label: s.titre || null
      }));

      const { error: insErr } = await sb.from('cashflows').insert(rows);
      if (!insErr) {
        D.migV6 = true;
        changed = true;
        const { data: cfData } = await sb
          .from('cashflows')
          .select('*')
          .eq('portfolio_id', window.currentPfId)
          .order('date', { ascending: true });
        window.cashflows = cfData || [];
      }
    } catch (e) {
      console.warn('Migration V6 exception :', e);
    }
  }

  return changed;
}

// Projection de remboursement du crédit : date de fin + intérêts restants
function mortgageProjection(m){
  if(!m||((!m.mainMensualite||m.mainMensualite<=0)&&(!m.ptzMensualite||m.ptzMensualite<=0)))return null;
  let main=m.mainCapital||0, ptz=m.ptzCapital||0, months=0, totalInterest=0;
  const rate=(m.mainTaux||0)/12;
  while((main>0.01||ptz>0.01)&&months<720){
    months++;
    if(ptz>0.01)ptz=Math.max(0,ptz-Math.min(m.ptzMensualite||0,ptz));
    if(main>0.01){
      const interest=main*rate;
      const principal=(m.mainMensualite||0)-interest;
      if(principal<=0){months=-1;break;}
      totalInterest+=interest;
      main=Math.max(0,main-principal);
    }
  }
  if(months<0||months>=720)return null;
  const end=new Date();end.setMonth(end.getMonth()+months);
  return {months,endDate:end,totalInterest:Math.round(totalInterest),monthlyTotal:(m.mainMensualite||0)+(m.ptzMensualite||0)};
}
function applyMortgagePayments(){
  if(!D||!D.immobilier)return false;
  if(D.immobilier.valeurEstimee === 0) return false; 
  
  if(!D.immobilier.mortgage){
    return false; // pas de crédit configuré → rien à amortir (évite d'injecter un crédit par défaut)
  }
  const m=D.immobilier.mortgage;
  const now=new Date();
  const parts=String(m.lastPayment||"").split("-").map(Number);
  const last=parts.length===3?new Date(parts[0],parts[1]-1,parts[2]):new Date(NaN);
  if(isNaN(last.getTime())){m.lastPayment=now.toISOString().slice(0,10);return false;}
  let applied=false;
  let safety=0; 
  while(safety<600){
    safety++;
    const next=new Date(last.getFullYear(),last.getMonth()+1,1);
    if(isNaN(next.getTime())||next>now)break;
    const ptzPay=Math.min(m.ptzMensualite,m.ptzCapital);
    m.ptzCapital=Math.max(0,m.ptzCapital-ptzPay);
    const interest=m.mainCapital*(m.mainTaux/12);
    const capitalPart=Math.max(0,m.mainMensualite-interest);
    m.mainCapital=Math.max(0,m.mainCapital-capitalPart);
    D.immobilier.capitalRestant=Math.round((m.ptzCapital+m.mainCapital)*100)/100;
    const yy=next.getFullYear(),mm=String(next.getMonth()+1).padStart(2,"0"),dd=String(next.getDate()).padStart(2,"0");
    m.lastPayment=`${yy}-${mm}-${dd}`;
    last.setTime(next.getTime());
    applied=true;
  }
  return applied;
}

function dn(data,colors,sz=120){const tot=data.reduce((s,d)=>s+d[1],0)||1;let a=0;const g=.02,cx=sz/2,cy=sz/2,R=sz*.42,r=sz*.28;let p="";data.forEach((d,i)=>{const f=d[1]/tot;if(f<.001){a+=f;return}const s1=a*Math.PI*2-Math.PI/2+g,e1=(a+f)*Math.PI*2-Math.PI/2-g,l=f>.5?1:0;p+=`<path d="M${cx+R*Math.cos(s1)},${cy+R*Math.sin(s1)} A${R},${R} 0 ${l} 1 ${cx+R*Math.cos(e1)},${cy+R*Math.sin(e1)} L${cx+r*Math.cos(e1)},${cy+r*Math.sin(e1)} A${r},${r} 0 ${l} 0 ${cx+r*Math.cos(s1)},${cy+r*Math.sin(s1)} Z" fill="${colors[i%colors.length]}" opacity=".9"/>`;a+=f});return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${p}</svg>`;}

// RESTAURATION fb23f43 : lc() restauré dans sa version simple d'origine (signature lc(data, k, w, h) avec k=clé string).
// Les fonctionnalités benchmark/crosshair/cashflow markers ne sont pas dans la version d'origine.
function lc(data, k, w=300, h=180) {
  const endVal = data.length > 0 ? data[data.length-1][k] : 0;
  const fmtC=(v)=>(Math.abs(Number(v))>=1000?fmt_(v):Number(v).toFixed(2));

  if(data.length < 2) {
    return `<div style="height:${h}px; position:relative; display:flex; flex-direction:column;">
      <div class="mono" style="font-size:16px; font-weight:bold; color:var(--txt); padding-top:14px;">${fmtC(endVal)}</div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--mut); font-size:11px; text-align:center; padding-bottom:10px;">
        <div style="font-size:20px; margin-bottom:8px; opacity:0.5;">📈</div>
        Acquisition en cours...<br>La courbe apparaîtra au prochain relevé.
      </div>
    </div>`;
  }

  const vs = data.map(d=>d[k]);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mn === mx) { mn -= 1; mx += 1; }

  const pad = (mx - mn) * 0.1;
  const dMin = mn - pad, dMax = mx + pad, rg = dMax - dMin;

  const pdX = 0, pt = 42, pb = 20;
  const cw = w - pdX * 2, ch = h - pt - pb;

  const startVal = vs[0];
  const diff = endVal - startVal;
  const isPos = diff >= 0;

  const col = isPos ? "#34d399" : "#f87171";

  const P = vs.map((v,i)=>({x: pdX+(i/(vs.length-1))*cw, y: pt+ch-((v-dMin)/rg*ch)}));
  const K = 0.16;
  let curveCmds = "";
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1];
    const c1x=p1.x+(p2.x-p0.x)*K, c1y=p1.y+(p2.y-p0.y)*K;
    const c2x=p2.x-(p3.x-p1.x)*K, c2y=p2.y-(p3.y-p1.y)*K;
    curveCmds += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const ptLine = `M${P[0].x.toFixed(1)},${P[0].y.toFixed(1)}` + curveCmds;
  const ptArea = `M${P[0].x.toFixed(1)},${(pt+ch).toFixed(1)} L${P[0].x.toFixed(1)},${P[0].y.toFixed(1)}` + curveCmds + ` L${(pdX+cw).toFixed(1)},${(pt+ch).toFixed(1)} Z`;

  const diffPct = startVal !== 0 ? (diff / Math.abs(startVal) * 100) : 0;
  const diffSign = isPos ? "+" : "";

  const formatT = (ms) => {
    if(!ms) return "";
    const d = new Date(ms), nw = new Date();
    if(d.getDate()===nw.getDate() && d.getMonth()===nw.getMonth() && d.getFullYear()===nw.getFullYear()) return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:d.getFullYear()!==nw.getFullYear()?"2-digit":undefined});
  };

  const yZero = (dMin < 0 && dMax > 0) ? pt + ch - ((0 - dMin) / rg * ch) : -1;
  const uid = Math.random().toString(36).substring(2,9);
  window._LC=window._LC||{};
  window._LC[uid]={xs:vs.map((v,i)=>pdX+(i/(vs.length-1))*cw),ys:vs.map(v=>pt+ch-((v-dMin)/rg*ch)),vs:vs.slice(),tsf:data.map(d=>formatT(d.t)),d1:fmtC(endVal),d2:diffSign+fmtC(diff)+" ("+diffSign+diffPct.toFixed(1)+"%)",col:col};

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible; display:block">
    <defs>
      <linearGradient id="g-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity="0.32"/>
        <stop offset="55%" stop-color="${col}" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow-${uid}" x="-20%" y="-30%" width="140%" height="160%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="${col}" flood-opacity="0.45"/>
      </filter>
    </defs>

    <text id="lcv-${uid}" x="0" y="14" font-size="16" font-weight="bold" fill="var(--txt)" font-family="monospace">${fmtC(endVal)}</text>
    <text id="lcd-${uid}" x="0" y="32" font-size="12" font-weight="600" fill="${col}" font-family="monospace">${diffSign}${fmtC(diff)} (${diffSign}${diffPct.toFixed(1)}%)</text>

    <line x1="0" y1="${pt}" x2="${w}" y2="${pt}" stroke="var(--bdr)" stroke-dasharray="2 4"/>
    <line x1="0" y1="${pt+ch}" x2="${w}" y2="${pt+ch}" stroke="var(--bdr)" stroke-dasharray="2 4"/>
    ${yZero > 0 ? `<line x1="0" y1="${yZero}" x2="${w}" y2="${yZero}" stroke="var(--dim)" stroke-opacity="0.5" stroke-dasharray="4 4"/>` : ''}

    <path d="${ptArea}" fill="url(#g-${uid})"/>
    <path d="${ptLine}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-${uid})"/>
    <circle cx="${P[P.length-1].x.toFixed(1)}" cy="${P[P.length-1].y.toFixed(1)}" r="6" fill="${col}" opacity="0.25"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="${P[P.length-1].x.toFixed(1)}" cy="${P[P.length-1].y.toFixed(1)}" r="3" fill="${col}"/>

    <text x="${w}" y="${pt-4}" font-size="9" fill="var(--dim)" text-anchor="end">${fmtC(mx)}</text>
    <text x="${w}" y="${pt+ch-3}" font-size="9" fill="var(--dim)" text-anchor="end">${fmtC(mn)}</text>

    <text x="0" y="${h-2}" font-size="9" fill="var(--mut)">${formatT(data[0].t)}</text>
    <text x="${w}" y="${h-2}" font-size="9" fill="var(--mut)" text-anchor="end">${formatT(data[data.length-1].t)}</text>
    <g style="pointer-events:none"><line id="cl-${uid}" x1="-9" y1="${pt-2}" x2="-9" y2="${pt+ch}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle id="cc-${uid}" cx="-9" cy="0" r="3.5" fill="${col}" stroke="#0b0c10" stroke-width="1.5" opacity="0"/></g>
    <rect x="0" y="0" width="${w}" height="${h}" fill="transparent" style="cursor:crosshair" onmousemove="_lcHover(event,'${uid}')" onmouseleave="_lcOut('${uid}')" ontouchstart="_lcHover(event,'${uid}')" ontouchmove="_lcHover(event,'${uid}')" ontouchend="_lcOut('${uid}')"/>
  </svg>`;
}

function ga(){const tF=Object.values(D.poches).reduce((s,p)=>s+p.valeur,0)+D.cash,tP=Object.values(D.poches).reduce((s,p)=>s+p.pl,0),tN=tF+(D.immobilier.equityNette||0);const al=[...Object.entries(D.poches).map(([k,v])=>[k,Math.round(v.valeur)]),["Cash",D.cash]];const ap=[];Object.entries(D.poches).forEach(([n,p])=>p.positions.forEach(x=>ap.push({...x,poche:n})));const alerts=[];ap.forEach(p=>{if(p.cible){const ec=((p.cours-p.cible)/p.cible)*100;alerts.push({...p,dir:"down",cibleVal:p.cible,cible:p.cible,ec,at:p.cours<=p.cible,nr:p.cours>p.cible&&ec<5});}if(p.cibleHaut){const ec=((p.cours-p.cibleHaut)/p.cibleHaut)*100;alerts.push({...p,dir:"up",cibleVal:p.cibleHaut,cible:p.cibleHaut,ec,at:p.cours>=p.cibleHaut,nr:p.cours<p.cibleHaut&&ec>-5});}});alerts.sort((a,b)=>Math.abs(a.ec)-Math.abs(b.ec));return{tF,tP,tN,al,ap,alerts,nA:alerts.filter(a=>a.at).length}}

window.exportPDF = () => { cm(); const d = ga(); let html = `<div class="print-page"><div class="print-title">Rapport de Portefeuille Global</div><div class="print-subtitle">Généré le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})}</div><div style="font-size:18px; margin-bottom:10px;">Patrimoine Net : <b>${fmt_(d.tN)} €</b></div><div style="font-size:14px; margin-bottom:20px;">P&L Global : <b class="${d.tP >= 0 ? 'text-green' : 'text-red'}">${fL(d.tP)}</b></div><table class="print-table"><thead><tr><th>Enveloppe</th><th class="text-right">Valeur</th><th class="text-right">Poids</th><th class="text-right">P&L</th></tr></thead><tbody>`; d.al.forEach(a => { const isCash = a[0] === "Cash"; const p = isCash ? null : D.poches[a[0]]; const plStr = isCash ? "-" : `<span class="${p.pl >= 0 ? 'text-green' : 'text-red'}">${fL(p.pl)}</span>`; html += `<tr><td><b>${a[0]}</b></td><td class="text-right">${fmt_(a[1])} €</td><td class="text-right">${((a[1] / d.tF) * 100).toFixed(1)}%</td><td class="text-right">${plStr}</td></tr>`; }); html += `</tbody></table>`; if (D.immobilier) { html += `<div class="print-title" style="font-size:18px; border-bottom:1px solid #ccc;">Immobilier</div><table class="print-table" style="width:50%;"><tr><td>Valeur Estimée</td><td class="text-right">${fmt_(D.immobilier.valeurEstimee)} €</td></tr><tr><td>Capital Restant</td><td class="text-right">${fmt_(D.immobilier.capitalRestant)} €</td></tr><tr><td><b>Capital Net (Equity)</b></td><td class="text-right"><b>${fmt_(D.immobilier.equityNette)} €</b></td></tr></table>`; } html += `</div>`; Object.entries(D.poches).forEach(([n, p]) => { html += `<div class="print-page"><div class="print-title">Détail : ${n}</div><div style="margin-bottom: 20px; font-size: 14px;">Valeur Totale : <b>${fmt_(p.valeur)} €</b> &nbsp;|&nbsp; Investissement : ${fmt_(p.investi)} € &nbsp;|&nbsp; P&L : <b class="${p.pl >= 0 ? 'text-green' : 'text-red'}">${fL(p.pl)}</b></div>`; if (p.positions.length > 0) { const sortedPositions=[...p.positions].sort((a,b)=>(b.valeur||0)-(a.valeur||0)); html += `<table class="print-table"><thead><tr><th>Nom de l'Actif</th><th>Ticker</th><th class="text-right">Qté</th><th class="text-right">PRU</th><th class="text-right">Cours Actuel</th><th class="text-right">Valeur</th><th class="text-right">Poids</th><th class="text-right">P&L Latent</th></tr></thead><tbody>`; sortedPositions.forEach(x => { const cur = curOf(x); const prSym = " " + curSym(cur); html += `<tr><td>${esc(x.titre)}</td><td>${esc(x.ticker)}</td><td class="text-right">${x.qty}</td><td class="text-right">${fmt2_(x.pru)}${prSym}</td><td class="text-right">${fmt2_(x.cours)}${prSym}</td><td class="text-right"><b>${fmt_(x.valeur)} €</b></td><td class="text-right">${x.poids}%</td><td class="text-right"><span class="${x.pl >= 0 ? 'text-green' : 'text-red'}">${fL(x.pl)}<br><span style="font-size:10px">${fP(x.plPct)}</span></span></td></tr>`; }); html += `</tbody></table>`; } else { html += `<p style="font-size:12px; color:#555;">Aucune position active dans cette enveloppe.</p>`; } html += `</div>`; }); let pr = document.getElementById("print-report"); pr.innerHTML = html; setTimeout(() => { window.print(); }, 300); };

window.openImport=(poche)=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Importer un CSV — ${esc(poche)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.5">Colle un export CSV (broker, Excel...) ou choisis un fichier. La 1re ligne doit contenir les noms de colonnes.</p><div class="field"><input type="file" id="imp_file" accept=".csv,.txt" onchange="loadImportFile(event)" style="font-size:12px"></div><div class="field"><label>Ou colle le CSV ici</label><textarea id="imp_text" rows="6" placeholder="Symbol,Quantity,Cost Price&#10;AAPL,10,150.20" style="width:100%;background:#1a1b25;border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt);font-family:monospace;font-size:11px;resize:vertical"></textarea></div><button class="btn btn-p" onclick="analyzeImport('${escAttr(poche)}')">Analyser</button>`);};
window.analyzeImport=(poche)=>{const text=document.getElementById("imp_text").value.trim();if(!text)return alert("Colle un CSV ou choisis un fichier.");const fl=text.split(/\r?\n/)[0]||"";const counts={",":(fl.match(/,/g)||[]).length,";":(fl.match(/;/g)||[]).length,"\t":(fl.match(/\t/g)||[]).length};const delim=Object.keys(counts).reduce((a,b)=>counts[a]>=counts[b]?a:b);const parse=(line)=>{const fields=[];let cur="",inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===delim&&!inQ){fields.push(cur);cur="";}else cur+=c;}fields.push(cur);return fields.map(f=>f.trim().replace(/^"|"$/g,""));};const allRows=text.split(/\r?\n/).filter(l=>l.trim()).map(parse);const ibkrHdr=allRows.find(r=>(r[0]==="Positions ouvertes"||r[0]==="Open Positions")&&r[1]==="Header");if(ibkrHdr){const ih=ibkrHdr.map(x=>x.toLowerCase());const icol=(kw)=>ih.findIndex(x=>kw.some(k=>x.includes(k)));const cS=icol(["symbole","symbol"]),cQ=icol(["quantité","quantity"]),cP=icol(["coût","cost"]),cC=icol(["devise","currency"]),cX=ih.findIndex(x=>x.includes("clôture")||x.includes("close"));const dd=allRows.filter(r=>(r[0]==="Positions ouvertes"||r[0]==="Open Positions")&&r[1]==="Data"&&r[2]==="Summary");const poss=dd.map(r=>({ticker:(r[cS]||"").trim().toUpperCase(),qty:pn(r[cQ]),pru:pn(r[cP]),currency:(r[cC]||"").trim().toUpperCase(),cours:cX>=0?pn(r[cX]):pn(r[cP])})).filter(p=>p.ticker&&p.qty>0);if(poss.length===0)return alert("Aucune position trouvée dans le relevé IBKR.");_importData={ibkr:true,positions:poss};const prev=poss.map(p=>`<tr><td style="padding:5px 10px;border-bottom:1px solid var(--bdr)">${esc(p.ticker)}</td><td style="padding:5px 10px;border-bottom:1px solid var(--bdr);text-align:right">${p.qty}</td><td style="padding:5px 10px;border-bottom:1px solid var(--bdr);text-align:right">${p.pru.toFixed(2)}</td></tr>`).join("");sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Relevé IBKR détecté</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:12px;color:var(--dim);margin-bottom:12px">${poss.length} position(s) trouvée(s) dans la section Positions ouvertes. Aperçu :</p><div style="max-height:260px;overflow-y:auto;margin-bottom:14px"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="color:var(--dim);text-align:left"><th style="padding:5px 10px">Ticker</th><th style="padding:5px 10px;text-align:right">Qté</th><th style="padding:5px 10px;text-align:right">PRU</th></tr>${prev}</table></div><button class="btn btn-p" onclick="doImportIBKR('${escAttr(poche)}')">Importer dans ${esc(poche)}</button>`);return;}if(allRows.length<2)return alert("Le CSV doit avoir une ligne d'en-tête + au moins une ligne de données.");const headers=allRows[0];const dataRows=allRows.slice(1);_importData={headers,dataRows};const guess=(kw)=>{for(let i=0;i<headers.length;i++){const h=headers[i].toLowerCase();if(kw.some(k=>h.includes(k)))return i;}return -1;};const gT=guess(["symbol","ticker","isin","code","mnémo"]);const gQ=guess(["quantity","qty","quantité","qté","nombre","shares","parts"]);const gP=guess(["cost","price","pru","prix","revient","achat","avg","unit"]);const gN=guess(["name","nom","description","libellé","désignation","label"]);const opts=(sel)=>headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h)||"(colonne "+(i+1)+")"}</option>`).join("")+`<option value="-1" ${sel===-1?"selected":""}>— aucune —</option>`;const ss=`width:100%;background:#1a1b25;border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt)`;sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Mapper les colonnes</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">${dataRows.length} ligne(s) détectée(s). Indique quelle colonne correspond à quoi :</p><div class="field"><label>Ticker / Symbole *</label><select id="map_t" style="${ss}">${opts(gT)}</select></div><div class="field"><label>Quantité *</label><select id="map_q" style="${ss}">${opts(gQ)}</select></div><div class="field"><label>PRU / Prix de revient *</label><select id="map_p" style="${ss}">${opts(gP)}</select></div><div class="field"><label>Nom (optionnel)</label><select id="map_n" style="${ss}">${opts(gN)}</select></div><button class="btn btn-p" onclick="doImport('${escAttr(poche)}')">Importer ${dataRows.length} position(s)</button>`);};
window.doImport=(poche)=>{if(!_importData)return;const ti=parseInt(document.getElementById("map_t").value);const qi=parseInt(document.getElementById("map_q").value);const pi=parseInt(document.getElementById("map_p").value);const ni=parseInt(document.getElementById("map_n").value);if(ti<0||qi<0||pi<0)return alert("Ticker, quantité et PRU sont obligatoires.");if(!D.poches[poche])return alert("Enveloppe introuvable.");let added=0,skipped=0;_importData.dataRows.forEach(row=>{const tk=(row[ti]||"").trim().toUpperCase();const qty=pn(row[qi]);const pru=pn(row[pi]);if(!tk||qty<=0){skipped++;return;}const pos={titre:(ni>=0&&row[ni])?row[ni].trim():tk,ticker:tk,qty,pru,cours:pru};D.poches[poche].positions.push(pos);added++;});_importData=null;cm();save();setTimeout(()=>alert(added+" position(s) importée(s)"+(skipped?", "+skipped+" ignorée(s) (ticker ou quantité manquant)":"")+". Clique ↻ pour récupérer les cours."),100);};
window.doImportIBKR=(poche)=>{if(!_importData||!_importData.positions)return;if(!D.poches[poche])return alert("Enveloppe introuvable.");const existing=new Set(D.poches[poche].positions.map(x=>String(x.ticker).toUpperCase()));let added=0,skipped=0;_importData.positions.forEach(p=>{if(existing.has(p.ticker)){skipped++;return;}const pos={titre:p.ticker,ticker:p.ticker,qty:p.qty,pru:p.pru,cours:p.cours||p.pru};if(p.currency)pos.currency=p.currency;D.poches[poche].positions.push(pos);added++;});_importData=null;cm();save();setTimeout(()=>alert(added+" position(s) importée(s)"+(skipped?", "+skipped+" déjà présente(s) ignorée(s)":"")+". Clique ↻ pour rafraîchir les cours."),100);};

window.editTargets=()=>{const tg=D.targetAlloc||{};const keys=[...Object.keys(D.poches),"Cash"];const total=keys.reduce((s,k)=>s+(tg[k]||0),0);sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Allocation cible</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:14px">Définis ta répartition cible (%) par enveloppe. Idéalement le total fait 100%.</p>${keys.map((k,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="flex:1;font-size:13px">${esc(k)}</span><input id="tg_${i}" value="${tg[k]||0}" inputmode="decimal" oninput="updTgTotal()" style="width:70px;background:#1a1b25;border:1px solid var(--bdr);border-radius:8px;padding:6px;color:var(--txt);text-align:right"><span style="color:var(--dim);font-size:12px">%</span></div>`).join("")}<div id="tg_total" style="text-align:right;font-size:12px;color:${total===100?"var(--grn)":"var(--amb)"};margin:10px 0;font-weight:600">Total : ${total}%</div><button class="btn btn-p" onclick="saveTargets()">Enregistrer</button>`);window._tgKeys=keys;};
window.updTgTotal=()=>{const keys=window._tgKeys||[];let t=0;keys.forEach((k,i)=>{const el=document.getElementById("tg_"+i);if(el)t+=pn(el.value);});const el=document.getElementById("tg_total");if(el){el.textContent="Total : "+Math.round(t*10)/10+"%";el.style.color=Math.round(t)===100?"var(--grn)":"var(--amb)";}};
window.saveTargets=()=>{const keys=window._tgKeys||[...Object.keys(D.poches),"Cash"];const nt={};keys.forEach((k,i)=>{const el=document.getElementById("tg_"+i);if(el)nt[k]=pn(el.value);});D.targetAlloc=nt;cm();save();};
window.addRealizedPnl=(poche)=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">P&L réalisé passé</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="background:#1a1b25;border-radius:10px;padding:10px;margin-bottom:14px;font-size:11px;color:var(--dim);line-height:1.5">Enregistre une plus ou moins-value <b style="color:var(--txt)">déjà encaissée</b> dans l'enveloppe <b style="color:var(--txt)">${esc(poche)}</b> (avant l'appli, ou sur une position non suivie).<br>👉 Ça n'ajoute <b style="color:var(--txt)">aucun argent</b> à ton patrimoine : c'est seulement un historique de performance.</div><div class="field"><label>Montant réalisé (€) — gain (+) ou perte (−)</label><input id="rp_amt" inputmode="decimal" placeholder="ex: 722,40  ou  -150"></div><div class="field"><label>Libellé (optionnel)</label><input id="rp_lbl" placeholder="ex: Ventes 2024, PV avant appli"></div><div class="field"><label>Date</label><input id="rp_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><button class="btn btn-p" onclick="saveRealizedPnl('${escAttr(poche)}')">Enregistrer</button>`)};

window.eImmo=()=>{const im=D.immobilier||{valeurEstimee:0,capitalRestant:0};const m=im.mortgage||{};sm(`<div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3 style="font-size:17px;font-weight:700">Immobilier</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div class="field"><label>Valeur estimée du bien (€)</label><input id="iv" value="${im.valeurEstimee||''}" inputmode="decimal" placeholder="ex: 250000"></div><div style="margin:16px 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px">Crédit principal <span style="text-transform:none;color:var(--mut)">— laisse vide si pas de crédit</span></div><div class="field"><label>Capital restant dû (€)</label><input id="imc" value="${m.mainCapital||''}" inputmode="decimal" placeholder="ex: 180000"></div><div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>Taux annuel (%)</label><input id="imt" value="${m.mainTaux?(m.mainTaux*100).toFixed(2):''}" inputmode="decimal" placeholder="3.5"></div><div class="field" style="flex:1"><label>Mensualité (€)</label><input id="imm" value="${m.mainMensualite||''}" inputmode="decimal" placeholder="950"></div></div><div style="margin:16px 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px">PTZ <span style="text-transform:none;color:var(--mut)">— prêt à taux zéro, optionnel</span></div><div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>Capital PTZ (€)</label><input id="ipc" value="${m.ptzCapital||''}" inputmode="decimal" placeholder="30000"></div><div class="field" style="flex:1"><label>Mensualité PTZ (€)</label><input id="ipm" value="${m.ptzMensualite||''}" inputmode="decimal" placeholder="100"></div></div><div class="field"><label>Date du dernier prélèvement</label><input id="ild" type="date" value="${m.lastPayment||new Date().toISOString().slice(0,10)}"></div><button class="btn btn-p" window.askSale=(pocheName,tk,qty,pru,titre,mode,pe)=>{_pendingSale={pn:pocheName,tk,qty,pru,titre,mode,pendingEdit:pe}; const _p0=D.poches[pocheName].positions.find(x=>x.ticker===tk);const _sym=_p0?curSym(curOf(_p0)):"€"; const cost=qty*pru; sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">${mode==="full"?"Supprimer":"Réduire"} ${esc(tk)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="background:#1a1b25;border-radius:10px;padding:10px;margin-bottom:14px;font-size:12px;color:var(--dim);line-height:1.5">${mode==="full"?"Suppression totale":"Réduction"} de <b style="color:var(--txt)">${fmt2_(qty)} ${qty>1?"parts/actions":"part/action"}</b> de ${esc(titre)}<br>Coût d'acquisition : ${fmt2_(cost)} ${_sym}</div><div style="margin-bottom:10px"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:10px;border:1px solid var(--bdr);border-radius:10px;background:#1a1b25"><input type="radio" name="mo" value="sale" checked onchange="document.getElementById('saleFields').style.display='block'"><div style="flex:1"><div style="font-weight:600;font-size:13px">Vente réelle</div><div style="font-size:10px;color:var(--dim)">Calcule le P&L réalisé</div></div></label></div><div id="saleFields"><div class="field"><label>Montant net reçu (${_sym}) *</label><input id="saleNet" inputmode="decimal" placeholder="ex: 1807.40"></div><div class="field"><label>Montant brut (${_sym}, optionnel)</label><input id="saleBrut" inputmode="decimal" placeholder="ex: 1909.24"></div></div><div style="margin:10px 0 14px"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:10px;border:1px solid var(--bdr);border-radius:10px;background:#1a1b25"><input type="radio" name="mo" value="correction" onchange="document.getElementById('saleFields').style.display='none'"><div style="flex:1"><div style="fon // ─── CORRECTION BUG #5 ───────────────────────────────────────────────────────
// confirmSale() : querySelector sur 'input[name="mo"]:checked' pouvait
// retourner null. Ajout d'une vérification explicite.

window.confirmSale=()=>{
  if(!_pendingSale)return;
  const {pn:pocheName,tk,qty,pru,mode,pendingEdit:pe}=_pendingSale;
  try{
    const checkedInput = document.querySelector('input[name="mo"]:checked');
    if(!checkedInput){
      console.error("confirmSale: aucune option sélectionnée");
      return;
    }
    const choice = checkedInput.value;
    const p=D.poches[pocheName].positions.find(x=>x.ticker===tk);
    if(!p)return;
    if(choice==="sale"){
      const net=pn(document.getElementById("saleNet").value);
      if(!net||net<=0){
        const inp=document.getElementById("saleNet");
        if(inp){inp.style.borderColor="var(--red)";inp.placeholder="⚠ Saisir le montant net reçu";inp.focus()}
        return;
      }
      const brut=pn(document.getElementById("saleBrut").value)||net;
      const _cur=curOf(p);const _te=toEur(_cur);const netEur=net*_te;const brutEur=brut*_te;
      const pl=netEur-(qty*pru)*_te;
      if(!D.sales)D.sales=[];
      D.sales.push({date:new Date().toISOString().slice(0,10),poche:pocheName,ticker:tk,titre:p.titre,qty:qty,pru:pru,net:Math.round(netEur*100)/100,brut:Math.round(brutEur*100)/100,pl:Math.round(pl*100)/100});
    }
    if(mode==="full"){
      D.poches[pocheName].positions=D.poches[pocheName].positions.filter(x=>x.ticker!==tk);
    }else if(pe){
      p.titre=pe.newTitre;p.ticker=pe.newTicker;p.qty=pe.newQty;p.pru=pe.newPru;p.cours=pe.newCours;
      if(pe.newCible)p.cible=pn(pe.newCible);else delete p.cible;
      if(pe.newCibleH)p.cibleHaut=pn(pe.newCibleH);else delete p.cibleHaut;
      if(pe.newCur)p.currency=pe.newCur;
    }
    _pendingSale=null;
    cm();save();
  }catch(e){
    console.error("confirmSale:",e);
    _pendingSale=null;
    cm();
  }
};

window.srcStock=async()=>{ const q=document.getElementById("srch").value.trim(); const out=document.getElementById("srchRes"); if(!q){out.innerHTML="";return} out.innerHTML=`<div style="color:var(--mut);font-size:11px;padding:6px">Recherche…</div>`; const isISIN=/^[A-Z]{2}[A-Z0-9]{10}$/i.test(q.trim()); let searchQuery=q.trim(); if(isISIN){ try{ const figiResp=await fetch("https://api.openfigi.com/v3/mapping",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify([{idType:"ID_ISIN",idValue:q.trim().toUpperCase()}])}); if(figiResp.ok){ const figiData=await figiResp.json(); const matches=figiData[0]?.data; if(matches&&matches.length>0){ out.innerHTML=matches.slice(0,8).map((m,i)=>{ const sym=m.ticker||"";const name=m.name||"";const exch=m.exchCode||"";const cur=m.currency||"";const secType=m.securityType||""; return `<div onclick="pickStock(${i})" style="padding:8px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:4px;cursor:pointer;background:#1a1b25" data-sym="${esc(sym)}" data-name="${esc(name)}" data-cur="${esc(cur)}"><div style="font-size:12px;font-weight:600">${esc(sym)} <span style="color:var(--dim);font-weight:400">· ${esc(cur)}</span></div><div style="font-size:10px;color:var(--dim)">${esc(name)}</div><div style="font-size:9px;color:var(--mut)">${esc(exch)} · ${esc(secType)}</div></div>`; }).join(""); return; } } }catch(e){} out.innerHTML=`<div style="color:var(--mut);font-size:11px;padding:6px">ISIN non résolu, recherche par nom…</div>`; } try{ const yhResp=await fetch(`https://proud-bar-fc46yahoo-proxy.bya-2mo.workers.dev/?search=${encodeURIComponent(searchQuery)}`); if(yhResp.ok){ const yhData=await yhResp.json(); const quotes=(yhData.quotes||[]).filter(m=>m.quoteType&&m.quoteType!=="CURRENCY"&&m.symbol); if(quotes.length>0){ out.innerHTML=quotes.slice(0,8).map((m,i)=>{ const sym=m.symbol||"";const name=m.longname||m.shortname||"";const exch=m.exchange||"";const cur=m.currency||""; return `<div onclick="pickStock(${i})" s window.delWatch=(sym)=>{if(D.prefs&&D.prefs.watchlist){D.prefs.watchlist=D.prefs.watchlist.filter(x=>x.sym!==sym);save();}};
window.delWatchCur=()=>{if(expQuote)delWatch(expQuote.sym);};
window.setWatchTarget=(sym)=>{const w=D.prefs&&D.prefs.watchlist&&D.prefs.watchlist.find(x=>x.sym===sym);if(!w)return;sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Alertes ${esc(w.ticker)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Mets un seuil bas, un seuil haut, ou les deux (en ${esc(w.cur)}).</p><div class="row"><div class="field"><label>Alerte ↓ bas</label><input id="wtl" value="${w.target!=null?w.target:""}" inputmode="decimal" placeholder="ex: 5"></div><div class="field"><label>Alerte ↑ haut</label><input id="wth" value="${w.targetHigh!=null?w.targetHigh:""}" inputmode="decimal" placeholder="ex: 10"></div></div><div style="font-size:9px;color:var(--mut);margin:2px 0 12px">↓ alerte quand le cours descend dessous · ↑ quand il monte dessus</div><button class="btn btn-p" onclick="saveWatchTarget('${escAttr(sym)}')">Enregistrer</button>`);};
window.saveWatchTarget=(sym)=>{const w=D.prefs&&D.prefs.watchlist&&D.prefs.watchlist.find(x=>x.sym===sym);if(!w)return;const loRaw=(document.getElementById("wtl")||{}).value||"";const hiRaw=(document.getElementById("wth")||{}).value||"";const lo=pn(loRaw),hi=pn(hiRaw);if(loRaw.trim()&&lo>0){w.target=lo;}else{delete w.target;delete w.notified;}if(hiRaw.trim()&&hi>0){w.targetHigh=hi;}else{delete w.targetHigh;delete w.notifiedHigh;}cm();save();};
window.refreshWatch=async()=>{if(!D.prefs||!D.prefs.watchlist||!D.prefs.watchlist.length)return;for(const w of D.prefs.watchlist){try{const r=await fetch(`${WORKER_URL}/?chart=${encodeURIComponent(w.sym)}&range=5d&_t=${Date.now()}`);const j=await r.json();const res=j&&j.chart&&j.chart.result&&j.chart.result[0];const meta=res&&res.meta;const p=meta&&meta.regularMarketPrice;if(p!=null){w.lastCours=p;w.lastUpd=Date.now();}}catch(e){}}save();};
window.expPickPoche=()=>{if(!expQuote)return;const poches=Object.keys(D.poches);sm(`<div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3 style="font-size:17px;font-weight:700">Ajouter ${esc(expQuote.sym)} à…</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="display:flex;flex-direction:column;gap:8px">${poches.map(p=>`<div class="card card-tap" onclick="expDoAdd('${escAttr(p)}')" style="display:flex;align-items:center;gap:10px;padding:12px 14px"><div style="width:4px;height:28px;border-radius:2px;background:${PCOL[p]||"var(--mut)"}"></div><span style="font-size:14px;font-weight:600">${esc(p)}</span></div>`).join("")}</div>`);};
window.expDoAdd=(poche)=>{const eq=expQuote;cm();aPos(poche);setTimeout(()=>{try{if(!eq)return;const tk=eq.sym.includes(".")?eq.sym.split(".")[0]:eq.sym;const mt=document.getElementById("mt");if(mt)mt.value=eq.name||tk;const mk=document.getElementById("mk");if(mk)mk.value=tk;const mx=document.getElementById("mx");if(mx&&eq.price!=null)mx.value=eq.price;const mp=document.getElementById("mp");if(mp&&eq.price!=null&&!mp.value)mp.value=eq.price;const mc=document.getElementById("mcur");if(mc&&eq.cur){const u=String(eq.cur).toUpperCase();if([...mc.options].some(o=>o.value===u)){mc.value=u;}else{const op=document.createElement("option");op.value=u;op.textContent=curSym(u)+" "+u;mc.appendChild(op);mc.value=u;}}const root=document.getElementById("modal-root");if(root&&eq.sym.includes("."))root.dataset.pickedSym=eq.sym;}catch(e){}},160);};
window.editGoal=()=>{const g=(D.prefs&&D.prefs.goalNetWorth)||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Objectif de patrimoine</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Fixe un montant cible. La barre de progression s'affiche sur l'accueil.</p><div class="field"><label>Objectif (€)</label><input id="goalIn" inputmode="decimal" value="${g}" placeholder="ex: 150000"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-p" style="flex:1" onclick="saveGoal()">Enregistrer</button>${g?`<button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="clearGoal()">Retirer</button>`:""}</div>`);};
window.saveGoal=()=>{const v=pn((document.getElementById("goalIn")||{}).value);if(!D.prefs)D.prefs={};if(v>0)D.prefs.goalNetWorth=v;else delete D.prefs.goalNetWorth;cm();save();};
window.clearGoal=()=>{if(D.prefs)delete D.prefs.goalNetWorth;cm();save();};
window.togglePocheGoals=()=>{if(!D.prefs)D.prefs={};D.prefs.showPocheGoals=!D.prefs.showPocheGoals;R();save();};
window.editPocheGoal=(name)=>{const g=(D.prefs&&D.prefs.pocheGoals&&D.prefs.pocheGoals[name])||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:17px;font-weight:700">Objectif \u2014 ${esc(name)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">\u2715</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Montant cible pour cette enveloppe.</p><div class="field"><label>Objectif (\u20ac)</label><input id="pgIn" inputmode="decimal" value="${g}" placeholder="ex: 30000" style="width:100%;background:#1a1b25;border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--txt);font-family:inherit"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-p" style="flex:1" onclick="savePocheGoal('${escAttr(name)}')">Enregistrer</button>${g?`<button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="clearPocheGoal('${escAttr(name)}')">Retirer</button>`:""}</div>`);};
window.savePocheGoal=(name)=>{const v=pn((document.getElementById("pgIn")||{}).value);if(!D.prefs)D.prefs={};if(!D.prefs.pocheGoals)D.prefs.pocheGoals={};if(v>0)D.prefs.pocheGoals[name]=v;else delete D.prefs.pocheGoals[name];cm();save();};
window.clearPocheGoal=(name)=>{if(D.prefs&&D.prefs.pocheGoals)delete D.prefs.pocheGoals[name];cm();save();};
window.editFisc=(name)=>{const cfg=(D.prefs&&D.prefs.fiscCfg&&D.prefs.fiscCfg[name])||{};const def=fiscDefault(name);const f=fiscFor(name);const ss="width:100%;background:#1a1b25;border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt);font-family:inherit";let body;if(def.clock){const dateDef=cfg.date||(D.prefs&&D.prefs[def.clockField])||"";body=`<p style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5">Taux automatique : <b>${def.rate} %</b> avant ${def.clock} ans, <b>${def.afterRate} %</b> après. Renseigne juste la date d'ouverture.</p><div class="field"><label>Date d'ouverture</label><input id="fi_date" type="date" value="${dateDef}" style="${ss}"></div>`;}else{body=`<p style="font-size:11px;color:var(--dim);margin-bottom:12px">Préréglage : <b>${f.label}</b>. Ajuste si besoin.</p><div class="field"><label>Taux d'imposition (%)</label><input id="fi_rate" inputmode="decimal" value="${cfg.rate!=null?cfg.rate:f.effRate}" style="${ss}"></div><div class="field"><label>Appliqué sur</label><select id="fi_base" style="${ss}"><option value="gain" ${f.base!=="valeur"?"selected":""}>la plus-value (gain)</option><option value="valeur" ${f.base==="valeur"?"selected":""}>la valeur de vente</option></select></div><div style="font-size:10px;color:var(--mut);margin-bottom:12px;line-height:1.6">Présets : <span onclick="fiscPreset('pfu')" style="color:var(--acc);cursor:pointer">PFU 30%</span> · <span onclick="fiscPreset('social')" style="color:var(--acc);cursor:pointer">17,2%</span> · <span onclick="fiscPreset('tmp')" style="color:var(--acc);cursor:pointer">Métaux 11,5%</span> · <span onclick="fiscPreset('metalpv')" style="color:var(--acc);cursor:pointer">Métaux PV 36,2%</span></div>`;}sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:17px;font-weight:700">Fiscalité — ${esc(name)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div>${body}<div style="display:flex;gap:8px"><button class="btn btn-p" style="flex:1" onclick="saveFisc('${escAttr(name)}')">Enregistrer</button><button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="resetFisc('${escAttr(name)}')">Défaut</button></div>`);};
window.fiscPreset=(kind)=>{const r=document.getElementById("fi_rate"),b=document.getElementById("fi_base");if(!r||!b)return;if(kind==="pfu"){r.value=30;b.value="gain";}else if(kind==="social"){r.value="17.2";b.value="gain";}else if(kind==="tmp"){r.value="11.5";b.value="valeur";}else if(kind==="metalpv"){r.value="36.2";b.value="gain";}};
window.saveFisc=(name)=>{if(!D.prefs)D.prefs={};if(!D.prefs.fiscCfg)D.prefs.fiscCfg={};const def=fiscDefault(name);if(def.clock){const date=(document.getElementById("fi_date")||{}).value;if(date)D.prefs.fiscCfg[name]={date};else delete D.prefs.fiscCfg[name];}else{const rate=pn((document.getElementById("fi_rate")||{}).value);const base=(document.getElementById("fi_base")||{}).value;D.prefs.fiscCfg[name]={rate,base};}cm();save();};
window.resetFisc=(name)=>{if(D.prefs&&D.prefs.fiscCfg)delete D.prefs.fiscCfg[name];cm();save();};
window.addHistPoint=()=>{const ss="width:100%;background:#1a1b25;border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--txt);font-family:inherit";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">Point d'historique passé</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Ajoute la valeur de ton portefeuille à une date passée pour allonger l'historique et débloquer la performance plus tôt.</p><div class="field"><label>Date</label><input id="hp_date" type="date" style="${ss}"></div><div class="field"><label>Valeur totale (€)</label><input id="hp_val" inputmode="decimal" placeholder="ex: 90000" style="${ss}"></div><div class="field"><label>Montant investi à cette date (€) — optionnel</label><input id="hp_inv" inputmode="decimal" placeholder="ex: 80000" style="${ss}"></div><button class="btn btn-p" style="margin-top:6px" onclick="saveHistPoint()">Ajouter</button>`);};
window.saveHistPoint=()=>{const dt=(document.getElementById("hp_date")||{}).value;const v=pn((document.getElementById("hp_val")||{}).value);const invRaw=(document.getElementById("hp_inv")||{}).value;const inv=invRaw?pn(invRaw):v;if(!dt||v<=0)return alert("Indique une date et une valeur.");const t=new Date(dt).getTime();if(H.some(x=>Math.abs(x.t-t)<86400000))return alert("Un point existe déjà à cette date.");H.push({t,v:Math.round(v),inv:Math.round(inv),pl:Math.round(v-inv),h:"00:00",env:{},manual:true});H.sort((a,b)=>a.t-b.t);cm();save();};
window.showNote=(tk)=>{const n=(D.prefs&&D.prefs.notes&&D.prefs.notes[tk])||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">📝 ${esc(tk)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="font-size:13px;line-height:1.55;color:var(--txt);white-space:pre-wrap">${esc(n)||'<span style="color:var(--mut)">Aucune note.</span>'}</div>`);};
window.togglePriv=()=>{if(!D.prefs)D.prefs={};D.prefs.privacyMode=!D.prefs.privacyMode;R();save();};
window.setHtf=v=>{htf=v;R()};
// RESTAURATION fb23f43 : setter pour le filtre d'enveloppe sur l'onglet Analyse
window.setAEnv=v=>{aEnvSel=v;R()};
window.setHMode=m=>{hMode=m;R()};
window.refreshPrices=refreshPrices;

init();
</script>
</body>
</html>
