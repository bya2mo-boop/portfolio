window.gerer=()=>{const pr=D.prefs||{};const fams=_families();const poches=Object.keys(D.poches);const tog=(key,label,icon,defOn)=>{const on=(key in pr)?!!pr[key]:(defOn!==false);return `<div onclick="setSection('${key}',${on?'false':'true'})" style="display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer"><span style="font-size:15px;width:20px;text-align:center">${icon}</span><span style="font-size:14px;flex:1">${label}</span><span style="width:36px;height:21px;border-radius:11px;background:${on?'var(--acc)':'var(--bdr)'};position:relative;flex-shrink:0;transition:background .2s"><span style="position:absolute;top:2px;left:${on?'17px':'2px'};width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s"></span></span></div>`;};const famRow=(f)=>`<div style="display:flex;align-items:center;gap:9px;padding:8px 0"><span style="width:9px;height:9px;border-radius:50%;background:${_famColor(f.id)}"></span><span style="font-size:14px;flex:1">${esc(f.name)}</span><span onclick="renameFamily('${f.id}')" style="color:var(--acc);font-size:14px;cursor:pointer;padding:2px 6px">✎</span><span onclick="delFamily('${f.id}')" style="color:var(--red);font-size:15px;cursor:pointer;padding:2px 4px">🗑</span></div>`;const envRow=(n)=>{const fam=_famOf(n);return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0"><span style="font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n)}</span><span onclick="movePoche('${escAttr(n)}',-1)" style="color:var(--dim);font-size:14px;cursor:pointer;padding:2px 5px" title="Monter">↑</span><span onclick="movePoche('${escAttr(n)}',1)" style="color:var(--dim);font-size:14px;cursor:pointer;padding:2px 5px" title="Descendre">↓</span>${fams.length?`<select onchange="setPocheFamily('${escAttr(n)}',this.value)" style="background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:6px;color:var(--txt);font-size:12px;max-width:130px">${fams.map(f=>`<option value="${f.id}" ${fam===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>`:''}<span onclick="dEnv('${escAttr(n)}')" style="color:var(--red);font-size:15px;cursor:pointer;padding:2px 4px">🗑</span></div>`;};const sec=(t)=>`<div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px">${t}</div>`;const hr=`<div style="border-top:1px solid var(--bdr);margin:6px 0"></div>`;sm(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="font-size:18px;font-weight:700">⚙ Gérer</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div>`+sec("Affichage des sections")+tog("showImmo","Immobilier","🏠",true)+tog("showBudget","Budget mensuel","💰",true)+tog("showPocheGoals","Objectifs","🎯",false)+hr+sec("Familles")+(fams.length?fams.map(famRow).join(""):`<div style="font-size:12px;color:var(--mut);padding:4px 0">Aucune famille — tes enveloppes s'affichent en liste simple.</div>`)+`<button class="btn" style="width:100%;font-size:12px;margin-top:6px" onclick="aFamily()">+ Ajouter une famille</button>`+hr+sec("Enveloppes")+(poches.length?poches.map(envRow).join(""):`<div style="font-size:12px;color:var(--mut);padding:4px 0">Aucune enveloppe.</div>`)+`<button class="btn" style="width:100%;font-size:12px;margin-top:6px" onclick="aEnv()">+ Ajouter une enveloppe</button>`+hr+sec("Immobilier")+`<button class="btn" style="width:100%;font-size:12px" onclick="aBien()">+ Ajouter un bien immobilier</button>`+sec("Export")+`<button class="btn" style="width:100%;font-size:13px;background:#e8e9ed;color:#0a0b0f" onclick="exportPDF()">📄 Exporter le portefeuille en PDF</button>`+`<div onclick="showGuide(0)" style="text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--bdr);font-size:12px;color:var(--mut);cursor:pointer">📖 Revoir le guide d'accueil</div>`);};

window.editPocheGoal=(name)=>{const g=(D.prefs&&D.prefs.pocheGoals&&D.prefs.pocheGoals[name])||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:17px;font-weight:700">Objectif \u2014 ${esc(name)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">\u2715</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Montant cible pour cette enveloppe.</p><div class="field"><label>Objectif (\u20ac)</label><input id="pgIn" inputmode="decimal" value="${g}" placeholder="ex: 30000" style="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--txt);font-family:inherit"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-p" style="flex:1" onclick="savePocheGoal('${escAttr(name)}')">Enregistrer</button>${g?`<button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="clearPocheGoal('${escAttr(name)}')">Retirer</button>`:""}</div>`);};

window.editFisc=(name)=>{const cfg=(D.prefs&&D.prefs.fiscCfg&&D.prefs.fiscCfg[name])||{};const def=fiscDefault(name);const f=fiscFor(name);const ss="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt);font-family:inherit";let body;if(def.clock){const dateDef=cfg.date||(D.prefs&&D.prefs[def.clockField])||"";body=`<p style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5">Taux automatique : <b>${def.rate} %</b> avant ${def.clock} ans, <b>${def.afterRate} %</b> après. Renseigne juste la date d'ouverture.</p><div class="field"><label>Date d'ouverture</label><input id="fi_date" type="date" value="${dateDef}" style="${ss}"></div>`;}else{body=`<p style="font-size:11px;color:var(--dim);margin-bottom:12px">Préréglage : <b>${f.label}</b>. Ajuste si besoin.</p><div class="field"><label>Taux d'imposition (%)</label><input id="fi_rate" inputmode="decimal" value="${cfg.rate!=null?cfg.rate:f.effRate}" style="${ss}"></div><div class="field"><label>Appliqué sur</label><select id="fi_base" style="${ss}"><option value="gain" ${f.base!=="valeur"?"selected":""}>la plus-value (gain)</option><option value="valeur" ${f.base==="valeur"?"selected":""}>la valeur de vente</option></select></div><div style="font-size:10px;color:var(--mut);margin-bottom:12px;line-height:1.6">Présets : <span onclick="fiscPreset('pfu')" style="color:var(--acc);cursor:pointer">PFU 30%</span> · <span onclick="fiscPreset('social')" style="color:var(--acc);cursor:pointer">17,2%</span> · <span onclick="fiscPreset('tmp')" style="color:var(--acc);cursor:pointer">Métaux 11,5%</span> · <span onclick="fiscPreset('metalpv')" style="color:var(--acc);cursor:pointer">Métaux PV 36,2%</span></div>`;}sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:17px;font-weight:700">Fiscalité — ${esc(name)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div>${body}<div style="display:flex;gap:8px"><button class="btn btn-p" style="flex:1" onclick="saveFisc('${escAttr(name)}')">Enregistrer</button><button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="resetFisc('${escAttr(name)}')">Défaut</button></div>`);};
window.fiscPreset=(kind)=>{const r=document.getElementById("fi_rate"),b=document.getElementById("fi_base");if(!r||!b)return;if(kind==="pfu"){r.value=30;b.value="gain";}else if(kind==="social"){r.value="17.2";b.value="gain";}else if(kind==="tmp"){r.value="11.5";b.value="valeur";}else if(kind==="metalpv"){r.value="36.2";b.value="gain";}};
window.saveFisc=(name)=>{if(!D.prefs)D.prefs={};if(!D.prefs.fiscCfg)D.prefs.fiscCfg={};const def=fiscDefault(name);if(def.clock){const date=(document.getElementById("fi_date")||{}).value;if(date)D.prefs.fiscCfg[name]={date};else delete D.prefs.fiscCfg[name];}else{const rate=pn((document.getElementById("fi_rate")||{}).value);const base=(document.getElementById("fi_base")||{}).value;D.prefs.fiscCfg[name]={rate,base};}cm();save();};

window.addHistPoint=()=>{const ss="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--txt);font-family:inherit";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">Point d'historique passé</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Ajoute la valeur de ton portefeuille à une date passée pour allonger l'historique et débloquer la performance plus tôt.</p><div class="field"><label>Date</label><input id="hp_date" type="date" style="${ss}"></div><div class="field"><label>Valeur totale (€)</label><input id="hp_val" inputmode="decimal" placeholder="ex: 90000" style="${ss}"></div><div class="field"><label>Montant investi à cette date (€) — optionnel</label><input id="hp_inv" inputmode="decimal" placeholder="ex: 80000" style="${ss}"></div><button class="btn btn-p" style="margin-top:6px" onclick="saveHistPoint()">Ajouter</button>`);};
window.saveHistPoint=()=>{const dt=(document.getElementById("hp_date")||{}).value;const v=pn((document.getElementById("hp_val")||{}).value);const invRaw=(document.getElementById("hp_inv")||{}).value;const inv=invRaw?pn(invRaw):v;if(!dt||v<=0)return toast("Indique une date et une valeur.");const t=new Date(dt).getTime();if(H.some(x=>Math.abs(x.t-t)<86400000))return toast("Un point existe déjà à cette date.");H.push({t,v:Math.round(v),inv:Math.round(inv),pl:Math.round(v-inv),h:"00:00",env:{},manual:true});H.sort((a,b)=>a.t-b.t);cm();save();};
window.showNote=(tk)=>{const n=(D.prefs&&D.prefs.notes&&D.prefs.notes[tk])||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">✎ ${esc(tk)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="font-size:13px;line-height:1.55;color:var(--txt);white-space:pre-wrap">${esc(n)||'<span style="color:var(--mut)">Aucune note.</span>'}</div>`);};
