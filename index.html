const fmt_=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(n||0);
const fmt2_=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(n||0);
const fP=n=>(n>0?"+":"")+(n||0).toFixed(1)+"%";
const fL=n=>(n>=0?"+":"")+fmt_(n)+" €";
const pn=s=>{ const str=String(s||0).replace(/\s/g,""); const lastComma=str.lastIndexOf(","); const lastDot=str.lastIndexOf("."); let cleaned; if(lastComma>-1&&lastDot>-1){ if(lastComma>lastDot)cleaned=str.replace(/\./g,"").replace(",","."); else cleaned=str.replace(/,/g,""); }else if(lastComma>-1){ cleaned=str.replace(",","."); }else{ cleaned=str; } return parseFloat(cleaned)||0; };
const sC=s=>{const n=parseFloat(String(s).replace(",","."));return n>=9?"s":n>=7?"a":n>=5?"b":"c"};
const sGrade=s=>{const n=parseFloat(String(s).replace(",","."));if(n>=9)return"S";if(n>=7)return"A";if(n>=5)return"B";if(n>=3)return"C";return"D"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function scorePos(pos, pocheName){
  const isCrypto = pocheName === "Crypto" || CG[pos.ticker]; const isFund = pocheName === "Assurance Vie" || pocheName === "PEE";
  let s=5; const crit=[]; const pl=pos.plPct||0; const mult=isCrypto?1.5:isFund?0.7:1.0;
  if(pl>=50*mult){s+=2.5;crit.push({n:"P&L",v:"+2.5",c:"g"})} else if(pl>=25*mult){s+=1.5;crit.push({n:"P&L",v:"+1.5",c:"g"})} else if(pl>=10*mult){s+=0.8;crit.push({n:"P&L",v:"+0.8",c:"g"})} else if(pl>=-5*mult){crit.push({n:"P&L",v:"0",c:"a"})} else if(pl>=-15*mult){s-=0.8;crit.push({n:"P&L",v:"-0.8",c:"r"})} else if(pl>=-30*mult){s-=1.5;crit.push({n:"P&L",v:"-1.5",c:"r"})} else{s-=2.5;crit.push({n:"P&L",v:"-2.5",c:"r"})}
  const w=pos.poids||0;
  if(w>=8&&w<=22){s+=0.5;crit.push({n:"Poids",v:"+0.5",c:"g"})} else if((w>=5&&w<8)||(w>22&&w<=30)){crit.push({n:"Poids",v:"0",c:"a"})} else if((w>=2&&w<5)||(w>30&&w<=40)){s-=0.5;crit.push({n:"Poids",v:"-0.5",c:"a"})} else if(w<2){s-=1;crit.push({n:"Poids",v:"-1.0",c:"r"})} else{s-=1.5;crit.push({n:"Poids",v:"-1.5",c:"r"})}
  const div=pos.dividend||DIVS[pos.ticker]||0; const yld=pos.cours>0?(div/pos.cours*100):0;
  if(yld>5){s+=1;crit.push({n:"Div",v:"+1.0",c:"g"})} else if(yld>3){s+=0.7;crit.push({n:"Div",v:"+0.7",c:"g"})} else if(yld>1){s+=0.4;crit.push({n:"Div",v:"+0.4",c:"g"})} else if(yld>0){s+=0.2;crit.push({n:"Div",v:"+0.2",c:"a"})}
  if(pos.cours7j&&pos.cours7j>0){ const delta=(pos.cours-pos.cours7j)/pos.cours7j*100; if(delta>10){s+=1;crit.push({n:"7j",v:"+1.0",c:"g"})} else if(delta>3){s+=0.5;crit.push({n:"7j",v:"+0.5",c:"g"})} else if(delta>-3){crit.push({n:"7j",v:"0",c:"a"})} else if(delta>-10){s-=0.5;crit.push({n:"7j",v:"-0.5",c:"r"})} else{s-=1;crit.push({n:"7j",v:"-1.0",c:"r"})} }
  return {score:Math.max(1,Math.min(10,Math.round(s*10)/10)),crit};
}

function downsampleH(){
  if(H.length<2)return; const now=Date.now(); const D7=7*24*3600*1000; const D30=30*24*3600*1000;
  const recent=H.filter(x=>now-x.t<D7); const mid=H.filter(x=>now-x.t>=D7&&now-x.t<D30); const old=H.filter(x=>now-x.t>=D30);
  const midMap={}; mid.forEach(x=>{const k=new Date(x.t).toISOString().slice(0,10);if(!midMap[k])midMap[k]=x;else Object.assign(midMap[k], x);});
  const oldMap={}; old.forEach(x=>{const d=new Date(x.t);const wk=`${d.getFullYear()}-W${String(Math.ceil((d-new Date(d.getFullYear(),0,1))/604800000)).padStart(2,"0")}`;if(!oldMap[wk])oldMap[wk]=x;else Object.assign(oldMap[wk], x);});
  H=[...Object.values(oldMap),...Object.values(midMap),...recent].sort((a,b)=>a.t-b.t);
}

function rc(d){
  if(!d||!d.poches)return d; const eurUsd=d.eurUsd||1.1;
  Object.entries(d.poches).forEach(([pocheName,p])=>{
    p.positions.forEach(x=>{ const cur=x.currency||CUR[x.ticker]; const rate=(cur==="USD")?eurUsd:1; x.valeur=(x.qty*x.cours)/rate; x.pl=(x.qty*(x.cours-x.pru))/rate; x.plPct=x.pru?((x.cours-x.pru)/x.pru*100):0; });
    p.investi=p.positions.reduce((s,x)=>{ const cur=x.currency||CUR[x.ticker]; const rate=(cur==="USD")?eurUsd:1; return s+(x.qty*x.pru)/rate },0);
    p.valeur=p.positions.reduce((s,x)=>s+x.valeur,0); p.pl=p.valeur-p.investi; const t=p.valeur||1;
    p.positions.forEach(x=>{x.poids=Math.round(x.valeur/t*1000)/10});
    const n=p.positions.length; if(n===0){p.sante="5,0";return;}
    let sc=0,wTotal=0; p.positions.forEach(x=>{ const w=(x.poids||0)/100; const r=scorePos(x,pocheName); x._score=r.score;x._crit=r.crit; sc+=r.score*w;wTotal+=w; });
    let raw=wTotal>0?sc/wTotal:5; if(n>=6)raw+=0.3;else if(n>=4)raw+=0.15; const maxPoids=Math.max(...p.positions.map(x=>x.poids)); if(maxPoids>60)raw-=1;else if(maxPoids>45)raw-=0.5;
    const plPct=p.investi>0?(p.pl/p.investi*100):0; if(plPct>20)raw+=0.5;else if(plPct<-15)raw-=0.5;
    p.sante=Math.max(1,Math.min(10,raw)).toFixed(1).replace('.',',');
  });
  if(d.immobilier)d.immobilier.equityNette=d.immobilier.valeurEstimee-d.immobilier.capitalRestant;
  d.updatedAt=new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); return d;
}

function getCutoffs() {
   const nowD = new Date(); const now = nowD.getTime(); const day = nowD.getDay(); const diffDate = nowD.getDate() - day + (day === 0 ? -6 : 1);
   return { "1s":now-7*86400000, "wtd":new Date(nowD.getFullYear(), nowD.getMonth(), diffDate).getTime(), "1m":now-30*86400000, "3m":now-90*86400000, "mtd":new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime(), "1a":now-365*86400000, "ytd":new Date(nowD.getFullYear(), 0, 1).getTime(), "tout":0 };

// ══════════════ SUPABASE SYNC ══════════════
let _isSyncing=false; let _syncPending=false;
async function pullFromSupabase() {
  if (!sb || !currentUser) return false;
  try {
    const { data: pfData, error: pfErr } = await sb.from('portfolios').select('*').eq('user_id', currentUser.id).limit(1);
    if (pfErr) throw pfErr;
    if (!pfData || pfData.length === 0) return false;
    window.currentPfId = pfData[0].id;

    const { data: posData } = await sb.from('positions').select('*').eq('portfolio_id', pfData[0].id);

    // Fetch des Cashflows
    const { data: cfData, error: cfErr } = await sb
      .from('cashflows')
      .select('*')
      .eq('portfolio_id', pfData[0].id)
      .order('date', { ascending: true });
    if (cfErr) console.warn('cashflows fetch error', cfErr);
    window.cashflows = cfData || [];

    const localD = loadLocal().D || {};
    let newD = {
      updatedAt: new Date().toLocaleDateString("fr-FR"),
      eurUsd: pfData[0].eur_usd || 1.10,
      cash: pfData[0].cash || 0,
      targetAlloc: pfData[0].target_alloc || {},
      immobilier: pfData[0].immobilier || {},
      sales: pfData[0].sales || [],
      poches: {},
      migV2: localD.migV2, migV3: localD.migV3, migV4: localD.migV4, migV5: localD.migV5, migV6: localD.migV6
    };
    
    ["CTO", "PEA", "Assurance Vie", "PEE", "Crypto", "Métaux"].forEach(p => newD.poches[p] = { sante: "5,0", positions: [] });

    if (posData) {
      posData.forEach(pos => {
        if (!newD.poches[pos.poche]) newD.poches[pos.poche] = { sante: "5,0", positions: [] };
        const oldPos = localD.poches && localD.poches[pos.poche] && localD.poches[pos.poche].positions.find(x => x.ticker === pos.ticker);
        newD.poches[pos.poche].positions.push({
          ticker: pos.ticker, titre: pos.titre, qty: pos.qty, pru: pos.pru, cours: pos.cours,
          cible: pos.cible, sector: pos.sector, dividend: pos.dividend,
          cours7j: oldPos ? oldPos.cours7j : pos.cours,
          cours7jDate: oldPos ? oldPos.cours7jDate : Date.now(),
          lastUpd: oldPos ? oldPos.lastUpd : Date.now(),
          currency: oldPos ? oldPos.currency : null,
          avSymbol: oldPos ? oldPos.avSymbol : null
        });
      });
    }
    D = newD; H = pfData[0].hist || []; st.sync = true; return true;
  } catch (e) { st.sync = false; return false; }
}

async function pushToSupabase() {
  if(!sb || !currentUser || !window.currentPfId) return false; if(_isSyncing){_syncPending=true;return false;} _isSyncing=true; let ok=false;
  try{
    await sb.from('portfolios').update({ cash: D.cash || 0, eur_usd: D.eurUsd || 1.1, immobilier: D.immobilier || {}, target_alloc: D.targetAlloc || {}, sales: D.sales || [], hist: H.slice(-1000) }).eq('id', window.currentPfId);
    const { data: dbPos } = await sb.from('positions').select('id, poche, ticker').eq('portfolio_id', window.currentPfId);
    let toUpdate = []; let toInsert = []; let keptIds = new Set();
    Object.entries(D.poches).forEach(([pocheName, p]) => {
      p.positions.forEach(pos => {
        const dbMatch = dbPos.find(x => x.poche === pocheName && x.ticker === pos.ticker);
        const payload = { portfolio_id: window.currentPfId, poche: pocheName, ticker: pos.ticker, titre: pos.titre, qty: pos.qty, pru: pos.pru, cours: pos.cours, cible: pos.cible || null, sector: pos.sector || null, dividend: pos.dividend || null };
        if(dbMatch) { toUpdate.push({ id: dbMatch.id, ...payload }); keptIds.add(dbMatch.id); } else { toInsert.push(payload); }
      });
    });
    const idsToDelete = dbPos.filter(x => !keptIds.has(x.id)).map(x => x.id);
    if(idsToDelete.length > 0) await sb.from('positions').delete().in('id', idsToDelete);
    if(toInsert.length > 0) await sb.from('positions').insert(toInsert);
    for(const item of toUpdate) { const { id, ...data } = item; await sb.from('positions').update(data).eq('id', id); }
    st.sync=true; ok=true;
  }catch(e){st.sync=false} finally{ _isSyncing=false; R(); }
  if(_syncPending){_syncPending=false;setTimeout(pushToSupabase,0)} return ok;
}

async function fetchBenchmark(ticker = "CW8.PA") {
  const todayStr = new Date().toISOString().slice(0,10);
  const cacheKey = `bench_${ticker}_${todayStr}`;
  Object.keys(localStorage).forEach(k => { if(k.startsWith(`bench_${ticker}_`) && k !== cacheKey) { localStorage.removeItem(k); } });

  const cached = localStorage.getItem(cacheKey);
  if(cached) { benchmarkData = JSON.parse(cached); return; }

  const targetUrl = `https://proud-bar-fc46yahoo-proxy.bya-2mo.workers.dev/?chart=${encodeURIComponent(ticker)}`;
  try {
     const r = await fetch(targetUrl);
     if(r.ok) {
        const j = await r.json();
        if(j.chart && j.chart.result && j.chart.result[0]) {
           const res = j.chart.result[0];
           const timestamps = res.timestamp;
           const closes = res.indicators.quote[0].close;
           
           if(timestamps && closes) {
              const series = [];
              for(let i=0; i<timestamps.length; i++) {
                 if(closes[i] !== null && !isNaN(closes[i])) {
                    series.push({ t: timestamps[i] * 1000, c: closes[i] });
                 }
              }
              if(series.length > 0) {
                 benchmarkData = { ticker, series };
                 localStorage.setItem(cacheKey, JSON.stringify(benchmarkData));
                 return;
              }
           }
        }
     }
  } catch(e) {}
  benchmarkData = null; 
}

  }

  if (!D.migV6 && sb && window.currentPfId && Array.isArray(D.sales) && D.sales.length > 0) {
    try {
      const rows = D.sales.map(s => ({

function dn(data,colors,sz=120){const tot=data.reduce((s,d)=>s+d[1],0)||1;let a=0;const g=.02,cx=sz/2,cy=sz/2,R=sz*.42,r=sz*.28;let p="";data.forEach((d,i)=>{const f=d[1]/tot;if(f<.001){a+=f;return}const s1=a*Math.PI*2-Math.PI/2+g,e1=(a+f)*Math.PI*2-Math.PI/2-g,l=f>.5?1:0;p+=`<path d="M${cx+R*Math.cos(s1)},${cy+R*Math.sin(s1)} A${R},${R} 0 ${l} 1 ${cx+R*Math.cos(e1)},${cy+R*Math.sin(e1)} L${cx+r*Math.cos(e1)},${cy+r*Math.sin(e1)} A${r},${r} 0 ${l} 0 ${cx+r*Math.cos(s1)},${cy+r*Math.sin(s1)} Z" fill="${colors[i%colors.length]}" opacity=".9"/>`;a+=f});return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${p}</svg>`;}

function lc(data, config, w = 300, h = 180) {
  if (data.length < 2) return `<div>Acquisition en cours...</div>`;
  let vs = [];
  const startObj = data[0];
  const tMin = data[0].t, tMax = data[data.length - 1].t;
  const tRange = tMax - tMin || 1;

  if (config.mode === 'pct') {
    const baseCap = startObj.inv || (startObj.v - startObj.pl) || 1;
    vs = data.map(d => ((d.pl - startObj.pl) / baseCap) * 100);
  } else if (config.mode === 'dd') {
    let maxSeen = 0;
    vs = data.map(d => { maxSeen = Math.max(maxSeen, d.v); return maxSeen > 0 ? ((d.v - maxSeen) / maxSeen) * 100 : 0; });
  } else { vs = data.map(d => d[config.key]); }

  let mn = Math.min(...vs), mx = Math.max(...vs);
  let benchVs = []; let benchPath = "";
  if (config.mode === 'pct' && benchmarkData && benchmarkData.series.length > 0) {
    let baseClose = null; let startIdx = 0;
    for (let i = benchmarkData.series.length - 1; i >= 0; i--) {
      if (benchmarkData.series[i].t <= tMin) { baseClose = benchmarkData.series[i].c; startIdx = i; break; }
    }
    if (baseClose === null) { baseClose = benchmarkData.series[0].c; startIdx = 0; }
    if (baseClose > 0) {
      const benchPoints = benchmarkData.series.slice(startIdx).filter(b => b.t <= tMax);
      if (benchPoints.length > 0) {
        benchPoints.forEach(b => { const pct = ((b.c - baseClose) / baseClose) * 100; benchVs.push({ t: b.t, pct }); mn = Math.min(mn, pct); mx = Math.max(mx, pct); });
      }
    }
    if (benchVs.length > 0) {
      if (benchVs[0].t < tMin) { benchVs[0] = { t: tMin, pct: 0 }; }
      else if (benchVs[0].t > tMin) { benchVs.unshift({ t: tMin, pct: 0 }); }
    }
  }
  if (mn === mx) { mn -= 1; mx += 1; }
  if (config.mode === 'dd') mx = 0;
  const pad = config.mode === 'dd' ? 0 : (mx - mn) * 0.1;
  const dMin = mn - pad, dMax = mx + pad, rg = dMax - dMin;

  const pdX = 0, pt = config.mode === 'dd' ? 10 : 10, pb = 20;
  const cw = w - pdX * 2, ch = h - pt - pb;

  if (config.interactive) {
    window._chartData = data;
    window._chartVs = vs;
    window._chartBenchVs = benchVs;
    window._chartConfig = config;
    window._chartScales = { w, h, pdX, pt, pb, cw, ch, tMin, tMax, tRange, dMin, dMax, rg };
  }

  const endVal = vs[vs.length - 1];
  const isPos = config.mode === 'dd' ? false : endVal >= 0;
  const col = config.mode === 'dd' ? "#f87171" : (isPos ? "#34d399" : "#f87171");

  let ptLine = "", ptArea = "";
  vs.forEach((v, i) => {
    const x = pdX + ((data[i].t - tMin) / tRange) * cw;
    const y = pt + ch - ((v - dMin) / rg * ch);
    ptLine += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
    if (i === 0) ptArea = `M${x.toFixed(1)},${pt + ch} L${x.toFixed(1)},${y.toFixed(1)}`;
    else ptArea += ` L${x.toFixed(1)},${y.toFixed(1)}`;
  });
  ptArea += ` L${pdX + cw},${pt + ch} Z`;

  if (benchVs.length > 0) {
    benchVs.forEach((b, i) => {
      const x = pdX + ((b.t - tMin) / tRange) * cw;
      const y = pt + ch - ((b.pct - dMin) / rg * ch);
      benchPath += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
    });
  }

  // --- Marqueurs Cash-flows ---
  let cfMarkers = "";
  if (config.interactive && Array.isArray(window.cashflows) && window.cashflows.length) {
    const yMark = pt + ch + 12; // tout en bas
    window.cashflows.forEach((cf, i) => {
      const tCf = new Date(cf.date).getTime();
      if (tCf < tMin || tCf > tMax) return;
      const x = pdX + ((tCf - tMin) / tRange) * cw;
      const isIn = (cf.type === 'buy' || cf.type === 'deposit' || cf.type === 'dividend');
      const colCf = isIn ? "#34d399" : "#f87171";
      const arrow = isIn ? "↓" : "↑";
      cfMarkers += `<text x="${x.toFixed(1)}" y="${yMark}" text-anchor="middle" font-size="10" fill="${colCf}" data-cf-idx="${i}" style="cursor:pointer; pointer-events:all" class="cf-mark">${arrow}</text>`;
    });
  }

  const crosshair = config.interactive
    ? `<g id="crosshair" style="display:none"><line y1="${pt}" y2="${pt + ch}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2 2"/><circle id="ch-bench" r="3" fill="var(--bg)" stroke="var(--dim)" stroke-width="2" style="display:none"/><circle id="ch-main" r="4" fill="${col}" stroke="var(--card)" stroke-width="2"/></g>`
    : '';

  const formatT = (ms) => {
    if(!ms) return ""; const d = new Date(ms), nw = new Date();
    if(d.getDate()===nw.getDate() && d.getMonth()===nw.getMonth() && d.getFullYear()===nw.getFullYear()) return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
  };
  const yZero = (dMin < 0 && dMax > 0) ? pt + ch - ((0 - dMin) / rg * ch) : -1;
  const uid = Math.random().toString(36).substring(2,9); 

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible; display:block"><defs><linearGradient id="g-${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.3"/><stop offset="100%" stop-color="${col}" stop-opacity="0.0"/></linearGradient></defs><line x1="0" y1="${pt}" x2="${w}" y2="${pt}" stroke="var(--bdr)" stroke-dasharray="2 4"/><line x1="0" y1="${pt + ch}" x2="${w}" y2="${pt + ch}" stroke="var(--bdr)" stroke-dasharray="2 4"/>${yZero > 0 ? `<line x1="0" y1="${yZero}" x2="${w}" y2="${yZero}" stroke="var(--dim)" stroke-opacity="0.5" stroke-dasharray="4 4"/>` : ''}${benchPath ? `<path d="${benchPath}" fill="none" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>` : ''}<path d="${ptArea}" fill="url(#g-${uid})"/><path d="${ptLine}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${cfMarkers}${crosshair}<text x="${w}" y="${pt-4}" font-size="9" fill="var(--dim)" text-anchor="end">${config.mode === 'pct' || config.mode === 'dd' ? mx.toFixed(1)+'%' : fmt_(mx)}</text><text x="${w}" y="${pt+ch+10}" font-size="9" fill="var(--dim)" text-anchor="end">${config.mode === 'pct' || config.mode === 'dd' ? mn.toFixed(1)+'%' : fmt_(mn)}</text><text x="0" y="${h-2}" font-size="9" fill="var(--mut)">${formatT(data[0].t)}</text><text x="${w}" y="${h-2}" font-size="9" fill="var(--mut)" text-anchor="end">${formatT(data[data.length-1].t)}</text></svg>`;
}

// ══════════════ INTERACTIONS GRAPHIQUES (POINTER EVENTS OPTIMISÉ) ══════════════
window.bindInteraction = () => {
  const svgEl = document.querySelector('.chart-touch svg');
  if(!svgEl || !window._chartData || window._chartData.length < 2) return;
  
  const data = window._chartData; const vs = window._chartVs; const benchVs = window._chartBenchVs || [];
  const scales = window._chartScales; const config = window._chartConfig;
  
  let rect = null, rafId = 0, lastIdx = -1;
  const ch = svgEl.querySelector('#crosshair'); const chLine = ch.querySelector('line');
  const chMainDot = ch.querySelector('#ch-main'); const chBenchDot = ch.querySelector('#ch-bench');

  const elLabel = document.getElementById('sb-label'); const elValue = document.getElementById('sb-value');
  const elBench = document.getElementById('sb-bench'); const elDeltaE = document.getElementById('sb-deltaE');
  const elDeltaPct = document.getElementById('sb-deltaPct'); const elDiff = document.getElementById('sb-diff');

  const findIdx = (clientX) => {
    const xPx = clientX - rect.left; const svgX = (xPx / rect.width) * scales.w;
    const t = scales.tMin + ((svgX - scales.pdX) / scales.cw) * scales.tRange;
    let lo = 0, hi = data.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (data[mid].t < t) lo = mid + 1; else hi = mid; }
    if (lo > 0 && Math.abs(data[lo-1].t - t) < Math.abs(data[lo].t - t)) return lo - 1; return lo;
  };
  
  const render = (idx) => {
    const d = data[idx]; const valY = vs[idx];
    const x = scales.pdX + ((d.t - scales.tMin) / scales.tRange) * scales.cw;
    const y = scales.pt + scales.ch - ((valY - scales.dMin) / scales.rg * scales.ch);
    
    chLine.setAttribute('x1', x); chLine.setAttribute('x2', x);
    chMainDot.setAttribute('cx', x); chMainDot.setAttribute('cy', y);

    if (config.mode === 'pct' && benchVs.length > 0) {
        let bCur = benchVs[benchVs.length - 1], bNext = null;
        for (let i = 0; i < benchVs.length - 1; i++) {
            if (benchVs[i].t <= d.t && benchVs[i+1].t >= d.t) { bCur = benchVs[i]; bNext = benchVs[i+1]; break; }
        }
        
        let interpPct = bCur.pct;
        if (bNext && bNext.t > bCur.t) {
            const frac = Math.max(0, Math.min(1, (d.t - bCur.t) / (bNext.t - bCur.t)));
            interpPct = bCur.pct + frac * (bNext.pct - bCur.pct);
        } else if (d.t <= benchVs[0].t) {
            interpPct = benchVs[0].pct;
        }

        const by = scales.pt + scales.ch - ((interpPct - scales.dMin) / scales.rg * scales.ch);
        chBenchDot.setAttribute('cx', x); chBenchDot.setAttribute('cy', by); chBenchDot.style.display = '';
        
        elBench.style.display = '';
        elBench.textContent = `${benchmarkData ? benchmarkData.ticker : 'Bench'} : ${interpPct>=0?'+':''}${interpPct.toFixed(2)}%`;
        
        const diffPts = valY - interpPct; const diffColor = diffPts >= 0 ? "var(--grn)" : "var(--red)";
        elDiff.style.display = ''; elDiff.style.color = diffColor; elDiff.textContent = `${diffPts>=0?'+':''}${diffPts.toFixed(2)} pts`;
    } else { chBenchDot.style.display = 'none'; elBench.style.display = 'none'; elDiff.style.display = 'none'; }

    ch.style.display = '';

    const dt = new Date(d.t);
    elLabel.textContent = dt.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}) + " " + dt.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    
    const startObj = data[0]; const deltaE = d.v - startObj.v; const isPct = config.mode === 'pct';
    const isPos = isPct ? valY >= 0 : deltaE >= 0; const cCol = isPos ? "var(--grn)" : "var(--red)"; const sgn = isPos ? "+" : "";

    elValue.textContent = isPct ? valY.toFixed(2)+'%' : fmt_(valY)+' €';
    elDeltaE.textContent = `${sgn}${fmt_(deltaE)} €`; elDeltaE.style.color = cCol;
    
    if (isPct) { elDeltaPct.textContent = ""; } 
    else {
        const baseCap = startObj.inv || (startObj.v - startObj.pl) || 1;
        const deltaPct = ((d.pl - startObj.pl) / baseCap) * 100;
        elDeltaPct.textContent = `${deltaPct>=0?'+':''}${deltaPct.toFixed(2)}%`; elDeltaPct.style.color = deltaPct>=0?"var(--grn)":"var(--red)";
    }
  };
  
  const onMove = (e) => {
    if (!rect) return; const idx = findIdx(e.clientX); if (idx === lastIdx) return;
    lastIdx = idx; if (!rafId) rafId = requestAnimationFrame(() => { render(lastIdx); rafId = 0; });
  };
  
  const onDown = (e) => { rect = svgEl.getBoundingClientRect(); svgEl.setPointerCapture(e.pointerId); onMove(e); };
  const onUp = () => { rect = null; lastIdx = -1; ch.style.display = 'none'; window.renderOverview(); };
  
  svgEl.addEventListener('pointerdown', onDown); svgEl.addEventListener('pointermove', onMove);
  svgEl.addEventListener('pointerup', onUp); svgEl.addEventListener('pointercancel', onUp);
  
  window.bindCashflowMarkers(svgEl); // Binding des Cashflows ajouté ici
};

window.bindCashflowMarkers = function (svgRoot) {
  if (!svgRoot) return;
  const marks = svgRoot.querySelectorAll('.cf-mark');
  if (!marks.length) return;

  const fmtEur = n => (n >= 0 ? "+" : "") + Math.round(n).toLocaleString('fr-FR') + " €";
  const labelFor = cf => {
    const map = { buy: 'Achat', sell: 'Vente', dividend: 'Dividende', deposit: 'Dépôt', withdrawal: 'Retrait' };
    return (map[cf.type] || cf.type) + (cf.ticker ? ' ' + cf.ticker : '');
  };
  const signFor = cf => (cf.type === 'sell' || cf.type === 'withdrawal') ? -1 : 1;
  const setText = (id, txt) => { const el = document.getElementById(id); if (el) el.firstChild ? el.firstChild.nodeValue = txt : el.textContent = txt; };

  const showCf = (idx) => {
    const cf = (window.cashflows || [])[idx];
    if (!cf) return;
    const ch = document.getElementById('crosshair'); if (ch) ch.style.display = 'none';
    const amt = signFor(cf) * Number(cf.amount_eur || 0);
    setText('sb-label', new Date(cf.date).toLocaleDateString('fr-FR'));
    setText('sb-value', labelFor(cf));
    setText('sb-deltaE', fmtEur(amt));
    setText('sb-deltaPct', '');
    setText('sb-bench', '');
    setText('sb-diff', cf.label || cf.poche || '');
  };

  const release = () => { if (typeof window.renderOverview === 'function') window.renderOverview(); };

  marks.forEach(m => {
    m.addEventListener('pointerdown', e => { e.stopPropagation(); const idx = parseInt(m.getAttribute('data-cf-idx'), 10); showCf(idx); });
    m.addEventListener('pointerenter', e => { const idx = parseInt(m.getAttribute('data-cf-idx'), 10); showCf(idx); });
    m.addEventListener('pointerup', release); m.addEventListener('pointerleave', release); m.addEventListener('pointercancel', release);
  });
};

window.renderOverview = () => {
   const d = ga(); const cutoffs = getCutoffs(); const cut = cutoffs[htf]||0; let r = H.filter(x => x.t >= cut);
   let startV = r.length > 0 ? r[0].v : d.tN; let startPl = r.length > 0 ? r[0].pl : d.tP; let endV = d.tN; let deltaE = endV - startV;
   
   let startInv = r.length > 0 ? (r[0].inv || (startV - startPl)) : (Object.values(D.poches).reduce((s,p)=>s+p.investi,0));
   let baseCap = startInv || 1; let deltaPct = ((d.tP - startPl) / baseCap) * 100;
   
   if(r.length < 2) { deltaE = 0; deltaPct = 0; }
   const isPos = deltaPct >= 0; const cCol = isPos ? "var(--grn)" : "var(--red)"; const sgn = isPos ? "+" : "";

   const elLabel = document.getElementById('sb-label');
   if(elLabel) {
       elLabel.textContent = "Valeur Actuelle";
       document.getElementById('sb-value').textContent = hMode==='pct'? deltaPct.toFixed(2)+'%': fmt_(endV)+' €';
       
       const elE = document.getElementById('sb-deltaE');
       elE.textContent = `${sgn}${fmt_(deltaE)} €`; elE.style.color = cCol;
       
       const elPct = document.getElementById('sb-deltaPct');
       const elBench = document.getElementById('sb-bench');
       const elDiff = document.getElementById('sb-diff');

       if (hMode === 'pct' && benchmarkData && benchmarkData.series.length > 0) {
           const startT = r.length > 0 ? r[0].t : Date.now();
           let baseClose = null;
           for (let i = benchmarkData.series.length - 1; i >= 0; i--) { 
               if (benchmarkData.series[i].t <= startT) { baseClose = benchmarkData.series[i].c; break; } 
           }
           if(baseClose === null) baseClose = benchmarkData.series[0].c;
           
           const endClose = benchmarkData.series[benchmarkData.series.length-1].c;
           const benchPct = ((endClose - baseClose)/baseClose) * 100;
           const diffPts = deltaPct - benchPct;
           const diffColor = diffPts >= 0 ? "var(--grn)" : "var(--red)";
           
           elPct.textContent = "";
           elBench.style.display = ''; elBench.textContent = `${benchmarkData.ticker} : ${benchPct>=0?'+':''}${benchPct.toFixed(2)}%`;
           elDiff.style.display = ''; elDiff.style.color = diffColor; elDiff.textContent = `${diffPts>=0?'+':''}${diffPts.toFixed(2)} pts`;
       } else {
           elBench.style.display = 'none'; elDiff.style.display = 'none';
           elPct.textContent = `${sgn}${deltaPct.toFixed(2)}%`; elPct.style.color = cCol;
       }
   }
};
