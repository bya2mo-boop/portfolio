let _importData = null;
window.loadImportFile=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=(ev)=>{document.getElementById("imp_text").value=ev.target.result;};r.readAsText(f);};
window.openImport=(poche)=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Importer un CSV — ${esc(poche)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.5">Colle un export CSV (broker, Excel...) ou choisis un fichier. La 1re ligne doit contenir les noms de colonnes.</p><div class="field"><input type="file" id="imp_file" accept=".csv,.txt" onchange="loadImportFile(event)" style="font-size:12px"></div><div class="field"><label>Ou colle le CSV ici</label><textarea id="imp_text" rows="6" placeholder="Symbol,Quantity,Cost Price&#10;AAPL,10,150.20" style="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt);font-family:monospace;font-size:11px;resize:vertical"></textarea></div><button class="btn btn-p" onclick="analyzeImport('${escAttr(poche)}')">Analyser</button>`);};
window.analyzeImport=(poche)=>{const text=document.getElementById("imp_text").value.trim();if(!text)return toast("Colle un CSV ou choisis un fichier.");const fl=text.split(/\r?\n/)[0]||"";const counts={",":(fl.match(/,/g)||[]).length,";":(fl.match(/;/g)||[]).length,"\t":(fl.match(/\t/g)||[]).length};const delim=Object.keys(counts).reduce((a,b)=>counts[a]>=counts[b]?a:b);const parse=(line)=>{const fields=[];let cur="",inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===delim&&!inQ){fields.push(cur);cur="";}else cur+=c;}fields.push(cur);return fields.map(f=>f.trim().replace(/^"|"$/g,""));};const allRows=text.split(/\r?\n/).filter(l=>l.trim()).map(parse);const ibkrHdr=allRows.find(r=>(r[0]==="Positions ouvertes"||r[0]==="Open Positions")&&r[1]==="Header");if(ibkrHdr){const ih=ibkrHdr.map(x=>x.toLowerCase());const icol=(kw)=>ih.findIndex(x=>kw.some(k=>x.includes(k)));const cS=icol(["symbole","symbol"]),cQ=icol(["quantité","quantity"]),cP=icol(["coût","cost"]),cC=icol(["devise","currency"]),cX=ih.findIndex(x=>x.includes("clôture")||x.includes("close"));const dd=allRows.filter(r=>(r[0]==="Positions ouvertes"||r[0]==="Open Positions")&&r[1]==="Data"&&r[2]==="Summary");const poss=dd.map(r=>({ticker:(r[cS]||"").trim().toUpperCase(),qty:pn(r[cQ]),pru:pn(r[cP]),currency:(r[cC]||"").trim().toUpperCase(),cours:cX>=0?pn(r[cX]):pn(r[cP])})).filter(p=>p.ticker&&p.qty>0);if(poss.length===0)return toast("Aucune position trouvée dans le relevé IBKR.");_importData={ibkr:true,positions:poss};const prev=poss.map(p=>`<tr><td style="padding:5px 10px;border-bottom:1px solid var(--bdr)">${esc(p.ticker)}</td><td style="padding:5px 10px;border-bottom:1px solid var(--bdr);text-align:right">${p.qty}</td><td style="padding:5px 10px;border-bottom:1px solid var(--bdr);text-align:right">${p.pru.toFixed(2)}</td></tr>`).join("");sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Relevé IBKR détecté</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:12px;color:var(--dim);margin-bottom:12px">${poss.length} position(s) trouvée(s) dans la section Positions ouvertes. Aperçu :</p><div style="max-height:260px;overflow-y:auto;margin-bottom:14px"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="color:var(--dim);text-align:left"><th style="padding:5px 10px">Ticker</th><th style="padding:5px 10px;text-align:right">Qté</th><th style="padding:5px 10px;text-align:right">PRU</th></tr>${prev}</table></div><button class="btn btn-p" onclick="doImportIBKR('${escAttr(poche)}')">Importer dans ${esc(poche)}</button>`);return;}if(allRows.length<2)return toast("Le CSV doit avoir une ligne d'en-tête + au moins une ligne de données.");const headers=allRows[0];const dataRows=allRows.slice(1);_importData={headers,dataRows};const guess=(kw)=>{for(let i=0;i<headers.length;i++){const h=headers[i].toLowerCase();if(kw.some(k=>h.includes(k)))return i;}return -1;};const gT=guess(["symbol","ticker","isin","code","mnémo"]);const gQ=guess(["quantity","qty","quantité","qté","nombre","shares","parts"]);const gP=guess(["cost","price","pru","prix","revient","achat","avg","unit"]);const gN=guess(["name","nom","description","libellé","désignation","label"]);const opts=(sel)=>headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h)||"(colonne "+(i+1)+")"}</option>`).join("")+`<option value="-1" ${sel===-1?"selected":""}>— aucune —</option>`;const ss=`width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt)`;sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Mapper les colonnes</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">${dataRows.length} ligne(s) détectée(s). Indique quelle colonne correspond à quoi :</p><div class="field"><label>Ticker / Symbole *</label><select id="map_t" style="${ss}">${opts(gT)}</select></div><div class="field"><label>Quantité *</label><select id="map_q" style="${ss}">${opts(gQ)}</select></div><div class="field"><label>PRU / Prix de revient *</label><select id="map_p" style="${ss}">${opts(gP)}</select></div><div class="field"><label>Nom (optionnel)</label><select id="map_n" style="${ss}">${opts(gN)}</select></div><button class="btn btn-p" onclick="doImport('${escAttr(poche)}')">Importer ${dataRows.length} position(s)</button>`);};
window.doImport=(poche)=>{if(!_importData)return;const ti=parseInt(document.getElementById("map_t").value);const qi=parseInt(document.getElementById("map_q").value);const pi=parseInt(document.getElementById("map_p").value);const ni=parseInt(document.getElementById("map_n").value);if(ti<0||qi<0||pi<0)return toast("Ticker, quantité et PRU sont obligatoires.");if(!D.poches[poche])return toast("Enveloppe introuvable.");const existing=new Set(D.poches[poche].positions.map(x=>String(x.ticker).toUpperCase()));let added=0,skipped=0;_importData.dataRows.forEach(row=>{const tk=(row[ti]||"").trim().toUpperCase();const qty=pn(row[qi]);const pru=pn(row[pi]);if(!tk||qty<=0||existing.has(tk)){skipped++;return;}const pos={titre:(ni>=0&&row[ni])?row[ni].trim():tk,ticker:tk,qty,pru,cours:pru};D.poches[poche].positions.push(pos);existing.add(tk);added++;});_importData=null;cm();save();setTimeout(()=>toast(added+" position(s) importée(s)"+(skipped?", "+skipped+" ignorée(s) (déjà présente, ticker ou quantité manquant)":"")+". Clique ↻ pour récupérer les cours."),100);};
window.doImportIBKR=(poche)=>{if(!_importData||!_importData.positions)return;if(!D.poches[poche])return toast("Enveloppe introuvable.");const existing=new Set(D.poches[poche].positions.map(x=>String(x.ticker).toUpperCase()));let added=0,skipped=0;_importData.positions.forEach(p=>{if(existing.has(p.ticker)){skipped++;return;}const pos={titre:p.ticker,ticker:p.ticker,qty:p.qty,pru:p.pru,cours:p.cours||p.pru};if(p.currency)pos.currency=p.currency;D.poches[poche].positions.push(pos);added++;});_importData=null;cm();save();setTimeout(()=>toast(added+" position(s) importée(s)"+(skipped?", "+skipped+" déjà présente(s) ignorée(s)":"")+". Clique ↻ pour rafraîchir les cours."),100);};

window.updTgTotal=()=>{const keys=window._tgKeys||[];let t=0;keys.forEach((k,i)=>{const el=document.getElementById("tg_"+i);if(el)t+=pn(el.value);});const el=document.getElementById("tg_total");if(el){el.textContent="Total : "+Math.round(t*10)/10+"%";el.style.color=Math.round(t)===100?"var(--grn)":"var(--amb)";}};

// ─── CORRECTION BUG #5 ───────────────────────────────────────────────────────
// confirmSale() : querySelector sur 'input[name="mo"]:checked' pouvait
// retourner null. Ajout d'une vérification explicite.

window.confirmSale=()=>{
  if(!_pendingSale)return;
  const {pn:pocheName,tk,qty,pru,mode,pendingEdit:pe}=_pendingSale;
  try{
    const checkedInput = document.querySelector('input[name="mo"]:checked');
    if(!checkedInput){
      console.error("confirmSale: aucune option sélectionnée");
      return;
    }
    const choice = checkedInput.value;
    const p=D.poches[pocheName].positions.find(x=>x.ticker===tk);
    if(!p)return;
    if(choice==="sale"){
      const net=pn(document.getElementById("saleNet").value);
      if(!net||net<=0){
        const inp=document.getElementById("saleNet");
        if(inp){inp.style.borderColor="var(--red)";inp.placeholder="⚠ Saisir le montant net reçu";inp.focus()}
        return;
      }
      const brut=pn(document.getElementById("saleBrut").value)||net;
      const _cur=curOf(p);const _te=toEur(_cur);const netEur=net*_te;const brutEur=brut*_te;
      const pl=netEur-(qty*pru)*_te;
      if(!D.sales)D.sales=[];
      D.sales.push({date:new Date().toISOString().slice(0,10),poche:pocheName,ticker:tk,titre:p.titre,qty:qty,pru:pru,net:Math.round(netEur*100)/100,brut:Math.round(brutEur*100)/100,pl:Math.round(pl*100)/100});
    }
    if(mode==="full"){
      D.poches[pocheName].positions=D.poches[pocheName].positions.filter(x=>x.ticker!==tk);
    }else if(pe){
      p.titre=pe.newTitre;p.ticker=pe.newTicker;p.qty=pe.newQty;p.pru=pe.newPru;p.cours=pe.newCours;
      if(pe.newCible)p.cible=pn(pe.newCible);else delete p.cible;
      if(pe.newCibleH)p.cibleHaut=pn(pe.newCibleH);else delete p.cibleHaut;
      if(pe.newCur)p.currency=pe.newCur;
    }
    _pendingSale=null;
    cm();save();
  }catch(e){
    console.error("confirmSale:",e);
    _pendingSale=null;
    cm();
  }
};

async function refreshDivs(){
  try{
    if(!D||!D.poches)return;
      const map={};
    Object.entries(D.poches).forEach(([n,p])=>{ if(n==="Crypto")return; p.positions.forEach(pos=>{ const t=pos.ticker; if(!t||CG[t]||t==="50PESO")return; let ys; if(pos.avSymbol)ys=pos.avSymbol; else if(KNOWN_EU[t])ys=KNOWN_EU[t]; else ys=t; map[t]=ys; }); });
    const syms=[...new Set(Object.values(map))];
    if(!syms.length)return;
    const r=await fetchT(`${WORKER_URL}/?divs=${encodeURIComponent(syms.join(","))}&_t=${Date.now()}`);
    if(!r.ok)return;
    const j=await r.json();
    if(!j||!j.divs)return;
    const byTicker={};
    Object.keys(map).forEach(t=>{ const ys=map[t]; if(j.divs[ys])byTicker[t]=j.divs[ys]; });
    if(!D.prefs)D.prefs={};
    D.prefs.divAuto=byTicker;
    D.prefs.divAutoTs=Date.now();
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{const info=byTicker[pos.ticker];if(info&&info.annual>0&&Math.abs((pos.dividend||0)-info.annual)>0.01)pos.dividend=info.annual;}));
    saveLocal(); if(currentUser) pushToSupabase(); R();
  }catch(e){}
}

function _setPaliers(poche,tk,o){D.prefs=D.prefs||{};D.prefs.paliers=D.prefs.paliers||{};
  const cle=_pkPal(poche,tk);
  const garde=o&&o.rows&&o.rows.some(r=>r&&(Number(r.px)>0||Number(r.q)>0));
  if(garde)D.prefs.paliers[cle]=o;else delete D.prefs.paliers[cle];}
// Le palier suivant à atteindre = le plus bas au-dessus du cours. C'est lui qu'on recopie dans
// cibleHaut : la colonne SQL reste alimentée, donc le cron Supabase et les e-mails Resend
// continuent de fonctionner exactement comme avant, sans aucune modification côté serveur.
// Ces trois helpers prennent une POSITION : elle doit porter son enveloppe (x.poche).
function _palierSuivant(x){const rows=_paliersRows(x.poche,x.ticker);if(!rows.length)return null;
  const hauts=rows.filter(r=>r.px>(x.cours||0)).sort((a,b)=>a.px-b.px);
  return hauts.length?hauts[0]:null;}
function _paliersAtteints(x){return _paliersRows(x.poche,x.ticker).filter(r=>(x.cours||0)>=r.px).sort((a,b)=>b.px-a.px);}
// SENS UNIQUE : le plan de l'enveloppe alimente le cibleHaut de CETTE position, et rien d'autre.
// Aucune lecture de position ne remonte vers prefs.paliers — c'est ce retour qui rendait
// l'objectif indéboulonnable.
function _syncCibleHaut(){
  if(!D||!D.poches)return;
  D.prefs=D.prefs||{};D.prefs.palierSync=D.prefs.palierSync||{};
  Object.entries(D.poches).forEach(([poche,p])=>p.positions.forEach(x=>{
    const cle=_pkPal(poche,x.ticker);
    const rows=_paliersRows(poche,x.ticker);   // ← le plan de CETTE enveloppe seulement
    const pose=D.prefs.palierSync[cle];
    if(!rows.length){
      // Plan vidé : on retire la cible que la synchronisation avait posée, et elle seule.
      if(pose!=null&&x.cibleHaut===pose)delete x.cibleHaut;
      delete D.prefs.palierSync[cle];
      return;
    }
    const hauts=rows.filter(r=>r.px>(x.cours||0)).sort((a,b)=>a.px-b.px);
    // Plus de palier au-dessus du cours : on garde le plus haut, pour ne pas effacer une alerte.
    const px=hauts.length?hauts[0].px:Math.max(...rows.map(r=>r.px));
    if(px>0){x.cibleHaut=px;D.prefs.palierSync[cle]=px;}
  }));
}
// _migrerPaliers() a été supprimée : elle reconstruisait un palier depuis n'importe quel
// cibleHaut à CHAQUE cycle de rafraîchissement, ce qui ressuscitait indéfiniment les objectifs
// supprimés. Sa conversion est devenue une migration jouée UNE fois : voir _migrerPaliersEnv()
// dans applyPortfolioMigrations().
// Un palier saisi EN ACTIONS ne veut plus dire la même chose si la position a changé depuis.
// On le constate, on ne corrige rien : c'est à l'utilisateur de décider.
// Bandeau d'ouverture : un palier franchi se signale dans l'app comme un message non lu. Il reste
// jusqu'à consultation du détail ou fermeture par la croix — jamais de disparition automatique.
// Marquer un palier « vu » dans une enveloppe ne doit pas le marquer vu dans l'autre.
function _palierCle(x,r){return _pkPal(x.poche,x.ticker)+"@"+r.px;}
function _paliersNouveaux(){
  const vus=(D.prefs&&D.prefs.palierVu)||{};const out=[];

  }));

}

function _palierPhrase(x,r){

// base et qty appartiennent maintenant à la MÊME enveloppe : la comparaison a enfin un sens.
function _palierPerime(x){

// ══ MA BOUSSOLE ══════════════════════════════════════════════════════════════════════════════
// Un seul flux de notes par titre, deux types : « thèse » et « journal ». La thèse ACTUELLE reste
// unique et continue de vivre dans D.prefs.notes[tk] — aucune donnée n'est déplacée, donc aucune
// ne peut être perdue. Le journal (D.prefs.journal[tk]) accueille les notes datées ET les thèses
// archivées, distinguées par leur type (k:"these") et numérotées (v:1,2,3…).
function _theseTxt(tk){const v=(D.prefs&&D.prefs.notes&&D.prefs.notes[tk])||"";return v.trim()?v:"";}
function _theseTs(tk){return (D.prefs&&D.prefs.notesTs&&D.prefs.notesTs[tk])||null;}
function _setTheseTs(tk){D.prefs=D.prefs||{};D.prefs.notesTs=D.prefs.notesTs||{};D.prefs.notesTs[tk]=Date.now();}
// Le numéro suit les thèses DÉJÀ archivées : la thèse vivante n'en a pas. On repart du plus haut
// numéro existant, pour qu'une suppression ne fasse jamais réapparaître un numéro déjà utilisé.
function _theseVersionSuivante(tk){const j=(D.prefs&&D.prefs.journal&&D.prefs.journal[tk])||[];
  let m=0;j.forEach(e=>{if(e&&e.k==="these"&&Number(e.v)>m)m=Number(e.v);});return m+1;}
function _boussoleTickers(){const o={};
  const n=(D.prefs&&D.prefs.notes)||{};Object.keys(n).forEach(tk=>{if(String(n[tk]||"").trim())o[tk]=1;});
  const j=(D.prefs&&D.prefs.journal)||{};Object.keys(j).forEach(tk=>{if((j[tk]||[]).length)o[tk]=1;});
  return Object.keys(o);}
function _boussoleFlux(tk){const out=[];
  const th=_theseTxt(tk);
  if(th)out.push({tk:tk,type:"these",actuelle:true,t:th,d:_theseTs(tk)});
  const j=(D.prefs&&D.prefs.journal&&D.prefs.journal[tk])||[];
  j.forEach((e,i)=>{if(!e)return;out.push({tk:tk,type:(e.k==="these"?"these":"note"),t:e.t,d:e.d,v:e.v||null,i:i});});
  return out;}
function _boussoleCompte(tk){return _boussoleFlux(tk).length;}
// Nom lisible d'un ticker, qu'il soit détenu, suivi, ou ni l'un ni l'autre.
function _tkNom(tk){const q=(ga().ap||[]).find(y=>y.ticker===tk);if(q)return _nomAffiche(q,28);
  const w=((D.prefs&&D.prefs.watchlist)||[]).find(y=>y.ticker===tk);if(w&&w.name)return w.name.length>28?w.name.slice(0,27)+"…":w.name;
  if(_achatCtx&&_achatCtx.tk===tk&&_achatCtx.name)return _achatCtx.name.length>28?_achatCtx.name.slice(0,27)+"…":_achatCtx.name;
  const a=(_achatToutes(tk).find(z=>z.o&&z.o.name)||{}).o;if(a&&a.name)return a.name.length>28?a.name.slice(0,27)+"…":a.name;
  return tk;}
// ═══ THÈMES — regrouper plusieurs titres sous une même conviction ═══════════
// Deux niveaux volontairement séparés :
//   la THÈSE ACTION (prefs.notes[ticker]) dit pourquoi on détient CE titre — inchangée ici ;
//   la THÈSE DU THÈME dit la grande idée qui réunit plusieurs titres.
// Le lien entre les deux est une ÉTIQUETTE, pas un dossier : le titre reste unique et n'est
// jamais recopié. C'est le thème qui porte la liste des tickers qu'il étiquette.
//
// Forme stockée dans prefs.themes :
//   [{ id:"th…", nom:"Eau", icone:"💧", these:"…", cree:1786…,
//      liens:[{tk:"VIE", note:"acteur diversifié", vendu:0}] }]
//
// Rien ici n'est jamais régénéré : cette donnée est entièrement saisie par l'utilisateur.
// Aucune migration, aucune synchronisation, aucune écriture automatique — c'est la leçon du
// « 500 fantôme », où des paliers indexés par ticker étaient rediffusés à chaque démarrage.
// Ici la clé est l'identifiant du thème, jamais un ticker : rien ne peut être « re-déduit »
// depuis le portefeuille.
function _themes(){if(!D)return [];D.prefs=D.prefs||{};if(!Array.isArray(D.prefs.themes))D.prefs.themes=[];return D.prefs.themes;}
function _theme(id){return _themes().find(t=>t&&t.id===id)||null;}
function _themeLiens(t){if(!t)return [];if(!Array.isArray(t.liens))t.liens=[];return t.liens;}
function _themeLien(t,tk){return _themeLiens(t).find(l=>l&&l.tk===tk)||null;}
// Identifiant stable : posé une fois à la création, jamais recalculé. C'est lui qui garantit
// qu'une couleur ou une référence reste la même dans le temps, même si le nom change.
function _themeNouvelId(){const pris=new Set(_themes().map(t=>t&&t.id));let n=0,id;
  do{id="th"+Date.now().toString(36)+(n?"_"+n:"");n++;}while(pris.has(id));
  return id;}
// Même principe de pastille déterministe que les listes de suivi : la couleur découle de
// l'identifiant, donc elle ne bouge pas quand on renomme ou qu'on réordonne.
function _themeCouleur(t){if(!t)return WL_PAL[0];if(t.color)return t.color;
  const txt=String(t.id||t.nom||"");let h=0;
  for(let i=0;i<txt.length;i++)h=(h*31+txt.charCodeAt(i))>>>0;
  return WL_PAL[h%WL_PAL.length];}

// ── Créer, modifier, supprimer un thème ──────────────────────────────────────
function _themeCreer(nom,these,icone){const n=String(nom||"").trim();if(!n)return null;
  const t={id:_themeNouvelId(),nom:n,icone:String(icone||"").trim(),these:String(these||""),liens:[],cree:Date.now()};
  _themes().push(t);save();return t;}
function _themeMaj(id,champs){const t=_theme(id);if(!t||!champs)return null;
  if(champs.nom!=null){const n=String(champs.nom).trim();if(n)t.nom=n;}
  if(champs.these!=null)t.these=String(champs.these);
  if(champs.icone!=null)t.icone=String(champs.icone).trim();

// Supprimer un thème n'emporte QUE le thème et ses étiquettes. Les thèses action des titres
// concernés vivent dans prefs.notes et n'y sont pas touchées.
function _themeSupprimer(id){const L=_themes();const i=L.findIndex(t=>t&&t.id===id);

// ── Étiqueter, retirer l'étiquette, annoter ──────────────────────────────────
// Rattacher n'ajoute PAS le titre au thème : ça ajoute le thème au titre. Le même ticker
// peut donc figurer dans plusieurs thèmes sans exister en double nulle part.
function _themeRattacher(id,tk,note){const t=_theme(id);const k=String(tk||"").trim().toUpperCase();
  if(!t||!k)return null;
  let l=_themeLien(t,k);
  if(!l){l={tk:k,note:String(note||"")};_themeLiens(t).push(l);}
  else if(note!=null)l.note=String(note);
  save();return l;}
function _themeDetacher(id,tk){const t=_theme(id);if(!t)return false;
  const L=_themeLiens(t);const i=L.findIndex(l=>l&&l.tk===tk);
  if(i<0)return false;L.splice(i,1);save();return true;}
// La note de rattachement est facultative de bout en bout : la vider est une opération
// normale, pas une suppression du lien.
function _themeNote(id,tk,note){const t=_theme(id);const l=t?_themeLien(t,tk):null;
  if(!l)return null;l.note=String(note||"");save();return l;}

// ── Lectures ─────────────────────────────────────────────────────────────────
function _themeTickers(id){const t=_theme(id);return _themeLiens(t).map(l=>l.tk);}
function _themesDuTitre(tk){const k=String(tk||"").toUpperCase();

// Les titres détenus qu'aucun thème n'étiquette encore.
function _titresSansTheme(){const dedans=new Set();
  _themes().forEach(t=>_themeLiens(t).forEach(l=>{if(l&&l.tk)dedans.add(l.tk);}));

    if(!dedans.has(p.ticker))out.push(p.ticker);});
  return out;}

// ── Poids et conviction ──────────────────────────────────────────────────────
// Le poids d'un titre est celui de la fiche : sa valorisation cumulée sur TOUTES ses
// enveloppes, rapportée au total boursier. Un même outil doit donner le même chiffre partout.
function _poidsTicker(tk){const L=_bPos();if(!L.length)return 0;
  const tot=L.reduce((a,r)=>a+r.v,0);if(!(tot>0))return 0;
  const v=L.filter(r=>r.x&&r.x.ticker===tk).reduce((a,r)=>a+r.v,0);
  return v/tot*100;}
// Un lien marqué vendu, ou un titre qu'on ne détient plus, ne pèse rien : il reste visible
// en historique mais ne gonfle ni le poids ni la conviction du thème.
function _themeLienActif(l){return !!(l&&l.tk&&!l.vendu&&_tkDetenu(l.tk));}
function _themeStats(id){const t=_theme(id);
  const vide={nb:0,nbActifs:0,nbHisto:0,poids:0,conv:null,tickers:[],actifs:[],histo:[]};
  if(!t)return vide;
  const liens=_themeLiens(t);
  const actifs=liens.filter(_themeLienActif).map(l=>l.tk);
  const histo=liens.filter(l=>l&&l.tk&&!_themeLienActif(l)).map(l=>l.tk);
  const poids=actifs.reduce((a,tk)=>a+_poidsTicker(tk),0);
  const cv=(D.prefs&&D.prefs.conv)||{};
  const notes=actifs.map(tk=>cv[tk]).filter(v=>typeof v==="number"&&v>0);
  return {nb:liens.length,nbActifs:actifs.length,nbHisto:histo.length,
    poids:poids,
    conv:notes.length?(notes.reduce((a,v)=>a+v,0)/notes.length):null,
    tickers:liens.map(l=>l.tk),actifs:actifs,histo:histo};}
// Un titre présent dans plusieurs thèmes compte EN ENTIER dans chacun : on ne répartit pas
// une conviction. La somme des poids peut donc dépasser 100 %, et c'est voulu — ces deux
// mesures permettent de le dire à l'écran plutôt que de laisser croire à une erreur.

function _themeNorm(t){try{return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}catch(e){return String(t||"").toLowerCase();}}

// Écrit en pur DOM (innerHTML d'un sous-bloc) à chaque frappe, jamais R() : le clavier ne

function _themeUnivers(exclude){

  (ga().ap||[]).filter(x=>!x.noPerf).sort((a,b)=>(b.valeur||0)-(a.valeur||0)).forEach(x=>{
    if(vus.has(x.ticker)||ex.has(x.ticker))return;vus.add(x.ticker);out.push({tk:x.ticker,nom:_nomAffiche(x,30),detenu:true});});
  ((D.prefs&&D.prefs.watchlist)||[]).forEach(w=>{if(!w.ticker||vus.has(w.ticker)||ex.has(w.ticker))return;vus.add(w.ticker);out.push({tk:w.ticker,nom:w.name||w.ticker,detenu:false});});
  return out;}
function _themeRattacherHtml(mode){

window._themeAjouterLibre=(mode)=>{const el=document.getElementById("thLibre");const tk=((el&&el.value)||"").trim().toUpperCase();if(!tk)return;_themePicker(mode,tk);if(el)el.value="";};

  if(!cur){D.prefs=D.prefs||{};D.prefs.boussoleVu=1;}

// Le seul moment où l'utilisateur peut perdre du texte : on le lui demande explicitement, et on

  sm(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px"><h3 style="font-size:16px;font-weight:700">Ton ancienne thèse</h3><button onclick="_bsAnnuler()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1">✕</button></div>`

   +`<div onclick="_bsTheseRanger()" style="display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--sep);cursor:pointer"><div style="flex:1"><div style="font-size:13px;color:var(--txt)">La ranger dans le journal</div><div style="font-size:10.5px;color:var(--mut);margin-top:2px">Elle y sera datée et marquée « Thèse v${_theseVersionSuivante(tk)} ». Tu la gardes.</div></div><span style="color:var(--mut);font-size:14px">›</span></div>`
   +`<div onclick="_bsTheseRemplacer()" style="display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--sep);cursor:pointer"><div style="flex:1"><div style="font-size:13px;color:var(--txt)">La supprimer</div><div style="font-size:10.5px;color:var(--mut);margin-top:2px">L'ancienne disparaît définitivement.</div></div><span style="color:var(--mut);font-size:14px">›</span></div>`);}

window._bsDelNote=(tk,i)=>{const j=D.prefs&&D.prefs.journal&&D.prefs.journal[tk];if(!j||!j[i])return;

// ══ MA THÈSE — étape 1 du chantier titre, bâtie sur le socle (_soclePage) ══════════════════════
// Aucune logique de données réécrite : lecture (_theseTxt/_theseTs/_theseVersionSuivante) et
// écriture (_bsTheseSave, le choix remplacer/ranger via _bsTheseQuestion) sont les mêmes

       +`</div>`:"")
    :`<div style="text-align:center;padding:24px 10px;color:var(--mut)"><div style="font-size:26px;margin-bottom:10px">🧭</div><div style="font-size:13.5px;line-height:1.6">Pourquoi tu détiens ce titre ?<br>Écris-le maintenant — tu le reliras quand ça baissera.</div></div>`;
  const ecriture=`<textarea id="bsTxt" rows="7" placeholder="Ex : leader sur un marché qui double tous les 3 ans, je garde tant que…" style="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:10px;color:var(--txt);font-family:inherit;font-size:14px;resize:vertical">${esc(cur)}</textarea>`;

// ══ MES NOTES — étape 2 du chantier titre, sur le même patron que Ma thèse ═════════════════════
// Même flux que Ma boussole (_boussoleFlux, filtré type==="note"), même écriture (_bsNoteSave),
// même suppression (_bsDelNote) — rien de réécrit. Le geste principal du socle sert à AJOUTER une
// note (on empile, on ne réécrit jamais une note passée) ; la suppression, ponctuelle et déjà sans

// ce qu'on vient de voir).

// ══ MES THÈMES — étape 3 du chantier titre : la seule page vraiment nouvelle ═══════════════════
// Lecture via _themesDuTitre (existant, inchangé). Rattachement/détachement via _themeRattacher/
// _themeDetacher (existants, les mêmes que la gestion des thèmes) — rien de réécrit. Pas de

    ?`<div style="text-align:center;padding:20px 10px;color:var(--mut)"><div style="font-size:13.5px;line-height:1.6;margin-bottom:12px">Tu n'as encore créé aucun thème.</div><button class="btn btn-p" onclick="themeNouveau()">+ Créer un thème</button></div>`
    :`<div style="display:flex;flex-direction:column">`+tousLesThemes.map(t=>{
        const on=_themesTitreStage&&_themesTitreStage.has(t.id);
        return `<div data-th-id="${escAttr(t.id)}" onclick="_themeTitreToggle('${escAttr(t.id)}')" style="display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--sep);cursor:pointer"><span class="chk" style="font-size:16px;width:20px;flex-shrink:0">${on?"☑":"☐"}</span><span style="width:8px;height:8px;border-radius:50%;background:${_themeCouleur(t)};flex-shrink:0"></span><div style="flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.icone?esc(t.icone)+" ":""}${esc(t.nom)}</div></div>`;

window._themeTitreToggle=(id)=>{if(!_themesTitreStage)_themesTitreStage=new Set();
  if(_themesTitreStage.has(id))_themesTitreStage.delete(id);else _themesTitreStage.add(id);
  const el=document.querySelector('[data-th-id="'+id+'"] .chk');
  if(el)el.textContent=_themesTitreStage.has(id)?"☑":"☐";};
// Case à cocher multiple (pas un texte, pas un choix unique) : on applique tout au clic sur
// Enregistrer plutôt qu'au tap de chaque case, pour rester cohérent avec le reste du socle — rien
// ne s'écrit avant ce clic explicite. Chaque changement passe par _themeRattacher/_themeDetacher.
window._themesTitreEnregistrer=(tk)=>{
  const avant=new Set(_themesDuTitre(tk).map(t=>t.id));
  const apres=_themesTitreStage||new Set();
  _themes().forEach(t=>{
    const etait=avant.has(t.id),doit=apres.has(t.id);
    if(doit&&!etait)_themeRattacher(t.id,tk,"");
    else if(!doit&&etait)_themeDetacher(t.id,tk);
  });
  _ficheEdit=false;R();};

// ══ MA CONVICTION — SOMMAIRE (CASE 2, étape 4/7) ════════════════════════════════════════════════
// Assemble ce qui existe déjà : le curseur (setConv/v231, inchangé) + 4 aperçus lus via les
// fonctions de lecture existantes (_theseTxt, _boussoleFlux, _horizonOf/_horizonTxt,
// _themesDuTitre). Pas de mode lecture/écriture propre à ce sommaire — chaque ligne ouvre sa page,
// qui gère ça elle-même. Le sommaire se redessine à chaque R() (ex. au retour d'une sous-page) et

  _theseOuverteTk=null;_notesOuverteTk=null;_horizonOuverteTk=null;_themesOuverteTk=null;
  _convictionOuverteTk=tk;R();scrollTo(0,0);};
function convictionSommaireHtml(){
  const tk=_convictionOuverteTk;
  const conv=(D.prefs&&D.prefs.conv&&D.prefs.conv[tk])||0;

// ══ PLAN D'ACHAT ═════════════════════════════════════════════════════════════════════════════
// Même mécanique que les paliers de sortie, côté entrée. Vit dans prefs (colonne JSON) : aucune
// colonne SQL à créer. Deux unités possibles, jamais mélangées : actions, ou montant dans la
// devise de cotation du titre.
// { "ENVELOPPE|TICKER": {...} }  —  enveloppe vide ("|TICKER") = plan sur un titre non détenu.
function _achat(poche,tk){return (D.prefs&&D.prefs.achat&&D.prefs.achat[_pkPal(poche,tk)])||null;}
function _achatRows(poche,tk){const o=_achat(poche,tk);return (o&&Array.isArray(o.rows))?o.rows.filter(r=>r&&r.px>0):[];}
function _setAchat(poche,tk,o){D.prefs=D.prefs||{};D.prefs.achat=D.prefs.achat||{};
  const cle=_pkPal(poche,tk);
  const garde=o&&o.rows&&o.rows.some(r=>r&&(Number(r.px)>0||Number(r.q)>0));
  if(garde)D.prefs.achat[cle]=o;else delete D.prefs.achat[cle];}
// Découpe une clé de plan en {poche, tk}. La première barre sépare : un ticker n'en contient pas.
function _achatCleSplit(cle){const i=String(cle).indexOf("|");
  return (i<0)?{poche:"",tk:String(cle)}:{poche:cle.slice(0,i),tk:cle.slice(i+1)};}
// Tous les plans d'un même titre, toutes enveloppes confondues. Sert aux replis d'affichage
// (nom, devise, dernier cours) qui n'ont pas d'enveloppe sous la main.
function _achatToutes(tk){const out=[];const m=(D.prefs&&D.prefs.achat)||{};
  Object.keys(m).forEach(cle=>{const d=_achatCleSplit(cle);if(d.tk===tk)out.push({poche:d.poche,tk:d.tk,o:m[cle]});});
  return out;}
// Un titre peut être détenu, seulement suivi, ou ni l'un ni l'autre : on cherche son cours et sa
// devise dans cet ordre, et on ne renvoie rien plutôt que d'inventer.
function _tkCours(tk){const q=(ga().ap||[]).find(y=>y.ticker===tk);if(q&&q.cours!=null)return q.cours;
  const w=((D.prefs&&D.prefs.watchlist)||[]).find(y=>y.ticker===tk);if(w&&w.lastCours!=null)return w.lastCours;
  if(_achatCtx&&_achatCtx.tk===tk&&_achatCtx.cours!=null)return _achatCtx.cours;
  const a=(_achatToutes(tk).find(z=>z.o&&z.o.lastCours!=null)||{}).o;if(a&&a.lastCours!=null)return a.lastCours;
  return null;}
function _tkCur(tk){const q=(ga().ap||[]).find(y=>y.ticker===tk);if(q)return curOf(q);
  const w=((D.prefs&&D.prefs.watchlist)||[]).find(y=>y.ticker===tk);if(w&&w.cur)return w.cur;
  if(_achatCtx&&_achatCtx.tk===tk&&_achatCtx.cur)return _achatCtx.cur;
  const a=(_achatToutes(tk).find(z=>z.o&&z.o.cur)||{}).o;if(a&&a.cur)return a.cur;
  return "EUR";}
// On achète en descendant : le premier seuil franchi est le plus HAUT sous le cours actuel.
function _achatSuivant(poche,tk){const rows=_achatRows(poche,tk);if(!rows.length)return null;const c=_tkCours(tk);
  if(c==null)return rows.slice().sort((a,b)=>b.px-a.px)[0];
  const bas=rows.filter(r=>r.px<c).sort((a,b)=>b.px-a.px);
  return bas.length?bas[0]:null;}
function _achatAtteints(poche,tk){const c=_tkCours(tk);if(c==null)return [];
  return _achatRows(poche,tk).filter(r=>c<=r.px).sort((a,b)=>a.px-b.px);}
// Le plan alimente le seuil BAS existant (position.cible / watchlist.target), donc les alertes
// déjà en place continuent de fonctionner sans rien changer ailleurs. On note ce qu'on a écrit
// (achatSync) : si la valeur a été changée à la main depuis, on n'y touche plus et on le dit.
// SENS UNIQUE, et cloisonné : le plan d'une enveloppe alimente le seuil bas de CETTE position.
// La liste de suivi, elle, reste par ticker : elle est alimentée par le plan SANS enveloppe.
function _syncCibleAchat(){
  if(!D)return;D.prefs=D.prefs||{};D.prefs.achatSync=D.prefs.achatSync||{};
  const mk=(poche,tk)=>{const rows=_achatRows(poche,tk);if(!rows.length)return null;
    const n=_achatSuivant(poche,tk);return n?n.px:Math.min.apply(null,rows.map(r=>r.px));};
  if(D.poches)Object.entries(D.poches).forEach(([poche,p])=>p.positions.forEach(x=>{
    const cle=_pkPal(poche,x.ticker);
    const px=mk(poche,x.ticker);const m=D.prefs.achatSync[cle];
    if(!(px>0)){if(m!=null&&x.cible===m)delete x.cible;delete D.prefs.achatSync[cle];return;}
    if(x.cible==null||x.cible===m){x.cible=px;D.prefs.achatSync[cle]=px;}
  }));
  ((D.prefs&&D.prefs.watchlist)||[]).forEach(w=>{
    const px=mk("",w.ticker);const k="wl:"+w.ticker,m=D.prefs.achatSync[k];
    if(!(px>0)){if(m!=null&&w.target===m)delete w.target;delete D.prefs.achatSync[k];return;}
    if(w.target==null||w.target===m){w.target=px;D.prefs.achatSync[k]=px;}
  });
}
// Le seuil bas a-t-il été fixé à la main, différent du plan ? On le constate, on ne corrige rien.
function _achatDivergence(poche,tk){const rows=_achatRows(poche,tk);if(!rows.length)return null;
  const px=(_achatSuivant(poche,tk)||{}).px||Math.min.apply(null,rows.map(r=>r.px));
  const q=poche?(ga().ap||[]).find(y=>y.ticker===tk&&y.poche===poche):null;
  const w=poche?null:((D.prefs&&D.prefs.watchlist)||[]).find(y=>y.ticker===tk);
  const seuil=q?q.cible:(w?w.target:null);
  if(seuil==null||!(px>0))return null;
  return (Math.abs(seuil-px)<0.0001)?null:{seuil:seuil,plan:px};}
function _achatCle(poche,tk,r){return "A:"+_pkPal(poche,tk)+"@"+r.px;}
function _achatNouveaux(){const vus=(D.prefs&&D.prefs.achatVu)||{};const out=[];
  Object.keys((D.prefs&&D.prefs.achat)||{}).forEach(cle=>{const d=_achatCleSplit(cle);
    _achatAtteints(d.poche,d.tk).forEach(r=>{if(!vus[_achatCle(d.poche,d.tk,r)])out.push({poche:d.poche,tk:d.tk,r:r});});});
  return out;}
window._achatVoir=()=>{const n=_achatNouveaux();D.prefs=D.prefs||{};D.prefs.achatVu=D.prefs.achatVu||{};
  n.forEach(o=>{D.prefs.achatVu[_achatCle(o.poche,o.tk,o.r)]=Date.now();});
  save();gt("alerts");alertsSub="cibles";R();};
window._achatMasquer=()=>{const n=_achatNouveaux();D.prefs=D.prefs||{};D.prefs.achatVu=D.prefs.achatVu||{};
  n.forEach(o=>{D.prefs.achatVu[_achatCle(o.poche,o.tk,o.r)]=Date.now();});save();R();};
function _achatBandeau(){const n=_achatNouveaux();if(!n.length)return "";
  const t=n.length===1
    ? `${esc(n[0].tk)} est descendu à ${vg(n[0].r.px,2)} ${esc(curSym(_tkCur(n[0].tk)))}`
    : `${n.length} paliers d'achat atteints`;
  return `<div class="card" style="display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:10px;border-left:3px solid var(--dim)"><div onclick="_achatVoir()" style="flex:1;cursor:pointer"><div style="font-size:12.5px;font-weight:700">${t}</div><div style="font-size:10.5px;color:var(--mut);margin-top:2px">Voir ce que ton plan prévoyait ›</div></div><span onclick="_achatMasquer()" style="color:var(--mut);font-size:15px;cursor:pointer;padding:0 2px">✕</span></div>`;}
function _achatPart(poche,tk,r){const o=_achat(poche,tk);
  return (o&&o.unit==="amount")?`pour ${vg(r.q,0)} ${curSym(_tkCur(tk))}`:`${vg(r.q,0)} actions`;}
function _achatPhrase(poche,tk,r){
  return `${esc(tk)} est descendu à ${vg(r.px,2)} ${esc(curSym(_tkCur(tk)))}${poche?" ("+esc(poche)+")":""} — ton plan prévoyait d'acheter ${_achatPart(poche,tk,r)}.`;}
window.openAchat=(tk,ctx,poche)=>{_navPush();achatTk=tk;achatPoche=poche||"";_achatUnitPend=null;
  _achatCtx=(ctx&&ctx.sym)?{tk:tk,sym:ctx.sym,name:ctx.name||tk,cur:ctx.cur||"EUR",cours:(ctx.cours!=null?ctx.cours:null)}:null;
  convView="achat";R();scrollTo(0,0);};
// Le plan garde de quoi être lu et rafraîchi tout seul, même sans liste ni position.
function _achatIdentite(poche,tk){const o=_achat(poche,tk);if(!o)return;
  const c=_achatCtx;if(c&&c.tk===tk){if(!o.sym)o.sym=c.sym;if(!o.name)o.name=c.name;if(!o.cur)o.cur=c.cur;
    if(o.lastCours==null&&c.cours!=null){o.lastCours=c.cours;o.lastUpd=Date.now();}}
  if(!o.sym){const w=((D.prefs&&D.prefs.watchlist)||[]).find(y=>y.ticker===tk);if(w){o.sym=w.sym;o.name=o.name||w.name;o.cur=o.cur||w.cur;}}
  if(!o.sym){const q=(ga().ap||[]).find(y=>y.ticker===tk);if(q){o.sym=_ySym(q)||tk;o.name=o.name||q.titre;o.cur=o.cur||curOf(q);}}}
function _achatDansSuivi(tk){return ((D.prefs&&D.prefs.watchlist)||[]).some(w=>w.ticker===tk);}
// Le titre n'existe encore nulle part : il faut lui donner une place. On demande APRÈS le
// réglage du plan, pour ne pas couper l'utilisateur au milieu de sa saisie.
window._achatChoisirListe=(tk)=>{
  const lists=(D.prefs&&D.prefs.watchLists)||[];
  const wl=(D.prefs&&D.prefs.watchlist)||[];
  const countFor=(id)=>wl.filter(w=>w.listId===id).length;
  const titreGroupe=(t)=>`<div style="font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:0 2px 8px">${t}</div>`;
  // 1) Les listes existantes : regroupées, chacune avec sa pastille et son compteur.
  const ligneListe=(l,dernier)=>`<div onclick="_achatRangerFin('${escAttr(l.id)}')" style="display:flex;justify-content:space-between;align-items:center;padding:13px 0;${dernier?"":"border-bottom:1px solid var(--sep);"}cursor:pointer"><span style="display:flex;align-items:center;gap:10px;min-width:0"><span style="width:8px;height:8px;border-radius:50%;background:${_wlCouleur(l)};flex-shrink:0"></span><span style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.name)}</span></span><span style="display:flex;align-items:center;gap:8px;flex-shrink:0">${countFor(l.id)?`<span class="mono" style="font-size:10.5px;font-weight:700;color:var(--dim);background:var(--inp);border-radius:99px;padding:2px 9px">${countFor(l.id)}</span>`:""}<span style="color:var(--dim);font-size:14px">›</span></span></div>`;
  const groupeListes=lists.length
    ? titreGroupe("Mes listes de suivi")+`<div class="card" style="padding:2px 14px;margin-bottom:16px">${lists.map((l,i)=>ligneListe(l,i===lists.length-1)).join("")}</div>`
    : "";
  // 2) Ranger sans dossier : neutre, isolé dans sa propre carte.
  const sansDossier=`<div onclick="_achatRangerFin('')" class="card card-tap" style="display:flex;justify-content:space-between;align-items:center;padding:14px;margin-bottom:10px"><span style="display:flex;align-items:center;gap:10px;min-width:0"><span style="width:8px;height:8px;border-radius:50%;background:var(--mut);flex-shrink:0"></span><span style="min-width:0"><span style="font-size:13px;font-weight:700;display:block">Non classées</span><span style="font-size:10.5px;color:var(--mut)">Dans le suivi, sans dossier</span></span></span><span style="color:var(--dim);font-size:14px;flex-shrink:0">›</span></div>`;
  // 3) Créer : une action, pas une liste — encadré pointillé, comme partout ailleurs dans l'app.
  const creer=`<div onclick="_achatNouvelleListe('${escAttr(tk)}')" class="card card-tap" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;margin-bottom:4px;border:1px dashed #6c8cff66;color:var(--acc);font-size:12px;font-weight:700">＋ Créer une nouvelle liste</div>`;
  // 4) Refuser : un opt-out, discret, détaché par un filet.
  const refuser=`<div onclick="_achatSansListe()" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--sep);cursor:pointer;text-align:center"><div style="font-size:12px;color:var(--dim)">Ne pas ranger</div><div style="font-size:10.5px;color:var(--mut);margin-top:2px">Le plan vit seul dans « Plans d'achat »</div></div>`;
  sm(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px"><h3 style="font-size:16px;font-weight:700">Plan enregistré</h3><button onclick="_achatSansListe()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1">✕</button></div>`
   +`<div style="font-size:11.5px;color:var(--mut);line-height:1.55;margin-bottom:14px">Ton plan est enregistré. Tu peux aussi ranger ${esc(tk)} dans une liste de suivi — c'est facultatif.</div>`
   +groupeListes+sansDossier+creer+refuser);};
window._achatSansListe=()=>{cm();save();R();toast("Plan d'achat enregistré");};
window._achatNouvelleListe=(tk)=>{sm(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">Nouvelle liste</h3><button onclick="_achatChoisirListe('${escAttr(tk)}')" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1">✕</button></div><div class="field"><label>Nom</label><input id="acWlName" placeholder="ex: À surveiller" autocomplete="off"></div><button class="btn btn-p" style="width:100%" onclick="_achatNouvelleListeSave()">Créer et ranger</button>`);
  setTimeout(()=>{const e=document.getElementById("acWlName");if(e)e.focus();},60);};
window._achatNouvelleListeSave=()=>{const nm=((document.getElementById("acWlName")||{}).value||"").trim();
  if(!nm)return toast("Donne un nom.");
  D.prefs=D.prefs||{};D.prefs.watchLists=D.prefs.watchLists||[];
  const id="wl"+Date.now().toString(36);D.prefs.watchLists.push({id:id,name:nm,color:_pickWlColor()});
  _achatRangerFin(id);};
window._achatRangerFin=(listId)=>{const tk=achatTk;const c=_achatCtx;
  const sym=(c&&c.sym)?c.sym:tk;
  addWatch(sym,(c&&c.name)||tk,(c&&c.cur)||"EUR",listId||null);
  const w=((D.prefs&&D.prefs.watchlist)||[]).find(x=>x.sym===sym);
  if(w&&c&&c.cours!=null&&w.lastCours==null){w.lastCours=c.cours;w.lastUpd=Date.now();}
  _syncCibleAchat();cm();save();R();toast("Plan enregistré, titre ajouté à ton suivi");};
// _planObj/_planSave vivaient dans une portée imbriquée : remontés ici, au même niveau que
// le reste de la mécanique des paliers, pour être visibles depuis le bouton d'enregistrement.
// La position visée par le plan ouvert : ticker ET enveloppe, jamais le premier venu.
function _planPos(){return (ga().ap||[]).find(y=>y.ticker===convPlanTk&&y.poche===convPlanPoche)||null;}
function _planObj(){const x=_planPos();
  const pend=(_planUnitPend&&_planUnitPend.tk===convPlanTk&&_planUnitPend.poche===convPlanPoche)?_planUnitPend.unit:"pct";
  const o=_paliers(convPlanPoche,convPlanTk)||{unit:pend,base:(x&&x.qty)||0,rows:[]};
  if(!o.rows||!o.rows.length)o.rows=[{q:"",px:""}];
  return o;}
function _planSave(o){const x=_planPos();
  o.rows=(o.rows||[]).filter(r=>Number(r.px)>0||Number(r.q)>0);
  if(o.unit==="qty"&&x&&!o.base)o.base=x.qty||0;
  _setPaliers(convPlanPoche,convPlanTk,o);
  _syncCibleHaut();save();}
function _achatObj(){const pend=(_achatUnitPend&&_achatUnitPend.tk===achatTk&&_achatUnitPend.poche===achatPoche)?_achatUnitPend.unit:"qty";
  const o=_achat(achatPoche,achatTk)||{unit:pend,rows:[]};
  if(!o.rows||!o.rows.length)o.rows=[{q:"",px:""}];
  return o;}
function _achatSave(o){o.rows=(o.rows||[]).filter(r=>Number(r.px)>0||Number(r.q)>0);
  _setAchat(achatPoche,achatTk,o);_syncCibleAchat();save();}
window._achSet=(i,champ,val)=>{const o=_achatObj();o.rows[i]=o.rows[i]||{};
  o.rows[i][champ]=(val===""||val==null)?"":pn(val);_achatFlash=0;_achatSave(o);};
window._achAdd=()=>{const o=_achatLireDOM(_achatObj());o.rows.push({q:"",px:""});_setAchat(achatPoche,achatTk,o);_achatFlash=0;R();};
window._achDel=(i)=>{const o=_achatLireDOM(_achatObj());o.rows.splice(i,1);_achatFlash=0;_achatSave(o);R();};
window._achUnite=(u)=>{const o=_achatLireDOM(_achatObj());o.unit=u;_achatUnitPend={tk:achatTk,poche:achatPoche,unit:u};_achatFlash=0;_achatSave(o);R();};
// On relit les champs affichés plutôt que de se fier au dernier onchange : ce qui est à l'écran
// est exactement ce qui est enregistré.
function _achatLireDOM(o){const rows=[];
  for(let i=0;i<o.rows.length;i++){const q=document.getElementById("acq"+i),px=document.getElementById("acp"+i);
    if(!q&&!px){rows.push(o.rows[i]);continue;}
    rows.push({q:(q&&q.value!=="")?pn(q.value):"",px:(px&&px.value!=="")?pn(px.value):""});}
  if(rows.length)o.rows=rows;return o;}
window._achEnregistrer=()=>{const o=_achatLireDOM(_achatObj());const tk=achatTk;const poche=achatPoche;
  _achatSave(o);_achatIdentite(poche,tk);_achatFlash=Date.now();save();R();
  // Ranger dans une liste ne concerne que les plans SANS enveloppe : un plan rattaché à une

// Le composant de paliers est écrit UNE fois et servi partout : page dédiée, parcours

// qui divergent. L'appelant pose convPlanTk avant d'appeler.
// ── Calculateur de paliers ─────────────────────────────────────────────────
// Un palier a toujours deux faces : un nombre d'actions et un montant. On affiche celle que
// l'utilisateur n'a pas saisie, deduite du prix cible de la ligne.
//   montant / prix = actions   ·   actions x prix = montant   ·   % x position = actions
// Une ligne incomplete ne produit rien : mieux vaut aucun chiffre qu'un zero trompeur.
function _palFaces(unit,q,px,base){
  const p=Number(px)||0,n=Number(q)||0;
  if(!(p>0)||!(n>0))return null;

  if(unit==="pct"){const b=Number(base)||0;if(!(b>0))return null;const a=b*n/100;return {act:a,mnt:a*p};}

// Sous une ligne : court, une seule information, jamais une phrase.
function _palLigneTxt(unit,f,sym,sens){
  if(!f)return "";

  if(unit==="pct")return vg(f.act,2)+" actions · "+fmt2_(f.mnt)+" "+sym;
  return fmt2_(f.mnt)+" "+sym+(sens==="achat"?" à investir":" récupérés");

// Le total ne s'affiche qu'a partir de deux paliers calculables : avec un seul, il repeterait
// la ligne juste au-dessus.
function _palTotalTxt(unit,rows,sym,base){

  (rows||[]).forEach(r=>{const f=_palFaces(unit,r&&r.q,r&&r.px,base);if(f){mnt+=f.mnt;act+=f.act;v++;}});
  return v>=2?("En tout : "+fmt2_(mnt)+" "+sym+" · "+vg(act,2)+" actions"):"";

// Mise a jour a la frappe. On n'ecrit que dans les zones de calcul, via textContent : aucun
// rendu n'est declenche, donc le champ en cours de saisie garde son focus. L'unite, la devise
// et la base sont lues sur l'element de total, pose au rendu : pas de recalcul d'agregat ici.
function _palPeindre(prefQ,prefP,prefCalc,idTotal){
  const t=document.getElementById(idTotal);
  if(!t)return;
  const unit=t.dataset.unit||"", sym=t.dataset.sym||"", sens=t.dataset.sens||"", base=Number(t.dataset.base)||0;
  let mnt=0,act=0,valides=0;
  for(let i=0;;i++){
    const ec=document.getElementById(prefCalc+i);
    if(!ec)break;
    const eq=document.getElementById(prefQ+i),ep=document.getElementById(prefP+i);
    const f=(eq&&ep)?_palFaces(unit,pn(eq.value),pn(ep.value),base):null;

    if(f){mnt+=f.mnt;act+=f.act;valides++;}

// une seule liste d'identifiants, qui ne peut pas diverger.
//
// Correspondance des périodes (mesurée le 19/08 sur l'API gratuite) :
//   1J → days=1   (points de 5 min)      1S → days=7   (1 h)
//   1M → days=30  (1 h)                  3M → days=90  (1 h)
//   1A → days=365 (1 jour)               5A → days=365 également : au-delà, l'API gratuite

const CG_JOURS={"1d":1,"5d":7,"1mo":30,"3mo":90,"1y":365,"5y":365};
const CG_PLAFOND_JOURS=365;
async function _cryptoBars(sym,per){
  const id=(typeof CG!=="undefined")?CG[sym]:null;
  if(!id)return null;
  const jours=CG_JOURS[per]||30;
  const dev=String(aCur||"usd").toLowerCase();
  // Même cache que le reste des graphiques : l'API gratuite de CoinGecko limite le débit,
  // et le rafraîchissement intraday de 120 s taperait sinon à chaque battement.
  const cle="cvCG1:"+id+":"+dev+":"+jours;
  const ttl=(per==="1d"||per==="5d")?60e3:900e3;

    const r=await fetchT(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(id)}/market_chart?vs_currency=${encodeURIComponent(dev)}&days=${jours}`,{},12000);
    const j=await r.json();

    if(!px||!px.length)return null;
    // market_chart ne donne que des prix, pas de vraies bougies : o/h/l valent donc le prix
    // relevé à cet instant. C'est la seule valeur connue pour ce point — on ne fabrique
    // aucune amplitude. En mode Ligne (celui par défaut) l'affichage est exact.
    const bars=px.map(p=>{const v=Number(p[1]);return {t:Math.round(Number(p[0])/1000),o:v,h:v,l:v,c:v};})

}

function _chunkText(t,max){const parts=String(t).split(/([.!?]\s+)/);const out=[];let cur="";for(let i=0;i<parts.length;i++){const p=parts[i];if(cur.length+p.length>max&&cur){out.push(cur);cur="";}if(p.length>max){for(let k=0;k<p.length;k+=max)out.push(p.slice(k,k+max));}else cur+=p;}if(cur.trim())out.push(cur);return out.filter(s=>s.trim());}

async function _trMM(t,to){const r=await fetchT(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${encodeURIComponent("en|"+to)}`,null,15000);if(!r.ok)return null;const j=await r.json();const x=j&&j.responseData&&j.responseData.translatedText;return (x&&Number(j.responseStatus)===200)?x:null;}

// l'heure seule y serait illisible, d'où le seuil sur l'étendue et non sur la seule présence

function _etiqAxe(d,etendueSec,hasIntraday){

  if(!uneSeance)return d.getDate()+"/"+(d.getMonth()+1);

const QUAL_GRADES=[[90,"A+"],[80,"A"],[65,"B"],[50,"C"],[0,"D"]];

const QUAL_REND=["Utilities","Energy","Real Estate","Basic Materials"];

// Croissance assouplie : la stabilité n'est pas un échec ; le 0 est réservé au vrai déclin.
function _croisScore(g){if(g==null||!isFinite(g))return null;const p=g*100;if(p>20)return 100;if(p>=10)return 75;if(p>=5)return 60;if(p>=2)return 50;if(p>=-2)return 40;if(p>=-5)return 20;return 0;}

function _palHi(v,a,b,c,d){if(v==null||!isFinite(v))return null;if(v<a)return 0;if(v<b)return 25;if(v<c)return 50;if(v<d)return 75;return 100;}

function qualityScore(f){
  if(!f||f.error)return{status:"na"};

  // Régime capital-intensif / rendement : secteurs d'office, + Industrials/Communication Services SI dividende > 2 %
  // (Schneider, telecoms → oui ; Rocket Lab, Google → non).
  const isRend=!isFin&&(QUAL_REND.some(s=>sec.indexOf(s)>=0)||(QUAL_REND_DIV.some(s=>sec.indexOf(s)>=0)&&f.divY!=null&&f.divY>0.02));
  // Rentabilité — garde-fou marge nette artificielle (bénéfice exceptionnel)
  let mN=f.mNette;const artif=(mN!=null&&f.mOp!=null&&(mN-f.mOp)>0.10);if(artif)mN=null;
  const rent=[_palHi(f.roe,0,0.10,0.15,0.25),(mN!=null?_palHi(mN,0,0.05,0.10,0.20):null),_palHi(f.mOp,0,0.08,0.15,0.25)];
  // Solidité — « peux-tu rembourser » : dette nette / EBITDA (repli dette nette / FCF). Ignorée pour les financières.
  let solid=null;
  if(!isFin){
    const netCash=(f.cash!=null&&f.debt!=null)?(f.cash-f.debt):null;
    let ds=null;
    if(netCash!=null){
      if(netCash>=0){ds=100;} // trésorerie nette positive
      else{const nd=-netCash;
        if(f.ebitda!=null&&f.ebitda>0){const r=nd/f.ebitda;
          ds=isRend?(r<2?100:r<3?75:r<4?50:r<5?25:0):(r<1?100:r<2?75:r<3?50:r<4?25:0); // capital-intensif = +1 cran de tolérance
        }else if(f.fcf!=null&&f.fcf>0){const r=nd/f.fcf;

        }else{ds=0;} // dette nette mais ni EBITDA ni FCF positif
      }
    }

    solid=[_palLo(f.debtEq,25,50,100,200),ds,fcfScore];

  // Croissance assouplie
  const crois=[_croisScore(f.revG),_croisScore(f.epsG)];
  // Valorisation
  const fcfY=(f.fcf!=null&&f.cap>0)?(f.fcf<0?0:_palHi(f.fcf/f.cap,0.01,0.03,0.05,0.08)):null;
  const per=(f.per!=null&&f.per>0)?_palLo(f.per,12,20,30,50):null;
  const pb=(f.pb!=null&&f.pb>0)?_palLo(f.pb,1.5,3,5,10):null;
  const valo=[fcfY,per,pb];

  const score=Math.round(pills.reduce((a,p)=>a+p[0]*p[1],0)/wsum);

// ── La cotation est-elle vraiment la donnée la plus fraîche dont on dispose ? ──
// L'ancienne garde comparait Date.now() à l'heure de la REQUÊTE : une réponse sortie d'un
// cache pouvait contenir un prix vieux d'une heure et passer pour instantanée.
//
// On ne peut pas non plus la remplacer par un simple « moins de 15 minutes », parce que
// l'âge normal d'une cotation dépend entièrement de l'instrument (mesuré le 19/08) :
//   Euronext ~15 min (différé de la source) · Séoul fermé 59 min
//   marché US fermé 689 min · fonds à VL quotidienne 2129 min
// Un seuil absolu rejetterait donc Euronext en permanence et tous les marchés fermés.
//
// La bonne question n'est pas « quel âge a cette cotation » mais « est-elle au moins aussi
// récente que le graphique ? ». Cette comparaison s'étalonne d'elle-même : elle suit le
// différé de chaque place, tolère les marchés fermés, et écarte précisément le cas qui
// posait problème — un relevé capté il y a plusieurs séances pendant que le graphique,
// lui, continue de se rafraîchir toutes les deux minutes.
function _cotationFiable(q,bars){
  // On juge la FRAÎCHEUR du relevé, pas sa complétude : un relevé sans prix mais avec une
  // clôture de veille reste une référence valable, la dernière barre fournissant le prix
  // (comportement acquis en v222). C'est l'appelant qui décide quoi faire d'un px absent.
  if(!q)return false;
  const tq=Number(q.t)||0;
  // Sans horodatage, on ne peut rien garantir : on laisse la main au graphique.
  if(!(tq>0))return false;
  const der=(bars&&bars.length)?Number(bars[bars.length-1].t)||0:0;
  // Une barre couvre un intervalle : la cotation peut la précéder de quelques secondes.
  if(der>0)return tq>=der-60;
  // Aucune barre pour se comparer : garde absolue, large mais qui écarte les vieux relevés.
  return (Date.now()/1000-tq)<4*86400;
}

   +ch("simObj","Objectif",v.obj,"150000","€")
   +ch("simTx","Rendement annuel estimé",v.tx,"6","%")
   +ch("simVers","Versement mensuel",v.vers,"300","€")
   +ch("simAns","Horizon souhaité — optionnel",v.ans,"10","ans")
   +`<div id="simRes">${_simuResHtml()}</div>`
   +`<div style="font-size:10px;color:var(--mut);line-height:1.5;margin-top:14px">Projection à rendement constant. La réalité ne l'est jamais : c'est un ordre de grandeur, pas une prévision.</div></div>`;
}
function _simuResHtml(){
  const d=ga();const p0=Math.round(d.tN||0);const v=_simu||{};
  const obj=pn(v.obj),tx=pn(v.tx),vers=pn(v.vers),ans=pn(v.ans);
  let res="";
  if(obj>0){
    const i=(tx||0)/100/12;
    const fv=(n)=>i>0?(p0*Math.pow(1+i,n)+vers*((Math.pow(1+i,n)-1)/i)):(p0+vers*n);
    let mois=null;
    if(fv(0)>=obj)mois=0;
    else if(vers>0||i>0){for(let n=1;n<=1200;n++){if(fv(n)>=obj){mois=n;break;}}}
    const phrase=mois===0?`Ton patrimoine actuel dépasse déjà cet objectif.`
      :(mois==null?`Sans versement ni rendement, cet objectif n'est pas atteint.`
      :`Objectif atteint en <b style="color:var(--txt)">${Math.floor(mois/12)} an${Math.floor(mois/12)>1?"s":""}${mois%12?` et ${mois%12} mois`:""}</b>.`);
    res+=`<div style="font-size:12.5px;color:var(--dim);line-height:1.6;padding:12px 0 4px;border-top:1px solid var(--sep)">${phrase}</div>`;
    if(ans>0){
      const N=Math.round(ans*12);
      const need=i>0?((obj-p0*Math.pow(1+i,N))*i/(Math.pow(1+i,N)-1)):((obj-p0)/N);
      res+=`<div style="font-size:12.5px;color:var(--dim);line-height:1.6;padding-top:8px">Pour l'atteindre en ${vg(ans,0)} an${ans>1?"s":""} : <b style="color:var(--txt)">${need<=0?"aucun versement nécessaire":fmt_(Math.ceil(need))+" € par mois"}</b>.</div>`;}
  }
  return res;
}

// Un seul aller-retour par symbole, qui rapporte le cours ET la devise de cotation.
// La devise renvoyée par la source fait autorité : elle prime sur toute déduction par suffixe.
async function _coursEtDevise(sym){
  try{
    // range=1d, et pas davantage : chartPreviousClose est la clôture qui PRÉCÈDE la fenêtre
    // demandée. Sur 5 jours il renvoyait donc la clôture d'il y a cinq séances, et la
    // « variation du jour » de la fiche action se calculait contre elle (NBIS : +46 %
    // affiché pour −0,07 % réel). Le prix, lui, est un champ de meta indépendant de la
    // fenêtre : il reste disponible en 1d, y compris sur les fonds peu liquides.
    const r=await fetchT(`${WORKER_URL}/?chart=${encodeURIComponent(sym)}&range=1d&_t=${Date.now()}`,{},12000);
    const j=await r.json();
    const res=j&&j.chart&&j.chart.result&&j.chart.result[0];
    const meta=res&&res.meta;
    if(!meta)return null;
    return {px:(meta.regularMarketPrice!=null?meta.regularMarketPrice:null),
            cur:meta.currency||null,
            pc:(meta.chartPreviousClose!=null?meta.chartPreviousClose:null),
            // L'heure à laquelle la COTATION a été produite (secondes), à ne pas confondre
            // avec l'heure à laquelle on l'a reçue : entre les deux il y a les caches.
            t:(meta.regularMarketTime!=null?meta.regularMarketTime:null)};
  }catch(e){return null;}
}

    .filter(p=>p.o&&p.o.sym&&!((D.prefs.watchlist||[]).some(w=>w.ticker===p.tk))&&!(ga().ap||[]).some(y=>y.ticker===p.tk));
  const wl=(D.prefs.watchlist||[]).filter(w=>w&&w.sym);

window.gerer=()=>{const pr=D.prefs||{};const fams=_families();const poches=Object.keys(D.poches);const tog=(key,label,icon,defOn)=>{const on=(key in pr)?!!pr[key]:(defOn!==false);return `<div onclick="setSection('${key}',${on?'false':'true'})" style="display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer"><span style="font-size:15px;width:20px;text-align:center">${icon}</span><span style="font-size:14px;flex:1">${label}</span><span style="width:36px;height:21px;border-radius:11px;background:${on?'var(--acc)':'var(--bdr)'};position:relative;flex-shrink:0;transition:background .2s"><span style="position:absolute;top:2px;left:${on?'17px':'2px'};width:17px;height:17px;border-radius:50%;background:#fff;transition:left .2s"></span></span></div>`;};const famRow=(f)=>`<div style="display:flex;align-items:center;gap:9px;padding:8px 0"><span style="width:9px;height:9px;border-radius:50%;background:${_famColor(f.id)}"></span><span style="font-size:14px;flex:1">${esc(f.name)}</span><span onclick="renameFamily('${f.id}')" style="color:var(--acc);font-size:14px;cursor:pointer;padding:2px 6px">✎</span><span onclick="delFamily('${f.id}')" style="color:var(--red);font-size:15px;cursor:pointer;padding:2px 4px">🗑</span></div>`;const envRow=(n)=>{const fam=_famOf(n);return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0"><span style="font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n)}</span><span onclick="movePoche('${escAttr(n)}',-1)" style="color:var(--dim);font-size:14px;cursor:pointer;padding:2px 5px" title="Monter">↑</span><span onclick="movePoche('${escAttr(n)}',1)" style="color:var(--dim);font-size:14px;cursor:pointer;padding:2px 5px" title="Descendre">↓</span>${fams.length?`<select onchange="setPocheFamily('${escAttr(n)}',this.value)" style="background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:6px;color:var(--txt);font-size:12px;max-width:130px">${fams.map(f=>`<option value="${f.id}" ${fam===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>`:''}<span onclick="dEnv('${escAttr(n)}')" style="color:var(--red);font-size:15px;cursor:pointer;padding:2px 4px">🗑</span></div>`;};const sec=(t)=>`<div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px">${t}</div>`;const hr=`<div style="border-top:1px solid var(--bdr);margin:6px 0"></div>`;sm(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h3 style="font-size:18px;font-weight:700">⚙ Gérer</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div>`+sec("Affichage des sections")+tog("showImmo","Immobilier","🏠",true)+tog("showBudget","Budget mensuel","💰",true)+tog("showPocheGoals","Objectifs","🎯",false)+hr+sec("Familles")+(fams.length?fams.map(famRow).join(""):`<div style="font-size:12px;color:var(--mut);padding:4px 0">Aucune famille — tes enveloppes s'affichent en liste simple.</div>`)+`<button class="btn" style="width:100%;font-size:12px;margin-top:6px" onclick="aFamily()">+ Ajouter une famille</button>`+hr+sec("Enveloppes")+(poches.length?poches.map(envRow).join(""):`<div style="font-size:12px;color:var(--mut);padding:4px 0">Aucune enveloppe.</div>`)+`<button class="btn" style="width:100%;font-size:12px;margin-top:6px" onclick="aEnv()">+ Ajouter une enveloppe</button>`+hr+sec("Immobilier")+`<button class="btn" style="width:100%;font-size:12px" onclick="aBien()">+ Ajouter un bien immobilier</button>`+sec("Export")+`<button class="btn" style="width:100%;font-size:13px;background:#e8e9ed;color:#0a0b0f" onclick="exportPDF()">📄 Exporter le portefeuille en PDF</button>`+`<div onclick="showGuide(0)" style="text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--bdr);font-size:12px;color:var(--mut);cursor:pointer">📖 Revoir le guide d'accueil</div>`);};
window.manageFams=gerer;
window.editPocheGoal=(name)=>{const g=(D.prefs&&D.prefs.pocheGoals&&D.prefs.pocheGoals[name])||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:17px;font-weight:700">Objectif \u2014 ${esc(name)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">\u2715</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Montant cible pour cette enveloppe.</p><div class="field"><label>Objectif (\u20ac)</label><input id="pgIn" inputmode="decimal" value="${g}" placeholder="ex: 30000" style="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--txt);font-family:inherit"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-p" style="flex:1" onclick="savePocheGoal('${escAttr(name)}')">Enregistrer</button>${g?`<button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="clearPocheGoal('${escAttr(name)}')">Retirer</button>`:""}</div>`);};
window.savePocheGoal=(name)=>{const v=pn((document.getElementById("pgIn")||{}).value);if(!D.prefs)D.prefs={};if(!D.prefs.pocheGoals)D.prefs.pocheGoals={};if(v>0)D.prefs.pocheGoals[name]=v;else delete D.prefs.pocheGoals[name];cm();save();};
window.clearPocheGoal=(name)=>{if(D.prefs&&D.prefs.pocheGoals)delete D.prefs.pocheGoals[name];cm();save();};
window.editFisc=(name)=>{const cfg=(D.prefs&&D.prefs.fiscCfg&&D.prefs.fiscCfg[name])||{};const def=fiscDefault(name);const f=fiscFor(name);const ss="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt);font-family:inherit";let body;if(def.clock){const dateDef=cfg.date||(D.prefs&&D.prefs[def.clockField])||"";body=`<p style="font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.5">Taux automatique : <b>${def.rate} %</b> avant ${def.clock} ans, <b>${def.afterRate} %</b> après. Renseigne juste la date d'ouverture.</p><div class="field"><label>Date d'ouverture</label><input id="fi_date" type="date" value="${dateDef}" style="${ss}"></div>`;}else{body=`<p style="font-size:11px;color:var(--dim);margin-bottom:12px">Préréglage : <b>${f.label}</b>. Ajuste si besoin.</p><div class="field"><label>Taux d'imposition (%)</label><input id="fi_rate" inputmode="decimal" value="${cfg.rate!=null?cfg.rate:f.effRate}" style="${ss}"></div><div class="field"><label>Appliqué sur</label><select id="fi_base" style="${ss}"><option value="gain" ${f.base!=="valeur"?"selected":""}>la plus-value (gain)</option><option value="valeur" ${f.base==="valeur"?"selected":""}>la valeur de vente</option></select></div><div style="font-size:10px;color:var(--mut);margin-bottom:12px;line-height:1.6">Présets : <span onclick="fiscPreset('pfu')" style="color:var(--acc);cursor:pointer">PFU 30%</span> · <span onclick="fiscPreset('social')" style="color:var(--acc);cursor:pointer">17,2%</span> · <span onclick="fiscPreset('tmp')" style="color:var(--acc);cursor:pointer">Métaux 11,5%</span> · <span onclick="fiscPreset('metalpv')" style="color:var(--acc);cursor:pointer">Métaux PV 36,2%</span></div>`;}sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:17px;font-weight:700">Fiscalité — ${esc(name)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div>${body}<div style="display:flex;gap:8px"><button class="btn btn-p" style="flex:1" onclick="saveFisc('${escAttr(name)}')">Enregistrer</button><button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="resetFisc('${escAttr(name)}')">Défaut</button></div>`);};
window.fiscPreset=(kind)=>{const r=document.getElementById("fi_rate"),b=document.getElementById("fi_base");if(!r||!b)return;if(kind==="pfu"){r.value=30;b.value="gain";}else if(kind==="social"){r.value="17.2";b.value="gain";}else if(kind==="tmp"){r.value="11.5";b.value="valeur";}else if(kind==="metalpv"){r.value="36.2";b.value="gain";}};
window.saveFisc=(name)=>{if(!D.prefs)D.prefs={};if(!D.prefs.fiscCfg)D.prefs.fiscCfg={};const def=fiscDefault(name);if(def.clock){const date=(document.getElementById("fi_date")||{}).value;if(date)D.prefs.fiscCfg[name]={date};else delete D.prefs.fiscCfg[name];}else{const rate=pn((document.getElementById("fi_rate")||{}).value);const base=(document.getElementById("fi_base")||{}).value;D.prefs.fiscCfg[name]={rate,base};}cm();save();};
window.resetFisc=(name)=>{if(D.prefs&&D.prefs.fiscCfg)delete D.prefs.fiscCfg[name];cm();save();};
window.addHistPoint=()=>{const ss="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:9px;color:var(--txt);font-family:inherit";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">Point d'historique passé</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Ajoute la valeur de ton portefeuille à une date passée pour allonger l'historique et débloquer la performance plus tôt.</p><div class="field"><label>Date</label><input id="hp_date" type="date" style="${ss}"></div><div class="field"><label>Valeur totale (€)</label><input id="hp_val" inputmode="decimal" placeholder="ex: 90000" style="${ss}"></div><div class="field"><label>Montant investi à cette date (€) — optionnel</label><input id="hp_inv" inputmode="decimal" placeholder="ex: 80000" style="${ss}"></div><button class="btn btn-p" style="margin-top:6px" onclick="saveHistPoint()">Ajouter</button>`);};
window.saveHistPoint=()=>{const dt=(document.getElementById("hp_date")||{}).value;const v=pn((document.getElementById("hp_val")||{}).value);const invRaw=(document.getElementById("hp_inv")||{}).value;const inv=invRaw?pn(invRaw):v;if(!dt||v<=0)return toast("Indique une date et une valeur.");const t=new Date(dt).getTime();if(H.some(x=>Math.abs(x.t-t)<86400000))return toast("Un point existe déjà à cette date.");H.push({t,v:Math.round(v),inv:Math.round(inv),pl:Math.round(v-inv),h:"00:00",env:{},manual:true});H.sort((a,b)=>a.t-b.t);cm();save();};
window.showNote=(tk)=>{const n=(D.prefs&&D.prefs.notes&&D.prefs.notes[tk])||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3 style="font-size:16px;font-weight:700">✎ ${esc(tk)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="font-size:13px;line-height:1.55;color:var(--txt);white-space:pre-wrap">${esc(n)||'<span style="color:var(--mut)">Aucune note.</span>'}</div>`);};
window.togglePriv=()=>{if(!D.prefs)D.prefs={};D.prefs.privacyMode=!D.prefs.privacyMode;R();save();};
window.setHtf=v=>{htf=v;R()};
// RESTAURATION fb23f43 : setter pour le filtre d'enveloppe sur l'onglet Analyse
window.setAEnv=v=>{aEnvSel=v;R()};
window.refreshPrices=refreshPrices;

init();
setTimeout(checkForUpdate, 4000);
setInterval(checkForUpdate, 300000);
</script>
<script>
(function(){function snap(){var n=document.querySelector('.nav');if(!n)return;n.style.bottom='1px';n.offsetHeight;n.style.bottom='0';}
window.addEventListener('load',function(){[100,400,800].forEach(function(t){setTimeout(snap,t);});});
window.addEventListener('pageshow',function(){setTimeout(snap,120);});
if(window.visualViewport){window.visualViewport.addEventListener('resize',snap);}
function legacyIconCheck(){try{
if(navigator.standalone!==true)return;
if(localStorage.getItem('cvIconFix'))return;
if(!(window.innerHeight>=screen.height-2))return;
if(document.getElementById('iconFixBanner'))return;
var b=document.createElement('div');b.id='iconFixBanner';
b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:var(--card);border-bottom:1px solid #1e2030;padding:max(12px,env(safe-area-inset-top,12px)) 14px 12px;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#e8e9ed;display:flex;gap:10px;align-items:flex-start;box-shadow:0 4px 16px rgba(0,0,0,.4)';
b.innerHTML='<div style="flex:1">\uD83D\uDCF1 <b>Mise \u00e0 jour d\u2019affichage</b> \u2014 pour corriger la barre du bas : supprime l\u2019ic\u00f4ne de l\u2019\u00e9cran d\u2019accueil, ouvre <b>convicto.app</b> dans Safari, puis <b>Partager \u2192 Sur l\u2019\u00e9cran d\u2019accueil</b>.</div><button style="background:none;border:0;color:#9296a8;font-size:16px;padding:2px 4px;flex-shrink:0" aria-label="Fermer">\u2715</button>';
b.querySelector('button').onclick=function(){try{localStorage.setItem('cvIconFix','1');}catch(e){}b.remove();};
document.body.appendChild(b);
}catch(e){}}
window.addEventListener('load',function(){setTimeout(legacyIconCheck,1200);});})();
</script>
