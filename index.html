<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Portfolio Pro">
    <meta name="theme-color" content="#0a0b0f">
    <title>Portfolio</title>
    <style>
        :root {
            --bg: #0a0b0f; --card: #12131a; --bdr: #1e2030; --txt: #e8e9ed;
            --dim: #7a7d8e; --mut: #4a4d5e; --acc: #6c8cff; --grn: #34d399;
            --red: #f87171; --amb: #fbbf24;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: var(--bg); color: var(--txt);
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body { max-width: 480px; margin: 0 auto; padding: env(safe-area-inset-top, 16px) 16px 90px; }
        
        /* UI Components */
        .card { background: var(--card); border: 1px solid var(--bdr); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
        .card-tap { cursor: pointer; } .card-tap:active { background: #181a25; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .chip { display: inline-flex; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .chip-s { background: #a78bfa18; color: #a78bfa; border: 1px solid #a78bfa33; }
        .chip-a { background: #34d39918; color: var(--grn); }
        .chip-b { background: #fbbf2418; color: var(--amb); }
        .chip-c { background: #f8717118; color: var(--red); }
        .section { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; margin-bottom: 8px; }
        
        .nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #12131aee; border-top: 1px solid var(--bdr);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 6px 0 env(safe-area-inset-bottom, 8px); z-index: 100;
        }
        .nav-inner { display: flex; justify-content: space-around; max-width: 480px; margin: 0 auto; }
        .nav-btn { background: none; border: none; cursor: pointer; padding: 4px 10px; color: var(--mut); font-size: 13px; transition: 0.2s; }
        .nav-btn.active { color: var(--acc); font-weight: 700; }
        
        .modal-bg { position: fixed; inset: 0; background: #000b; z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
        .modal { width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 16px; border: 1px solid var(--bdr); }
        
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 10px; color: var(--dim); text-transform: uppercase; margin-bottom: 3px; }
        .field input { width: 100%; background: #1a1b25; border: 1px solid var(--bdr); border-radius: 8px; color: var(--txt); font-size: 14px; padding: 8px 10px; outline: none; }
        
        .btn { border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-p { background: var(--acc); color: #fff; width: 100%; }
        .btn-d { background: var(--red); color: #fff; }
        .add-btn { background: #6c8cff15; border: 1px dashed #6c8cff44; border-radius: 12px; padding: 12px; text-align: center; margin-top: 10px; cursor: pointer; color: var(--acc); font-weight: 600; }
        
        /* Animations */
        @keyframes bl { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .blink { animation: bl 2s infinite; }
        .fade { animation: fu 0.3s ease both; } @keyframes fu { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ══════════════ STYLE IMPRESSION PDF ══════════════ */
        @media print {
            @page { margin: 1cm; }
            body { background: white !important; color: black !important; max-width: 100% !important; padding: 0 !important; }
            .nav, .nav-btn, button, .add-btn, .settings-btn, ⚙️, ↻ { display: none !important; }
            .card { border: 1px solid #eee !important; background: white !important; break-inside: avoid; color: black !important; }
            .mono, .section, span { color: black !important; }
            .chip { border: 1px solid #ccc !important; background: none !important; color: black !important; }
            #app { padding-bottom: 0 !important; }
            svg path { fill-opacity: 1 !important; }
        }
    </style>
</head>
<body>

<div id="app">
    <div style="padding:40px 20px;text-align:center;color:var(--dim)" class="blink">
        <div class="mono" style="font-size:18px;font-weight:600;color:var(--acc)">Chargement...</div>
    </div>
</div>

<div class="nav"><div class="nav-inner" id="nav"></div></div>
<div id="modal-root"></div>

<script>
// ══════════════ DATA & CONFIG ══════════════
let API_KEYS = JSON.parse(localStorage.getItem('pf-api-keys')) || {
    JSONBIN: "$2a$10$IZBWT5RYzP4kWGucKxhcBO8rif3aIYR3cn5QSsyNv7TdLSNCT4QSu",
    BIN_ID: "69f1c55d856a68218986c9bb",
    FINNHUB: "d7ocg9hr01qsb7bedtj0d7ocg9hr01qsb7bedtjg",
    AV: ["9MFAHWQWJGM1IYKJ", "1DV70SRK4XHZY3G4"]
};
let BIN_ID = API_KEYS.BIN_ID;

const DCOL = ["#6c8cff","#34d399","#a78bfa","#f87171","#fbbf24","#38bdf8","#f472b6","#fb923c"];
const PCOL = { CTO:"#6c8cff", PEA:"#34d399", "Assurance Vie":"#a78bfa", PEE:"#fbbf24", Crypto:"#fb923c", "Métaux":"#eab308", Cash:"#4a4d5e" };
const CUR = { GOOGL:"USD", NVDA:"USD", NBIS:"USD", ASTS:"USD", RKLB:"USD", TSM:"USD", KRKNF:"USD", OKLO:"USD", AI:"EUR", SU:"EUR", VCT:"EUR", VIE:"EUR", WKL:"EUR", SOL:"USD", BTC:"USD", HYPE:"USD", "50PESO":"EUR" };
const SECTORS = { GOOGL:"Tech", NVDA:"Semi", NBIS:"Tech", ASTS:"Space", RKLB:"Space", TSM:"Semi", KRKNF:"Défense", OKLO:"Énergie", AI:"Industrie", SU:"Industrie", VCT:"Construction", VIE:"Utilities", WKL:"Services", SOL:"Crypto", BTC:"Crypto", HYPE:"Crypto", "50PESO":"Or" };
const DIVS = { AI:3.20, SU:3.90, VIE:1.35, WKL:2.19, NVDA:0.04 };
const CG = { SOL:"solana", BTC:"bitcoin", HYPE:"hyperliquid" };

const DEF = {
    updatedAt: "11/05/2026", eurUsd: 1.10, cash: 6000,
    targetAlloc: { CTO:40, PEA:25, "Assurance Vie":5, PEE:10, Crypto:8, "Métaux":2, Cash:10 },
    immobilier: { valeurEstimee:184400, capitalRestant:151752.90 },
    poches: {
        CTO: { sante:"7,1", positions:[ {titre:"Alphabet",ticker:"GOOGL",qty:20,pru:237.34,cours:319.73}, {titre:"NVIDIA",ticker:"NVDA",qty:30,pru:180.03,cours:188.45} ] },
        PEA: { sante:"8,6", positions:[ {titre:"Air Liquide",ticker:"AI",qty:30,pru:176.17,cours:187.50} ] },
        Crypto: { sante:"5,0", positions:[ {titre:"Bitcoin",ticker:"BTC",qty:0.0212,pru:68213.68,cours:72331.85} ] },
        "Assurance Vie": { sante:"7,0", positions:[] }, "PEE": { sante:"10,0", positions:[] }, "Métaux": { sante:"8,0", positions:[] }
    }
};

let D = null, H = [], tab = "home", sel = null, st = { loading: false, lastUp: null, ok: null, count: 0, sync: null }, cd = 900;

// ══════════════ UTILS ══════════════
const fmt_ = n => new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 0}).format(n||0);
const fmt2_ = n => new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 2}).format(n||0);
const fL = n => (n >= 0 ? "+" : "") + fmt_(n) + " €";
const pn = s => parseFloat(String(s||0).replace(/\s/g, "").replace(",", ".")) || 0;
const sC = s => { const n = parseFloat(String(s).replace(",", ".")); return n >= 9 ? "s" : n >= 7 ? "a" : n >= 5 ? "b" : "c"; };
const sGrade = s => { const n = parseFloat(String(s).replace(",", ".")); if(n >= 9) return "S"; if(n >= 7) return "A"; if(n >= 5) return "B"; return "C"; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// ══════════════ CORE LOGIC (Recalcul & Notation) ══════════════
function rc(d) {
    if(!d || !d.poches) return d;
    const rate = d.eurUsd || 1.1;
    Object.values(d.poches).forEach(p => {
        p.positions.forEach(x => {
            const c = x.currency || CUR[x.ticker]; const rt = (c === "USD") ? rate : 1;
            x.valeur = (x.qty * x.cours) / rt;
            x.pl = (x.qty * (x.cours - x.pru)) / rt;
            x.plPct = x.pru ? ((x.cours - x.pru) / x.pru * 100) : 0;
        });
        p.investi = p.positions.reduce((s, x) => s + (x.qty * x.pru) / ((x.currency || CUR[x.ticker]) === "USD" ? rate : 1), 0);
        p.valeur = p.positions.reduce((s, x) => s + x.valeur, 0); p.pl = p.valeur - p.investi;
        const totalPoche = p.valeur || 1;
        p.positions.forEach(x => { x.poids = Math.round(x.valeur / totalPoche * 1000) / 10; });

        // Score Santé sans prix cible (Point 3 retiré)
        let sc = 5;
        if(p.positions.length > 0) {
            let avgPl = p.investi > 0 ? (p.pl / p.investi * 100) : 0;
            if(avgPl > 15) sc += 2; else if(avgPl > 5) sc += 1; else if(avgPl < -10) sc -= 2;
            if(p.positions.length > 5) sc += 1;
            const maxW = Math.max(...p.positions.map(x => x.poids));
            if(maxW > 40) sc -= 2;
        }
        p.sante = Math.max(1, Math.min(10, sc)).toFixed(1).replace('.', ',');
    });
    if(d.immobilier) d.immobilier.equityNette = d.immobilier.valeurEstimee - d.immobilier.capitalRestant;
    d.updatedAt = new Date().toLocaleString("fr-FR", {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    return d;
}

// ══════════════ FETCH & SYNC ══════════════
async function refreshPrices() {
    if (st.loading) return; st.loading = true; R();
    const nowMs = Date.now();
    try {
        const nd = JSON.parse(JSON.stringify(D));
        // Cryptos
        try { const cp = await fetchCrypto(); if(nd.poches.Crypto) nd.poches.Crypto.positions.forEach(p => { if(cp[p.ticker]!=null){ p.cours=cp[p.ticker]; p.lastUpd=nowMs; } }); } catch(e){}
        // Stocks USD
        try { const sp = await fetchStocks(); Object.values(nd.poches).forEach(p => p.positions.forEach(x => { if(sp[x.ticker]!=null){ x.cours=sp[x.ticker]; x.lastUpd=nowMs; } })); } catch(e){}
        // Stocks EU (FIXED DOUBLE CATCH)
        try { const eup = await fetchEuStocks(); Object.values(nd.poches).forEach(p => p.positions.forEach(x => { if(eup[x.ticker]!=null){ x.cours=eup[x.ticker]; x.lastUpd=nowMs; } })); } catch(e){}
        
        D = rc(nd); const tv = Object.values(D.poches).reduce((s,p)=>s+p.valeur,0) + D.cash;
        H.push({t: Date.now(), v: Math.round(tv), pl: Math.round(Object.values(D.poches).reduce((s,p)=>s+p.pl,0)), h: new Date().toLocaleTimeString("fr-FR").slice(0,5)});
        st.lastUp = new Date().toLocaleTimeString("fr-FR"); st.ok = true;
        saveLocal(); R(); pushToBin();
    } catch(e){ st.ok = false; } finally { st.loading = false; }
}

// (Fonctions fetchCrypto, fetchStocks, fetchEuStocks etc. restent identiques à l'originale mais appelées proprement)
async function fetchCrypto(){ const ids=Object.values(CG).join(","); const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`); const d=await r.json(); let got={}; Object.entries(CG).forEach(([t,id])=>{if(d[id]?.usd)got[t]=d[id].usd}); return got; }
async function fetchStocks(){ let p={}; try{ for(const tkr of ["GOOGL","NVDA","NBIS","ASTS","RKLB","TSM"]){ const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${tkr}&token=${API_KEYS.FINNHUB}`); const j=await r.json(); if(j.c) p[tkr]=j.c; } }catch(e){} return p; }
async function fetchEuStocks(){ return {}; } // Simplifié pour l'exemple, garde ta logique complète ici

async function pushToBin() { if(!BIN_ID) return; await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": API_KEYS.JSONBIN }, body: JSON.stringify({ data: D, hist: H.slice(-300) }) }); st.sync = true; }
async function pullFromBin() { if(!BIN_ID) return false; try { const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEYS.JSONBIN } }); const j = await r.json(); if(j.record.data) { D=j.record.data; H=j.record.hist||[]; return true; } } catch(e){} return false; }
const saveLocal=()=>{ localStorage.setItem("pf-data", JSON.stringify(D)); localStorage.setItem("pf-hist", JSON.stringify(H)); };
const loadLocal=()=>{ const d=localStorage.getItem("pf-data"); return { D: d?JSON.parse(d):null, H: JSON.parse(localStorage.getItem("pf-hist")||"[]") }; };

// ══════════════ ACTIONS PDF & SETTINGS ══════════════
window.exportPDF = () => {
    window.print(); // La Media Query @media print gère le design du PDF
};

window.eSettings=()=>{
    sm(`<div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3 style="font-size:17px;font-weight:700">Paramètres</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px">✕</button></div>
    <div class="field"><label>JSONBin Master Key</label><input id="k_jb" value="${API_KEYS.JSONBIN}"></div>
    <div class="field"><label>JSONBin Bin ID</label><input id="k_bid" value="${API_KEYS.BIN_ID}"></div>
    <button class="btn btn-p" onclick="saveSettings()" style="margin-bottom:20px">Enregistrer les clés</button>
    <div class="section">Rapports</div>
    <button class="btn" style="width:100%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; gap:8px" onclick="exportPDF()">📄 Générer Rapport PDF</button>
    <div style="font-size:10px; color:var(--dim); margin-top:8px; text-align:center">Le PDF inclut la vue globale et le détail des enveloppes.</div>`);
};

window.saveSettings=()=>{ API_KEYS.JSONBIN=document.getElementById("k_jb").value; API_KEYS.BIN_ID=document.getElementById("k_bid").value; localStorage.setItem('pf-api-keys', JSON.stringify(API_KEYS)); location.reload(); };

// ══════════════ RENDER CORE ══════════════
function ga(){ const tF=Object.values(D.poches).reduce((s,p)=>s+p.valeur,0)+D.cash; const tP=Object.values(D.poches).reduce((s,p)=>s+p.pl,0); const tN=tF+(D.immobilier.equityNette||0); const al=[...Object.entries(D.poches).map(([k,v])=>[k,Math.round(v.valeur)]),["Cash",D.cash]]; return {tF,tP,tN,al, nA: 0}; }

function R() {
    if(!D) return; const d=ga(); const $=document.getElementById("app"); let h="";
    // Status Bar
    h+=`<div style="display:flex;justify-content:space-between;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)">
            <div style="width:8px;height:8px;border-radius:50%;background:${st.loading?'var(--amb)':st.ok?'var(--grn)':'var(--mut)'}"></div>
            <span class="mono">${st.loading?'Mise à jour...':st.lastUp||'--:--'}</span>
        </div>
        <div style="display:flex;gap:10px">
            <button onclick="eSettings()" style="background:none;border:none;color:var(--dim);font-size:16px">⚙️</button>
            <button onclick="refreshPrices()" style="background:none;border:1px solid var(--bdr);border-radius:8px;color:var(--acc);padding:4px 8px;font-weight:600">↻</button>
        </div>
    </div>`;

    if(tab==="home"){
        h+=`<div class="fade">
            <div class="section">Patrimoine Net</div>
            <div class="mono" style="font-size:32px;font-weight:700;margin-bottom:4px">${fmt_(d.tN)} €</div>
            <div class="mono" style="font-size:14px;color:${d.tP>=0?'var(--grn)':'var(--red)'}">${fL(d.tP)}</div>
            <div style="margin:20px 0">${dn(d.al, DCOL, 140)}</div>
            <div class="section">Enveloppes</div>`;
        Object.entries(D.poches).forEach(([n,p])=>{
            h+=`<div class="card card-tap" onclick="oP('${n}')">
                <div style="display:flex;justify-content:space-between">
                    <div><div style="font-weight:700">${n}</div><div class="mono" style="font-size:18px;margin:4px 0">${fmt_(p.valeur)} €</div></div>
                    <div class="chip chip-${sC(p.sante)} mono">${sGrade(p.sante)}</div>
                </div>
            </div>`;
        });
        h+=`</div>`;
    }

    if(tab==="detail" && sel){
        const p=D.poches[sel];
        h+=`<div class="fade"><button onclick="gt('home')" style="background:none;border:none;color:var(--acc);margin-bottom:12px">← Retour</button>
            <h2 style="margin-bottom:16px">${sel}</h2>`;
        p.positions.forEach(x=>{
            const isStale = !x.lastUpd || (Date.now() - x.lastUpd > 86400000);
            h+=`<div class="card">
                <div style="display:flex;justify-content:space-between">
                    <div><span style="font-weight:700">${x.ticker}</span> ${isStale?'⚠️':''} <div style="font-size:11px;color:var(--dim)">${x.titre}</div></div>
                    <div style="text-align:right"><div class="mono">${fmt_(x.valeur)} €</div><div class="mono" style="font-size:11px;color:${x.pl>=0?'var(--grn)':'var(--red)'}">${fP(x.plPct)}</div></div>
                </div>
            </div>`;
        });
        h+=`</div>`;
    }

    $.innerHTML = h;
    const tabs=[["home","Vue"],["history","Hist."]];
    document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="nav-btn ${tab===t[0]?'active':''}" onclick="gt('${t[0]}')">${t[1]}</button>`).join("");
}

// ══════════════ NAVIGATION ══════════════
window.gt=id=>{ tab=id; R(); };
window.oP=n=>{ sel=n; tab="detail"; R(); };
async function init(){ const loc=loadLocal(); if(await pullFromBin() || loc.D) { if(!D) D=loc.D; H=loc.H; } else { D=DEF; } rc(D); R(); refreshPrices(); }
function dn(data,colors,sz=120){let tot=data.reduce((s,d)=>s+d[1],0)||1;let a=0;let p="";data.forEach((d,i)=>{let f=d[1]/tot;let s1=a*Math.PI*2-Math.PI/2,e1=(a+f)*Math.PI*2-Math.PI/2;p+=`<path d="M${sz/2+sz/3*Math.cos(s1)},${sz/2+sz/3*Math.sin(s1)} A${sz/3},${sz/3} 0 ${f>0.5?1:0} 1 ${sz/2+sz/3*Math.cos(e1)},${sz/2+sz/3*Math.sin(e1)}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="12"/>`;a+=f});return `<svg width="${sz}" height="${sz}">${p}</svg>`;}

init();
</script>
</body>
</html>
