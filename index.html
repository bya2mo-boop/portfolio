const fmt_=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(n||0);
const fmt2_=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:2}).format(n||0);
const fP=n=>(n>0?"+":"")+(n||0).toFixed(1)+"%";

const pn=s=>{
  const str=String(s||0).replace(/\s/g,"");
  const lastComma=str.lastIndexOf(",");
  const lastDot=str.lastIndexOf(".");
  let cleaned;
  if(lastComma>-1&&lastDot>-1){
    if(lastComma>lastDot)cleaned=str.replace(/\./g,"").replace(",",".");
    else cleaned=str.replace(/,/g,"");
  }else if(lastComma>-1){
    cleaned=str.replace(",",".");
  }else{
    cleaned=str;
  }
  return parseFloat(cleaned)||0;
};

function scorePos(pos, pocheName){
  const isCrypto = pocheName === "Crypto" || CG[pos.ticker];
  const isFund = pocheName === "Assurance Vie" || pocheName === "PEE";
  let s=5; const crit=[];
  const pl=pos.plPct||0;
  const mult=isCrypto?1.5:isFund?0.7:1.0;
  if(pl>=50*mult){s+=2.5;crit.push({n:"P&L",v:"+2.5",c:"g"})}
  else if(pl>=25*mult){s+=1.5;crit.push({n:"P&L",v:"+1.5",c:"g"})}
  else if(pl>=10*mult){s+=0.8;crit.push({n:"P&L",v:"+0.8",c:"g"})}
  else if(pl>=-5*mult){crit.push({n:"P&L",v:"0",c:"a"})}
  else if(pl>=-15*mult){s-=0.8;crit.push({n:"P&L",v:"-0.8",c:"r"})}
  else if(pl>=-30*mult){s-=1.5;crit.push({n:"P&L",v:"-1.5",c:"r"})}
  else{s-=2.5;crit.push({n:"P&L",v:"-2.5",c:"r"})}
  const w=pos.poids||0;
  if(w>=8&&w<=22){s+=0.5;crit.push({n:"Poids",v:"+0.5",c:"g"})}
  else if((w>=5&&w<8)||(w>22&&w<=30)){crit.push({n:"Poids",v:"0",c:"a"})}
  else if((w>=2&&w<5)||(w>30&&w<=40)){s-=0.5;crit.push({n:"Poids",v:"-0.5",c:"a"})}
  else if(w<2){s-=1;crit.push({n:"Poids",v:"-1.0",c:"r"})}
  else{s-=1.5;crit.push({n:"Poids",v:"-1.5",c:"r"})}
  const div=pos.dividend||DIVS[pos.ticker]||0;
  const yld=pos.cours>0?(div/pos.cours*100):0;
  if(yld>5){s+=1;crit.push({n:"Div",v:"+1.0",c:"g"})}
  else if(yld>3){s+=0.7;crit.push({n:"Div",v:"+0.7",c:"g"})}
  else if(yld>1){s+=0.4;crit.push({n:"Div",v:"+0.4",c:"g"})}
  else if(yld>0){s+=0.2;crit.push({n:"Div",v:"+0.2",c:"a"})}
  if(pos.cours7j&&pos.cours7j>0){
    const delta=(pos.cours-pos.cours7j)/pos.cours7j*100;
    if(delta>10){s+=1;crit.push({n:"7j",v:"+1.0",c:"g"})}
    else if(delta>3){s+=0.5;crit.push({n:"7j",v:"+0.5",c:"g"})}
    else if(delta>-3){crit.push({n:"7j",v:"0",c:"a"})}
    else if(delta>-10){s-=0.5;crit.push({n:"7j",v:"-0.5",c:"r"})}
    else{s-=1;crit.push({n:"7j",v:"-1.0",c:"r"})}
  }
  return {score:Math.max(1,Math.min(10,Math.round(s*10)/10)),crit};
}

function downsampleH(){
  if(H.length<2)return;
  const now=Date.now();
  const D7=7*24*3600*1000;
  const D30=30*24*3600*1000;
  const recent=H.filter(x=>now-x.t<D7);
  const mid=H.filter(x=>now-x.t>=D7&&now-x.t<D30);
  const old=H.filter(x=>now-x.t>=D30);
  const midMap={};
  mid.forEach(x=>{const k=new Date(x.t).toISOString().slice(0,10);midMap[k]=x});
  const oldMap={};
  old.forEach(x=>{const d=new Date(x.t);const wk=`${d.getFullYear()}-W${String(Math.ceil((d-new Date(d.getFullYear(),0,1))/604800000)).padStart(2,"0")}`;oldMap[wk]=x});
  H=[...Object.values(oldMap),...Object.values(midMap),...recent].sort((a,b)=>a.t-b.t);
}

function rc(d){
  if(!d||!d.poches)return d;
  const eurUsd=d.eurUsd||1.1;
  Object.entries(d.poches).forEach(([pocheName,p])=>{
    p.positions.forEach(x=>{
      const cur=x.currency||CUR[x.ticker];
      const rate=(cur==="USD")?eurUsd:1;
      x.valeur=(x.qty*x.cours)/rate;
      x.pl=(x.qty*(x.cours-x.pru))/rate;
      x.plPct=x.pru?((x.cours-x.pru)/x.pru*100):0;
    });
    p.investi=p.positions.reduce((s,x)=>{
      const cur=x.currency||CUR[x.ticker];
      const rate=(cur==="USD")?eurUsd:1;
      return s+(x.qty*x.pru)/rate
    },0);
    p.valeur=p.positions.reduce((s,x)=>s+x.valeur,0);
    p.pl=p.valeur-p.investi;
    const t=p.valeur||1;
    p.positions.forEach(x=>{x.poids=Math.round(x.valeur/t*1000)/10});
    const n=p.positions.length;
    if(n===0){p.sante="5,0";return;}
    let sc=0,wTotal=0;
    p.positions.forEach(x=>{
      const w=(x.poids||0)/100;
      const r=scorePos(x,pocheName);
      x._score=r.score;x._crit=r.crit;
      sc+=r.score*w;wTotal+=w;
    });
    let raw=wTotal>0?sc/wTotal:5;
    if(n>=6)raw+=0.3;else if(n>=4)raw+=0.15;
    const maxPoids=Math.max(...p.positions.map(x=>x.poids));
    if(maxPoids>60)raw-=1;else if(maxPoids>45)raw-=0.5;
    const plPct=p.investi>0?(p.pl/p.investi*100):0;
    if(plPct>20)raw+=0.5;else if(plPct<-15)raw-=0.5;
    p.sante=Math.max(1,Math.min(10,raw)).toFixed(1).replace('.',',');
  });
  if(d.immobilier)d.immobilier.equityNette=d.immobilier.valeurEstimee-d.immobilier.capitalRestant;
  d.updatedAt=new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return d;
}

// ══════════════ SYNC ══════════════
async function createBin(){
  try{
    const r=await fetch("https://api.jsonbin.io/v3/b",{method:"POST",headers:{"Content-Type":"application/json","X-Master-Key":API_KEYS.JSONBIN,"X-Bin-Name":"portfolio","X-Bin-Private":"true"},body:JSON.stringify({data:D,hist:H})});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const j=await r.json();
    BIN_ID=j.metadata.id;
    API_KEYS.BIN_ID=BIN_ID;
    localStorage.setItem("pf-api-keys", JSON.stringify(API_KEYS));
    return true;
  }catch(e){console.error("createBin:",e);return false}
}

let _isSyncing=false;
let _syncPending=false;
async function pushToBin(){
  if(!BIN_ID){const ok=await createBin();return ok}
  if(_isSyncing){_syncPending=true;return false}
  _isSyncing=true;
  let ok=false;
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":API_KEYS.JSONBIN},body:JSON.stringify({data:D,hist:H.slice(-1000)})});
    st.sync=r.ok;ok=r.ok;
  }catch(e){console.error("push:",e);st.sync=false}
  finally{_isSyncing=false}
  if(_syncPending){_syncPending=false;setTimeout(pushToBin,0)}
  return ok;
}

async function pullFromBin(){
  if(!BIN_ID)return false;
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{"X-Master-Key":API_KEYS.JSONBIN}});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const j=await r.json();
    if(j.record&&j.record.data){D=j.record.data;if(j.record.hist)H=j.record.hist;st.sync=true;return true}
  }catch(e){console.error("pull:",e);st.sync=false}
  return false;
}

async function save(){rc(D);saveLocal();R();pushToBin();}

    if(!r.ok)throw new Error("CG "+r.status);
    const d=await r.json();
    Object.entries(CG).forEach(([t,id])=>{if(d[id]?.usd)got[t]=d[id].usd});
    if(Object.keys(got).length===Object.keys(CG).length) return got;
  }catch(e){}
  const COINBASE={SOL:"SOL-USD",BTC:"BTC-USD"};
  for(const [tkr,pair] of Object.entries(COINBASE)){
    if(got[tkr])continue;
    try{
      const r=await fetch(`https://api.exchange.coinbase.com/products/${pair}/ticker`);
      if(r.ok){const j=await r.json();if(j.price)got[tkr]=parseFloat(j.price);}
    }catch(e){}
  }
  const BINANCE={SOL:"SOLUSDT",BTC:"BTCUSDT",HYPE:"HYPEUSDT"};
  for(const [tkr,sym] of Object.entries(BINANCE)){
    if(got[tkr])continue;
    try{
      const r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}`);
      if(r.ok){const j=await r.json();if(j.price)got[tkr]=parseFloat(j.price);}
    }catch(e){}
  }
  return got;
}

async function fetchStocks(){
  const tickers=new Set();
  if(D&&D.poches)Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
    const cur=pos.currency||CUR[pos.ticker];
    if(cur==="USD"&&!pos.ticker.includes(".")&&!CG[pos.ticker]&&pos.ticker!=="50PESO"){
      tickers.add(pos.ticker);
    }
  }));
  const p={};
  for(const tkr of tickers){
    try{
      const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${tkr}&token=${API_KEYS.FINNHUB}`);
      if(r.ok){
        const j=await r.json();
        if(j.c&&j.c>0)p[tkr]=j.c;
      }
    }catch(e){}
    await new Promise(res=>setTimeout(res,100));
  }
  return p;
}

async function fetchEuStocks(){
  const KNOWN_EU={AI:"AI.PA",SU:"SU.PA",VCT:"VCT.PA",VIE:"VIE.PA",WKL:"WKL.AS",VU:"VU.PA"};
  const tickerMap={};
  if(D&&D.poches)Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
    if(pos.avSymbol){tickerMap[pos.ticker]=pos.avSymbol}
    else if(KNOWN_EU[pos.ticker]){tickerMap[pos.ticker]=KNOWN_EU[pos.ticker]}
  }));
  if(Object.keys(tickerMap).length===0)return {};
  const today=new Date().toISOString().slice(0,10);
  let exhausted=[];
  try{
    const e=JSON.parse(localStorage.getItem("pf-av-exhausted")||"{}");
    if(e.date===today)exhausted=e.keys||[];else{try{localStorage.removeItem("pf-av-exhausted")}catch{}exhausted=[]}
  }catch{}
  const usableKeys=API_KEYS.AV.filter(k=>!exhausted.includes(k));
  if(usableKeys.length===0)return {};
  const p={};
  let kIdx=0,curKey=usableKeys[0];
  for(const [tkr,sym] of Object.entries(tickerMap)){
    let attempts=0;
    while(attempts<usableKeys.length){
      try{
        const r=await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${sym}&apikey=${curKey}`);
        if(r.ok){
          const j=await r.json();
          const price=parseFloat(j["Global Quote"]?.["05. price"]);
          if(price>0){p[tkr]=price;break}
          if(j.Note||j.Information){
            exhausted.push(curKey);
            try{localStorage.setItem("pf-av-exhausted",JSON.stringify({date:today,keys:exhausted}))}catch{}
            kIdx++;
            if(kIdx>=usableKeys.length)return p;
            curKey=usableKeys[kIdx];
            attempts++;
            continue;
          }
          break;
        }
      }catch(e){break}
      attempts++;
    }
    await new Promise(res=>setTimeout(res,1200));
  }
  return p;
}

async function fetchEurUsd(){try{const r=await fetch("https://api.exchangerate-api.com/v4/latest/EUR");if(r.ok){const j=await r.json();return j.rates?.USD}}catch{}return null;}
async function fetchGold(){
  try{
    const r=await fetch("https://api.gold-api.com/price/XAU");
    if(r.ok){
      const j=await r.json();
      if(j.price){
        const usdPerOz=j.price;

        const eurPerCoin=(usdPerOz*1.2056)/eurUsd;

}

async function refreshPrices(){
  if(st.loading && Date.now()-st.loadingSince < 30000)return;
  st.loading=true;
  st.loadingSince=Date.now();
  R();
  const _rpTimeout=setTimeout(()=>{if(st.loading){st.loading=false;cd=900;R();}},90000);
  let cnt=0,ok=false;
  const nowMs = Date.now();
  try{
    const nd=JSON.parse(JSON.stringify(D));
    try{
      const cp=await fetchCrypto();
      if(nd.poches.Crypto)nd.poches.Crypto.positions.forEach(p=>{if(cp[p.ticker]!=null){p.cours=cp[p.ticker]; p.lastUpd=nowMs; cnt++}});
      ok=true;
    }catch(e){}
    try{
      const sp=await fetchStocks();
      Object.values(nd.poches).forEach(p=>p.positions.forEach(pos=>{
        if(sp[pos.ticker]!=null){pos.cours=sp[pos.ticker]; pos.lastUpd=nowMs; cnt++}
      }));
      ok=true;
    }catch(e){}
    try{
      const eup=await fetchEuStocks();
      Object.values(nd.poches).forEach(p=>p.positions.forEach(pos=>{
        if(eup[pos.ticker]!=null){pos.cours=eup[pos.ticker]; pos.lastUpd=nowMs; cnt++}
      }));
    }catch(e){}
    try{const r=await fetchEurUsd();if(r)nd.eurUsd=Math.round(r*10000)/10000}catch{}
    Object.values(nd.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.cours7jDate||(Date.now()-pos.cours7jDate)>7*86400000){
        pos.cours7j=pos.cours;
        pos.cours7jDate=Date.now();
      }
    }));
    try{
      const gp=await fetchGold();
      if(gp&&nd.poches["Métaux"]){
        const coin=nd.poches["Métaux"].positions.find(p=>p.ticker==="50PESO");
        if(coin){coin.cours=gp; coin.lastUpd=nowMs; cnt++}
      }
    }catch{}
    D=rc(nd);
    const now=new Date();
    const ts=now.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    st.lastUp=ts;st.ok=ok;st.count=cnt;
    const tv=Object.values(D.poches).reduce((s,p)=>s+p.valeur,0)+D.cash;
    const tp=Object.values(D.poches).reduce((s,p)=>s+p.pl,0);
    H.push({t:now.getTime(),v:Math.round(tv),pl:Math.round(tp),h:ts.slice(0,5)});
    downsampleH();
    if(H.length>1000)H=H.slice(-1000);
    saveLocal();R();pushToBin();
  }catch(e){console.error(e)}
  finally{
    clearTimeout(_rpTimeout);
    st.loading=false;
    cd=900;
  }
}

function applyPortfolioMigrations(){
  if(!D||!D.poches||!D.poches.PEA)return false;
  let changed=false;
  if(!D.migV2){
    if(!D.sales)D.sales=[];
    if(!D.sales.some(s=>s.ticker==="CDC-D"&&Math.abs(s.qty-141.13)<0.01)){
      D.sales.push({date:"2026-04-24",poche:"PEE",ticker:"CDC-D",titre:"CDC Diversifié ISR",qty:141.13,pru:6.40,net:1807.40,brut:1909.24,pl:904.17});
    }
    D.migV2=true; changed=true;
  }
  if(!D.migV3){
    if(!D.sales)D.sales=[];
    if(!D.sales.some(s=>s.ticker==="HIST-2025")){
      D.sales.push({date:"2025-12-31",poche:"Historique",ticker:"HIST-2025",titre:"P&L réalisé 2025",qty:1,pru:0,net:722.40,brut:722.40,pl:722.40});
    }
    D.migV3=true; changed=true;
  }
  if(!D.migV4){
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.sector&&SECTORS[pos.ticker])pos.sector=SECTORS[pos.ticker];
      if(!pos.dividend&&DIVS[pos.ticker])pos.dividend=DIVS[pos.ticker];
    }));
    D.migV4=true;changed=true;
  }
  if(!D.migV5){
    const now=Date.now();
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.lastUpd)pos.lastUpd=now;
      if(!pos.cours7j&&pos.cours){pos.cours7j=pos.cours;pos.cours7jDate=now;}
    }));
    D.migV5=true;changed=true;
  }
  return changed;
}

function applyMortgagePayments(){
  if(!D||!D.immobilier)return false;
  if(!D.immobilier.mortgage){D.immobilier.mortgage={ptzCapital:29514.90,ptzMensualite:104.30,mainCapital:122238.00,mainMensualite:654.65,mainTaux:0.038,lastPayment:"2026-04-01"};}
  const m=D.immobilier.mortgage;
  const now=new Date();
  const parts=String(m.lastPayment||"").split("-").map(Number);
  const last=parts.length===3?new Date(parts[0],parts[1]-1,parts[2]):new Date(NaN);
  if(isNaN(last.getTime())){m.lastPayment=now.toISOString().slice(0,10);return false;}
  let applied=false; let safety=0; 
  while(safety<600){
    safety++;
    const next=new Date(last.getFullYear(),last.getMonth()+1,1);
    if(isNaN(next.getTime())||next>now)break;
    const ptzPay=Math.min(m.ptzMensualite,m.ptzCapital);
    m.ptzCapital=Math.max(0,m.ptzCapital-ptzPay);
    const interest=m.mainCapital*(m.mainTaux/12);
    const capitalPart=Math.max(0,m.mainMensualite-interest);
    m.mainCapital=Math.max(0,m.mainCapital-capitalPart);
    D.immobilier.capitalRestant=Math.round((m.ptzCapital+m.mainCapital)*100)/100;
    const yy=next.getFullYear(),mm=String(next.getMonth()+1).padStart(2,"0"),dd=String(next.getDate()).padStart(2,"0");
    m.lastPayment=`${yy}-${mm}-${dd}`;
    last.setTime(next.getTime());
    applied=true;
  }
  return applied;
}

function dn(data,colors,sz=120){const tot=data.reduce((s,d)=>s+d[1],0)||1;let a=0;const g=.02,cx=sz/2,cy=sz/2,R=sz*.42,r=sz*.28;let p="";data.forEach((d,i)=>{const f=d[1]/tot;if(f<.001){a+=f;return}const s1=a*Math.PI*2-Math.PI/2+g,e1=(a+f)*Math.PI*2-Math.PI/2-g,l=f>.5?1:0;p+=`<path d="M${cx+R*Math.cos(s1)},${cy+R*Math.sin(s1)} A${R},${R} 0 ${l} 1 ${cx+R*Math.cos(e1)},${cy+R*Math.sin(e1)} L${cx+r*Math.cos(e1)},${cy+r*Math.sin(e1)} A${r},${r} 0 ${l} 0 ${cx+r*Math.cos(s1)},${cy+r*Math.sin(s1)} Z" fill="${colors[i%colors.length]}" opacity=".9"/>`;a+=f});return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${p}</svg>`;}
function lc(data,k,col,w=300,h=140){if(data.length<2)return`<div style="text-align:center;color:var(--dim);padding:30px;font-size:13px">En attente…</div>`;const vs=data.map(d=>d[k]),mn=Math.min(...vs),mx=Math.max(...vs),rg=mx-mn||1,pd=20,cw=w-pd*2,ch=h-pd*2;let pt="";vs.forEach((v,i)=>{const x=pd+(i/(vs.length-1))*cw,y=pd+ch-((v-mn)/rg*ch);pt+=(i?"L":"M")+x.toFixed(1)+","+y.toFixed(1)});const z=k==="pl"?pd+ch-((0-mn)/rg*ch):"";return`<svg width="100%" viewBox="0 0 ${w} ${h}">${z?`<line x1="${pd}" y1="${z}" x2="${w-pd}" y2="${z}" stroke="var(--mut)" stroke-dasharray="3 3"/>`:""}<path d="${pt}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round"/><text x="${pd}" y="${h-2}" font-size="9" fill="var(--mut)">${data[0].h||""}</text><text x="${w-pd}" y="${h-2}" font-size="9" fill="var(--mut)" text-anchor="end">${data[data.length-1].h||""}</text><text x="${pd}" y="${pd-4}" font-size="9" fill="var(--mut)">${fmt_(mx)}</text></svg>`;}
function ga(){const tF=Object.values(D.poches).reduce((s,p)=>s+p.valeur,0)+D.cash,tP=Object.values(D.poches).reduce((s,p)=>s+p.pl,0),tN=tF+(D.immobilier.equityNette||0);const al=[...Object.entries(D.poches).map(([k,v])=>[k,Math.round(v.valeur)]),["Cash",D.cash]];const ap=[];Object.entries(D.poches).forEach(([n,p])=>p.positions.forEach(x=>ap.push({...x,poche:n})));const alerts=ap.filter(p=>p.cible).map(p=>({...p,ec:((p.cours-p.cible)/p.cible)*100,at:p.cours<=p.cible,nr:((p.cours-p.cible)/p.cible)*100<5&&p.cours>p.cible})).sort((a,b)=>a.ec-b.ec);return{tF,tP,tN,al,ap,alerts,nA:alerts.filter(a=>a.at).length}}

<div style="background:#1a1b25;border-radius:10px;padding:10px;margin-bottom:14px;font-size:12px;color:var(--dim);line-height:1.5">${mode==="full"?"Suppression totale":"Réduction"} de <b>${fmt2_(qty)} parts</b> de ${esc(titre)}</div>
<div style="margin-bottom:10px"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:10px;border:1px solid var(--bdr);border-radius:10px;background:#1a1b25"><input type="radio" name="mo" value="sale" checked onchange="document.getElementById('saleFields').style.display='block'"><div>Vente réelle</div></label></div>
<div id="saleFields"><div class="field"><label>Net reçu (€) *</label><input id="saleNet" inputmode="decimal"></div></div>
<div style="margin:10px 0 14px"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:10px;border:1px solid var(--bdr);border-radius:10px;background:#1a1b25"><input type="radio" name="mo" value="correction" onchange="document.getElementById('saleFields').style.display='none'"><div>Correction</div></label></div>
<button class="btn btn-p" onclick="confirmSale()">Valider</button>`)};

window.confirmSale=()=>{
  if(!_pendingSale)return; const {pn:pn_,tk,qty,pru,mode,pendingEdit:pe}=_pendingSale;
  try{
    const choice=document.querySelector('input[name="mo"]:checked').value; const p=D.poches[pn_].positions.find(x=>x.ticker===tk); if(!p)return;
    if(choice==="sale"){
      const net=pn(document.getElementById("saleNet").value); if(!net||net<=0){ const inp=document.getElementById("saleNet"); if(inp){inp.style.borderColor="var(--red)";inp.focus()} return; }
      const pl=net-(qty*pru); if(!D.sales)D.sales=[]; D.sales.push({date:new Date().toISOString().slice(0,10),poche:pn_,ticker:tk,titre:p.titre,qty,pru,net,brut:net,pl:Math.round(pl*100)/100});
    }
    if(mode==="full"){ D.poches[pn_].positions=D.poches[pn_].positions.filter(x=>x.ticker!==tk); }
    else if(pe){ p.titre=pe.newTitre;p.ticker=pe.newTicker;p.qty=pe.newQty;p.pru=pe.newPru;p.cours=pe.newCours; if(pe.newCible)p.cible=pn(pe.newCible);else delete p.cible; }
    _pendingSale=null;cm();save();
  }catch(e){console.error(e);_pendingSale=null;cm();}
};

window.aPos=(pn_)=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:16px"><h3 style="font-size:17px;font-weight:700">Ajouter à ${esc(pn_)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div>
<div class="field"><label>Rechercher</label><div style="display:flex;gap:6px"><input id="srch" placeholder="Nom ou ISIN" style="flex:1"><button class="btn" style="background:var(--acc);color:#fff;padding:8px 14px;" onclick="srcStock()">🔍</button></div><div id="srchRes" style="margin-top:8px"></div></div>
<div class="field"><label>Nom</label><input id="mt"></div><div class="field"><label>Ticker</label><input id="mk"></div>
<div class="field"><label>Secteur</label><input id="ms" list="secteur-list" placeholder="ex: Tech"><datalist id="secteur-list"><option value="Tech">Semi</option><option value="Space">Énergie</option><option value="Industrie">Défense</option><option value="Utilities">Services</option><option value="Construction">Crypto</option><option value="Fonds">Quantum</option><option value="Or">Autre</option></datalist></div>
<div class="row"><div class="field"><label>Qté</label><input id="mq" inputmode="decimal"></div><div class="field"><label>PRU</label><input id="mp" inputmode="decimal"></div></div>
<div class="row"><div class="field"><label>Cours</label><input id="mx" inputmode="decimal"></div><div class="field"><label>Cible</label><input id="mi" inputmode="decimal"></div></div>
<div class="field"><label>Dividende annuel (€)</label><input id="md" inputmode="decimal"></div>
<button class="btn btn-p" onclick="doA('${esc(pn_)}')">Ajouter</button>`);
setTimeout(()=>{document.getElementById("srch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();srcStock()}})},100);};

window.srcStock=async()=>{
  const q=document.getElementById("srch").value.trim(); const out=document.getElementById("srchRes"); if(!q)return; out.innerHTML="...";
  try{
    const r=await fetch(`https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8`);
    if(r.ok){ const j=await r.json(); const quotes=j.quotes.filter(m=>m.symbol); out.innerHTML=quotes.map((m,i)=>`<div onclick="pickStock(${i})" style="padding:8px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:4px;cursor:pointer;background:#1a1b25" data-sym="${esc(m.symbol)}" data-name="${esc(m.longname||m.shortname)}" data-cur="${esc(m.currency)}"><b>${m.symbol}</b> · ${m.longname||m.shortname}</div>`).join(""); }
  }catch(e){out.innerHTML="Erreur";}
};

window.pickStock=async(idx)=>{
  const items=document.querySelectorAll("#srchRes > div"); if(!items[idx])return; const el=items[idx];
  const sym=el.dataset.sym; const ticker=sym.includes(".")?sym.split(".")[0]:sym;
  document.getElementById("mt").value=el.dataset.name; document.getElementById("mk").value=ticker;
  const key=API_KEYS.AV.find(k=>!JSON.parse(localStorage.getItem("pf-av-exhausted")||"{}").keys?.includes(k));
  if(key){ try{ const r=await fetch(`https://www.alphavantage.co/query?function=OVERVIEW&symbol=${ticker}&apikey=${key}`); const j=await r.json(); if(j.Sector) document.getElementById("ms").value=j.Sector; if(j.DividendPerShare && j.DividendPerShare!=="None") document.getElementById("md").value=j.DividendPerShare; }catch(e){} }
  document.getElementById("mq").focus();
};

window.doA=(pn_)=>{
  const tk=document.getElementById("mk").value; if(!tk)return;
  const pos={ titre:document.getElementById("mt").value||tk, ticker:tk, qty:pn(document.getElementById("mq").value), pru:pn(document.getElementById("mp").value), cours:pn(document.getElementById("mx").value), sector:document.getElementById("ms").value, dividend:pn(document.getElementById("md").value) };
  const ci=document.getElementById("mi").value; if(ci)pos.cible=pn(ci); D.poches[pn_].positions.push(pos); cm(); save();
};

// ══════════════ RENDER ══════════════
function R(){
if(!D)return; const d=ga(); const $=document.getElementById("app"); let h="";
const isLoad = st.loading && Date.now()-st.loadingSince < 30000;
h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
  <div style="display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;background:${isLoad?"var(--amb)":st.ok?"var(--grn)":"var(--mut)"};${isLoad?'animation:bl 1s infinite':''}"></div><span class="mono" style="font-size:11px;">${isLoad?"Mise à jour...":st.lastUp||"—"}</span></div>
  <div><button onclick="eSettings()" style="background:none;border:none;color:var(--dim);cursor:pointer">⚙️</button> <button onclick="refreshPrices()" ${isLoad?"disabled":""} style="background:none;border:1px solid var(--bdr);border-radius:8px;color:${isLoad?"var(--mut)":"var(--acc)"};padding:4px 8px;font-weight:600">↻</button></div>
</div>`;
if(tab==="home"){
  h+=`<div class="fade"><div><div class="section">Portefeuille</div><div class="mono" style="font-size:32px;font-weight:700;">${fmt_(d.tN)} €</div><div class="mono" style="color:${d.tP>=0?"var(--grn)":"var(--red)"}">${fL(d.tP)}</div></div>`;
  Object.entries(D.poches).forEach(([n,p])=>{ const dd=p.positions.map(x=>[x.ticker,x.valeur]); h+=`<div class="card card-tap" onclick="oP('${esc(n)}')"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:700">${esc(n)}</div><div class="mono" style="font-size:20px">${fmt_(p.valeur)} €</div></div>${dn(dd,DCOL,85)}</div></div>`; });
  h+=`<div class="card card-tap" onclick="eCash()"><span style="font-weight:700">Liquidités</span> <span class="mono">${fmt_(D.cash)} €</span></div></div>`;
}
if(tab==="detail"&&sel){
  const p=D.poches[sel]; h+=`<div class="fade"><button onclick="gt('home')" style="background:none;border:none;color:var(--acc);cursor:pointer">← Retour</button><h2>${esc(sel)}</h2><div class="card">`;
  p.positions.forEach(x=>{ h+=`<div style="display:grid;grid-template-columns:1fr auto auto;padding:8px 0;border-bottom:1px solid #1e203022" onclick="ePos('${esc(sel)}','${esc(x.ticker)}')"><div><b>${x.ticker}</b><br><small>${x.qty} x ${fmt2_(x.cours)}</small></div><div style="text-align:right">${fmt_(x.valeur)} €</div><div style="text-align:right;color:${x.pl>=0?"var(--grn)":"var(--red)"}">${fP(x.plPct)}</div></div>`; });
  h+=`</div><div class="add-btn" onclick="aPos('${esc(sel)}')">+ Ajouter</div></div>`;
}
if(tab==="analyse"){
  const sm_={}; d.ap.forEach(p=>{const s=p.sector||SECTORS[p.ticker]||"Autre";sm_[s]=(sm_[s]||0)+p.valeur}); const sd=Object.entries(sm_).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="fade"><h2>Analyse</h2><div class="card"><div class="section">Évolution</div>${lc(H.slice(-30),"v","#6c8cff",300,80)}</div>
  <div class="card"><div class="section">Secteurs</div><div style="display:flex;gap:10px">${dn(sd,DCOL,100)}<div>${sd.map(d=>`<div style="font-size:10px">${d[0]}: ${fmt_(d[1])}€</div>`).join("")}</div></div></div></div>`;
}
if(tab==="history"){
  const cut=({"1j":864e5,"1s":6048e5,"1m":2592e6,"3m":7776e6,"tout":0})[htf]||0; const r=H.filter(x=>Date.now()-x.t<=cut||cut===0);
  h+=`<div class="fade"><h2>Historique</h2><div style="display:flex;gap:6px;margin-bottom:12px">${["1j","1s","1m","3m","tout"].map(v=>`<button onclick="setHtf('${v}')" style="padding:4px 8px;border-radius:6px;border:1px solid var(--bdr);background:${htf===v?"#6c8cff22":""}">${v.toUpperCase()}</button>`).join("")}</div><div class="card">${lc(r.length>=2?r:[{t:0,v:0,h:""}],"v","#6c8cff")}</div></div>`;
}
$.innerHTML=h;
document.getElementById("nav").innerHTML=[["home","Vue"],["analyse","Analyse"],["history","Hist."]].map(t=>`<button class="nav-btn${tab.startsWith(t[0])?" active":""}" onclick="gt('${t[0]}')">${t[1]}</button>`).join("");
}

window.gt=id=>{ tab=id; sel=null; R(); };
window.oP=n=>{ sel=n; tab="detail"; R(); };
window.setHtf=v=>{htf=v;R()};
window.refreshPrices=refreshPrices;
init();
</script>
</body>
</html>
