// pour un ETF/fonds sans pays résolu (donc probablement pas une entreprise unique) : va chercher ses principales lignes détenues
// (nouvelle fonction ?holdings= du Worker), puis le pays de chaque ligne (réutilise le même mécanisme que refreshCountries)
// pour reconstruire une vraie répartition géographique au lieu de deviner — fonctionne pour n'importe quel ETF, pas seulement ceux déjà connus
// appelée indépendamment de refreshCountries (pas imbriquée dedans) : sinon son cache de 7 jours bloque aussi celle-ci sans raison.
// Le cache est par ticker (30j si résolu, 3j si échec/non reconnu) plutôt qu'un verrou global, pour qu'un ticker jamais tenté
// (ex: position tout juste ajoutée, ou ancien blocage levé par une mise à jour du code) soit toujours retenté au prochain cycle.
async function refreshEtfHoldings(){
  try{
    if(!D||!D.poches)return;
    if(!D.prefs)D.prefs={};
    if(!D.prefs.etfHoldings)D.prefs.etfHoldings={};
    const eh=D.prefs.etfHoldings;
    const map={};
    Object.entries(D.poches).forEach(([n,p])=>{p.positions.forEach(pos=>{const t=pos.ticker;if(!t||(typeof CG!=="undefined"&&CG[t])||ETF_BREAKDOWN_BY_TICKER[t])return;
      const auto=(D.prefs&&D.prefs.paysAuto)||{};
      if(auto[t])return;
      const prev=eh[t];
      // prev.isFund===undefined : entrée en cache écrite par une ancienne version du code (avant le flag isFund) —
      // on la retente tout de suite au lieu d'attendre son délai normal, pour que les correctifs de classification
      // s'appliquent dès le prochain cycle plutôt que de rester coincés jusqu'à 3-30 jours.
      if(prev&&prev.isFund!==undefined){const ttl=(prev.parts&&prev.parts.length)?30*24*3600000:3*24*3600000;if(Date.now()-(prev.at||0)<ttl)return;}
      map[t]=_ySym(pos);
    });});
    const tickers=Object.keys(map);
    if(!tickers.length)return;
    for(const t of tickers){
      try{
        const h=await fundFetch("holdings",map[t]);
        // "isFund" : le Worker a confirmé que ce symbole est bien un fonds/ETF (famille, catégorie ou secteurs connus),
        // même si le détail ligne par ligne est absent chez Yahoo (fréquent sur les petits fonds européens). Dans ce cas
        // il ne faut surtout pas retomber sur la devinette pays-par-devise (ex: un ETF Émergents en EUR ne doit pas
        // s'afficher "France") : on classe proprement en Diversifié plutôt que d'inventer un pays.
        const isFund=!!(h&&!h.error&&(h.family||h.category||(h.sectors&&h.sectors.length)||(h.holdings&&h.holdings.length)));
        if(!h||h.error||!h.holdings||!h.holdings.length){eh[t]={parts:[],isFund,at:Date.now()};saveLocal();continue;}
        const parts=[];
        const BATCH=4;
        for(let i=0;i<h.holdings.length;i+=BATCH){
          const batch=h.holdings.slice(i,i+BATCH);
          const res=await Promise.all(batch.map(async hd=>{if(!hd.symbol||!hd.pct)return null;try{const s=await fundFetch("summary",hd.symbol);const code=(s&&s.pays)?(YAHOO_COUNTRY_TO_CODE[s.pays]||null):null;return code?[code,hd.pct]:null;}catch(e){return null;}}));
          res.forEach(r=>{if(r)parts.push(r);});
        }
        eh[t]={parts,isFund:true,holdings:h.holdings.slice(0,10),category:h.category||null,at:Date.now()};
        saveLocal();R();
      }catch(e){eh[t]={parts:[],isFund:false,at:Date.now()};saveLocal();}
    }
    if(currentUser)pushToSupabase();R();
  }catch(e){}
}

async function _resolveIsin(isin){
  try{
    const r=await fetchT(`${WORKER_URL}/?search=${encodeURIComponent(isin)}`,{},10000);
    if(!r.ok)return null;
    const j=await r.json();
    const q=(j.quotes||[]).find(m=>m.symbol&&m.quoteType!=="CURRENCY");
    if(!q)return null;
    return {sym:q.symbol,cur:q.currency||_guessCur(q.exchange)||_guessCur(q.exchDisp)||null,name:q.longname||q.shortname||null};
  }catch(e){return null;}
}

async function refreshIsinSymbols(){
  try{
    if(!D||!D.poches)return;
    if(!D.prefs)D.prefs={};
    if(!D.prefs.isinFailed)D.prefs.isinFailed={};
    const targets=[];
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      const t=pos.ticker;
      if(!t||pos.avSymbol||!ISIN_RE.test(t))return;
      const failedAt=D.prefs.isinFailed[t];
      if(failedAt&&Date.now()-failedAt<7*24*3600000)return;
      targets.push(pos);
    }));
    if(!targets.length)return;
    const BATCH=4;
    for(let i=0;i<targets.length;i+=BATCH){
      const batch=targets.slice(i,i+BATCH);
      await Promise.all(batch.map(async pos=>{
        if(!pos.isin)pos.isin=(pos.ticker||"").toUpperCase();
        const res=await _resolveIsin(pos.ticker);
        if(res&&res.sym){
          pos.avSymbol=res.sym;
          if(res.cur&&!pos.currency)pos.currency=res.cur;
          if(res.name&&(!pos.titre||pos.titre===pos.ticker))pos.titre=res.name;
          delete D.prefs.isinFailed[pos.ticker];
        }else{
          D.prefs.isinFailed[pos.ticker]=Date.now();
        }
      }));
      saveLocal();R();
    }
    if(currentUser)pushToSupabase();
  }catch(e){}
}

function downsampleH(){
  if(H.length<2)return;
  const now=Date.now();
  const D7=7*24*3600*1000;
  const D30=30*24*3600*1000;
  const recent=H.filter(x=>now-x.t<D7);
  const mid=H.filter(x=>now-x.t>=D7&&now-x.t<D30);
  const old=H.filter(x=>now-x.t>=D30);
  const midMap={};
  mid.forEach(x=>{const k=new Date(x.t).toISOString().slice(0,10);if(!midMap[k])midMap[k]=x;else Object.assign(midMap[k], x);});
  const oldMap={};
  old.forEach(x=>{const d=new Date(x.t);const wk=`${d.getFullYear()}-W${String(Math.ceil((d-new Date(d.getFullYear(),0,1))/604800000)).padStart(2,"0")}`;if(!oldMap[wk])oldMap[wk]=x;else Object.assign(oldMap[wk], x);});
  H=[...Object.values(oldMap),...Object.values(midMap),...recent].sort((a,b)=>a.t-b.t);
}

function rc(d){
  if(!d||!d.poches)return d;
  const eurUsd=d.eurUsd||1.1;
  Object.entries(d.poches).forEach(([pocheName,p])=>{
    p.positions.forEach(x=>{
      const cur=curOf(x);
      const te=toEur(cur);
      x.valeur=(x.qty*x.cours)*te;
      x.pl=(x.qty*(x.cours-x.pru))*te;
      x.plPct=x.pru?((x.cours-x.pru)/x.pru*100):0;
      // Fusion Plan de sortie → objectif de vente : migre l'ancien plan.px vers cibleHaut.
      if(d.prefs&&d.prefs.plan&&d.prefs.plan[x.ticker]&&d.prefs.plan[x.ticker].px>0&&!x.cibleHaut)x.cibleHaut=d.prefs.plan[x.ticker].px;
    });
    p.investi=p.positions.reduce((s,x)=>{
      const cur=curOf(x);
      return s+(x.qty*x.pru)*toEur(cur)
    },0);
    p.valeur=p.positions.reduce((s,x)=>s+x.valeur,0);
    p.pl=p.valeur-p.investi;
    const t=p.valeur||1;
    p.positions.forEach(x=>{x.poids=Math.round(x.valeur/t*1000)/10});
    
    const n=p.positions.length;
    if(n===0){p.sante="5,0";return;}
    let sc=0,wTotal=0;
    p.positions.forEach(x=>{
      const w=(x.poids||0)/100;
      const r=scorePos(x,pocheName);
      x._score=r.score;x._crit=r.crit;
      sc+=r.score*w;wTotal+=w;
    });
    let raw=wTotal>0?sc/wTotal:5;
    if(n>=6)raw+=0.3;else if(n>=4)raw+=0.15;
    const maxPoids=Math.max(...p.positions.map(x=>x.poids));
    if(maxPoids>60)raw-=1;else if(maxPoids>45)raw-=0.5;
    const plPct=p.investi>0?(p.pl/p.investi*100):0;
    if(plPct>20)raw+=0.5;else if(plPct<-15)raw-=0.5;
    p.sante=Math.max(1,Math.min(10,raw)).toFixed(1).replace('.',',');
  });
  if(d.immobilier){ensureImmoBiens(d);let _vv=0,_cc=0;d.immobilier.biens.forEach(b=>{_vv+=(b.valeurEstimee||0);_cc+=(b.capitalRestant||0);});d.immobilier.valeurEstimee=Math.round(_vv*100)/100;d.immobilier.capitalRestant=Math.round(_cc*100)/100;d.immobilier.equityNette=d.immobilier.valeurEstimee-d.immobilier.capitalRestant;}
  d.updatedAt=new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  return d;
}

function getCutoffs() {

   const wtd = new Date(nowD.getFullYear(), nowD.getMonth(), diffDate).getTime();
   const mtd = new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime();

}

function despike(arr, key){
  if(!Array.isArray(arr)||arr.length<3)return arr;
  let out=arr.map(x=>({...x}));
  for(let pass=0;pass<3;pass++){
    for(let i=1;i<out.length-1;i++){
      const a=out[i-1][key],b=out[i][key],c=out[i+1][key];
      if(a==null||b==null||c==null)continue;
      const refMax=Math.max(Math.abs(a),Math.abs(c),1);
      if(Math.abs(b-a)/refMax>0.15 && Math.abs(b-c)/refMax>0.15 && Math.abs(a-c)/refMax<0.1){ out[i][key]=(a+c)/2; }
    }
  }
  return out;
}

function _convChartSvg(items,poidsLabel){poidsLabel=poidsLabel||"poids";if(!items.length)return `<div style="font-size:11px;color:var(--mut);text-align:center;padding:20px 6px">Note au moins une conviction sur une position pour voir ce graphique.</div>`;
const maxP=Math.max(20,Math.ceil((Math.max(...items.map(i=>i.poids))*1.15)/5)*5);
const VW=390,VH=560;
const X0=36,X1=380,Y0=44,Y1=484;
const xf=p=>X0+(Math.min(p,maxP)/maxP)*(X1-X0);
const yf=c=>Y1-(Math.max(0,Math.min(100,c))/100)*(Y1-Y0);
const rf=p=>Math.max(8,Math.min(21,7+p*0.52));
// beeswarm : sépare horizontalement les points qui se chevauchent (ex: plusieurs petites positions ~0%), sans jamais bouger leur conviction (y)
// chaque point a désormais son nom affiché (pas seulement les positions à signaler) : l'écart minimum tient compte de la largeur du texte du ticker
// deux balayages symétriques (preuve mathématique en commentaire ci-dessous) au lieu d'un système de "groupes" fragile face aux cas où deux points ne se touchent jamais directement (conviction très différente) mais doivent quand même respecter l'ordre par poids
const dots0=items.map(it=>({it,ncx:xf(it.poids),cy:yf(it.conv),r:rf(it.poids),dr:Math.max(rf(it.poids),it.tk.length*3.3+5)}));
const order=dots0.slice().sort((a,b)=>a.ncx-b.ncx||a.cy-b.cy);
const n=order.length;
const gapOf=(a,b)=>{const dy=Math.abs(a.cy-b.cy);const mg=a.dr+b.dr+3;return dy<mg?Math.sqrt(Math.max(0,mg*mg-dy*dy)):0;};
// balayage avant : la position la plus à GAUCHE possible pour chaque point compte tenu de tous les points de poids inférieur (jamais de chevauchement, jamais d'inversion d'ordre — le poids inférieur ne peut jamais finir devant)
const fwd=new Array(n);
order.forEach((b,i)=>{let req=b.ncx;for(let j=0;j<i;j++)req=Math.max(req,fwd[j]+gapOf(order[j],b));fwd[i]=req;});
// balayage arrière (symétrique, en partant de la droite) : la position la plus à DROITE possible pour chaque point compte tenu de tous les points de poids supérieur
const bwd=new Array(n);
for(let i=n-1;i>=0;i--){let req=order[i].ncx;for(let k=i+1;k<n;k++)req=Math.min(req,bwd[k]-gapOf(order[i],order[k]));bwd[i]=req;}
// la moyenne des deux respecte forcément les mêmes écarts minimums (chacun des deux balayages les respecte déjà individuellement), tout en recentrant : fwd cascade depuis la gauche (tasse à droite), bwd cascade depuis la droite (tasse à gauche), leur moyenne se pose au milieu
order.forEach((d,i)=>{d.cx=(fwd[i]+bwd[i])/2;});
// translation rigide de l'ensemble pour rester dans le cadre (jamais de clamp point par point, qui casserait l'ordre ou recréerait un chevauchement)
const leftOver=Math.max(0,X0-Math.min(...order.map(d=>d.cx-d.dr)));
if(leftOver>0)order.forEach(d=>{d.cx+=leftOver;});
const rightOver=Math.max(0,Math.max(...order.map(d=>d.cx+d.dr))-X1);
if(rightOver>0)order.forEach(d=>{d.cx-=rightOver;});
let dots="";
// affichage des noms \u00e0 la Finviz/heatmap boursier : un nom ne s'affiche que s'il y a vraiment la place \u00e0 c\u00f4t\u00e9 du pr\u00e9c\u00e9dent sur la m\u00eame ligne (au-dessus/en-dessous), sinon seul le point reste (toujours cliquable pour voir le d\u00e9tail) \u2014 \u00e9vite les \u00e9tiquettes illisibles qui se recouvrent quand beaucoup de positions partagent une conviction proche
const _byConv={};dots0.forEach(d=>{const bucket=Math.round(d.it.conv/10)*10;(_byConv[bucket]=_byConv[bucket]||[]).push(d);});
Object.keys(_byConv).forEach(cvKey=>{
  const group=_byConv[cvKey].sort((a,b)=>a.cx-b.cx);
  let lastAboveRight=-Infinity,lastBelowRight=-Infinity;
  group.forEach((d,i)=>{
    const {it,cx,cy,r}=d;
    const above=i%2===0;
    const tier=Math.min(6,Math.floor(i/2));
    const off=8+tier*14;
    const ly=above?Math.max(16,cy-r-off):Math.min(Y1-6,cy+r+off+7);
    const col=it.flagged?"#fbbf24":"#6c8cff";
    const _msg=esc(it.tk)+" — "+it.poids+"% · conviction "+it.conv;
    const textHalfW=it.tk.length*3.3+3;
    const lastRight=above?lastAboveRight:lastBelowRight;
    const showLabel=(cx-textHalfW)>lastRight+2;
    if(showLabel){if(above)lastAboveRight=cx+textHalfW;else lastBelowRight=cx+textHalfW;}
    dots+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}33" stroke="${col}" stroke-width="${it.flagged?2.2:1.3}" style="cursor:pointer" onclick="toast('${escAttr(_msg)}')"/>`+(showLabel?`<text x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${col}" font-size="10" text-anchor="middle" font-weight="700">${esc(it.tk)}</text>`:"");
  });
});
const grid=[0,25,50,75,100].map(c=>`<line x1="${X0}" y1="${yf(c).toFixed(1)}" x2="${X1}" y2="${yf(c).toFixed(1)}" stroke="#242739" stroke-dasharray="${c===50?"3 4":"2 6"}"/>`).join("");
const ticks=[0,25,50,75,100].map(c=>`<text x="${X0-8}" y="${(yf(c)+3.5).toFixed(1)}" fill="#72768c" font-size="10" text-anchor="end">${c}</text>`).join("");
return `<svg viewBox="0 0 ${VW} ${VH}" width="100%" height="520" style="overflow:visible;display:block;margin:10px auto 0">
${grid}
<line x1="${X0}" y1="${Y0-6}" x2="${X0}" y2="${Y1}" stroke="#2c2f45"/>
<line x1="${X0}" y1="${Y1}" x2="${X1}" y2="${Y1}" stroke="#2c2f45"/>
${ticks}
<text x="${X0}" y="${Y1+28}" fill="#72768c" font-size="10">0%</text>
<text x="${(X0+X1)/2}" y="${Y1+28}" fill="#72768c" font-size="10" text-anchor="middle">${esc(poidsLabel)}</text>
<text x="${X1}" y="${Y1+28}" fill="#72768c" font-size="10" text-anchor="end">${maxP}%</text>
${dots}
</svg>`;}

function perfReelle(){if(!H||H.length<3)return null;const s0=H.slice().sort((a,b)=>a.t-b.t);
  // Bug C corrigé : on calcule la perf sur la VALEUR BOURSE (hors cash/immo),
  // reconstruite depuis env, avec les flux bourse. Si tout est inclus, on peut
  // utiliser inv (déjà bourse-only) pour les vieux points sans envInv.
  const allInc=_perfPoches().length===Object.keys((D&&D.poches)||{}).length;
  const pts=s0.map(p=>{const vB=_bourseVal(p);let iB=_bourseInv(p);if(iB==null&&allInc)iB=(p.inv!=null?p.inv:null);return{t:p.t,v:vB,inv:iB};}).filter(p=>p.v!=null&&p.inv!=null);
  if(pts.length<2)return null;
  let seedIdx=0,maxCf=0;const half=Math.max(1,Math.floor(pts.length/2));for(let i=1;i<=half;i++){const cf=(pts[i].inv||0)-(pts[i-1].inv||0);if(cf>maxCf){maxCf=cf;seedIdx=i;}}
  const s=pts.slice(seedIdx);if(s.length<2)return null;
  let twr=1,n=0;for(let i=1;i<s.length;i++){const v0=s[i-1].v,v1=s[i].v;let cf=(s[i].inv||0)-(s[i-1].inv||0);if(cf<0)cf=0;if(v0>0){const r=(v1-cf)/v0;if(isFinite(r)&&r>0){twr*=r;n++;}}}if(n<1)return null;
  const days=(s[s.length-1].t-s[0].t)/86400000;const cum=(twr-1)*100;const MINC=30,MINA=180;const cumLocked=days<MINC;const ann=days>=MINA?(Math.pow(twr,365/days)-1)*100:null;
  return {cum,days,cumLocked,ann,start:new Date(s[0].t),unlockCum:new Date(s[0].t+MINC*86400000),unlockAnn:new Date(s[0].t+MINA*86400000)};}

function seedJumpInfo(arr){if(!arr||arr.length<4)return {hasJump:false};const n=arr.length;const half=Math.max(3,Math.floor(n*0.5));let ci=0,maxR=0;for(let i=1;i<half;i++){const a=arr[i-1].v||0,b=arr[i].v||0;if(a>0){const rr=(b-a)/a;if(rr>maxR){maxR=rr;ci=i;}}}if(maxR>0.25&&ci>0&&ci<n-1)return {hasJump:true,cutIdx:ci,ratio:maxR};return {hasJump:false};}

else if(def.clock){m.hasDate=false;m.effRate=cfg.rate!=null?cfg.rate:def.rate;}

async function pullFromSupabase() {
  if (!sb || !currentUser) return false;
  try {
    const { data: pfData, error: pfErr } = await sb.from('portfolios').select('*').eq('user_id', currentUser.id).limit(1);
    if (pfErr) throw pfErr;
    if (!pfData || pfData.length === 0) return false;

    const pf = pfData[0];
    window.currentPfId = pf.id;

    const { data: posData, error: posErr } = await sb.from('positions').select('*').eq('portfolio_id', pf.id);
    if (posErr) throw posErr;

    const { data: cfData, error: cfErr } = await sb.from('cashflows').select('*').eq('portfolio_id', pf.id).order('date', { ascending: true });
    if (cfErr) console.warn('cashflows fetch error', cfErr);
    window.cashflows = cfData || [];

    const localD = loadLocal().D || {};

    let newD = {
      updatedAt: new Date().toLocaleDateString("fr-FR")+" "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}),
      eurUsd: pf.eur_usd || 1.10,
      cash: pf.cash || 0,
      targetAlloc: pf.target_alloc || {},
      immobilier: pf.immobilier || {},
      sales: pf.sales || [],
      divReceived: pf.div_received || [],
      prefs: pf.prefs || {},
      poches: {},
      migV2: localD.migV2, migV3: localD.migV3, migV4: localD.migV4, migV5: localD.migV5, migV6: localD.migV6, migV7: localD.migV7
    };

    const savedOrder = (pf.prefs && Array.isArray(pf.prefs.pocheOrder) && pf.prefs.pocheOrder.length) ? pf.prefs.pocheOrder : ["CTO", "PEA", "Assurance Vie", "PEE", "Crypto", "Métaux"];
    savedOrder.forEach(p => { if(!newD.poches[p]) newD.poches[p] = {sante: "5,0", positions: []}; });

    if (posData) {
      posData.forEach(pos => {
        if (!newD.poches[pos.poche]) {
          newD.poches[pos.poche] = {sante: "5,0", positions: []};
        }
        
        const oldPos = localD.poches && localD.poches[pos.poche] && localD.poches[pos.poche].positions.find(x => x.ticker === pos.ticker);
        
        newD.poches[pos.poche].positions.push({
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible,
          cibleHaut: pos.cible_haut,
          sector: pos.sector,
          dividend: pos.dividend,
          cours7j: oldPos ? oldPos.cours7j : pos.cours,
          cours7jDate: oldPos ? oldPos.cours7jDate : Date.now(),
          lastUpd: oldPos ? oldPos.lastUpd : Date.now(),
          currency: pos.currency || (oldPos ? oldPos.currency : null),
          avSymbol: pos.av_symbol || (oldPos ? oldPos.avSymbol : null),
          isin: pos.isin || (oldPos ? oldPos.isin : null),
          manual: !!(pf.prefs && pf.prefs.manualTickers && pf.prefs.manualTickers.includes(pos.ticker)),
          noPerf: !!(pf.prefs && pf.prefs.noPerfTickers && pf.prefs.noPerfTickers.includes(pos.ticker)),
          manualUpdated: (pf.prefs && pf.prefs.manualUpdatedAt && pf.prefs.manualUpdatedAt[pos.ticker]) || null
        });
      });
    }

    D = newD;
    H = pf.hist || [];
    st.sync = true;
    return true;
  } catch(e) {
    console.error("pullFromSupabase:", e);
    st.sync = false;
    return false;
  }
}

async function pushToSupabase() {
  if(!sb || !currentUser || !window.currentPfId) return false;
  if(_isSyncing){_syncPending=true;return false;}

  let ok=false;
  try{
    const { error: pfErr } = await sb.from('portfolios').update({

    if(pfErr) throw pfErr;

    const { data: dbPos, error: fetchErr } = await sb.from('positions').select('id, poche, ticker').eq('portfolio_id', window.currentPfId);
    if(fetchErr) throw fetchErr;

    let toUpdate = [];
    let toInsert = [];
    let keptIds = new Set();

    Object.entries(D.poches).forEach(([pocheName, p]) => {
      p.positions.forEach(pos => {
        const dbMatch = dbPos.find(x => x.poche === pocheName && x.ticker === pos.ticker);
        const payload = {
          portfolio_id: window.currentPfId,
          poche: pocheName,
          ticker: pos.ticker,
          titre: pos.titre,
          qty: pos.qty,
          pru: pos.pru,
          cours: pos.cours,
          cible: pos.cible || null,
          cible_haut: pos.cibleHaut || null,
          sector: pos.sector || null,
          dividend: pos.dividend || null,
          av_symbol: pos.avSymbol || null,
          currency: pos.currency || null,
          isin: pos.isin || null
        };
        if(dbMatch) {
          toUpdate.push({ id: dbMatch.id, ...payload });
          keptIds.add(dbMatch.id);
        } else {
          toInsert.push(payload);
        }
      });
    });

    const idsToDelete = dbPos.filter(x => !keptIds.has(x.id)).map(x => x.id);
    
    if(idsToDelete.length > 0) await sb.from('positions').delete().in('id', idsToDelete);
    if(toInsert.length > 0) await sb.from('positions').insert(toInsert);
    for(const item of toUpdate) {
        const { id, ...data } = item;
        await sb.from('positions').update(data).eq('id', id);
    }

    st.sync=true; ok=true;
  }catch(e){console.error("pushToSupabase:",e);st.sync=false;_syncErr();}
  finally{
    _isSyncing=false;
    R();
  }
  if(_syncPending){_syncPending=false;setTimeout(pushToSupabase,0)}
  else if(ok && currentUser){try{localStorage.removeItem("pf-dirty-"+currentUser.id);}catch(e){}}
  return ok;
}

     if(!window.currentPfId) {

          portfolio_id: pfId,

async function fetchCrypto(){
  const ids=Object.values(CG).join(",");
  const got={};
  try{
    const r=await fetchT(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
    if(!r.ok)throw new Error("CG "+r.status);
    const d=await r.json();
    Object.entries(CG).forEach(([t,id])=>{if(d[id]?.usd){got[t]=d[id].usd;if(d[id].usd_24h_change!=null){window._cryptoChg=window._cryptoChg||{};window._cryptoChg[t]=d[id].usd_24h_change;}}});
    if(Object.keys(got).length===Object.keys(CG).length) return got;
  }catch(e){}
  const COINBASE={SOL:"SOL-USD",BTC:"BTC-USD"};
  for(const [tkr,pair] of Object.entries(COINBASE)){
    if(got[tkr])continue;
    try{
      const r=await fetchT(`https://api.exchange.coinbase.com/products/${pair}/ticker`);
      if(r.ok){
        const j=await r.json();
        if(j.price)got[tkr]=parseFloat(j.price);
      }
    }catch(e){}
  }
  const BINANCE={SOL:"SOLUSDT",BTC:"BTCUSDT",HYPE:"HYPEUSDT"};
  for(const [tkr,sym] of Object.entries(BINANCE)){
    if(got[tkr])continue;
    try{
      const r=await fetchT(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}`);
      if(r.ok){
        const j=await r.json();
        if(j.price)got[tkr]=parseFloat(j.price);
      }
    }catch(e){}
  }
  return got;
}

async function fetchStocks(){
  const tickers=new Set();
  if(D&&D.poches)Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
    if(pos.manual)return;
    const cur=curOf(pos);
    // Tout ticker sans point, pas crypto, pas or → US par défaut
    // Couvre les positions ajoutées manuellement sans passer par la recherche
    if(!CG[pos.ticker]&&pos.ticker!=="50PESO"&&!pos.ticker.includes(".")){
      if(cur==="USD"||!cur) tickers.add(pos.ticker);
    }
  }));
  if(tickers.size===0){window._usPrevClose={};return {};}
  const list=[...tickers].join(",");
  let quotes={};const pcMap={};
  // Cours US via Finnhub (temps réel quand ça répond) — meta contient la clôture veille (pc).
  try{
    const r=await fetchT(`${WORKER_URL}/?usquote=${encodeURIComponent(list)}`);
    if(r.ok){const j=await r.json();quotes=j.quotes||{};const m=j.meta||{};Object.keys(m).forEach(k=>{if(m[k]&&m[k].pc>0)pcMap[k]=m[k].pc;});}
  }catch(e){console.error("US quote fetch error:",e)}
  // Repli Yahoo pour les tickers que Finnhub n'a pas renvoyés → évite les prix qui traînent (⚠️) + clôture veille.
  const missing=[...tickers].filter(t=>quotes[t]==null);
  if(missing.length){
    try{
      const r2=await fetchT(`${WORKER_URL}/?symbols=${encodeURIComponent(missing.join(","))}&_t=${Date.now()}`);
      if(r2.ok){const j2=await r2.json();const arr=(j2.quoteResponse&&j2.quoteResponse.result)||[];arr.forEach(q=>{if(q.symbol&&q.regularMarketPrice!=null){quotes[q.symbol]=q.regularMarketPrice;if(q.regularMarketPreviousClose>0)pcMap[q.symbol]=q.regularMarketPreviousClose;}});}
    }catch(e){console.error("US Yahoo fallback error:",e)}
  }
  window._usPrevClose=pcMap;
  return quotes;
}

async function applyPortfolioMigrations(){
  if(!D||!D.poches)return false;
  const _hasData=Object.values(D.poches).some(p=>p.positions&&p.positions.length)||D.cash>0||(Array.isArray(D.sales)&&D.sales.length>0);
  if(!_hasData)return false;

  let changed=false;
  // migV2/migV3 retirees : elles injectaient des donnees personnelles chez tous les comptes (fuite). On marque juste comme appliquees.
  if(!D.migV2){D.migV2=true;}
  if(!D.migV3){D.migV3=true;}
  if(!D.migV4){
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.sector&&SECTORS[pos.ticker])pos.sector=SECTORS[pos.ticker];
      if(!pos.dividend&&DIVS[pos.ticker])pos.dividend=DIVS[pos.ticker];
    }));
    D.migV4=true;changed=true;
  }
  if(!D.migV5){
    const now=Date.now();
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{
      if(!pos.lastUpd)pos.lastUpd=now;
      if(!pos.cours7j&&pos.cours){pos.cours7j=pos.cours;pos.cours7jDate=now;}
    }));
    D.migV5=true;changed=true;
  }

  if(!D.migV7){
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{ if(!pos.currency)pos.currency=LEGACY_CUR[pos.ticker]||"EUR"; }));
    D.migV7=true;changed=true;
  }

  if (!D.migV6 && sb && window.currentPfId && Array.isArray(D.sales) && D.sales.length > 0) {
    try {
      const rows = D.sales.map(s => ({
        portfolio_id: window.currentPfId,
        date: s.date,
        type: 'sell',
        ticker: s.ticker || null,
        poche: s.poche || null,
        amount_eur: Number(s.net != null ? s.net : (s.brut || 0)),
        qty: s.qty != null ? Number(s.qty) : null,
        price_eur: (s.qty && s.net) ? Number((s.net / s.qty).toFixed(4)) : null,
        label: s.titre || null
      }));

      const { error: insErr } = await sb.from('cashflows').insert(rows);
      if (!insErr) {
        D.migV6 = true;
        changed = true;
        const { data: cfData } = await sb
          .from('cashflows')
          .select('*')
          .eq('portfolio_id', window.currentPfId)
          .order('date', { ascending: true });
        window.cashflows = cfData || [];
      }
    } catch (e) {
      console.warn('Migration V6 exception :', e);
    }
  }

  if(!D.migV8){
    D.prefs=D.prefs||{};
    if(D.prefs.conv){
      Object.keys(D.prefs.conv).forEach(tk=>{
        const v=D.prefs.conv[tk];
        if(v>0&&v<=5)D.prefs.conv[tk]=Math.round(v*20);
      });
    }
    D.migV8=true;changed=true;
  }

  return changed;
}

// Projection de remboursement du crédit : date de fin + intérêts restants
function mortgageProjection(m){
  if(!m||((!m.mainMensualite||m.mainMensualite<=0)&&(!m.ptzMensualite||m.ptzMensualite<=0)))return null;
  let main=m.mainCapital||0, ptz=m.ptzCapital||0, months=0, totalInterest=0;
  const rate=(m.mainTaux||0)/12;
  while((main>0.01||ptz>0.01)&&months<720){

    if(main>0.01){
      const interest=main*rate;
      const principal=(m.mainMensualite||0)-interest;

      main=Math.max(0,main-principal);
    }
  }
  if(months<0||months>=720)return null;
  const end=new Date();end.setMonth(end.getMonth()+months);

}
function ensureImmoBiens(d){if(!d||!d.immobilier)return;if(!Array.isArray(d.immobilier.biens))d.immobilier.biens=[];if(!d.immobilier.biens.length&&((d.immobilier.valeurEstimee||0)>0||d.immobilier.mortgage)){d.immobilier.biens=[{id:"b"+Date.now().toString(36),nom:"Bien 1",valeurEstimee:d.immobilier.valeurEstimee||0,capitalRestant:d.immobilier.capitalRestant||0,mortgage:d.immobilier.mortgage||null}];delete d.immobilier.mortgage;}}
function immoEquityInTotal(d){d=d||D;if(!d||!d.immobilier)return 0;const b=d.immobilier.biens;if(!Array.isArray(b)||!b.length)return (d.immobilier.equityNette||0);let s=0;b.forEach(x=>{if(x.exclureTotal)return;s+=((x.valeurEstimee||0)-(x.capitalRestant||0));});return Math.round(s*100)/100;}
function pocheExclSum(d){d=d||D;if(!d||!d.prefs||!d.prefs.pocheExclTotal||!d.poches)return 0;let s=0;Object.entries(d.poches).forEach(([n,p])=>{if(d.prefs.pocheExclTotal[n])s+=(p.valeur||0);});return s;}
function applyMortgagePayments(){
  if(!D||!D.immobilier)return false;ensureImmoBiens(D);if(!D.immobilier.biens.length)return false;
  const now=new Date();let applied=false;
  D.immobilier.biens.forEach(b=>{
    const m=b.mortgage;if(!m)return;
    const parts=String(m.lastPayment||"").split("-").map(Number);
    let last=parts.length===3?new Date(parts[0],parts[1]-1,parts[2]):new Date(NaN);
    if(isNaN(last.getTime())){m.lastPayment=now.toISOString().slice(0,10);return;}
    let safety=0;
    while(safety<600){
      safety++;
      const next=new Date(last.getFullYear(),last.getMonth()+1,1);
      if(isNaN(next.getTime())||next>now)break;
      const ptzPay=Math.min(m.ptzMensualite,m.ptzCapital);
      m.ptzCapital=Math.max(0,m.ptzCapital-ptzPay);
      const interest=m.mainCapital*(m.mainTaux/12);
      const capitalPart=Math.max(0,m.mainMensualite-interest);
      m.mainCapital=Math.max(0,m.mainCapital-capitalPart);
      const yy=next.getFullYear(),mm=String(next.getMonth()+1).padStart(2,"0"),dd=String(next.getDate()).padStart(2,"0");
      m.lastPayment=yy+"-"+mm+"-"+dd;
      last.setTime(next.getTime());
      applied=true;
    }
    b.capitalRestant=Math.round((m.ptzCapital+m.mainCapital)*100)/100;
  });
  return applied;
}

function dn(data,colors,sz=120){const tot=data.reduce((s,d)=>s+d[1],0)||1;let a=0;const g=.02,cx=sz/2,cy=sz/2,R=sz*.42,r=sz*.28;let p="";data.forEach((d,i)=>{const f=d[1]/tot;if(f<.001){a+=f;return}const s1=a*Math.PI*2-Math.PI/2+g,e1=(a+f)*Math.PI*2-Math.PI/2-g,l=f>.5?1:0;p+=`<path d="M${cx+R*Math.cos(s1)},${cy+R*Math.sin(s1)} A${R},${R} 0 ${l} 1 ${cx+R*Math.cos(e1)},${cy+R*Math.sin(e1)} L${cx+r*Math.cos(e1)},${cy+r*Math.sin(e1)} A${r},${r} 0 ${l} 0 ${cx+r*Math.cos(s1)},${cy+r*Math.sin(s1)} Z" fill="${colors[i%colors.length]}" opacity=".9"/>`;a+=f});return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${p}</svg>`;}

// RESTAURATION fb23f43 : lc() restauré dans sa version simple d'origine (signature lc(data, k, w, h) avec k=clé string).
// Les fonctionnalités benchmark/crosshair/cashflow markers ne sont pas dans la version d'origine.
function lc(data, k, w=300, h=180, pctBase=null) {
  const endVal = data.length > 0 ? data[data.length-1][k] : 0;
  const fmtC=(v)=>(Math.abs(Number(v))>=1000?fmt_(v):Number(v).toFixed(2));

  if(data.length < 2) {
    return `<div style="height:${h}px; position:relative; display:flex; flex-direction:column;">
      <div class="mono" style="font-size:16px; font-weight:bold; color:var(--txt); padding-top:14px;">${fmtC(endVal)}</div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--mut); font-size:11px; text-align:center; padding-bottom:10px;">
        <div style="font-size:20px; margin-bottom:8px; opacity:0.5;">📈</div>
        Acquisition en cours...<br>La courbe apparaîtra au prochain relevé.
      </div>
    </div>`;
  }

  const vs = data.map(d=>d[k]);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mn === mx) { mn -= 1; mx += 1; }

  const pad = (mx - mn) * 0.1;
  const dMin = mn - pad, dMax = mx + pad, rg = dMax - dMin;

  const pdX = 0, pt = 42, pb = 20;
  const cw = w - pdX * 2, ch = h - pt - pb;

  const startVal = vs[0];
  const diff = endVal - startVal;
  const isPos = diff >= 0;

  const col = isPos ? "#34d399" : "#f87171";

  const P = vs.map((v,i)=>({x: pdX+(i/(vs.length-1))*cw, y: pt+ch-((v-dMin)/rg*ch)}));
  const K = 0.16;
  let curveCmds = "";
  const GRN="#34d399", RED="#f87171";
  const baseline = startVal;
  const segPaths = [];
  const lerp=(a,b,t)=>a+(b-a)*t;
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1];
    const c1x=p1.x+(p2.x-p0.x)*K, c1y=p1.y+(p2.y-p0.y)*K;
    const c2x=p2.x-(p3.x-p1.x)*K, c2y=p2.y-(p3.y-p1.y)*K;
    curveCmds += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    const v1=vs[i], v2=vs[i+1], s1=v1>=baseline, s2=v2>=baseline;
    if(s1===s2){
      segPaths.push({d:`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,c:s1?GRN:RED});
    }else{
      const t=(v2!==v1)?((baseline-v1)/(v2-v1)):0.5;
      const q0x=lerp(p1.x,c1x,t), q0y=lerp(p1.y,c1y,t);
      const q1x=lerp(c1x,c2x,t), q1y=lerp(c1y,c2y,t);
      const q2x=lerp(c2x,p2.x,t), q2y=lerp(c2y,p2.y,t);
      const r0x=lerp(q0x,q1x,t), r0y=lerp(q0y,q1y,t);
      const r1x=lerp(q1x,q2x,t), r1y=lerp(q1y,q2y,t);
      const sx=lerp(r0x,r1x,t), sy=lerp(r0y,r1y,t);
      segPaths.push({d:`M${p1.x.toFixed(1)},${p1.y.toFixed(1)} C${q0x.toFixed(1)},${q0y.toFixed(1)} ${r0x.toFixed(1)},${r0y.toFixed(1)} ${sx.toFixed(1)},${sy.toFixed(1)}`,c:s1?GRN:RED});
      segPaths.push({d:`M${sx.toFixed(1)},${sy.toFixed(1)} C${r1x.toFixed(1)},${r1y.toFixed(1)} ${q2x.toFixed(1)},${q2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,c:s2?GRN:RED});
    }
  }
  const ptArea = `M${P[0].x.toFixed(1)},${(pt+ch).toFixed(1)} L${P[0].x.toFixed(1)},${P[0].y.toFixed(1)}` + curveCmds + ` L${(pdX+cw).toFixed(1)},${(pt+ch).toFixed(1)} Z`;

  const diffPct = (pctBase!=null&&pctBase>0) ? (diff / pctBase * 100) : (startVal !== 0 ? (diff / Math.abs(startVal) * 100) : 0);
  const diffSign = isPos ? "+" : "";

  const hasIntraday = data.some((d,i)=>i>0 && d.t && data[i-1].t && new Date(d.t).toDateString()===new Date(data[i-1].t).toDateString());
  const formatT = (ms) => {
    if(!ms) return "";

    const sameDay = d.getDate()===nw.getDate() && d.getMonth()===nw.getMonth() && d.getFullYear()===nw.getFullYear();
    if(sameDay && !hasIntraday) return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    const dateStr = d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:d.getFullYear()!==nw.getFullYear()?"2-digit":undefined});

  const yZero = (dMin < 0 && dMax > 0) ? pt + ch - ((0 - dMin) / rg * ch) : -1;

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible; display:block">
    <defs>
      <linearGradient id="g-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${col}" stop-opacity="0.32"/>
        <stop offset="55%" stop-color="${col}" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </linearGradient>
      <filter id="glow-${uid}" x="-20%" y="-30%" width="140%" height="160%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="${col}" flood-opacity="0.45"/>
      </filter>
    </defs>

    <text id="lcv-${uid}" x="0" y="14" font-size="16" font-weight="bold" fill="var(--txt)" font-family="monospace">${fmtC(endVal)}</text>
    <text id="lcd-${uid}" x="0" y="32" font-size="12" font-weight="600" fill="${col}" font-family="monospace">${diffSign}${fmtC(diff)} (${diffSign}${diffPct.toFixed(1)}%)</text>

    <line x1="0" y1="${pt}" x2="${w}" y2="${pt}" stroke="var(--bdr)" stroke-dasharray="2 4"/>
    <line x1="0" y1="${pt+ch}" x2="${w}" y2="${pt+ch}" stroke="var(--bdr)" stroke-dasharray="2 4"/>
    ${yZero > 0 ? `<line x1="0" y1="${yZero}" x2="${w}" y2="${yZero}" stroke="var(--dim)" stroke-opacity="0.5" stroke-dasharray="4 4"/>` : ''}

    <path d="${ptArea}" fill="url(#g-${uid})"/>
    <g filter="url(#glow-${uid})">${segPaths.map(s=>`<path d="${s.d}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}</g>
    <circle cx="${P[P.length-1].x.toFixed(1)}" cy="${P[P.length-1].y.toFixed(1)}" r="6" fill="${col}" opacity="0.25"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.35;0;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="${P[P.length-1].x.toFixed(1)}" cy="${P[P.length-1].y.toFixed(1)}" r="3" fill="${col}"/>

    <text x="${w}" y="${pt-4}" font-size="9" fill="var(--dim)" text-anchor="end">${fmtC(mx)}</text>
    <text x="${w}" y="${pt+ch-3}" font-size="9" fill="var(--dim)" text-anchor="end">${fmtC(mn)}</text>

    <text x="0" y="${h-2}" font-size="9" fill="var(--mut)">${formatT(data[0].t)}</text>
    <text x="${w}" y="${h-2}" font-size="9" fill="var(--mut)" text-anchor="end">${formatT(data[data.length-1].t)}</text>
    <g style="pointer-events:none"><line id="cl-${uid}" x1="-9" y1="${pt-2}" x2="-9" y2="${pt+ch}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle id="cc-${uid}" cx="-9" cy="0" r="3.5" fill="${col}" stroke="#0b0c10" stroke-width="1.5" opacity="0"/></g>
    <rect x="0" y="0" width="${w}" height="${h}" fill="transparent" style="cursor:crosshair" onmousemove="_lcHover(event,'${uid}')" onmouseleave="_lcOut('${uid}')" ontouchstart="_lcHover(event,'${uid}')" ontouchmove="_lcHover(event,'${uid}')" ontouchend="_lcOut('${uid}')"/>
  </svg>`;
}

window.confirmDeleteAccount=()=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700;color:var(--red)">Supprimer mon compte</h3><button onclick="eSettings()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="background:#f8717118;border:1px solid #f8717144;border-radius:10px;padding:12px;font-size:12px;color:var(--txt);line-height:1.5;margin-bottom:14px">Action <b>définitive</b>. Tout sera effacé : enveloppes, positions, immobilier, budget, historique et ton compte.<br><b>Pense à exporter tes données avant.</b></div><label style="font-size:11px;color:var(--dim);display:block;margin-bottom:6px">Tape <b>SUPPRIMER</b> pour confirmer</label><input id="delConfirm" autocomplete="off" placeholder="SUPPRIMER" style="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:10px;padding:11px;color:var(--txt);margin-bottom:14px"><button class="btn btn-d" style="width:100%" onclick="doDeleteAccount()">Supprimer définitivement</button>`);setTimeout(()=>{const e=document.getElementById("delConfirm");if(e)e.focus();},40);};
window.doDeleteAccount=async()=>{const el=document.getElementById("delConfirm");const v=el?el.value:"";if((v||"").trim().toUpperCase()!=="SUPPRIMER")return toast("Tape SUPPRIMER pour confirmer");toast("Suppression en cours…");try{await sb.functions.invoke("delete-account");}catch(e){}try{if(window.currentPfId){await sb.from("positions").delete().eq("portfolio_id",window.currentPfId);await sb.from("cashflows").delete().eq("portfolio_id",window.currentPfId);}}catch(e){}try{if(currentUser)await sb.from("portfolios").delete().eq("user_id",currentUser.id);}catch(e){}try{if(currentUser){localStorage.removeItem("pf-data-"+currentUser.id);localStorage.removeItem("pf-hist-"+currentUser.id);localStorage.removeItem("sb-migrated-"+currentUser.id);}}catch(e){}try{await sb.auth.signOut();}catch(e){}toast("Compte supprimé.");setTimeout(()=>location.reload(),700);};
window.showLegal=()=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Mentions légales & confidentialité</h3><button onclick="eSettings()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="font-size:12px;color:var(--dim);line-height:1.6;max-height:60vh;overflow-y:auto"><b style="color:var(--txt)">Éditeur</b><br>Application éditée à titre non professionnel par un particulier (art. 6-III-2 de la LCEN). Contact : contact@convicto.app.<br>Directeur de la publication : l'éditeur.<br><br><b style="color:var(--txt)">Hébergement</b><br>Interface : GitHub Pages — GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Données : Supabase (Union européenne). Service de cours : Cloudflare.<br><br><b style="color:var(--txt)">Données collectées</b><br>Ton adresse email (compte) et les données patrimoniales que tu saisis toi-même (enveloppes, positions, immobilier, budget, historique).<br><br><b style="color:var(--txt)">Finalité & base légale</b><br>Te fournir un outil de suivi de patrimoine personnel. Aucune revente, aucun profilage publicitaire. Traitement fondé sur l'exécution du service et ton consentement.<br><br><b style="color:var(--txt)">Conservation</b><br>Tes données sont conservées tant que ton compte existe et sont effacées dès sa suppression.<br><br><b style="color:var(--txt)">Tes droits (RGPD)</b><br>Accès et portabilité : bouton « Exporter mes données ». Effacement : bouton « Supprimer mon compte ». Rectification / opposition : par email à contact@convicto.app.<br><br><b style="color:var(--txt)">Cookies & stockage</b><br>Aucun traceur publicitaire. Seul un stockage technique local (sur ton appareil) assure la connexion et le fonctionnement.<br><br><b style="color:var(--txt)">Avertissement</b><br>Outil informatif d'aide au suivi. Ne constitue pas un conseil en investissement. Les cours peuvent être différés ou erronés ; tu restes seul responsable de tes décisions.</div>`);};

window.exportPDF = () => { cm(); const d = ga(); let html = `<div class="print-page"><div class="print-title">Rapport de Portefeuille Global</div><div class="print-subtitle">Généré le ${new Date().toLocaleDateString('fr-FR')} à ${new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})}</div><div style="font-size:18px; margin-bottom:10px;">Patrimoine Net : <b>${fmt_(d.tN)} €</b></div><div style="font-size:14px; margin-bottom:20px;">P&L Global : <b class="${d.tP >= 0 ? 'text-green' : 'text-red'}">${fL(d.tP)}</b></div><table class="print-table"><thead><tr><th>Enveloppe</th><th class="text-right">Valeur</th><th class="text-right">Poids</th><th class="text-right">P&L</th></tr></thead><tbody>`; d.al.forEach(a => { const isCash = a[0] === "Cash"; const p = isCash ? null : D.poches[a[0]]; const plStr = isCash ? "-" : `<span class="${p.pl >= 0 ? 'text-green' : 'text-red'}">${fL(p.pl)}</span>`; html += `<tr><td><b>${a[0]}</b></td><td class="text-right">${fmt_(a[1])} €</td><td class="text-right">${((a[1] / d.tF) * 100).toFixed(1)}%</td><td class="text-right">${plStr}</td></tr>`; }); html += `</tbody></table>`; if (D.immobilier) { html += `<div class="print-title" style="font-size:18px; border-bottom:1px solid #ccc;">Immobilier</div><table class="print-table" style="width:50%;"><tr><td>Valeur Estimée</td><td class="text-right">${fmt_(D.immobilier.valeurEstimee)} €</td></tr><tr><td>Capital Restant</td><td class="text-right">${fmt_(D.immobilier.capitalRestant)} €</td></tr><tr><td><b>Capital Net (Equity)</b></td><td class="text-right"><b>${fmt_(D.immobilier.equityNette)} €</b></td></tr></table>`; } html += `</div>`; Object.entries(D.poches).forEach(([n, p]) => { html += `<div class="print-page"><div class="print-title">Détail : ${n}</div><div style="margin-bottom: 20px; font-size: 14px;">Valeur Totale : <b>${fmt_(p.valeur)} €</b> &nbsp;|&nbsp; Investissement : ${fmt_(p.investi)} € &nbsp;|&nbsp; P&L : <b class="${p.pl >= 0 ? 'text-green' : 'text-red'}">${fL(p.pl)}</b></div>`; if (p.positions.length > 0) { const sortedPositions=[...p.positions].sort((a,b)=>(b.valeur||0)-(a.valeur||0)); html += `<table class="print-table"><thead><tr><th>Nom de l'Actif</th><th>Ticker</th><th class="text-right">Qté</th><th class="text-right">PRU</th><th class="text-right">Cours Actuel</th><th class="text-right">Valeur</th><th class="text-right">Poids</th><th class="text-right">P&L Latent</th></tr></thead><tbody>`; sortedPositions.forEach(x => { const cur = curOf(x); const prSym = " " + curSym(cur); html += `<tr><td>${esc(x.titre)}</td><td>${esc(x.ticker)}</td><td class="text-right">${x.qty}</td><td class="text-right">${fmt2_(x.pru)}${prSym}</td><td class="text-right">${fmt2_(x.cours)}${prSym}</td><td class="text-right"><b>${fmt_(x.valeur)} €</b></td><td class="text-right">${x.poids}%</td><td class="text-right"><span class="${x.pl >= 0 ? 'text-green' : 'text-red'}">${fL(x.pl)}<br><span style="font-size:10px">${fP(x.plPct)}</span></span></td></tr>`; }); html += `</tbody></table>`; } else { html += `<p style="font-size:12px; color:#555;">Aucune position active dans cette enveloppe.</p>`; } html += `</div>`; }); let pr = document.getElementById("print-report"); pr.innerHTML = html; setTimeout(() => { window.print(); }, 300); };

let _importData = null;
window.loadImportFile=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=(ev)=>{document.getElementById("imp_text").value=ev.target.result;};r.readAsText(f);};
window.openImport=(poche)=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Importer un CSV — ${esc(poche)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.5">Colle un export CSV (broker, Excel...) ou choisis un fichier. La 1re ligne doit contenir les noms de colonnes.</p><div class="field"><input type="file" id="imp_file" accept=".csv,.txt" onchange="loadImportFile(event)" style="font-size:12px"></div><div class="field"><label>Ou colle le CSV ici</label><textarea id="imp_text" rows="6" placeholder="Symbol,Quantity,Cost Price&#10;AAPL,10,150.20" style="width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt);font-family:monospace;font-size:11px;resize:vertical"></textarea></div><button class="btn btn-p" onclick="analyzeImport('${escAttr(poche)}')">Analyser</button>`);};
window.analyzeImport=(poche)=>{const text=document.getElementById("imp_text").value.trim();if(!text)return toast("Colle un CSV ou choisis un fichier.");const fl=text.split(/\r?\n/)[0]||"";const counts={",":(fl.match(/,/g)||[]).length,";":(fl.match(/;/g)||[]).length,"\t":(fl.match(/\t/g)||[]).length};const delim=Object.keys(counts).reduce((a,b)=>counts[a]>=counts[b]?a:b);const parse=(line)=>{const fields=[];let cur="",inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===delim&&!inQ){fields.push(cur);cur="";}else cur+=c;}fields.push(cur);return fields.map(f=>f.trim().replace(/^"|"$/g,""));};const allRows=text.split(/\r?\n/).filter(l=>l.trim()).map(parse);const ibkrHdr=allRows.find(r=>(r[0]==="Positions ouvertes"||r[0]==="Open Positions")&&r[1]==="Header");if(ibkrHdr){const ih=ibkrHdr.map(x=>x.toLowerCase());const icol=(kw)=>ih.findIndex(x=>kw.some(k=>x.includes(k)));const cS=icol(["symbole","symbol"]),cQ=icol(["quantité","quantity"]),cP=icol(["coût","cost"]),cC=icol(["devise","currency"]),cX=ih.findIndex(x=>x.includes("clôture")||x.includes("close"));const dd=allRows.filter(r=>(r[0]==="Positions ouvertes"||r[0]==="Open Positions")&&r[1]==="Data"&&r[2]==="Summary");const poss=dd.map(r=>({ticker:(r[cS]||"").trim().toUpperCase(),qty:pn(r[cQ]),pru:pn(r[cP]),currency:(r[cC]||"").trim().toUpperCase(),cours:cX>=0?pn(r[cX]):pn(r[cP])})).filter(p=>p.ticker&&p.qty>0);if(poss.length===0)return toast("Aucune position trouvée dans le relevé IBKR.");_importData={ibkr:true,positions:poss};const prev=poss.map(p=>`<tr><td style="padding:5px 10px;border-bottom:1px solid var(--bdr)">${esc(p.ticker)}</td><td style="padding:5px 10px;border-bottom:1px solid var(--bdr);text-align:right">${p.qty}</td><td style="padding:5px 10px;border-bottom:1px solid var(--bdr);text-align:right">${p.pru.toFixed(2)}</td></tr>`).join("");sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Relevé IBKR détecté</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:12px;color:var(--dim);margin-bottom:12px">${poss.length} position(s) trouvée(s) dans la section Positions ouvertes. Aperçu :</p><div style="max-height:260px;overflow-y:auto;margin-bottom:14px"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="color:var(--dim);text-align:left"><th style="padding:5px 10px">Ticker</th><th style="padding:5px 10px;text-align:right">Qté</th><th style="padding:5px 10px;text-align:right">PRU</th></tr>${prev}</table></div><button class="btn btn-p" onclick="doImportIBKR('${escAttr(poche)}')">Importer dans ${esc(poche)}</button>`);return;}if(allRows.length<2)return toast("Le CSV doit avoir une ligne d'en-tête + au moins une ligne de données.");const headers=allRows[0];const dataRows=allRows.slice(1);_importData={headers,dataRows};const guess=(kw)=>{for(let i=0;i<headers.length;i++){const h=headers[i].toLowerCase();if(kw.some(k=>h.includes(k)))return i;}return -1;};const gT=guess(["symbol","ticker","isin","code","mnémo"]);const gQ=guess(["quantity","qty","quantité","qté","nombre","shares","parts"]);const gP=guess(["cost","price","pru","prix","revient","achat","avg","unit"]);const gN=guess(["name","nom","description","libellé","désignation","label"]);const opts=(sel)=>headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h)||"(colonne "+(i+1)+")"}</option>`).join("")+`<option value="-1" ${sel===-1?"selected":""}>— aucune —</option>`;const ss=`width:100%;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:8px;color:var(--txt)`;sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Mapper les colonnes</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">${dataRows.length} ligne(s) détectée(s). Indique quelle colonne correspond à quoi :</p><div class="field"><label>Ticker / Symbole *</label><select id="map_t" style="${ss}">${opts(gT)}</select></div><div class="field"><label>Quantité *</label><select id="map_q" style="${ss}">${opts(gQ)}</select></div><div class="field"><label>PRU / Prix de revient *</label><select id="map_p" style="${ss}">${opts(gP)}</select></div><div class="field"><label>Nom (optionnel)</label><select id="map_n" style="${ss}">${opts(gN)}</select></div><button class="btn btn-p" onclick="doImport('${escAttr(poche)}')">Importer ${dataRows.length} position(s)</button>`);};
window.doImport=(poche)=>{if(!_importData)return;const ti=parseInt(document.getElementById("map_t").value);const qi=parseInt(document.getElementById("map_q").value);const pi=parseInt(document.getElementById("map_p").value);const ni=parseInt(document.getElementById("map_n").value);if(ti<0||qi<0||pi<0)return toast("Ticker, quantité et PRU sont obligatoires.");if(!D.poches[poche])return toast("Enveloppe introuvable.");const existing=new Set(D.poches[poche].positions.map(x=>String(x.ticker).toUpperCase()));let added=0,skipped=0;_importData.dataRows.forEach(row=>{const tk=(row[ti]||"").trim().toUpperCase();const qty=pn(row[qi]);const pru=pn(row[pi]);if(!tk||qty<=0||existing.has(tk)){skipped++;return;}const pos={titre:(ni>=0&&row[ni])?row[ni].trim():tk,ticker:tk,qty,pru,cours:pru};D.poches[poche].positions.push(pos);existing.add(tk);added++;});_importData=null;cm();save();setTimeout(()=>toast(added+" position(s) importée(s)"+(skipped?", "+skipped+" ignorée(s) (déjà présente, ticker ou quantité manquant)":"")+". Clique ↻ pour récupérer les cours."),100);};
window.doImportIBKR=(poche)=>{if(!_importData||!_importData.positions)return;if(!D.poches[poche])return toast("Enveloppe introuvable.");const existing=new Set(D.poches[poche].positions.map(x=>String(x.ticker).toUpperCase()));let added=0,skipped=0;_importData.positions.forEach(p=>{if(existing.has(p.ticker)){skipped++;return;}const pos={titre:p.ticker,ticker:p.ticker,qty:p.qty,pru:p.pru,cours:p.cours||p.pru};if(p.currency)pos.currency=p.currency;D.poches[poche].positions.push(pos);added++;});_importData=null;cm();save();setTimeout(()=>toast(added+" position(s) importée(s)"+(skipped?", "+skipped+" déjà présente(s) ignorée(s)":"")+". Clique ↻ pour rafraîchir les cours."),100);};

window.updTgTotal=()=>{const keys=window._tgKeys||[];let t=0;keys.forEach((k,i)=>{const el=document.getElementById("tg_"+i);if(el)t+=pn(el.value);});const el=document.getElementById("tg_total");if(el){el.textContent="Total : "+Math.round(t*10)/10+"%";el.style.color=Math.round(t)===100?"var(--grn)":"var(--amb)";}};
window.addRealizedPnl=(poche)=>{sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">P&L réalisé passé</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="background:var(--inp);border-radius:10px;padding:10px;margin-bottom:14px;font-size:11px;color:var(--dim);line-height:1.5">Enregistre une plus ou moins-value <b style="color:var(--txt)">déjà encaissée</b> dans l'enveloppe <b style="color:var(--txt)">${esc(poche)}</b> (avant l'appli, ou sur une position non suivie).<br>👉 Ça n'ajoute <b style="color:var(--txt)">aucun argent</b> à ton patrimoine : c'est seulement un historique de performance.</div><div class="field"><label>Montant réalisé (€) — gain (+) ou perte (−)</label><input id="rp_amt" inputmode="decimal" placeholder="ex: 722,40  ou  -150"></div><div class="field"><label>Libellé (optionnel)</label><input id="rp_lbl" placeholder="ex: Ventes 2024, PV avant appli"></div><div class="field"><label>Date</label><input id="rp_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><button class="btn btn-p" onclick="saveRealizedPnl('${escAttr(poche)}')">Enregistrer</button>`)};

function computeBudget(){const pr=D.prefs||{};const sal=pr.salaireNet||0;const charges=pr.autresCharges||0;const conso=pr.creditsConso||[];const biens=(D.immobilier&&D.immobilier.biens)||[];let te=0,cash=0;biens.forEach(b=>{const mens=b.mortgage?((b.mortgage.ptzMensualite||0)+(b.mortgage.mainMensualite||0)):0;const loyer=(b.type==='locatif')?(b.loyer||0):0;const _cn=bienChargesMonthly(b);const net=mens-loyer+(_cn.dep-_cn.rev);cash+=net;if(!b.exclureTE)te+=Math.max(0,net);});conso.forEach(c=>{const m=c.mensualite||0;cash+=m;if(!c.exclureTE)te+=m;});const tauxEffort=sal>0?(te/sal*100):0;const capacite=sal-cash-charges;const hasData=sal>0||conso.length>0||biens.some(b=>b.mortgage);return{sal,charges,te,cash,tauxEffort,capacite,hasData};}

)||undefined;const _mpays=document.getElementById("mpays");if(_mpays){if(!D.prefs)D.prefs={};if(!D.prefs.paysOverride)D.prefs.paysOverride={};if(_mpays.value&&_mpays.value!==_autoCountry(p,pocheName))D.prefs.paysOverride[p.ticker]=_mpays.value;else delete D.prefs.paysOverride[p.ticker];}const _man=(document.getElementById("mManual")||{}).checked;if(!D.prefs)D.prefs={};if(!D.prefs.manualTickers)D.prefs.manualTickers=[];if(!D.prefs.manualUpdatedAt)D.prefs.manualUpdatedAt={};if(_man){p.manual=true;p.manualUpdated=Date.now();const _np=(document.getElementById("mNoPerf")||{}).checked;if(!D.prefs.noPerfTickers)D.prefs.noPerfTickers=[];if(_np){p.noPerf=true;if(!D.prefs.noPerfTickers.includes(p.ticker))D.prefs.noPerfTickers.push(p.ticker);}else{delete p.noPerf;D.prefs.noPerfTickers=D.prefs.noPerfTickers.filter(t=>t!==p.ticker);}D.prefs.manualUpdatedAt[p.ticker]=p.manualUpdated;if(!D.prefs.manualTickers.includes(p.ticker))D.prefs.manualTickers.push(p.ticker);}else{delete p.manual;delete p.manualUpdated;D.prefs.manualTickers=D.prefs.manualTickers.filter(t=>t!==p.ticker);delete D.prefs.manualUpdatedAt[p.ticker];delete p.noPerf;if(D.prefs.noPerfTickers)D.prefs.noPerfTickers=D.prefs.noPerfTickers.filter(t=>t!==p.ticker);}} const _miEl=document.getElementById("mIsin");if(_miEl){const _iv=_miEl.value.trim().toUpperCase();if(_iv&&ISIN_RE.test(_iv))p.isin=_iv;else if(!_iv)delete p.isin;} cm();save()};

window.askSale=(pocheName,tk,qty,pru,titre,mode,pe)=>{_pendingSale={pn:pocheName,tk,qty,pru,titre,mode,pendingEdit:pe}; const _p0=D.poches[pocheName].positions.find(x=>x.ticker===tk);const _sym=_p0?curSym(curOf(_p0)):"€"; const cost=qty*pru; sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">${mode==="full"?"Supprimer":"Réduire"} ${esc(tk)}</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div style="background:var(--inp);border-radius:10px;padding:10px;margin-bottom:14px;font-size:12px;color:var(--dim);line-height:1.5">${mode==="full"?"Suppression totale":"Réduction"} de <b style="color:var(--txt)">${fmt2_(qty)} ${qty>1?"parts/actions":"part/action"}</b> de ${esc(titre)}<br>Coût d'acquisition : ${fmt2_(cost)} ${_sym}</div><div style="margin-bottom:10px"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:10px;border:1px solid var(--bdr);border-radius:10px;background:var(--inp)"><input type="radio" name="mo" value="sale" checked onchange="document.getElementById('saleFields').style.display='block'"><div style="flex:1"><div style="font-weight:600;font-size:13px">Vente réelle</div><div style="font-size:10px;color:var(--dim)">Calcule le P&L réalisé</div></div></label></div><div id="saleFields"><div class="field"><label>Montant net reçu (${_sym}) *</label><input id="saleNet" inputmode="decimal" placeholder="ex: 1807.40"></div><div class="field"><label>Montant brut (${_sym}, optionnel)</label><input id="saleBrut" inputmode="decimal" placeholder="ex: 1909.24"></div></div><div style="margin:10px 0 14px"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;padding:10px;border:1px solid var(--bdr);border-radius:10px;background:var(--inp)"><input type="radio" name="mo" value="correction" onchange="document.getElementById('saleFields').style.display='none'"><div style="flex:1"><div s // ─── CORRECTION BUG #5 ───────────────────────────────────────────────────────
// confirmSale() : querySelector sur 'input[name="mo"]:checked' pouvait
// retourner null. Ajout d'une vérification explicite.
// ─────────────────────────────────────────────────────────────────────────────
window.confirmSale=()=>{
  if(!_pendingSale)return;
  const {pn:pocheName,tk,qty,pru,mode,pendingEdit:pe}=_pendingSale;
  try{
    const checkedInput = document.querySelector('input[name="mo"]:checked');
    if(!checkedInput){
      console.error("confirmSale: aucune option sélectionnée");
      return;
    }
    const choice = checkedInput.value;
    const p=D.poches[pocheName].positions.find(x=>x.ticker===tk);
    if(!p)return;
    if(choice==="sale"){
      const net=pn(document.getElementById("saleNet").value);
      if(!net||net<=0){
        const inp=document.getElementById("saleNet");
        if(inp){inp.style.borderColor="var(--red)";inp.placeholder="⚠ Saisir le montant net reçu";inp.focus()}
        return;
      }
      const brut=pn(document.getElementById("saleBrut").value)||net;
      const _cur=curOf(p);const _te=toEur(_cur);const netEur=net*_te;const brutEur=brut*_te;
      const pl=netEur-(qty*pru)*_te;
      if(!D.sales)D.sales=[];
      D.sales.push({date:new Date().toISOString().slice(0,10),poche:pocheName,ticker:tk,titre:p.titre,qty:qty,pru:pru,net:Math.round(netEur*100)/100,brut:Math.round(brutEur*100)/100,pl:Math.round(pl*100)/100});
    }
    if(mode==="full"){
      D.poches[pocheName].positions=D.poches[pocheName].positions.filter(x=>x.ticker!==tk);
    }else if(pe){
      p.titre=pe.newTitre;p.ticker=pe.newTicker;p.qty=pe.newQty;p.pru=pe.newPru;p.cours=pe.newCours;
      if(pe.newCible)p.cible=pn(pe.newCible);else delete p.cible;
      if(pe.newCibleH)p.cibleHaut=pn(pe.newCibleH);else delete p.cibleHaut;
      if(pe.newCur)p.currency=pe.newCur;
    }
    _pendingSale=null;
    cm();save();
  }catch(e){
    console.error("confirmSale:",e);
    _pendingSale=null;
    cm();
  }
};

window.editTaxes=()=>{const tr=(D.prefs&&D.prefs.taxRates)||{};const tg=(D.prefs&&D.prefs.taxGlobal!=null)?D.prefs.taxGlobal:30;const keys=Object.keys(D.poches);const ss="width:72px;background:var(--inp);border:1px solid var(--bdr);border-radius:8px;padding:6px;color:var(--txt);text-align:right";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Fiscalité des dividendes</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:14px;line-height:1.5">Taux d'imposition appliqué au calcul "Net". Le taux global s'applique partout sauf si tu renseignes un taux spécifique pour une enveloppe.</p><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--bdr)"><span style="flex:1;font-size:13px;font-weight:600">Taux global</span><input id="tx_global" value="${tg}" inputmode="decimal" style="${ss}"><span style="color:var(--dim);font-size:12px">%</span></div><div style="font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Par enveloppe (laisse vide = taux global)</div>${keys.map((k,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="flex:1;font-size:13px">${esc(k)}</span><input id="tx_${i}" value="${tr[k]!=null?tr[k]:""}" placeholder="${tg}" inputmode="decimal" style="${ss}"><span style="color:var(--dim);font-size:12px">%</span></div>`).join("")}<button class="btn btn-p" style="margin-top:6px" onclick="saveTaxes()">Enregistrer</button>`);window._txKeys=keys;};

async function refreshDivs(){
  try{
    if(!D||!D.poches)return;
      const map={};
    Object.entries(D.poches).forEach(([n,p])=>{ if(n==="Crypto")return; p.positions.forEach(pos=>{ const t=pos.ticker; if(!t||CG[t]||t==="50PESO")return; let ys; if(pos.avSymbol)ys=pos.avSymbol; else if(KNOWN_EU[t])ys=KNOWN_EU[t]; else ys=t; map[t]=ys; }); });
    const syms=[...new Set(Object.values(map))];
    if(!syms.length)return;
    const r=await fetchT(`${WORKER_URL}/?divs=${encodeURIComponent(syms.join(","))}&_t=${Date.now()}`);
    if(!r.ok)return;
    const j=await r.json();
    if(!j||!j.divs)return;
    const byTicker={};
    Object.keys(map).forEach(t=>{ const ys=map[t]; if(j.divs[ys])byTicker[t]=j.divs[ys]; });
    if(!D.prefs)D.prefs={};
    D.prefs.divAuto=byTicker;
    D.prefs.divAutoTs=Date.now();
    Object.values(D.poches).forEach(p=>p.positions.forEach(pos=>{const info=byTicker[pos.ticker];if(info&&info.annual>0&&Math.abs((pos.dividend||0)-info.annual)>0.01)pos.dividend=info.annual;}));
    saveLocal(); if(currentUser) pushToSupabase(); R();
  }catch(e){}
}

// On garde le worker en 1er, puis repli direct navigateur (les 2 API autorisent le CORS).
function _chunkText(t,max){const parts=String(t).split(/([.!?]\s+)/);const out=[];let cur="";for(let i=0;i<parts.length;i++){const p=parts[i];if(cur.length+p.length>max&&cur){out.push(cur);cur="";}if(p.length>max){for(let k=0;k<p.length;k+=max)out.push(p.slice(k,k+max));}else cur+=p;}if(cur.trim())out.push(cur);return out.filter(s=>s.trim());}
async function _trGtx(t,to){const r=await fetchT(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(to)}&dt=t&q=${encodeURIComponent(t)}`,null,15000);if(!r.ok)return null;const j=await r.json();if(!j||!j[0]||!j[0].length)return null;return j[0].map(s=>(s&&s[0])?s[0]:"").join("");}
async function _trMM(t,to){const r=await fetchT(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=${encodeURIComponent("en|"+to)}`,null,15000);if(!r.ok)return null;const j=await r.json();const x=j&&j.responseData&&j.responseData.translatedText;return (x&&Number(j.responseStatus)===200)?x:null;}
async function _trChunked(fn,text,to,max){const parts=_chunkText(text,max);const out=[];for(const p of parts){const s=await fn(p,to);if(!s)return null;out.push(s);}return out.length?out.join(" ").replace(/\s+/g," ").trim():null;}
async function _translate(text,to){to=to||"fr";
  try{const r=await fetchT(`${FUND_URL}/?tr=${encodeURIComponent(text)}&to=${to}`,null,15000);const j=await r.json();if(j&&j.text)return j.text;}catch(e){}
  try{const s=await _trChunked(_trGtx,text,to,1500);if(s)return s;}catch(e){}
  try{const s=await _trChunked(_trMM,text,to,450);if(s)return s;}catch(e){}
  return null;}

let _aHoverIdx=null;
function drawAChart(){
  const cv=document.getElementById("aCanvas");if(!cv)return;
  const go=()=>{
    const bars=aData.ohlc||[];
    const _hasIntraday=bars.some((b,i)=>i>0&&b.t&&bars[i-1].t&&new Date(b.t*1000).toDateString()===new Date(bars[i-1].t*1000).toDateString());
    const DPR=Math.min(window.devicePixelRatio||2,3);
    const CW=cv.clientWidth||340, CH=cv.clientHeight||210;
    const W=cv.width=Math.round(CW*DPR), H=cv.height=Math.round(CH*DPR);
    const ctx=cv.getContext("2d");ctx.clearRect(0,0,W,H);
    const cs=getComputedStyle(document.documentElement);
    const grn=(cs.getPropertyValue("--grn").trim()||"#34d399"), red=(cs.getPropertyValue("--red").trim()||"#f87171"), acc=(cs.getPropertyValue("--acc").trim()||"#6c8cff"), mut=(cs.getPropertyValue("--mut").trim()||"#888"), txt=(cs.getPropertyValue("--txt").trim()||"#ccc");
    if(!bars.length){ctx.fillStyle=mut;ctx.font=Math.round(H*0.075)+"px -apple-system,sans-serif";ctx.textAlign="center";ctx.fillText("Chargement…",W/2,H/2);return;}
    const lo=Math.min.apply(null,bars.map(b=>b.l)), hi=Math.max.apply(null,bars.map(b=>b.h));
    const pad=(hi-lo)*0.10||1, mn=lo-pad, mx=hi+pad;
    const FS=Math.round(H*0.055);
    const PT=FS*0.9, PB=FS*2.1, PL=FS*0.6, PR=FS*4.2;
    const iw=W-PL-PR, ih=H-PT-PB;
    const xf=k=>PL+iw*(k/(bars.length-1||1));
    const yf=v=>PT+ih*(1-(v-mn)/(mx-mn||1));
    ctx.font=FS+"px -apple-system,sans-serif";
    for(let g=0;g<=4;g++){
      const v=mn+(mx-mn)*g/4, y=yf(v);
      ctx.strokeStyle=mut;ctx.globalAlpha=0.5;ctx.lineWidth=Math.max(1,DPR*0.8);
      ctx.beginPath();ctx.setLineDash([DPR*3,DPR*3]);ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
      ctx.fillStyle=mut;ctx.textAlign="left";ctx.fillText(v.toFixed(v>=1000?0:v>=100?1:2), W-PR+FS*0.5, y+FS*0.35);
    }
    const nlab=Math.min(4,bars.length);
    ctx.textAlign="center";ctx.fillStyle=mut;
    for(let li=0;li<nlab;li++){
      const idx=Math.round(li*(bars.length-1)/(nlab-1||1));
      const d=new Date(bars[idx].t*1000);
      ctx.fillText(d.getDate()+"/"+(d.getMonth()+1), Math.max(PL+FS,Math.min(W-PR-FS,xf(idx))), H-FS*0.7);
    }
    const baseline=bars[0].c;
    if(aChartType==="line"){
      const up=bars[bars.length-1].c>=baseline;
      ctx.beginPath();bars.forEach((b,k)=>{const x=xf(k),y=yf(b.c);k?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      ctx.lineTo(xf(bars.length-1),PT+ih);ctx.lineTo(PL,PT+ih);ctx.closePath();
      ctx.fillStyle=(up?grn:red);ctx.globalAlpha=0.12;ctx.fill();ctx.globalAlpha=1;
      ctx.lineWidth=DPR*1.6;ctx.lineJoin="round";ctx.lineCap="round";
      for(let k=0;k<bars.length-1;k++){
        const x1=xf(k),y1=yf(bars[k].c),x2=xf(k+1),y2=yf(bars[k+1].c);
        const v1=bars[k].c,v2=bars[k+1].c,s1=v1>=baseline,s2=v2>=baseline;
        if(s1===s2){
          ctx.strokeStyle=s1?grn:red;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        }else{
          const t=(v2!==v1)?((baseline-v1)/(v2-v1)):0.5;
          const mx2=x1+(x2-x1)*t, my2=y1+(y2-y1)*t;
          ctx.strokeStyle=s1?grn:red;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(mx2,my2);ctx.stroke();
          ctx.strokeStyle=s2?grn:red;ctx.beginPath();ctx.moveTo(mx2,my2);ctx.lineTo(x2,y2);ctx.stroke();
        }
      }
    }else{
      const cw=Math.max(DPR,iw/bars.length*0.62);
      bars.forEach((b,k)=>{const x=xf(k);const up=b.c>=b.o;ctx.strokeStyle=up?grn:red;ctx.fillStyle=up?grn:red;ctx.lineWidth=Math.max(1,DPR*0.8);
        ctx.beginPath();ctx.moveTo(x,yf(b.h));ctx.lineTo(x,yf(b.l));ctx.stroke();
        const yo=yf(b.o),yc=yf(b.c);ctx.fillRect(x-cw/2,Math.min(yo,yc),cw,Math.max(DPR,Math.abs(yc-yo)));});
    }
    if(_aHoverIdx!=null && bars[_aHoverIdx]){
      const idx=Math.max(0,Math.min(bars.length-1,_aHoverIdx));
      const b=bars[idx];
      const x=xf(idx), y=yf(b.c);
      const ccol=b.c>=baseline?grn:red;
      ctx.setLineDash([DPR*3,DPR*3]);ctx.strokeStyle=mut;ctx.globalAlpha=0.7;ctx.lineWidth=Math.max(1,DPR*0.8);
      ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,PT+ih);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(x,y,DPR*3.5,0,Math.PI*2);ctx.fillStyle=ccol;ctx.fill();ctx.strokeStyle="#0b0c10";ctx.lineWidth=DPR*1.2;ctx.stroke();
      const d=new Date(b.t*1000);
      const dateStr=d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})+(_hasIntraday?" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"");
      const valStr=b.c.toFixed(b.c>=1000?0:2);
      ctx.font="bold "+Math.round(FS*0.95)+"px -apple-system,sans-serif";
      const tw=Math.max(ctx.measureText(valStr).width,ctx.measureText(dateStr).width)+FS*1.4;
      let tx=x-tw/2; tx=Math.max(PL,Math.min(W-PR-tw,tx));
      const ty=PT-FS*0.1, boxH=FS*2.5;
      ctx.fillStyle="rgba(10,11,16,0.92)";
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(tx,ty,tw,boxH,DPR*4);ctx.fill();}else{ctx.fillRect(tx,ty,tw,boxH);}
      ctx.strokeStyle=ccol;ctx.lineWidth=DPR*1;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(tx,ty,tw,boxH,DPR*4);ctx.stroke();}
      ctx.textAlign="center";
      ctx.fillStyle=txt;ctx.font="bold "+Math.round(FS*0.9)+"px -apple-system,sans-serif";
      ctx.fillText(valStr,tx+tw/2,ty+FS*1.05);
      ctx.fillStyle=mut;ctx.font=Math.round(FS*0.68)+"px -apple-system,sans-serif";
      ctx.fillText(dateStr,tx+tw/2,ty+FS*1.95);
    }
  };
  if(cv.clientHeight>0){go();}else{requestAnimationFrame(()=>requestAnimationFrame(go));}
  if(!cv._hoverWired){
    cv._hoverWired=true;
    const move=(clientX)=>{
      const bars=aData.ohlc||[];if(!bars.length)return;
      const r=cv.getBoundingClientRect();
      let rel=(clientX-r.left)/r.width; rel=Math.max(0,Math.min(1,rel));
      const idx=Math.round(rel*(bars.length-1));
      if(idx!==_aHoverIdx){_aHoverIdx=idx;go();}
    };
    cv.addEventListener("mousemove",e=>move(e.clientX));
    cv.addEventListener("mouseleave",()=>{if(_aHoverIdx!=null){_aHoverIdx=null;go();}});
    cv.addEventListener("touchstart",e=>{if(e.cancelable)e.preventDefault();if(e.touches[0])move(e.touches[0].clientX);},{passive:false});
    cv.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault();if(e.touches[0])move(e.touches[0].clientX);},{passive:false});
    cv.addEventListener("touchend",()=>{if(_aHoverIdx!=null){_aHoverIdx=null;go();}});
  }
}

const QUAL_GRADES=[[90,"A+"],[80,"A"],[65,"B"],[50,"C"],[0,"D"]];
const QUAL_FIN=["Financial Services","Financials","Insurance","Bank"];
const QUAL_REND=["Utilities","Real Estate","Energy"];
// paliers 0/25/50/75/100 — plus haut = mieux (a<b<c<d)
function _palHi(v,a,b,c,d){if(v==null||!isFinite(v))return null;if(v<a)return 0;if(v<b)return 25;if(v<c)return 50;if(v<d)return 75;return 100;}

function _palLo(v,a,b,c,d){if(v==null||!isFinite(v))return null;if(v>d)return 0;if(v>c)return 25;if(v>b)return 50;if(v>a)return 75;return 100;}
function qualityScore(f){
  if(!f||f.error)return{status:"na"};
  const sec=f.secteur||"";
  const isFin=QUAL_FIN.some(s=>sec.indexOf(s)>=0);
  const isRend=QUAL_REND.some(s=>sec.indexOf(s)>=0);
  // Rentabilité — garde-fou marge nette artificielle (bénéfice exceptionnel)
  let mN=f.mNette;const artif=(mN!=null&&f.mOp!=null&&(mN-f.mOp)>0.10);if(artif)mN=null;
  const rent=[_palHi(f.roe,0,0.10,0.15,0.25),(mN!=null?_palHi(mN,0,0.05,0.10,0.20):null),_palHi(f.mOp,0,0.08,0.15,0.25)];
  // Solidité (ignorée pour les financières)
  let solid=null;
  if(!isFin){
    const netCash=(f.cash!=null&&f.debt!=null)?(f.cash-f.debt):null;
    let nc=null;
    if(netCash!=null){const fcf=f.fcf;
      if(fcf!=null&&fcf>0){if(netCash>fcf)nc=100;else if(netCash>0.05*fcf)nc=75;else if(netCash>=-0.05*fcf)nc=50;else if(netCash>-2*fcf)nc=25;else nc=0;}
      else{nc=netCash>0?75:(netCash<0?25:50);}}
    const fcfScore=(f.fcf!=null)?(f.fcf>0?100:0):null;
    solid=[_palLo(f.debtEq,25,50,100,200),nc,fcfScore];
  }
  // Croissance (plafonnée à 100 par les paliers)
  const crois=[_palHi(f.revG,0,0.05,0.10,0.20),_palHi(f.epsG,0,0.05,0.12,0.25)];
  // Valorisation
  const fcfY=(f.fcf!=null&&f.cap>0)?(f.fcf<0?0:_palHi(f.fcf/f.cap,0.01,0.03,0.05,0.08)):null;
  const per=(f.per!=null&&f.per>0)?_palLo(f.per,12,20,30,50):null;
  const pb=(f.pb!=null&&f.pb>0)?_palLo(f.pb,1.5,3,5,10):null;
  const valo=[fcfY,per,pb];
  const avg=arr=>{const v=arr.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const pR=avg(rent),pS=(solid?avg(solid):null),pC=avg(crois),pV=avg(valo);
  // données manquantes
  const applic=[].concat(rent,(isFin?[]:solid),crois,valo);
  const missing=applic.filter(x=>x==null).length;
  if(missing>3||(applic.length-missing)<3)return{status:"insufficient",missing};
  // pondérations + redistribution sectorielle
  let wR=30,wS=25,wC=25,wV=20;
  if(isFin){wR=55;wS=0;wC=25;wV=20;}else if(isRend){wC=12.5;wS=37.5;}
  const pills=[[pR,wR],[pS,wS],[pC,wC],[pV,wV]].filter(p=>p[0]!=null&&p[1]>0);
  const wsum=pills.reduce((a,p)=>a+p[1],0);
  if(!wsum)return{status:"insufficient"};
  const score=Math.round(pills.reduce((a,p)=>a+p[0]*p[1],0)/wsum);
  const grade=(QUAL_GRADES.find(g=>score>=g[0])||[0,"D"])[1];
  return{status:"ok",score,grade,pR,pS,pC,pV,sec,isFin,isRend,artif};
}
function _qualSentence(q){

window.refreshWatch=async()=>{if(!D.prefs||!D.prefs.watchlist||!D.prefs.watchlist.length)return;for(const w of D.prefs.watchlist){try{const r=await fetchT(`${WORKER_URL}/?chart=${encodeURIComponent(w.sym)}&range=5d&_t=${Date.now()}`);const j=await r.json();const res=j&&j.chart&&j.chart.result&&j.chart.result[0];const meta=res&&res.meta;const p=meta&&meta.regularMarketPrice;if(p!=null){w.lastCours=p;w.lastUpd=Date.now();}}catch(e){}}save();};
window.editGoal=()=>{const g=(D.prefs&&D.prefs.goalNetWorth)||"";sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Objectif de patrimoine</h3><button onclick="cm()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><p style="font-size:11px;color:var(--dim);margin-bottom:12px">Fixe un montant cible. La barre de progression s'affiche dans Analyse › Synthèse.</p><div class="field"><label>Objectif (€)</label><input id="goalIn" inputmode="decimal" value="${g}" placeholder="ex: 150000"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-p" style="flex:1" onclick="saveGoal()">Enregistrer</button>${g?`<button class="btn" style="background:var(--card);border:1px solid var(--bdr);color:var(--mut)" onclick="clearGoal()">Retirer</button>`:""}</div>`);};

window.showGuide=(n)=>{n=n||0;const G=[{i:"👋",t:"Bienvenue sur Convicto",d:"Suis tout ton patrimoine au même endroit : bourse, crypto, immobilier et liquidités — piloté par la conviction."},{i:"🗂️",t:"Tes enveloppes",d:"Range tes placements en enveloppes (PEA, CTO, AV, crypto…) et regroupe-les en familles. Tu choisis lesquelles apparaissent dans Bourse."},{i:"🔍",t:"Explore une valeur",d:"Cherche par nom ou ISIN. Chaque fiche : graphique, fondamentaux expliqués (touche une case pour sa définition), avis d\'analystes et description."},{i:"🔥",t:"Investis par conviction",d:"Sur chaque ligne : note ta conviction, écris ta thèse, ton plan de sortie et ton journal de décisions. C\'est l\'esprit de Convicto."},{i:"📊",t:"Analyse & alertes",d:"Performance, répartition, alertes de prix, agenda des résultats, correction des splits et repérage des cours figés."},{i:"🚀",t:"C\'est parti !",d:"Crée une enveloppe et ajoute une position, tes liquidités ou un bien. Tu peux revoir ce guide dans ⚙ Réglages."}];const st=G[n];const last=n===G.length-1;const dots=G.map((_,i)=>`<span style="width:7px;height:7px;border-radius:50%;background:${i===n?"var(--acc)":"var(--bdr)"};display:inline-block;margin:0 3px;transition:background .2s"></span>`).join("");sm(`<div style="text-align:right;margin-bottom:2px"><span onclick="finishGuide()" style="font-size:12px;color:var(--mut);cursor:pointer">Passer</span></div><div style="text-align:center;padding:10px 6px 4px"><div style="font-size:46px;margin-bottom:14px;line-height:1">${st.i}</div><div style="font-size:19px;font-weight:800;margin-bottom:10px">${st.t}</div><div style="font-size:13px;color:var(--dim);line-height:1.55;max-width:300px;margin:0 auto">${st.d}</div></div><div style="text-align:center;margin:22px 0 16px">${dots}</div><div style="display:flex;gap:8px">${n>0?`<button onclick="showGuide(${n-1})" style="flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--bdr);background:transparent;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer">Précédent</button>`:""}<button onclick="${last?"finishGuide()":`showGuide(${n+1})`}" style="flex:${n>0?"2":"1"};padding:11px 0;border-radius:10px;border:none;background:var(--acc);color:#fff;font-size:14px;font-weight:700;cursor:pointer">${last?"Commencer 🚀":"Suivant →"}</button></div>`);};

window.renameFamily=(id)=>{const f=_families().find(x=>x.id===id);if(!f)return;sm(`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">Renommer</h3><button onclick="gerer()" style="background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer">✕</button></div><div class="field"><label>Nom</label><input id="rfName" value="${esc(f.name)}" autocomplete="off"></div><button class="btn btn-p" onclick="doRenameFamily('${id}')">Enregistrer</button>`);setTimeout(()=>{const e=document.getElementById("rfName");if(e)e.focus();},40);};
